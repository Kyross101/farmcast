<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FarmCast — Reset Password</title>

    <link rel="stylesheet" href="login.css">

    <link
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-card {
            width: 100%;
            max-width: 420px;

            padding: 36px 30px;

            background: #161b22;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);

            text-align: center;
        }

        .reset-logo {
            font-size: 46px;
            margin-bottom: 8px;
        }

        .reset-card h1 {
            color: #fff;
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .reset-description {
            color: #8b949e;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .reset-input {
            position: relative;

            width: 100%;
            height: 52px;

            margin-bottom: 14px;
        }

        .reset-input input {
            width: 100%;
            height: 100%;

            padding: 0 48px 0 16px;

            background: #0d1117;
            color: #fff;

            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;

            outline: none;
            font-size: 0.95rem;

            transition: 0.2s;
        }

        .reset-input input:focus {
            border-color: #3fb950;
            box-shadow: 0 0 0 3px rgba(63, 185, 80, 0.12);
        }

        .reset-input .password-toggle {
            position: absolute;

            right: 8px;
            top: 50%;

            transform: translateY(-50%);

            width: 36px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;
            background: transparent;

            color: #6e7681;
            font-size: 20px;

            cursor: pointer;
        }

        .reset-input .password-toggle:hover {
            color: #3fb950;
        }

        .password-info {
            text-align: left;

            margin: -3px 2px 18px;

            color: #6e7681;
            font-size: 0.78rem;
        }

        .reset-btn {
            width: 100%;
            height: 50px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #2ea043,
                #3fb950
            );

            color: #fff;

            font-size: 0.95rem;
            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;
        }

        .reset-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(63, 185, 80, 0.2);
        }

        .reset-btn:disabled {
            cursor: not-allowed;
            opacity: 0.65;
            transform: none;
        }

        .back-login {
            display: inline-block;

            margin-top: 20px;

            color: #3fb950;

            font-size: 0.85rem;
            font-weight: 600;

            text-decoration: none;
        }

        .back-login:hover {
            text-decoration: underline;
        }

        .reset-message {
            display: none;

            margin-bottom: 18px;
            padding: 11px 13px;

            border-radius: 10px;

            font-size: 0.82rem;
            line-height: 1.4;

            text-align: left;
        }

        .reset-message.error {
            display: block;

            background: rgba(248, 81, 73, 0.10);
            border: 1px solid rgba(248, 81, 73, 0.25);

            color: #ff7b72;
        }

        .reset-message.success {
            display: block;

            background: rgba(63, 185, 80, 0.10);
            border: 1px solid rgba(63, 185, 80, 0.25);

            color: #56d364;
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .reset-card {
                padding: 30px 20px 26px;
                border-radius: 20px;
            }

            .reset-card h1 {
                font-size: 1.55rem;
            }
        }
    </style>
</head>

<body>

    <div class="reset-card">

        <div class="reset-logo">🌾</div>

        <h1>Reset Password</h1>

        <p class="reset-description">
            Create a new password for your FarmCast account.
        </p>

        <div
            class="reset-message"
            id="resetMessage">
        </div>

        <form id="resetPasswordForm">

            <!-- NEW PASSWORD -->
            <div class="reset-input">

                <input
                    type="password"
                    id="newPassword"
                    placeholder="New Password"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    data-target="newPassword"
                    aria-label="Show password">

                    <i class="bx bx-show"></i>

                </button>

            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="reset-input">

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    data-target="confirmPassword"
                    aria-label="Show password">

                    <i class="bx bx-show"></i>

                </button>

            </div>

            <div class="password-info">
                Password must contain at least 6 characters.
            </div>

            <button
                type="submit"
                class="reset-btn"
                id="resetButton">

                Reset Password

            </button>

        </form>

        <a
            href="login.html"
            class="back-login">

            ← Back to Login

        </a>

    </div>

    <script src="reset-password.js"></script>

</body>
</html>
