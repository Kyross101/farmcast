<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Apricot</title>

  <desc id="desc">
    Two ripe golden-orange apricot fruits with green leaves.
  </desc>

  <!-- Small fruit stems -->
  <path d="M58 40
       C60 33 64 28 69 24

       M77 43
       C79 35 83 30 88 27" fill="none" stroke="#6c653f" stroke-width="3" stroke-linecap="round">
  </path>

  <!-- Left leaf -->
  <ellipse cx="47" cy="35" rx="16" ry="7" transform="rotate(-28 47 35)" fill="#68964f" stroke="#426d3c" stroke-width="1.8">
  </ellipse>

  <path d="M34 41 L59 31" fill="none" stroke="#99b581" stroke-width="1.4" stroke-linecap="round">
  </path>

  <!-- Right leaf -->
  <ellipse cx="90" cy="35" rx="16" ry="7" transform="rotate(27 90 35)" fill="#68964f" stroke="#426d3c" stroke-width="1.8">
  </ellipse>

  <path d="M77 30 L103 40" fill="none" stroke="#99b581" stroke-width="1.4" stroke-linecap="round">
  </path>

  <!-- Main apricot -->
  <path d="M58 44
       C45 43 35 52 33 67
       C31 82 38 97 50 104
       C61 110 72 107 79 98
       C86 89 88 74 83 61
       C79 51 69 45 58 44Z" fill="#eba24d" stroke="#b76d32" stroke-width="2.4">
  </path>

  <!-- Apricot blush -->
  <path d="M68 47
       C79 53 84 65 82 78
       C80 91 73 100 64 104
       C69 92 71 77 70 63
       C70 56 69 51 68 47Z" fill="#dc7450" opacity="0.78">
  </path>

  <!-- Main fruit crease -->
  <path d="M59 48
       C56 61 56 79 60 95
       C61 100 63 103 65 105" fill="none" stroke="#c47a43" stroke-width="2" stroke-linecap="round">
  </path>

  <!-- Main highlight -->
  <path d="M44 58
       C40 66 40 76 43 83" fill="none" stroke="#f5ca89" stroke-width="2.4" stroke-linecap="round">
  </path>

  <!-- Second apricot -->
  <path d="M89 50
       C79 50 72 58 72 70
       C71 82 76 93 86 98
       C96 103 106 98 111 88
       C116 76 112 63 104 55
       C100 52 95 50 89 50Z" fill="#f0aa53" stroke="#ba7135" stroke-width="2.2">
  </path>

  <!-- Second apricot blush -->
  <path d="M99 53
       C109 60 113 72 109 84
       C107 91 102 96 96 99
       C100 87 101 72 99 53Z" fill="#df7953" opacity="0.76">
  </path>

  <!-- Second fruit crease -->
  <path d="M90 54
       C87 65 87 80 91 95" fill="none" stroke="#c87f46" stroke-width="1.9" stroke-linecap="round">
  </path>

  <!-- Second highlight -->
  <path d="M82 61
       C79 68 80 76 83 81" fill="none" stroke="#f7cf8d" stroke-width="2.2" stroke-linecap="round">
  </path>

  <!-- Ground shadow -->
  <ellipse cx="71" cy="112" rx="37" ry="6" fill="#81664a" opacity="0.2">
  </ellipse>

</svg>