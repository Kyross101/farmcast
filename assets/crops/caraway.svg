<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Caraway</title>

  <desc id="desc">
    Detailed illustration of caraway foliage, white flower umbels, and mature brown aromatic seeds.
  </desc>

  <!-- Ground shadow -->
  <ellipse cx="65" cy="118" rx="43" ry="5" fill="#7e674b" opacity="0.16">
  </ellipse>

  <!-- Main stems -->
  <path d="M61 105
       C61 83 62 62 63 42

       M67 105
       C67 83 67 62 66 42" fill="none" stroke="#587643" stroke-width="3.4" stroke-linecap="round">
  </path>

  <!-- Fine left foliage -->
  <g fill="none" stroke="#6e9357" stroke-width="2" stroke-linecap="round">

    <path d="M61 78 C51 72 43 66 34 62"></path>
    <path d="M61 69 C51 63 43 56 36 50"></path>
    <path d="M62 60 C53 53 47 46 42 40"></path>

  </g>

  <!-- Fine right foliage -->
  <g fill="none" stroke="#73985a" stroke-width="2" stroke-linecap="round">

    <path d="M67 77 C77 70 85 65 95 61"></path>
    <path d="M67 68 C77 61 85 55 94 49"></path>
    <path d="M67 59 C77 52 83 45 88 39"></path>

  </g>

  <!-- Leaf divisions -->
  <g fill="none" stroke="#82a269" stroke-width="1.4" stroke-linecap="round">

    <path d="M48 69 L40 74"></path>
    <path d="M43 65 L35 67"></path>
    <path d="M49 57 L41 61"></path>
    <path d="M44 53 L36 54"></path>
    <path d="M53 50 L48 44"></path>

    <path d="M80 68 L88 73"></path>
    <path d="M86 64 L94 66"></path>
    <path d="M80 56 L88 60"></path>
    <path d="M86 52 L95 53"></path>
    <path d="M76 49 L81 43"></path>

  </g>

  <!-- Flower stems -->
  <path d="M63 43
       C55 36 49 31 43 26

       M66 43
       C74 35 81 30 88 25" fill="none" stroke="#587542" stroke-width="2.2" stroke-linecap="round">
  </path>

  <!-- Left flower umbel -->
  <g fill="none" stroke="#748d58" stroke-width="1.4">

    <path d="M43 27 L32 20"></path>
    <path d="M43 27 L38 16"></path>
    <path d="M43 27 L45 15"></path>
    <path d="M43 27 L52 17"></path>
    <path d="M43 27 L58 22"></path>

  </g>

  <!-- Right flower umbel -->
  <g fill="none" stroke="#748d58" stroke-width="1.4">

    <path d="M88 26 L76 19"></path>
    <path d="M88 26 L82 15"></path>
    <path d="M88 26 L89 14"></path>
    <path d="M88 26 L97 17"></path>
    <path d="M88 26 L103 22"></path>

  </g>

  <!-- White flowers -->
  <g fill="#f7f5ea" stroke="#b9af94" stroke-width="1">

    <circle cx="31" cy="19" r="3.2"></circle>
    <circle cx="38" cy="15" r="3.2"></circle>
    <circle cx="45" cy="14" r="3.2"></circle>
    <circle cx="53" cy="16" r="3.2"></circle>
    <circle cx="59" cy="21" r="3.2"></circle>

    <circle cx="75" cy="18" r="3.2"></circle>
    <circle cx="82" cy="14" r="3.2"></circle>
    <circle cx="90" cy="13" r="3.2"></circle>
    <circle cx="98" cy="16" r="3.2"></circle>
    <circle cx="104" cy="21" r="3.2"></circle>

  </g>

  <!-- Flower centers -->
  <g fill="#d6bd70">

    <circle cx="31" cy="19" r="1"></circle>
    <circle cx="38" cy="15" r="1"></circle>
    <circle cx="45" cy="14" r="1"></circle>
    <circle cx="53" cy="16" r="1"></circle>
    <circle cx="59" cy="21" r="1"></circle>

    <circle cx="75" cy="18" r="1"></circle>
    <circle cx="82" cy="14" r="1"></circle>
    <circle cx="90" cy="13" r="1"></circle>
    <circle cx="98" cy="16" r="1"></circle>
    <circle cx="104" cy="21" r="1"></circle>

  </g>

  <!-- Mature Caraway seeds -->
  <ellipse cx="34" cy="99" rx="4" ry="11" transform="rotate(-28 34 99)" fill="#9f7044" stroke="#68492f" stroke-width="1.8">
  </ellipse>

  <ellipse cx="50" cy="106" rx="4" ry="11" transform="rotate(-14 50 106)" fill="#ad7c49" stroke="#704d31" stroke-width="1.8">
  </ellipse>

  <ellipse cx="67" cy="108" rx="4" ry="11" transform="rotate(4 67 108)" fill="#95663f" stroke="#62452d" stroke-width="1.8">
  </ellipse>

  <ellipse cx="84" cy="104" rx="4" ry="11" transform="rotate(16 84 104)" fill="#b1814d" stroke="#735034" stroke-width="1.8">
  </ellipse>

  <ellipse cx="100" cy="97" rx="4" ry="11" transform="rotate(28 100 97)" fill="#a17145" stroke="#69492f" stroke-width="1.8">
  </ellipse>

