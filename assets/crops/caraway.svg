  <g fill="none" stroke="#755136" stroke-width="1" stroke-linecap="round">

    <path d="M30 90 L38 108"></path>
    <path d="M46 96 L54 116"></path>
    <path d="M64 98 L70 118"></path>
    <path d="M80 94 L88 114"></path>
    <path d="M96 88 L104 106"></path>

  </g>

  <!-- Seed highlights -->
  <g fill="none" stroke="#cea274" stroke-width="1.2" stroke-linecap="round" opacity="0.85">

    <path d="M31 93 L34 101"></path>
    <path d="M47 99 L50 107"></path>
    <path d="M65 101 L67 109"></path>
    <path d="M81 97 L84 105"></path>
    <path d="M97 91 L100 99"></path>

  </g>

</svg>