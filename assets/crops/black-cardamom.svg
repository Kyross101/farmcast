<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Black Cardamom</title>

  <desc id="desc">
    Detailed botanical illustration of black cardamom with tall leafy shoots,
    a basal flower spike, reddish-brown capsules, opened pods, and dark aromatic seeds.
  </desc>

  <defs>
    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86ad67"></stop>
      <stop offset="0.48" stop-color="#547d48"></stop>
      <stop offset="1" stop-color="#2d5738"></stop>
    </linearGradient>

    <linearGradient id="leafLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a4c47e"></stop>
      <stop offset="1" stop-color="#4d7646"></stop>
    </linearGradient>

    <linearGradient id="stemGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#789452"></stop>
      <stop offset="1" stop-color="#465f39"></stop>
    </linearGradient>

    <linearGradient id="capsuleRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b76b59"></stop>
      <stop offset="0.5" stop-color="#8d4a41"></stop>
      <stop offset="1" stop-color="#60322f"></stop>
    </linearGradient>

    <linearGradient id="capsuleDry" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a654a"></stop>
      <stop offset="0.5" stop-color="#684333"></stop>
      <stop offset="1" stop-color="#3d2923"></stop>
    </linearGradient>

    <radialGradient id="seedDark" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#6f5947"></stop>
      <stop offset="0.55" stop-color="#403128"></stop>
      <stop offset="1" stop-color="#1f1816"></stop>
    </radialGradient>

    <linearGradient id="flowerYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a8"></stop>
      <stop offset="0.55" stop-color="#e6ca69"></stop>
      <stop offset="1" stop-color="#a9853d"></stop>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#293027" flood-opacity="0.25"></feDropShadow>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="64" cy="119" rx="45" ry="5" fill="#554b42" opacity="0.16"></ellipse>

  <!-- Rhizome base -->
  <path d="M41 108
       C52 103 72 102 88 107
       C79 114 54 116 41 108Z" fill="#70533a" stroke="#4d392a" stroke-width="2"></path>

  <path d="M47 108 C58 106 72 106 82 109" fill="none" stroke="#a17c59" stroke-width="1.2" opacity="0.7"></path>

  <!-- Main pseudostems -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round">
    <path d="M59 108 C58 88 57 67 57 47 C57 34 55 24 53 17" stroke-width="6"></path>

    <path d="M72 108 C72 88 73 69 74 49 C75 35 78 25 81 18" stroke-width="6"></path>

    <path d="M47 108 C47 91 46 75 43 61 C41 49 38 39 35 31" stroke-width="4.5"></path>
  </g>

  <!-- Stem highlights -->
  <g fill="none" stroke="#a5b778" stroke-linecap="round" opacity="0.65">
    <path d="M61 104 C60 82 60 58 59 39" stroke-width="1.2"></path>
    <path d="M74 104 C74 82 75 59 77 38" stroke-width="1.2"></path>
  </g>

  <!-- Left leaves -->
  <g filter="url(#softShadow)">
    <path d="M55 79
         C42 69 29 67 19 74
         C28 85 41 90 56 85Z" fill="url(#leafGreen)" stroke="#31543a" stroke-width="2"></path>

    <path d="M55 61
         C43 51 31 49 22 55
         C31 67 43 70 56 67Z" fill="url(#leafLight)" stroke="#31543a" stroke-width="2"></path>

    <path d="M55 44
         C43 34 31 31 23 37
         C31 48 43 52 56 50Z" fill="url(#leafGreen)" stroke="#31543a" stroke-width="1.8"></path>
  </g>

  <!-- Right leaves -->
  <g filter="url(#softShadow)">
    <path d="M75 81
         C88 70 101 68 111 75
         C102 87 89 91 74 86Z" fill="url(#leafGreen)" stroke="#31543a" stroke-width="2"></path>

    <path d="M75 62
         C88 52 100 49 109 56
         C101 68 88 71 74 67Z" fill="url(#leafLight)" stroke="#31543a" stroke-width="2"></path>

    <path d="M76 44
         C88 34 100 31 108 37
         C100 49 88 53 75 50Z" fill="url(#leafGreen)" stroke="#31543a" stroke-width="1.8"></path>
  </g>

  <!-- Smaller side leaves -->
  <path d="M43 69
       C33 62 24 62 17 67
       C24 76 34 78 44 75Z" fill="url(#leafLight)" stroke="#31543a" stroke-width="1.6"></path>

  <path d="M43 51
       C34 43 25 41 18 46
       C25 55 34 58 44 57Z" fill="url(#leafGreen)" stroke="#31543a" stroke-width="1.6"></path>

  <!-- Leaf veins -->
  <g fill="none" stroke="#afc99b" stroke-linecap="round" opacity="0.8">
    <path d="M22 75 C35 77 46 81 54 84" stroke-width="1.1"></path>
    <path d="M25 56 C36 58 46 62 54 66" stroke-width="1.1"></path>
    <path d="M26 38 C37 40 47 45 54 49" stroke-width="1"></path>

    <path d="M108 76 C96 78 85 82 76 85" stroke-width="1.1"></path>
    <path d="M106 57 C95 59 84 63 76 66" stroke-width="1.1"></path>
    <path d="M105 38 C95 40 85 45 77 49" stroke-width="1"></path>
  </g>

  <!-- Leaf shine -->
  <g fill="none" stroke="#dcebd3" stroke-width="1" stroke-linecap="round" opacity="0.42">
    <path d="M30 72 C39 72 46 76 51 79"></path>
    <path d="M84 74 C92 72 101 73 105 76"></path>
  </g>

  <!-- Basal flowering spike -->
  <path d="M60 106 C61 99 61 93 60 87" fill="none" stroke="#706c3d" stroke-width="3" stroke-linecap="round"></path>

  <g transform="translate(59 84)" filter="url(#softShadow)">

    <path d="M0 9
         C-7 4 -8 -4 -3 -10
         C1 -15 8 -13 11 -7
         C14 -1 9 7 0 9Z" fill="url(#flowerYellow)" stroke="#8f7439" stroke-width="1.5"></path>

    <path d="M-4 -6
         C0 -2 5 -1 9 -4" fill="none" stroke="#fff4bd" stroke-width="1.2" opacity="0.75"></path>

    <path d="M-2 5
         C1 2 5 2 8 4" fill="none" stroke="#b66a59" stroke-width="1.4" stroke-linecap="round"></path>
  </g>

  <!-- Capsule cluster stems -->
  <g fill="none" stroke="#696f3c" stroke-width="1.8" stroke-linecap="round">
    <path d="M70 106 L79 93"></path>
    <path d="M71 106 L90 98"></path>
    <path d="M69 106 L77 109"></path>
    <path d="M68 105 L61 96"></path>
  </g>

  <!-- Reddish mature capsules -->
  <g filter="url(#softShadow)">
    <ellipse cx="80" cy="91" rx="7" ry="9" fill="url(#capsuleRed)" stroke="#59302b" stroke-width="1.8" transform="rotate(18 80 91)"></ellipse>

    <ellipse cx="92" cy="97" rx="7" ry="9" fill="url(#capsuleRed)" stroke="#59302b" stroke-width="1.8" transform="rotate(70 92 97)"></ellipse>

    <ellipse cx="77" cy="109" rx="7" ry="9" fill="url(#capsuleDry)" stroke="#452d25" stroke-width="1.8" transform="rotate(95 77 109)"></ellipse>

    <ellipse cx="60" cy="95" rx="6.5" ry="8.5" fill="url(#capsuleRed)" stroke="#59302b" stroke-width="1.8" transform="rotate(-25 60 95)"></ellipse>
  </g>

  <!-- Capsule ribs -->
  <g fill="none" stroke="#cf8871" stroke-width="1" opacity="0.72">
    <path d="M77 84 C79 90 80 95 80 98"></path>
    <path d="M83 84 C82 90 82 94 81 98"></path>

    <path d="M86 96 C92 96 96 98 99 100"></path>
    <path d="M87 101 C93 100 97 101 99 102"></path>

    <path d="M69 108 C76 108 81 109 84 111"></path>

    <path d="M57 88 C59 94 61 99 63 102"></path>
  </g>

  <!-- Open dried pod -->
  <g transform="translate(34 102)" filter="url(#softShadow)">

    <path d="M0 0
         C-9 -8 -10 -17 -5 -22
         C2 -18 5 -10 3 0Z" fill="url(#capsuleDry)" stroke="#452b22" stroke-width="1.8"></path>

    <path d="M3 0
         C12 -7 14 -16 9 -21
         C3 -18 0 -10 3 0Z" fill="#79503b" stroke="#452b22" stroke-width="1.8"></path>

    <path d="M-3 -18 C0 -13 1 -8 1 -3" fill="none" stroke="#bd8060" stroke-width="1"></path>

    <path d="M8 -17 C5 -12 4 -7 4 -3" fill="none" stroke="#b87959" stroke-width="1"></path>

    <!-- Seeds -->
    <g fill="url(#seedDark)" stroke="#1f1714" stroke-width="0.7">
      <circle cx="-1" cy="-9" r="2.2"></circle>
      <circle cx="4" cy="-11" r="2.1"></circle>
      <circle cx="7" cy="-7" r="2"></circle>
      <circle cx="1" cy="-5" r="2.1"></circle>
      <circle cx="5" cy="-3" r="1.8"></circle>
    </g>

    <g fill="#a88d72" opacity="0.35">
      <circle cx="-1.5" cy="-9.5" r="0.6"></circle>
      <circle cx="3.5" cy="-11.5" r="0.6"></circle>
      <circle cx="6.5" cy="-7.5" r="0.5"></circle>
    </g>
  </g>

  <!-- Loose black cardamom seeds -->
  <g fill="url(#seedDark)" stroke="#201815" stroke-width="0.8" filter="url(#softShadow)">
    <ellipse cx="48" cy="111" rx="3" ry="2.6"></ellipse>
    <ellipse cx="55" cy="114" rx="3.1" ry="2.5" transform="rotate(20 55 114)"></ellipse>
    <ellipse cx="62" cy="113" rx="2.8" ry="2.4" transform="rotate(-15 62 113)"></ellipse>
  </g>

  <!-- Highlights -->
  <g fill="#ead6ab" opacity="0.6">
    <circle cx="78" cy="88" r="1"></circle>
    <circle cx="89" cy="94" r="0.9"></circle>
    <circle cx="58" cy="92" r="0.9"></circle>
  </g>

</svg>