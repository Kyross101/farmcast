<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Safflower</title>

  <desc id="desc">
    Detailed illustration of an orange safflower bloom, green spiny leaves, and pale safflower seeds.
  </desc>

  <!-- Ground shadow -->
  <ellipse cx="65" cy="118" rx="41" ry="5" fill="#7d674d" opacity="0.16">
  </ellipse>

  <!-- Main stem -->
  <path d="M64 102
       C63 83 64 64 64 45" fill="none" stroke="#55763d" stroke-width="4" stroke-linecap="round">
  </path>

  <!-- Side stems -->
  <path d="M63 75
       C53 68 45 61 38 53

       M65 69
       C75 63 83 57 90 49" fill="none" stroke="#5d7e42" stroke-width="3" stroke-linecap="round">
  </path>

  <!-- Left leaf -->
  <path d="M59 75
       C48 68 34 68 25 75
       C34 81 45 84 58 79Z" fill="#678e4d" stroke="#416b3a" stroke-width="2">
  </path>

  <!-- Left leaf teeth -->
  <path d="M28 74
       L23 70
       M35 72
       L32 67
       M43 73
       L42 67" fill="none" stroke="#416b3a" stroke-width="1.5" stroke-linecap="round">
  </path>

  <!-- Right leaf -->
  <path d="M68 70
       C80 62 94 63 104 70
       C95 78 82 80 69 75Z" fill="#6c9550" stroke="#416b3a" stroke-width="2">
  </path>

  <!-- Right leaf teeth -->
  <path d="M78 68
       L78 62
       M87 67
       L89 61
       M96 68
       L101 63" fill="none" stroke="#416b3a" stroke-width="1.5" stroke-linecap="round">
  </path>

  <!-- Upper left leaf -->
  <path d="M58 56
       C49 48 38 46 30 51
       C37 59 47 62 58 60Z" fill="#719853" stroke="#416b3a" stroke-width="2">
  </path>

  <!-- Upper right leaf -->
  <path d="M69 53
       C78 45 90 43 99 49
       C92 57 81 61 70 58Z" fill="#719853" stroke="#416b3a" stroke-width="2">
  </path>

  <!-- Flower base -->
  <ellipse cx="64" cy="43" rx="23" ry="15" fill="#738d42" stroke="#4e6936" stroke-width="2">
  </ellipse>

  <!-- Green flower bracts -->
  <path d="M44 42 L35 35 L47 36
       M49 34 L44 24 L55 31
       M57 30 L58 19 L64 29
       M70 30 L75 20 L76 32
       M79 34 L90 27 L84 38
       M85 42 L97 40 L87 48" fill="#698b45" stroke="#486839" stroke-width="2" stroke-linejoin="round">
  </path>

  <!-- Orange safflower petals -->
  <g fill="none" stroke-linecap="round">

    <path d="M45 43
         C48 36 50 29 49 22" stroke="#df7b25" stroke-width="4">
    </path>

    <path d="M50 43
         C53 34 55 27 54 18" stroke="#ed8b28" stroke-width="4">
    </path>

    <path d="M55 42
         C57 33 59 24 59 16" stroke="#f1982d" stroke-width="4">
    </path>

    <path d="M60 42
         C61 31 63 23 64 14" stroke="#e87e22" stroke-width="4">
    </path>

    <path d="M65 42
         C66 31 68 22 70 15" stroke="#f29c2f" stroke-width="4">
    </path>

    <path d="M70 43
         C72 34 75 25 77 18" stroke="#e98526" stroke-width="4">
    </path>

    <path d="M75 44
         C78 35 82 29 84 22" stroke="#f19a2d" stroke-width="4">
    </path>

    <path d="M80 45
         C83 38 87 33 91 28" stroke="#dc7422" stroke-width="4">
    </path>

  </g>

  <!-- Flower center -->
  <ellipse cx="65" cy="43" rx="15" ry="8" fill="#d76922">
  </ellipse>

  <!-- Center highlights -->
  <g fill="#f3a93a">
    <circle cx="56" cy="41" r="2"></circle>
    <circle cx="62" cy="39" r="2"></circle>
    <circle cx="68" cy="40" r="2"></circle>
    <circle cx="74" cy="42" r="2"></circle>
    <circle cx="60" cy="45" r="2"></circle>
    <circle cx="67" cy="46" r="2"></circle>
  </g>

  <!-- Mature seeds -->
  <ellipse cx="35" cy="103" rx="9" ry="7" transform="rotate(-14 35 103)" fill="#e2dcc8" stroke="#9b9177" stroke-width="2">
  </ellipse>

  <ellipse cx="55" cy="109" rx="9" ry="7" transform="rotate(8 55 109)" fill="#eee8d4" stroke="#a1987d" stroke-width="2">
  </ellipse>

  <ellipse cx="77" cy="108" rx="9" ry="7" transform="rotate(-8 77 108)" fill="#ddd6c1" stroke="#968c74" stroke-width="2">
  </ellipse>

  <ellipse cx="97" cy="101" rx="9" ry="7" transform="rotate(12 97 101)" fill="#ebe5d0" stroke="#9d947a" stroke-width="2">
  </ellipse>

  <!-- Seed grooves -->
  <path d="M31 100 L39 105
       M51 106 L59 111
       M73 105 L81 110
       M93 98 L101 103" fill="none" stroke="#b9ad91" stroke-width="1.4" stroke-linecap="round">
  </path>

  <!-- Seed highlights -->
  <path d="M31 99 C34 97 37 98 39 99
       M51 105 C54 103 57 104 59 105
       M73 104 C76 102 79 103 81 104
       M93 97 C96 95 99 96 101 97" fill="none" stroke="#fffdf2" stroke-width="1.3" stroke-linecap="round" opacity="0.8">
  </path>

</svg>