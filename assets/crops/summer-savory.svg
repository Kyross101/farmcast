<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Summer Savory</title>

  <desc id="desc">
    Detailed botanical illustration of summer savory with narrow aromatic leaves,
    white-lilac flowers, branching stems, and small brown seeds.
  </desc>

  <defs>
    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9bb77b"></stop>
      <stop offset="0.52" stop-color="#668b55"></stop>
      <stop offset="1" stop-color="#3a6141"></stop>
    </linearGradient>

    <linearGradient id="stemGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#879f63"></stop>
      <stop offset="1" stop-color="#4d6842"></stop>
    </linearGradient>

    <linearGradient id="flowerWhite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffef8"></stop>
      <stop offset="1" stop-color="#e3e5d8"></stop>
    </linearGradient>

    <linearGradient id="flowerLilac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ddb5d4"></stop>
      <stop offset="1" stop-color="#8e668e"></stop>
    </linearGradient>

    <radialGradient id="seedBrown" cx="35%" cy="30%" r="72%">
      <stop offset="0" stop-color="#b69772"></stop>
      <stop offset="0.55" stop-color="#765b44"></stop>
      <stop offset="1" stop-color="#403027"></stop>
    </radialGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#273028" flood-opacity="0.22"></feDropShadow>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="64" cy="119" rx="44" ry="5" fill="#564f47" opacity="0.15"></ellipse>

  <!-- Main branching stems -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round">

    <path d="M64 109
         C63 91 64 74 64 57
         C65 42 64 29 61 17" stroke-width="4.5"></path>

    <path d="M52 108
         C53 92 51 77 48 64
         C46 53 42 43 37 34" stroke-width="3"></path>

    <path d="M76 108
         C75 92 78 77 82 64
         C86 53 91 43 96 35" stroke-width="3"></path>

  </g>

  <!-- Stem highlights -->
  <g fill="none" stroke="#a9bd80" stroke-linecap="round" opacity="0.62">

    <path d="M66 105
         C65 84 66 64 66 45" stroke-width="1.1"></path>

    <path d="M54 104
         C54 86 52 71 50 58" stroke-width="0.9"></path>

  </g>

  <!-- Leaf-bearing branches -->
  <g fill="none" stroke="#567848" stroke-width="1.8" stroke-linecap="round">

    <path d="M61 89 C51 83 42 76 33 68"></path>
    <path d="M63 80 C74 74 85 67 95 58"></path>
    <path d="M61 70 C51 64 43 58 36 50"></path>
    <path d="M64 62 C75 56 84 49 91 42"></path>
    <path d="M60 52 C52 47 45 41 40 35"></path>

  </g>

  <!-- Narrow savory leaves -->
  <g filter="url(#softShadow)">

    <path d="M33 68
         C25 62 19 61 15 65
         C20 72 27 75 34 73Z" fill="url(#leafGreen)" stroke="#35583b" stroke-width="1.3"></path>

    <path d="M41 75
         C33 69 27 69 22 73
         C27 80 34 82 42 79Z" fill="url(#leafGreen)" stroke="#35583b" stroke-width="1.3"></path>

    <path d="M48 81
         C40 76 34 76 29 80
         C34 86 41 88 49 85Z" fill="url(#leafGreen)" stroke="#35583b" stroke-width="1.3"></path>

    <path d="M36 50
         C28 44 22 44 18 48
         C23 55 30 57 37 55Z" fill="url(#leafGreen)" stroke="#35583b" stroke-width="1.3"></path>

    <path d="M44 57
         C36 52 30 52 25 56
         C30 62 37 64 45 61Z" fill="url(#leafGreen)" stroke="#35583b" stroke-width="1.3"></path>

    <path d="M95 58
         C103 52 109 52 113 56
         C108 63 101 65 94 63Z" fill="url(#leafGreen)" stroke="#35583b" stroke-width="1.3"></path>

    <path d="M87 65
         C95 59 102 59 106 63
         C101 70 94 72 86 69Z" fill="url(#leafGreen)" stroke="#35583b" stroke-width="1.3"></path>

    <path d="M80 72
         C88 67 95 67 99 71
         C94 77 87 79 79 76Z" fill="url(#leafGreen)" stroke="#35583b" stroke-width="1.3"></path>

    <path d="M91 42
         C99 36 105 36 109 40
         C104 47 97 49 90 47Z" fill="url(#leafGreen)" stroke="#35583b" stroke-width="1.3"></path>

    <path d="M84 49
         C92 44 98 44 103 48
         C98 54 91 56 83 53Z" fill="url(#leafGreen)" stroke="#35583b" stroke-width="1.3"></path>

  </g>

  <!-- Leaf highlights -->
  <g fill="none" stroke="#bed0af" stroke-width="0.8" stroke-linecap="round" opacity="0.75">

    <path d="M17 66 C24 67 29 70 33 72"></path>
    <path d="M24 74 C31 75 36 77 41 79"></path>
    <path d="M111 57 C104 58 99 60 95 62"></path>
    <path d="M104 64 C97 65 92 67 87 69"></path>

  </g>

  <!-- Flower branches -->
  <g fill="none" stroke="#6c7547" stroke-width="1.3" stroke-linecap="round">

    <path d="M63 47 L53 38"></path>
    <path d="M64 44 L65 33"></path>
    <path d="M65 45 L76 36"></path>
    <path d="M52 38 L46 31"></path>
    <path d="M53 38 L54 29"></path>
    <path d="M76 36 L75 28"></path>
    <path d="M76 36 L83 30"></path>

  </g>

  <!-- White / lilac flowers -->
  <g filter="url(#softShadow)">

    <g transform="translate(45 30)">

      <path d="M0 0
           C-5 -5 -4 -10 0 -12
           C4 -10 5 -5 0 0Z" fill="url(#flowerWhite)" stroke="#b7bcae" stroke-width="0.8"></path>

      <path d="M0 0
           C5 -4 9 -3 10 1
           C8 5 4 5 0 0Z" fill="url(#flowerWhite)" stroke="#b7bcae" stroke-width="0.8"></path>

      <path d="M0 0
           C2 5 0 9 -4 9
           C-7 6 -6 2 0 0Z" fill="url(#flowerLilac)" stroke="#7b5f7c" stroke-width="0.8"></path>

      <circle cx="0" cy="0" r="1.6" fill="#d7b95f"></circle>

    </g>

    <g transform="translate(66 31) scale(0.9)">

      <path d="M0 0
           C-5 -5 -4 -10 0 -12
           C4 -10 5 -5 0 0Z" fill="url(#flowerWhite)" stroke="#b7bcae" stroke-width="0.8"></path>

      <path d="M0 0
           C5 -4 9 -3 10 1
           C8 5 4 5 0 0Z" fill="url(#flowerWhite)" stroke="#b7bcae" stroke-width="0.8"></path>

      <path d="M0 0
           C2 5 0 9 -4 9
           C-7 6 -6 2 0 0Z" fill="url(#flowerLilac)" stroke="#7b5f7c" stroke-width="0.8"></path>

      <circle cx="0" cy="0" r="1.6" fill="#d7b95f"></circle>

    </g>

    <g transform="translate(84 29) scale(0.82)">

      <path d="M0 0
           C-5 -5 -4 -10 0 -12
           C4 -10 5 -5 0 0Z" fill="url(#flowerWhite)" stroke="#b7bcae" stroke-width="0.8"></path>

      <path d="M0 0
           C5 -4 9 -3 10 1
           C8 5 4 5 0 0Z" fill="url(#flowerWhite)" stroke="#b7bcae" stroke-width="0.8"></path>

      <path d="M0 0
           C2 5 0 9 -4 9
           C-7 6 -6 2 0 0Z" fill="url(#flowerLilac)" stroke="#7b5f7c" stroke-width="0.8"></path>

      <circle cx="0" cy="0" r="1.6" fill="#d7b95f"></circle>

    </g>

  </g>

  <!-- Seed head -->
  <path d="M77 85
       C87 90 94 96 98 103" fill="none" stroke="#766d48" stroke-width="1.4" stroke-linecap="round"></path>

  <!-- Aromatic seeds -->
  <g fill="url(#seedBrown)" stroke="#44342a" stroke-width="0.7" filter="url(#softShadow)">

    <ellipse cx="96" cy="101" rx="2.4" ry="3.4" transform="rotate(-20 96 101)"></ellipse>

    <ellipse cx="102" cy="106" rx="2.4" ry="3.4" transform="rotate(16 102 106)"></ellipse>

    <ellipse cx="91" cy="107" rx="2.4" ry="3.4" transform="rotate(-8 91 107)"></ellipse>

    <ellipse cx="35" cy="108" rx="2.6" ry="3.6" transform="rotate(-16 35 108)"></ellipse>

    <ellipse cx="43" cy="113" rx="2.6" ry="3.6" transform="rotate(18 43 113)"></ellipse>

    <ellipse cx="51" cy="109" rx="2.6" ry="3.6" transform="rotate(-6 51 109)"></ellipse>

  </g>

  <!-- Botanical highlights -->
  <g fill="#eee1b8" opacity="0.6">

    <circle cx="49" cy="62" r="1"></circle>
    <circle cx="84" cy="60" r="1"></circle>
    <circle cx="58" cy="42" r="0.9"></circle>

  </g>

</svg>