<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Kutsay</title>

  <desc id="desc">
    Detailed botanical illustration of Philippine Kutsay or Garlic Chives
    with dense flat green leaves, white star-shaped flowers,
    layered highlights, shadows and natural depth.
  </desc>

  <defs>

    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a4d66f"></stop>
      <stop offset="0.42" stop-color="#579b4d"></stop>
      <stop offset="1" stop-color="#245d38"></stop>
    </linearGradient>

    <linearGradient id="leafDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#70af58"></stop>
      <stop offset="0.5" stop-color="#3a7d47"></stop>
      <stop offset="1" stop-color="#194a30"></stop>
    </linearGradient>

    <linearGradient id="stemGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86b85b"></stop>
      <stop offset="0.55" stop-color="#527b42"></stop>
      <stop offset="1" stop-color="#315538"></stop>
    </linearGradient>

    <radialGradient id="flowerWhite" cx="35%" cy="28%" r="75%">
      <stop offset="0" stop-color="#ffffff"></stop>
      <stop offset="0.55" stop-color="#f5f3df"></stop>
      <stop offset="1" stop-color="#d8d5bc"></stop>
    </radialGradient>

    <radialGradient id="flowerCenter" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#f4db83"></stop>
      <stop offset="1" stop-color="#b69243"></stop>
    </radialGradient>

    <filter id="mainShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.4" flood-color="#1d3427" flood-opacity="0.30"></feDropShadow>
    </filter>

    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5"></feGaussianBlur>
    </filter>

  </defs>

  <ellipse cx="64" cy="112" rx="37" ry="6" fill="#20392a" opacity="0.15" filter="url(#softBlur)"></ellipse>

  <g filter="url(#mainShadow)">

    <!-- dense flat chive leaves -->
    <path d="M45 108
             C44 87 46 65 51 41
             C54 29 57 20 61 14
             C60 37 59 61 58 83
             C57 96 54 104 51 110Z" fill="url(#leafGreen)"></path>

    <path d="M54 110
             C52 91 54 69 61 47
             C65 34 69 25 74 18
             C70 40 67 61 66 83
             C65 96 62 105 60 111Z" fill="url(#leafDark)"></path>

    <path d="M64 111
             C63 91 66 70 74 52
             C80 38 86 29 92 24
             C84 45 79 65 76 84
             C74 98 71 106 69 112Z" fill="url(#leafGreen)"></path>

    <path d="M37 108
             C35 88 35 69 38 51
             C40 37 44 27 48 20
             C47 40 47 61 48 81
             C48 96 45 104 43 110Z" fill="url(#leafDark)"></path>

    <path d="M72 109
             C73 91 78 74 87 58
             C94 46 101 38 108 34
             C97 51 90 69 86 87
             C83 99 79 107 76 111Z" fill="url(#leafDark)"></path>

    <path d="M30 106
             C27 88 26 72 28 57
             C29 46 32 37 36 30
             C36 49 38 67 40 84
             C41 95 39 103 36 108Z" fill="url(#leafGreen)"></path>

    <!-- flower stalk -->
    <path d="M62 108
             C63 86 65 64 67 45
             C69 32 72 23 75 17" fill="none" stroke="url(#stemGreen)" stroke-width="4" stroke-linecap="round"></path>

    <!-- umbel branches -->
    <path d="M75 19 L64 12" stroke="#6d9750" stroke-width="1.8" stroke-linecap="round"></path>

    <path d="M75 19 L71 8" stroke="#6d9750" stroke-width="1.8" stroke-linecap="round"></path>

    <path d="M75 19 L78 7" stroke="#6d9750" stroke-width="1.8" stroke-linecap="round"></path>

    <path d="M75 19 L85 10" stroke="#6d9750" stroke-width="1.8" stroke-linecap="round"></path>

    <path d="M75 19 L89 17" stroke="#6d9750" stroke-width="1.8" stroke-linecap="round"></path>

    <path d="M75 19 L84 25" stroke="#6d9750" stroke-width="1.8" stroke-linecap="round"></path>

    <path d="M75 19 L68 25" stroke="#6d9750" stroke-width="1.8" stroke-linecap="round"></path>

    <!-- flower 1 -->
    <g transform="translate(62 10)">
      <ellipse cx="0" cy="-4" rx="2.3" ry="4.5" fill="url(#flowerWhite)"></ellipse>
      <ellipse cx="4" cy="-1" rx="2.3" ry="4.5" transform="rotate(60 4 -1)" fill="url(#flowerWhite)"></ellipse>
      <ellipse cx="3" cy="4" rx="2.3" ry="4.5" transform="rotate(120 3 4)" fill="url(#flowerWhite)"></ellipse>
      <ellipse cx="-3" cy="4" rx="2.3" ry="4.5" transform="rotate(-120 -3 4)" fill="url(#flowerWhite)"></ellipse>
      <ellipse cx="-4" cy="-1" rx="2.3" ry="4.5" transform="rotate(-60 -4 -1)" fill="url(#flowerWhite)"></ellipse>
      <circle cx="0" cy="0" r="1.7" fill="url(#flowerCenter)"></circle>
    </g>

    <!-- flower 2 -->
    <g transform="translate(71 7)">
      <ellipse cx="0" cy="-4" rx="2.2" ry="4.3" fill="url(#flowerWhite)"></ellipse>
      <ellipse cx="4" cy="-1" rx="2.2" ry="4.3" transform="rotate(60 4 -1)" fill="url(#flowerWhite)"></ellipse>
      <ellipse cx="3" cy="4" rx="2.2" ry="4.3" transform="rotate(120 3 4)" fill="url(#flowerWhite)"></ellipse>
      <ellipse cx="-3" cy="4" rx="2.2" ry="4.3" transform="rotate(-120 -3 4)" fill="url(#flowerWhite)"></ellipse>
      <ellipse cx="-4" cy="-1" rx="2.2" ry="4.3" transform="rotate(-60 -4 -1)" fill="url(#flowerWhite)"></ellipse>
      <circle cx="0" cy="0" r="1.6" fill="url(#flowerCenter)"></circle>
    </g>

    <!-- flower 3 -->
    <g transform="translate(80 7)">
      <ellipse cx="0" cy="-4" rx="2.2" ry="4.3" fill="url(#flowerWhite)"></ellipse>
      <ellipse cx="4" cy="-1" rx="2.2" ry="4.3" transform="rotate(60 4 -1)" fill="url(#flowerWhite)"></ellipse>
      <ellipse cx="3" cy="4" rx="2.2" ry="4.3" transform="rotate(120 3 4)" fill="url(#flowerWhite)"></ellipse>
      <ellipse cx="-3" cy="4" rx="2.2" ry="4.3" transform="rotate(-120 -3 4)" fill="url(#flowerWhite)"></ellipse>
      <ellipse cx="-4" cy="-1" rx="2.2" ry="4.3" transform="rotate(-60 -4 -1)" fill="url(#flowerWhite)"></ellipse>
      <circle cx="0" cy="0" r="1.6" fill="url(#flowerCenter)"></circle>
    </g>

    <!-- flower 4 -->
    <g transform="translate(87 14)">
      <ellipse cx="0" cy="-4" rx="2.2" ry="4.3" fill="url(#flowerWhite)"></ellipse>
      <ellipse cx="4" cy="-1" rx="2.2" ry="4.3" transform="rotate(60 4 -1)" fill="url(#flowerWhite)"></ellipse>
      <ellipse cx="3" cy="4" rx="2.2" ry="4.3" transform="rotate(120 3 4)" fill="url(#flowerWhite)"></ellipse>
      <ellipse cx="-3" cy="4" rx="2.2" ry="4.3" transform="rotate(-120 -3 4)" fill="url(#flowerWhite)"></ellipse>
      <ellipse cx="-4" cy="-1" rx="2.2" ry="4.3" transform="rotate(-60 -4 -1)" fill="url(#flowerWhite)"></ellipse>
      <circle cx="0" cy="0" r="1.6" fill="url(#flowerCenter)"></circle>
    </g>

    <!-- flower 5 -->
    <g transform="translate(83 24)">
      <ellipse cx="0" cy="-4" rx="2.2" ry="4.3" fill="url(#flowerWhite)"></ellipse>
      <ellipse cx="4" cy="-1" rx="2.2" ry="4.3" transform="rotate(60 4 -1)" fill="url(#flowerWhite)"></ellipse>
      <ellipse cx="3" cy="4" rx="2.2" ry="4.3" transform="rotate(120 3 4)" fill="url(#flowerWhite)"></ellipse>
      <ellipse cx="-3" cy="4" rx="2.2" ry="4.3" transform="rotate(-120 -3 4)" fill="url(#flowerWhite)"></ellipse>
      <ellipse cx="-4" cy="-1" rx="2.2" ry="4.3" transform="rotate(-60 -4 -1)" fill="url(#flowerWhite)"></ellipse>
      <circle cx="0" cy="0" r="1.6" fill="url(#flowerCenter)"></circle>
    </g>

    <!-- flower 6 -->
    <g transform="translate(67 24)">
      <ellipse cx="0" cy="-4" rx="2.2" ry="4.3" fill="url(#flowerWhite)"></ellipse>
      <ellipse cx="4" cy="-1" rx="2.2" ry="4.3" transform="rotate(60 4 -1)" fill="url(#flowerWhite)"></ellipse>
      <ellipse cx="3" cy="4" rx="2.2" ry="4.3" transform="rotate(120 3 4)" fill="url(#flowerWhite)"></ellipse>
      <ellipse cx="-3" cy="4" rx="2.2" ry="4.3" transform="rotate(-120 -3 4)" fill="url(#flowerWhite)"></ellipse>
      <ellipse cx="-4" cy="-1" rx="2.2" ry="4.3" transform="rotate(-60 -4 -1)" fill="url(#flowerWhite)"></ellipse>
      <circle cx="0" cy="0" r="1.6" fill="url(#flowerCenter)"></circle>
    </g>

  </g>

  <!-- leaf highlights -->
  <path d="M48 104
           C48 78 52 49 59 22" fill="none" stroke="#d9ebb0" stroke-width="1.4" stroke-linecap="round" opacity="0.35"></path>

  <path d="M67 106
           C69 83 76 57 88 31" fill="none" stroke="#d6e9aa" stroke-width="1.3" stroke-linecap="round" opacity="0.32"></path>

  <path d="M35 102
           C33 78 34 54 38 35" fill="none" stroke="#e0efba" stroke-width="1.2" stroke-linecap="round" opacity="0.30"></path>

</svg>