<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Caucasian Spinach</title>

  <desc id="desc">
    Detailed botanical illustration of Caucasian spinach with climbing green stems,
    broad heart-shaped edible leaves, tender young shoots,
    small greenish-yellow star-shaped flowers, and a perennial root crown.
  </desc>

  <defs>

    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3da9d"></stop>
      <stop offset="0.48" stop-color="#78a565"></stop>
      <stop offset="1" stop-color="#3c6a4d"></stop>
    </linearGradient>

    <linearGradient id="leafDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fb474"></stop>
      <stop offset="1" stop-color="#345b45"></stop>
    </linearGradient>

    <linearGradient id="youngLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9e6ae"></stop>
      <stop offset="1" stop-color="#71975c"></stop>
    </linearGradient>

    <linearGradient id="stemGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aac382"></stop>
      <stop offset="0.55" stop-color="#718b58"></stop>
      <stop offset="1" stop-color="#4f704f"></stop>
    </linearGradient>

    <radialGradient id="flowerGreen" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#e4df91"></stop>
      <stop offset="0.55" stop-color="#abb45e"></stop>
      <stop offset="1" stop-color="#6d7945"></stop>
    </radialGradient>

    <linearGradient id="rootBrown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ad8b63"></stop>
      <stop offset="1" stop-color="#695341"></stop>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#273029" flood-opacity="0.2"></feDropShadow>
    </filter>

  </defs>

  <!-- Ground shadow -->
  <ellipse cx="64" cy="119" rx="43" ry="5" fill="#4d514a" opacity="0.15"></ellipse>

  <!-- Perennial root crown -->
  <path d="M47 105
       C52 100 58 98 64 98
       C71 98 77 100 81 105
       C77 112 71 115 64 115
       C57 115 52 112 47 105Z" fill="#725e49" stroke="#493e34" stroke-width="1.4"></path>

  <!-- Thick perennial roots -->
  <g fill="none" stroke="url(#rootBrown)" stroke-linecap="round">

    <path d="M54 110 C49 115 46 120 42 124" stroke-width="2"></path>

    <path d="M60 112 C58 118 57 122 57 126" stroke-width="1.7"></path>

    <path d="M67 112 C69 118 70 122 71 126" stroke-width="1.7"></path>

    <path d="M74 110 C79 115 82 120 86 124" stroke-width="2"></path>

  </g>

  <!-- Main climbing stem -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round">

    <path d="M63 102
         C58 91 61 81 68 73
         C77 63 75 52 66 44
         C57 36 60 26 69 18
         C74 14 75 10 72 6" stroke-width="3"></path>

    <path d="M65 85
         C51 80 42 72 36 62" stroke-width="1.7"></path>

    <path d="M68 73
         C82 70 92 62 98 52" stroke-width="1.7"></path>

    <path d="M67 45
         C54 44 45 38 39 30" stroke-width="1.45"></path>

    <path d="M64 35
         C77 33 86 27 92 19" stroke-width="1.45"></path>

  </g>

  <!-- Lower left heart-shaped leaf -->
  <g filter="url(#softShadow)">

    <path d="M58 91
         C50 96 40 94 33 88
         C27 83 24 76 27 70
         C30 64 37 62 43 65
         C47 67 50 71 52 75
         C55 71 60 69 64 71
         C65 78 63 85 58 91Z" fill="url(#leafGreen)" stroke="#386347" stroke-width="1.5"></path>

  </g>

  <!-- Lower right heart-shaped leaf -->
  <g filter="url(#softShadow)">

    <path d="M71 89
         C79 95 89 93 96 87
         C102 82 105 75 102 69
         C99 63 92 61 86 64
         C82 66 79 70 77 74
         C74 70 69 68 65 70
         C64 77 66 84 71 89Z" fill="url(#leafGreen)" stroke="#386347" stroke-width="1.5"></path>

  </g>

  <!-- Mid left leaf -->
  <path d="M62 70
       C54 74 46 71 41 66
       C36 61 35 55 38 50
       C42 46 48 46 53 49
       C56 51 58 54 59 57
       C62 54 66 53 70 55
       C70 61 67 67 62 70Z" fill="url(#leafDark)" stroke="#345a43" stroke-width="1.3" filter="url(#softShadow)"></path>

  <!-- Mid right leaf -->
  <path d="M72 59
       C80 64 88 61 93 56
       C98 51 99 45 96 40
       C92 36 86 36 81 39
       C78 41 76 44 75 47
       C72 44 68 43 64 45
       C64 51 67 56 72 59Z" fill="url(#leafDark)" stroke="#345a43" stroke-width="1.3" filter="url(#softShadow)"></path>

  <!-- Upper left leaf -->
  <path d="M61 46
       C54 48 47 45 43 40
       C40 36 40 31 43 27
       C47 24 52 25 56 28
       C58 30 60 33 61 36
       C64 33 67 32 70 34
       C69 39 66 43 61 46Z" fill="url(#leafGreen)" stroke="#386347" stroke-width="1.15"></path>

  <!-- Upper right leaf -->
  <path d="M73 35
       C80 39 87 36 91 31
       C94 27 94 22 91 18
       C87 15 82 16 78 19
       C76 21 74 24 73 27
       C70 24 67 23 64 25
       C65 30 68 33 73 35Z" fill="url(#leafGreen)" stroke="#386347" stroke-width="1.15"></path>

  <!-- Tender spring shoot -->
  <g filter="url(#softShadow)">

    <path d="M57 101
         C53 92 54 84 58 77
         C60 73 63 70 66 69
         C68 77 67 86 64 94
         C62 99 60 101 57 101Z" fill="url(#youngLeaf)" stroke="#647f52" stroke-width="1.15"></path>

    <path d="M60 82
         C55 81 52 77 52 73
         C52 69 55 66 58 65
         C62 69 63 76 60 82Z" fill="url(#youngLeaf)" stroke="#647f52" stroke-width="1"></path>

  </g>

  <!-- Leaf veins -->
  <g fill="none" stroke="#d5e2bd" stroke-linecap="round" opacity="0.72">

    <path d="M57 88 C49 80 40 73 30 70" stroke-width="0.8"></path>

    <path d="M72 86 C81 79 90 72 99 69" stroke-width="0.8"></path>

    <path d="M61 67 C54 60 47 54 40 51" stroke-width="0.7"></path>

    <path d="M73 56 C80 49 88 43 95 40" stroke-width="0.7"></path>

    <path d="M61 43 C55 37 49 31 44 28" stroke-width="0.65"></path>

    <path d="M73 32 C79 26 85 21 90 19" stroke-width="0.65"></path>

  </g>

  <!-- Flowering side branches -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round">

    <path d="M69 18 L57 13" stroke-width="0.95"></path>

    <path d="M70 17 L66 8" stroke-width="0.95"></path>

    <path d="M71 17 L79 9" stroke-width="0.95"></path>

    <path d="M70 18 L87 15" stroke-width="0.95"></path>

  </g>

  <!-- Tiny greenish-yellow star flowers -->
  <g filter="url(#softShadow)">

    <g transform="translate(56 12)">
      <g fill="url(#flowerGreen)" stroke="#687344" stroke-width="0.4">

        <path d="M0 0 L0 -3.3 L1.2 -1.4 L3.3 -2.1 L1.7 0 L3.3 2.1 L1.1 1.4 L0 3.5 L-1.1 1.4 L-3.3 2.1 L-1.7 0 L-3.3 -2.1 L-1.2 -1.4Z"></path>

      </g>

      <circle cx="0" cy="0" r="0.8" fill="#e4d86e"></circle>
    </g>

    <g transform="translate(66 7)">
      <g fill="url(#flowerGreen)" stroke="#687344" stroke-width="0.4">

        <path d="M0 0 L0 -3.5 L1.2 -1.4 L3.4 -2.2 L1.8 0 L3.4 2.2 L1.2 1.4 L0 3.5 L-1.2 1.4 L-3.4 2.2 L-1.8 0 L-3.4 -2.2 L-1.2 -1.4Z"></path>

      </g>

      <circle cx="0" cy="0" r="0.8" fill="#e4d86e"></circle>
    </g>

    <g transform="translate(79 8)">
      <g fill="url(#flowerGreen)" stroke="#687344" stroke-width="0.4">

        <path d="M0 0 L0 -3.3 L1.2 -1.4 L3.3 -2.1 L1.7 0 L3.3 2.1 L1.1 1.4 L0 3.5 L-1.1 1.4 L-3.3 2.1 L-1.7 0 L-3.3 -2.1 L-1.2 -1.4Z"></path>

      </g>

      <circle cx="0" cy="0" r="0.8" fill="#e4d86e"></circle>
    </g>

    <g transform="translate(88 14) scale(.9)">
      <g fill="url(#flowerGreen)" stroke="#687344" stroke-width="0.4">

        <path d="M0 0 L0 -3.3 L1.2 -1.4 L3.3 -2.1 L1.7 0 L3.3 2.1 L1.1 1.4 L0 3.5 L-1.1 1.4 L-3.3 2.1 L-1.7 0 L-3.3 -2.1 L-1.2 -1.4Z"></path>

      </g>

      <circle cx="0" cy="0" r="0.8" fill="#e4d86e"></circle>
    </g>

  </g>

  <!-- Stem highlights -->
  <g fill="none" stroke="#d1dcad" stroke-linecap="round" opacity="0.45">

    <path d="M64 97
         C61 87 64 79 69 73" stroke-width="0.65"></path>

    <path d="M68 42
         C62 37 62 31 67 25" stroke-width="0.6"></path>

  </g>

</svg>