<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Pili</title>
  <desc id="desc">
    A pili tree with a broad green canopy
    and clusters of dark oval pili fruits.
  </desc>

  <!-- Trunk -->
  <path d="M55 116
       C58 91 59 69 60 47
       L68 47
       C69 69 70 92 74 116Z" fill="#806044" stroke="#604936" stroke-width="2.5"></path>

  <!-- Main branches -->
  <path d="M64 52
       C52 40 43 32 34 24" fill="none" stroke="#70543c" stroke-width="6" stroke-linecap="round"></path>

  <path d="M65 52
       C78 40 88 31 97 24" fill="none" stroke="#70543c" stroke-width="6" stroke-linecap="round"></path>

  <path d="M64 46
       C62 34 62 24 64 15" fill="none" stroke="#70543c" stroke-width="5" stroke-linecap="round"></path>

  <!-- Canopy -->
  <circle cx="27" cy="35" r="16" fill="#5f934a"></circle>
  <circle cx="38" cy="22" r="17" fill="#69a050"></circle>
  <circle cx="55" cy="19" r="18" fill="#72a657"></circle>

  <circle cx="73" cy="18" r="18" fill="#679b4d"></circle>
  <circle cx="91" cy="24" r="17" fill="#73a557"></circle>
  <circle cx="103" cy="37" r="15" fill="#609448"></circle>

  <circle cx="42" cy="40" r="18" fill="#76aa59"></circle>
  <circle cx="62" cy="37" r="19" fill="#64994c"></circle>
  <circle cx="83" cy="40" r="18" fill="#70a454"></circle>

  <!-- Leaf details -->
  <path d="M24 32
       C17 25 11 28 12 34
       C16 40 23 39 29 34Z" fill="#82b466"></path>

  <path d="M46 18
       C40 11 33 14 34 20
       C39 25 45 24 50 20Z" fill="#84b566"></path>

  <path d="M81 18
       C87 11 94 14 93 20
       C88 25 82 24 77 20Z" fill="#7caf60"></path>

  <path d="M102 34
       C110 28 116 32 114 38
       C109 43 102 41 97 37Z" fill="#7bae5f"></path>

  <!-- Pili fruit cluster -->
  <path d="M46 41 C47 47 49 52 52 57" fill="none" stroke="#667342" stroke-width="2"></path>

  <path d="M52 45 C53 50 55 54 57 58" fill="none" stroke="#667342" stroke-width="2"></path>

  <ellipse cx="51" cy="59" rx="5" ry="8" transform="rotate(-14 51 59)" fill="#614f42" stroke="#44382f" stroke-width="1.5"></ellipse>

  <ellipse cx="58" cy="61" rx="5" ry="8" transform="rotate(13 58 61)" fill="#51473d" stroke="#39322c" stroke-width="1.5"></ellipse>

  <ellipse cx="44" cy="55" rx="5" ry="8" transform="rotate(-24 44 55)" fill="#6c5847" stroke="#45382f" stroke-width="1.5"></ellipse>

  <!-- Right fruit cluster -->
  <path d="M82 42 C80 48 78 53 76 57" fill="none" stroke="#667342" stroke-width="2"></path>

  <ellipse cx="75" cy="60" rx="5" ry="8" transform="rotate(15 75 60)" fill="#5a4a3e" stroke="#40342d" stroke-width="1.5"></ellipse>

  <ellipse cx="83" cy="57" rx="5" ry="8" transform="rotate(24 83 57)" fill="#665344" stroke="#44372f" stroke-width="1.5"></ellipse>

  <!-- Ground -->
  <ellipse cx="64" cy="117" rx="36" ry="5" fill="#80654a" opacity="0.4"></ellipse>
