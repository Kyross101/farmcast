<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Green Pea</title>

  <desc id="desc">
    A climbing green pea plant with leaves,
    curling tendrils, flowers, and green pea pods.
  </desc>

  <!-- Main vine -->
  <path d="M62 116
       C60 96 64 79 61 63
       C58 47 62 34 67 22" fill="none" stroke="#568748" stroke-width="6" stroke-linecap="round">
  </path>

  <!-- Side vines -->
  <path d="M62 58
       C48 52 39 43 33 34" fill="none" stroke="#568748" stroke-width="4" stroke-linecap="round">
  </path>

  <path d="M63 70
       C78 63 88 54 95 43" fill="none" stroke="#568748" stroke-width="4" stroke-linecap="round">
  </path>

  <path d="M61 84
       C49 79 40 72 34 64" fill="none" stroke="#568748" stroke-width="3.5" stroke-linecap="round">
  </path>

  <!-- Leaves -->
  <ellipse cx="36" cy="37" rx="10" ry="6" transform="rotate(35 36 37)" fill="#75aa5b">
  </ellipse>

  <ellipse cx="48" cy="48" rx="10" ry="6" transform="rotate(20 48 48)" fill="#689d50">
  </ellipse>

  <ellipse cx="92" cy="47" rx="10" ry="6" transform="rotate(-35 92 47)" fill="#75aa5b">
  </ellipse>

  <ellipse cx="81" cy="58" rx="10" ry="6" transform="rotate(-20 81 58)" fill="#689d50">
  </ellipse>

  <ellipse cx="38" cy="67" rx="10" ry="6" transform="rotate(30 38 67)" fill="#7caf60">
  </ellipse>

  <ellipse cx="50" cy="77" rx="10" ry="6" transform="rotate(15 50 77)" fill="#6da253">
  </ellipse>

  <!-- Tendrils -->
  <path d="M67 24
       C76 14 83 18 80 25
       C77 31 70 27 73 22" fill="none" stroke="#72a85a" stroke-width="2.5" stroke-linecap="round">
  </path>

  <path d="M95 43
       C105 34 112 39 108 46
       C105 51 99 48 101 44" fill="none" stroke="#72a85a" stroke-width="2.5" stroke-linecap="round">
  </path>

  <!-- Flowers -->
  <circle cx="30" cy="29" r="5" fill="#f1edf4" stroke="#a898b6" stroke-width="1.5">
  </circle>

  <circle cx="99" cy="38" r="5" fill="#f1edf4" stroke="#a898b6" stroke-width="1.5">
  </circle>

  <!-- Pea pod -->
  <path d="M23 52
       C30 48 42 50 48 57
       C42 67 29 70 19 64
       C17 59 19 55 23 52Z" fill="#76ad57" stroke="#4d7d3f" stroke-width="2">
  </path>

  <!-- Peas inside pod -->
  <circle cx="27" cy="59" r="3" fill="#a6cd73">
  </circle>

  <circle cx="34" cy="58" r="3" fill="#afd47b">
  </circle>

  <circle cx="41" cy="59" r="3" fill="#a3ca70">
  </circle>

  <!-- Second pod -->
  <path d="M89 67
       C96 63 107 65 112 72
       C106 82 94 84 84 78
       C82 73 85 69 89 67Z" fill="#72a954" stroke="#4d7d3f" stroke-width="2">
  </path>

  <circle cx="92" cy="74" r="3" fill="#a6cd73">
  </circle>

  <circle cx="99" cy="73" r="3" fill="#afd47b">
  </circle>

  <circle cx="106" cy="74" r="3" fill="#a3ca70">
  </circle>

  <!-- Ground -->
  <ellipse cx="64" cy="117" rx="30" ry="5" fill="#81664a" opacity="0.4">
  </ellipse>

</svg>