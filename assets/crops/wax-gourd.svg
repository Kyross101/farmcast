<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Wax Gourd</title>
  <desc id="desc">
    A wax gourd vine with green leaves and a pale green oblong fruit.
  </desc>

  <!-- Vine -->
  <path d="M18 45
       C35 29 54 31 67 43
       C79 54 91 52 109 38" fill="none" stroke="#4f803f" stroke-width="5" stroke-linecap="round"></path>

  <!-- Tendril -->
  <path d="M86 48
       C96 40 103 47 98 54
       C94 60 86 56 90 51" fill="none" stroke="#65994b" stroke-width="3" stroke-linecap="round"></path>

  <!-- Leaves -->
  <path d="M35 39
       C25 24 13 25 10 35
       C14 47 26 51 39 45
       C41 42 40 40 35 39Z" fill="#6da34f" stroke="#4f7f3e" stroke-width="2"></path>

  <path d="M73 43
       C68 26 78 18 89 22
       C99 29 96 42 82 49
       C77 49 75 47 73 43Z" fill="#75aa54" stroke="#4f7f3e" stroke-width="2"></path>

  <!-- Leaf veins -->
  <path d="M14 36 L35 42" fill="none" stroke="#598a43" stroke-width="1.5"></path>

  <path d="M88 25 L78 44" fill="none" stroke="#598a43" stroke-width="1.5"></path>

  <!-- Fruit stem -->
  <path d="M63 42 C62 49 62 54 62 59" fill="none" stroke="#547f3d" stroke-width="4" stroke-linecap="round"></path>

  <!-- Wax gourd fruit -->
  <path d="M62 57
       C47 57 37 67 36 82
       C35 99 46 111 62 113
       C79 114 91 103 91 84
       C91 67 80 57 62 57Z" fill="#8fb58a" stroke="#557d55" stroke-width="3"></path>

  <!-- Waxy coating -->
  <path d="M46 70
       C51 65 58 63 65 64" fill="none" stroke="#c4d7c0" stroke-width="3" stroke-linecap="round"></path>

  <path d="M43 80
       C51 76 61 75 71 77" fill="none" stroke="#b9cfb6" stroke-width="2" stroke-linecap="round"></path>

  <!-- Fruit texture -->
  <circle cx="53" cy="91" r="2" fill="#739a72"></circle>
  <circle cx="72" cy="87" r="2" fill="#739a72"></circle>
  <circle cx="64" cy="103" r="2" fill="#739a72"></circle>
</svg>