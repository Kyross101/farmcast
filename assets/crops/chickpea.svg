<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Chickpea</title>

  <desc id="desc">
    A chickpea plant with branching green stems,
    small compound leaves, and rounded seed pods.
  </desc>

  <!-- Main stem -->
  <path d="M63 116
       C62 94 63 74 63 55
       C63 39 62 27 61 17" fill="none" stroke="#5f8c4d" stroke-width="6" stroke-linecap="round">
  </path>

  <!-- Branches -->
  <path d="M62 49
       C49 42 40 34 34 25" fill="none" stroke="#5f8c4d" stroke-width="4" stroke-linecap="round">
  </path>

  <path d="M64 57
       C78 49 88 41 95 32" fill="none" stroke="#5f8c4d" stroke-width="4" stroke-linecap="round">
  </path>

  <path d="M62 70
       C50 65 42 59 35 52" fill="none" stroke="#5f8c4d" stroke-width="3.5" stroke-linecap="round">
  </path>

  <!-- Leaves -->
  <ellipse cx="38" cy="29" rx="8" ry="4" transform="rotate(35 38 29)" fill="#73a65a">
  </ellipse>

  <ellipse cx="47" cy="38" rx="8" ry="4" transform="rotate(35 47 38)" fill="#7daf60">
  </ellipse>

  <ellipse cx="91" cy="36" rx="8" ry="4" transform="rotate(-35 91 36)" fill="#73a65a">
  </ellipse>

  <ellipse cx="82" cy="45" rx="8" ry="4" transform="rotate(-35 82 45)" fill="#7daf60">
  </ellipse>

  <ellipse cx="39" cy="56" rx="8" ry="4" transform="rotate(30 39 56)" fill="#6c9f53">
  </ellipse>

  <ellipse cx="49" cy="63" rx="8" ry="4" transform="rotate(30 49 63)" fill="#79aa5c">
  </ellipse>

  <!-- Additional leaflets -->
  <ellipse cx="58" cy="33" rx="6" ry="3.5" transform="rotate(-15 58 33)" fill="#75a95a">
  </ellipse>

  <ellipse cx="69" cy="42" rx="6" ry="3.5" transform="rotate(15 69 42)" fill="#6da052">
  </ellipse>

  <ellipse cx="57" cy="79" rx="7" ry="4" transform="rotate(-25 57 79)" fill="#72a557">
  </ellipse>

  <ellipse cx="69" cy="83" rx="7" ry="4" transform="rotate(25 69 83)" fill="#7aac5d">
  </ellipse>

  <!-- Chickpea pods -->
  <path d="M30 20
       C23 22 22 31 28 35
       C35 35 39 29 36 23
       C34 20 32 19 30 20Z" fill="#9fbb66" stroke="#66884a" stroke-width="2">
  </path>

  <path d="M99 27
       C93 26 89 32 91 38
       C94 44 103 44 106 38
       C108 32 104 28 99 27Z" fill="#a9c371" stroke="#66884a" stroke-width="2">
  </path>

  <path d="M31 48
       C25 48 22 54 24 60
       C27 66 36 66 39 60
       C41 54 37 49 31 48Z" fill="#9db763" stroke="#66884a" stroke-width="2">
  </path>

  <!-- Pod seed details -->
  <circle cx="30" cy="28" r="3" fill="#d3c18c">
  </circle>

  <circle cx="99" cy="35" r="3" fill="#d8c691">
  </circle>

  <circle cx="31" cy="57" r="3" fill="#cfbd88">
  </circle>

  <!-- Ground -->
  <ellipse cx="64" cy="117" rx="30" ry="5" fill="#81664a" opacity="0.4">
  </ellipse>

</svg>