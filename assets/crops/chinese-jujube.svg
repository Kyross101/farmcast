<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="chineseJujubeTitle chineseJujubeDesc">
  <title id="chineseJujubeTitle">Chinese Jujube</title>
  <desc id="chineseJujubeDesc">
    Detailed Chinese jujube branch with glossy green leaves
    and ripe reddish-brown edible fruits.
  </desc>

  <defs>
    <linearGradient id="cjStem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#84613f"></stop>
      <stop offset="48%" stop-color="#63442f"></stop>
      <stop offset="100%" stop-color="#3f2b21"></stop>
    </linearGradient>

    <linearGradient id="cjLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9bd46c"></stop>
      <stop offset="40%" stop-color="#58aa53"></stop>
      <stop offset="100%" stop-color="#23713d"></stop>
    </linearGradient>

    <linearGradient id="cjLeafDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#65b65b"></stop>
      <stop offset="100%" stop-color="#175c34"></stop>
    </linearGradient>

    <radialGradient id="cjFruitRipe" cx="32%" cy="25%" r="76%">
      <stop offset="0%" stop-color="#e9a36a"></stop>
      <stop offset="28%" stop-color="#c66d45"></stop>
      <stop offset="65%" stop-color="#963e32"></stop>
      <stop offset="100%" stop-color="#67282a"></stop>
    </radialGradient>

    <radialGradient id="cjFruitBrown" cx="30%" cy="24%" r="78%">
      <stop offset="0%" stop-color="#d9945d"></stop>
      <stop offset="38%" stop-color="#a85b3c"></stop>
      <stop offset="100%" stop-color="#643025"></stop>
    </radialGradient>

    <radialGradient id="cjFruitGreen" cx="32%" cy="26%" r="74%">
      <stop offset="0%" stop-color="#d7e988"></stop>
      <stop offset="45%" stop-color="#95bd55"></stop>
      <stop offset="100%" stop-color="#5d8b3d"></stop>
    </radialGradient>

    <filter id="cjShadow" x="-35%" y="-35%" width="170%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.4" flood-color="#1c3020" flood-opacity="0.22"></feDropShadow>
    </filter>
  </defs>

  <ellipse cx="65" cy="111" rx="39" ry="6" fill="#243526" opacity="0.12"></ellipse>

  <!-- Main branch -->
  <g fill="none" stroke="url(#cjStem)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 104
         C40 90 53 77 65 61
         C77 45 84 30 91 15" stroke-width="6"></path>

    <path d="M48 82
         C39 71 32 61 27 49" stroke-width="3.5"></path>

    <path d="M62 66
         C76 67 90 63 102 54" stroke-width="3.4"></path>

    <path d="M37 92
         C50 96 64 96 77 91" stroke-width="3"></path>

    <path d="M74 49
         C69 39 67 30 69 21" stroke-width="2.8"></path>
  </g>

  <!-- Bark highlight -->
  <path d="M27 101
       C42 88 54 76 64 61
       C75 45 82 30 89 16" fill="none" stroke="#ae8356" stroke-width="1.15" stroke-linecap="round" opacity="0.48"></path>

  <!-- Upper left leaf -->
  <g filter="url(#cjShadow)">
    <path d="M34 52
         C24 51 16 45 16 37
         C23 30 34 30 42 36
         C47 41 43 49 34 52Z" fill="url(#cjLeaf)"></path>

    <path d="M39 44
         C32 41 25 39 18 38" fill="none" stroke="#d8efbd" stroke-width="1.3" stroke-linecap="round" opacity="0.72"></path>

    <g fill="none" stroke="#bde09f" stroke-width="0.85" opacity="0.62">
      <path d="M32 41 L29 35"></path>
      <path d="M35 43 L37 37"></path>
      <path d="M28 40 L24 35"></path>
    </g>
  </g>

  <!-- High leaf -->
  <g filter="url(#cjShadow)">
    <path d="M69 27
         C62 20 63 11 71 7
         C80 9 84 17 81 25
         C78 31 73 32 69 27Z" fill="url(#cjLeafDark)"></path>

    <path d="M74 27
         C74 20 73 14 72 8" fill="none" stroke="#d2e9b8" stroke-width="1.25" opacity="0.7"></path>
  </g>

  <!-- Right upper leaf -->
  <g filter="url(#cjShadow)">
    <path d="M92 51
         C95 40 104 35 113 39
         C117 48 111 57 102 60
         C96 60 91 57 92 51Z" fill="url(#cjLeaf)"></path>

    <path d="M98 55
         C103 49 108 44 113 40" fill="none" stroke="#d9efc0" stroke-width="1.3" opacity="0.7"></path>
  </g>

  <!-- Mid-left leaf -->
  <g filter="url(#cjShadow)">
    <path d="M47 70
         C37 66 28 69 25 77
         C31 86 42 89 51 82
         C56 77 53 72 47 70Z" fill="url(#cjLeafDark)"></path>

    <path d="M49 77
         C41 77 34 78 27 78" fill="none" stroke="#d0e7b8" stroke-width="1.25" opacity="0.68"></path>
  </g>

  <!-- Center leaf -->
  <g filter="url(#cjShadow)">
    <path d="M57 59
         C50 51 52 42 60 37
         C69 40 73 48 70 56
         C67 63 61 64 57 59Z" fill="url(#cjLeaf)"></path>

    <path d="M62 58
         C62 51 61 44 60 38" fill="none" stroke="#d9efc2" stroke-width="1.25" opacity="0.68"></path>
  </g>

  <!-- Lower right leaf -->
  <g filter="url(#cjShadow)">
    <path d="M80 88
         C87 78 98 76 106 82
         C107 92 98 101 88 100
         C80 98 76 93 80 88Z" fill="url(#cjLeafDark)"></path>

    <path d="M84 94
         C92 90 99 86 105 83" fill="none" stroke="#d2e9b8" stroke-width="1.3" opacity="0.7"></path>
  </g>

  <!-- Fruit stems -->
  <g fill="none" stroke="#5f7138" stroke-width="2.4" stroke-linecap="round">
    <path d="M52 77 C51 83 50 87 48 91"></path>
    <path d="M72 59 C75 65 77 70 78 75"></path>
    <path d="M89 59 C92 64 95 69 97 74"></path>
    <path d="M76 48 C79 52 81 56 82 61"></path>
  </g>

  <!-- Left ripe fruit -->
  <g filter="url(#cjShadow)">
    <ellipse cx="46" cy="96" rx="11" ry="15" transform="rotate(10 46 96)" fill="url(#cjFruitRipe)" stroke="#74322d" stroke-width="1.3"></ellipse>

    <ellipse cx="42" cy="90" rx="4" ry="6" transform="rotate(-20 42 90)" fill="#f3c18a" opacity="0.48"></ellipse>

    <path d="M39 101
         C43 105 49 107 54 103" fill="none" stroke="#542526" stroke-width="1" opacity="0.52"></path>

    <circle cx="47" cy="82" r="2.1" fill="#536631"></circle>
  </g>

  <!-- Center fruit -->
  <g filter="url(#cjShadow)">
    <ellipse cx="79" cy="81" rx="12" ry="16" transform="rotate(-5 79 81)" fill="url(#cjFruitBrown)" stroke="#75402e" stroke-width="1.3"></ellipse>

    <ellipse cx="75" cy="75" rx="4.4" ry="6" transform="rotate(-24 75 75)" fill="#efbf84" opacity="0.46"></ellipse>

    <path d="M71 86
         C75 90 82 92 87 87" fill="none" stroke="#613021" stroke-width="1" opacity="0.48"></path>

    <circle cx="79" cy="65" r="2.1" fill="#556835"></circle>
  </g>

  <!-- Right dark ripe fruit -->
  <g filter="url(#cjShadow)">
    <ellipse cx="99" cy="82" rx="10.5" ry="14.5" transform="rotate(12 99 82)" fill="url(#cjFruitRipe)" stroke="#672a28" stroke-width="1.3"></ellipse>

    <ellipse cx="95" cy="76" rx="3.5" ry="5" transform="rotate(-15 95 76)" fill="#e9ae78" opacity="0.42"></ellipse>

    <path d="M92 87
         C97 91 102 92 107 88" fill="none" stroke="#542324" stroke-width="1" opacity="0.48"></path>

    <circle cx="98" cy="68" r="2" fill="#536634"></circle>
  </g>

  <!-- Unripe green fruit -->
  <g filter="url(#cjShadow)">
    <ellipse cx="83" cy="65" rx="8" ry="11" transform="rotate(7 83 65)" fill="url(#cjFruitGreen)" stroke="#60833d" stroke-width="1.2"></ellipse>

    <ellipse cx="80" cy="61" rx="2.8" ry="4" fill="#e4ee9e" opacity="0.55" transform="rotate(-20 80 61)"></ellipse>

    <circle cx="83" cy="54" r="1.7" fill="#566b35"></circle>
  </g>

  <!-- Small thorn detail -->
  <path d="M57 72 L52 67" fill="none" stroke="#755039" stroke-width="1.8" stroke-linecap="round"></path>

  <path d="M89 43 L94 38" fill="none" stroke="#755039" stroke-width="1.7" stroke-linecap="round"></path>
</svg>