<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Ajwain</title>

  <desc id="desc">
    Detailed botanical illustration of ajwain with feathery leaves,
    white flower umbels, green developing fruits, and dried aromatic carom seeds.
  </desc>

  <defs>
    <linearGradient id="stemGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#789a57"></stop>
      <stop offset="1" stop-color="#45663d"></stop>
    </linearGradient>

    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#91b76d"></stop>
      <stop offset="0.55" stop-color="#5c8a50"></stop>
      <stop offset="1" stop-color="#315e3e"></stop>
    </linearGradient>

    <radialGradient id="seedBrown" cx="35%" cy="28%" r="72%">
      <stop offset="0" stop-color="#b79a70"></stop>
      <stop offset="0.55" stop-color="#80654a"></stop>
      <stop offset="1" stop-color="#4a382c"></stop>
    </radialGradient>

    <linearGradient id="flowerWhite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffef5"></stop>
      <stop offset="1" stop-color="#dfe5d2"></stop>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#263128" flood-opacity="0.22"></feDropShadow>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="64" cy="119" rx="44" ry="5" fill="#554f46" opacity="0.15"></ellipse>

  <!-- Main stems -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round">

    <path d="M63 108
         C62 91 63 72 64 55
         C65 39 64 27 61 17" stroke-width="4.8"></path>

    <path d="M52 108
         C52 91 50 75 47 60
         C45 48 41 38 36 29" stroke-width="3.4"></path>

    <path d="M75 108
         C75 91 78 75 82 61
         C86 49 91 39 96 31" stroke-width="3.4"></path>

  </g>

  <!-- Stem highlights -->
  <g fill="none" stroke="#abc082" stroke-linecap="round" opacity="0.62">

    <path d="M65 105
         C64 84 65 63 66 44" stroke-width="1.1"></path>

    <path d="M54 104
         C54 86 52 71 49 57" stroke-width="0.9"></path>

  </g>

  <!-- Feathery leaf branches -->
  <g fill="none" stroke="#4e7545" stroke-linecap="round" stroke-width="1.7">

    <path d="M61 84 C50 78 40 72 31 64"></path>
    <path d="M63 75 C75 69 86 62 96 53"></path>
    <path d="M62 64 C51 58 43 51 36 43"></path>
    <path d="M64 56 C75 50 83 43 90 35"></path>
    <path d="M60 47 C51 42 44 36 39 30"></path>

  </g>

  <!-- Left feathery leaves -->
  <g fill="none" stroke="url(#leafGreen)" stroke-linecap="round" stroke-width="2">

    <path d="M32 65 L20 59"></path>
    <path d="M35 67 L22 68"></path>
    <path d="M39 70 L29 77"></path>
    <path d="M42 72 L36 82"></path>
    <path d="M39 70 L27 72"></path>
    <path d="M46 75 L41 86"></path>

    <path d="M37 43 L25 37"></path>
    <path d="M40 46 L27 47"></path>
    <path d="M44 50 L34 57"></path>
    <path d="M47 53 L42 62"></path>

    <path d="M40 30 L31 25"></path>
    <path d="M43 34 L33 35"></path>
    <path d="M46 37 L39 44"></path>

  </g>

  <!-- Right feathery leaves -->
  <g fill="none" stroke="url(#leafGreen)" stroke-linecap="round" stroke-width="2">

    <path d="M96 53 L107 46"></path>
    <path d="M92 57 L105 57"></path>
    <path d="M88 61 L99 68"></path>
    <path d="M84 64 L91 74"></path>
    <path d="M90 59 L103 62"></path>
    <path d="M80 67 L85 78"></path>

    <path d="M90 35 L101 29"></path>
    <path d="M86 39 L99 40"></path>
    <path d="M82 43 L92 50"></path>
    <path d="M78 47 L84 57"></path>

  </g>

  <!-- Fine leaflets -->
  <g fill="none" stroke="#84a965" stroke-linecap="round" stroke-width="1" opacity="0.95">

    <path d="M24 60 l-5 -5 M24 60 l-6 2"></path>
    <path d="M27 68 l-6 -4 M27 68 l-6 3"></path>
    <path d="M33 76 l-4 -6 M33 76 l-6 1"></path>
    <path d="M39 82 l-2 -6 M39 82 l-5 2"></path>

    <path d="M102 49 l5 -6 M102 49 l6 1"></path>
    <path d="M101 58 l6 -4 M101 58 l6 3"></path>
    <path d="M96 67 l5 -5 M96 67 l6 2"></path>
    <path d="M89 74 l3 -6 M89 74 l5 3"></path>

    <path d="M29 38 l-5 -5 M29 38 l-6 1"></path>
    <path d="M31 47 l-6 -3 M31 47 l-5 3"></path>
    <path d="M38 56 l-4 -5 M38 56 l-6 1"></path>

    <path d="M97 31 l5 -5 M97 31 l6 1"></path>
    <path d="M95 40 l6 -3 M95 40 l5 3"></path>
    <path d="M88 49 l4 -5 M88 49 l6 1"></path>

  </g>

  <!-- Central flower stalks -->
  <g fill="none" stroke="#6e7a46" stroke-linecap="round" stroke-width="1.5">

    <path d="M62 48 C58 39 55 31 52 24"></path>
    <path d="M64 48 C64 38 65 30 66 22"></path>
    <path d="M65 48 C70 39 74 31 78 24"></path>
    <path d="M66 48 C75 42 82 36 88 30"></path>

  </g>

  <!-- Umbel rays -->
  <g fill="none" stroke="#75824b" stroke-width="1.2" stroke-linecap="round">

    <path d="M52 24 L44 18"></path>
    <path d="M52 24 L49 15"></path>
    <path d="M52 24 L56 16"></path>

    <path d="M66 22 L61 14"></path>
    <path d="M66 22 L67 12"></path>
    <path d="M66 22 L72 14"></path>

    <path d="M78 24 L75 15"></path>
    <path d="M78 24 L82 15"></path>
    <path d="M78 24 L87 19"></path>

    <path d="M88 30 L89 21"></path>
    <path d="M88 30 L95 23"></path>
    <path d="M88 30 L99 29"></path>

  </g>

  <!-- White flowers -->
  <g fill="url(#flowerWhite)" stroke="#c6cdb8" stroke-width="0.55" filter="url(#softShadow)">

    <circle cx="43" cy="17" r="3"></circle>
    <circle cx="49" cy="14" r="3"></circle>
    <circle cx="56" cy="15" r="3"></circle>

    <circle cx="61" cy="13" r="3"></circle>
    <circle cx="67" cy="11" r="3"></circle>
    <circle cx="73" cy="14" r="3"></circle>

    <circle cx="75" cy="14" r="3"></circle>
    <circle cx="82" cy="14" r="3"></circle>
    <circle cx="88" cy="18" r="3"></circle>

    <circle cx="89" cy="20" r="3"></circle>
    <circle cx="96" cy="22" r="3"></circle>
    <circle cx="100" cy="29" r="3"></circle>

  </g>

  <!-- Flower centers -->
  <g fill="#d9b85d">

    <circle cx="43" cy="17" r="0.8"></circle>
    <circle cx="49" cy="14" r="0.8"></circle>
    <circle cx="56" cy="15" r="0.8"></circle>

    <circle cx="61" cy="13" r="0.8"></circle>
    <circle cx="67" cy="11" r="0.8"></circle>
    <circle cx="73" cy="14" r="0.8"></circle>

    <circle cx="75" cy="14" r="0.8"></circle>
    <circle cx="82" cy="14" r="0.8"></circle>
    <circle cx="88" cy="18" r="0.8"></circle>

    <circle cx="89" cy="20" r="0.8"></circle>
    <circle cx="96" cy="22" r="0.8"></circle>
    <circle cx="100" cy="29" r="0.8"></circle>

  </g>

  <!-- Developing fruit umbel -->
  <path d="M76 69 C85 73 92 78 98 85" fill="none" stroke="#71794a" stroke-width="1.6" stroke-linecap="round"></path>

  <g fill="#8b9b54" stroke="#5e6f3d" stroke-width="0.8">

    <ellipse cx="97" cy="84" rx="2.2" ry="3.6" transform="rotate(-20 97 84)"></ellipse>

    <ellipse cx="103" cy="88" rx="2.2" ry="3.6" transform="rotate(15 103 88)"></ellipse>

    <ellipse cx="91" cy="88" rx="2.2" ry="3.6" transform="rotate(-30 91 88)"></ellipse>

    <ellipse cx="98" cy="92" rx="2.2" ry="3.6" transform="rotate(8 98 92)"></ellipse>

  </g>

  <!-- Dried ajwain seed cluster -->
  <g transform="translate(42 101)" filter="url(#softShadow)">

    <g fill="url(#seedBrown)" stroke="#49372b" stroke-width="0.85">

      <ellipse cx="-8" cy="-5" rx="3.1" ry="5.2" transform="rotate(-25 -8 -5)"></ellipse>

      <ellipse cx="0" cy="-8" rx="3.1" ry="5.2" transform="rotate(5 0 -8)"></ellipse>

      <ellipse cx="8" cy="-5" rx="3.1" ry="5.2" transform="rotate(26 8 -5)"></ellipse>

      <ellipse cx="-5" cy="4" rx="3.1" ry="5.2" transform="rotate(-12 -5 4)"></ellipse>

      <ellipse cx="4" cy="4" rx="3.1" ry="5.2" transform="rotate(15 4 4)"></ellipse>

    </g>

    <!-- Seed ridges -->
    <g fill="none" stroke="#d1b388" stroke-width="0.7" opacity="0.72">

      <path d="M-9 -9 L-7 -1"></path>
      <path d="M0 -12 L0 -4"></path>
      <path d="M7 -9 L9 -1"></path>
      <path d="M-6 0 L-4 8"></path>
      <path d="M3 0 L5 8"></path>

    </g>

  </g>

  <!-- Loose seeds -->
  <g fill="url(#seedBrown)" stroke="#443228" stroke-width="0.8" filter="url(#softShadow)">

    <ellipse cx="61" cy="108" rx="3" ry="4.8" transform="rotate(-18 61 108)"></ellipse>

    <ellipse cx="70" cy="112" rx="3" ry="4.8" transform="rotate(14 70 112)"></ellipse>

    <ellipse cx="79" cy="108" rx="3" ry="4.8" transform="rotate(28 79 108)"></ellipse>

  </g>

  <!-- Loose seed ridges -->
  <g fill="none" stroke="#c7aa82" stroke-width="0.7" opacity="0.7">

    <path d="M60 104 L62 112"></path>
    <path d="M69 108 L71 116"></path>
    <path d="M77 104 L81 112"></path>

  </g>

  <!-- Botanical highlights -->
  <g fill="#efe3ba" opacity="0.62">

    <circle cx="55" cy="54" r="1"></circle>
    <circle cx="84" cy="60" r="1"></circle>
    <circle cx="47" cy="79" r="0.9"></circle>

  </g>

</svg>