<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Foxtail Millet</title>

  <desc id="desc">
    A foxtail millet plant with narrow green leaves
    and a curved dense golden-green grain head.
  </desc>

  <!-- Main stalk -->
  <path d="M63 116
       C63 94 63 73 64 54
       C64 39 65 28 66 19" fill="none" stroke="#6d914c" stroke-width="6" stroke-linecap="round">
  </path>

  <!-- Left leaf -->
  <path d="M61 82
       C47 69 33 64 18 65
       C32 75 46 85 62 92Z" fill="#72a456" stroke="#4e7c42" stroke-width="2">
  </path>

  <!-- Right leaf -->
  <path d="M67 69
       C81 57 95 52 111 53
       C97 63 83 74 66 80Z" fill="#79aa59" stroke="#4e7c42" stroke-width="2">
  </path>

  <!-- Lower leaf -->
  <path d="M61 99
       C48 90 36 87 24 90
       C37 97 49 103 62 108Z" fill="#65984c" stroke="#4e7c42" stroke-width="2">
  </path>

  <!-- Curved foxtail head base -->
  <path d="M66 22
       C72 12 83 7 96 9
       C105 11 110 17 111 24" fill="none" stroke="#8e7948" stroke-width="5" stroke-linecap="round">
  </path>

  <!-- Dense grain cluster -->
  <ellipse cx="76" cy="17" rx="9" ry="12" transform="rotate(55 76 17)" fill="#b79a57">
  </ellipse>

  <ellipse cx="86" cy="14" rx="9" ry="12" transform="rotate(70 86 14)" fill="#c2a45d">
  </ellipse>

  <ellipse cx="97" cy="16" rx="9" ry="12" transform="rotate(82 97 16)" fill="#b69350">
  </ellipse>

  <!-- Grain dots -->
  <circle cx="72" cy="13" r="2" fill="#d4bd77"></circle>
  <circle cx="77" cy="18" r="2" fill="#cfb36c"></circle>
  <circle cx="82" cy="11" r="2" fill="#d8c17d"></circle>
  <circle cx="87" cy="16" r="2" fill="#cdb069"></circle>
  <circle cx="92" cy="11" r="2" fill="#d5bb73"></circle>
  <circle cx="98" cy="16" r="2" fill="#caa962"></circle>
  <circle cx="103" cy="19" r="2" fill="#d7bf79"></circle>

  <!-- Foxtail bristles -->
  <path d="M71 9 L66 3
       M76 7 L73 1
       M82 6 L81 0
       M88 6 L89 0
       M94 7 L97 1
       M100 9 L105 4
       M105 12 L112 8
       M108 17 L116 15
       M108 22 L116 24" fill="none" stroke="#aa9256" stroke-width="1.5" stroke-linecap="round">
  </path>

  <!-- Ground -->
  <ellipse cx="64" cy="117" rx="30" ry="5" fill="#81664a" opacity="0.4">
  </ellipse>

</svg>