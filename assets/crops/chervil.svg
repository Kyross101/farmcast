  <g fill="#d5bb61">

    <circle cx="46" cy="30" r="0.6"></circle>
    <circle cx="52" cy="27" r="0.6"></circle>
    <circle cx="57" cy="31" r="0.6"></circle>

    <circle cx="61" cy="23" r="0.6"></circle>
    <circle cx="67" cy="21" r="0.6"></circle>
    <circle cx="72" cy="24" r="0.6"></circle>

    <circle cx="77" cy="27" r="0.6"></circle>
    <circle cx="84" cy="29" r="0.6"></circle>
    <circle cx="88" cy="33" r="0.6"></circle>

  </g>

  <!-- Root crown -->
  <path d="M56 104
