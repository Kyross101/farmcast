<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Chervil</title>

  <desc id="desc">
    Detailed botanical illustration of chervil with delicate divided leaves,
    slender green stems, small white umbels, and a harvested culinary sprig.
  </desc>

  <defs>
    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a6c58c"></stop>
      <stop offset="0.52" stop-color="#6f9b61"></stop>
      <stop offset="1" stop-color="#3f6b48"></stop>
    </linearGradient>

    <linearGradient id="stemGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8eaa70"></stop>
      <stop offset="1" stop-color="#587748"></stop>
    </linearGradient>

    <linearGradient id="flowerWhite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffef7"></stop>
      <stop offset="1" stop-color="#e8ebdf"></stop>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#293029" flood-opacity="0.22"></feDropShadow>
    </filter>
  </defs>

  <ellipse cx="64" cy="119" rx="44" ry="5" fill="#565048" opacity="0.15"></ellipse>

  <!-- Main stems -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round">

    <path d="M64 109
         C63 92 64 75 65 58
         C66 43 65 30 62 18" stroke-width="4.6"></path>

    <path d="M53 108
         C53 93 51 78 48 65
         C46 53 42 44 37 35" stroke-width="3"></path>

    <path d="M76 108
         C76 92 79 77 83 64
         C87 52 92 43 97 35" stroke-width="3"></path>

  </g>

  <!-- Stem highlights -->
  <g fill="none" stroke="#b8cc9d" stroke-linecap="round" opacity="0.65">

    <path d="M66 105
         C66 85 67 66 67 47" stroke-width="1"></path>

    <path d="M55 104
         C55 88 53 73 50 60" stroke-width="0.85"></path>

  </g>

  <!-- Leaf branches -->
  <g fill="none" stroke="#62804f" stroke-width="1.55" stroke-linecap="round">

