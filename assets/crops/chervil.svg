         M34 68
         l-11 1
         M39 72
         l-9 8
         M44 76
         l-4 10" stroke-width="1.8"></path>

    <path d="M37 50
         l-10 -6
         M37 50
         l-10 1
         M42 54
         l-8 8
         M47 58
         l-3 9" stroke-width="1.7"></path>

    <path d="M96 58
         l10 -7
         M96 58
         l11 1
         M91 62
         l9 8
         M86 66
         l4 10" stroke-width="1.8"></path>

