<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Jack Bean</title>

  <desc id="desc">
    Detailed illustration of green jack bean pods, ivory mature seeds, and green trifoliate leaves.
  </desc>

  <!-- Trifoliate leaves -->
  <ellipse cx="44" cy="25" rx="16" ry="9" transform="rotate(-28 44 25)" fill="#628e49" stroke="#3e6939" stroke-width="1.8">
  </ellipse>

  <ellipse cx="64" cy="20" rx="16" ry="9" fill="#6b9850" stroke="#3e6939" stroke-width="1.8">
  </ellipse>

  <ellipse cx="85" cy="26" rx="16" ry="9" transform="rotate(28 85 26)" fill="#628e49" stroke="#3e6939" stroke-width="1.8">
  </ellipse>

  <!-- Leaf veins -->
  <path d="M31 31 L57 22
       M64 28 L64 13
       M73 23 L98 32" fill="none" stroke="#91ad77" stroke-width="1.4" stroke-linecap="round">
  </path>

  <!-- Leaf stems -->
  <path d="M64 43
       L64 27

       M64 35
       L47 28

       M64 35
       L81 29" fill="none" stroke="#607041" stroke-width="2.6" stroke-linecap="round">
  </path>

  <!-- Left long pod -->
  <path d="M23 49
       C29 43 45 42 57 48
       C66 53 70 64 64 72
       C57 81 40 83 29 76
       C20 70 17 57 23 49Z" fill="#75a454" stroke="#49753e" stroke-width="2.4">
  </path>

  <!-- Left pod ribs -->
  <path d="M27 54
       C38 50 51 51 61 58

       M27 69
       C39 73 52 71 61 65" fill="none" stroke="#99be78" stroke-width="1.6" stroke-linecap="round">
  </path>

  <!-- Left highlight -->
  <path d="M28 50
       C37 46 48 47 55 51" fill="none" stroke="#b9d79c" stroke-width="1.8" stroke-linecap="round" opacity="0.8">
  </path>

  <!-- Right open pod -->
  <path d="M65 48
       C76 41 94 43 104 52
       C112 59 110 69 102 76
       C93 84 77 83 68 75
       C60 68 59 55 65 48Z" fill="#7cab59" stroke="#4d7940" stroke-width="2.4">
  </path>

  <!-- Inner pod -->
  <path d="M70 53
       C79 48 93 49 100 55
       C106 60 104 67 98 72
       C90 78 79 77 72 72
       C66 67 66 58 70 53Z" fill="#d9c89a">
  </path>

  <!-- Seeds inside -->
  <ellipse cx="77" cy="61" rx="7" ry="5.5" fill="#eee2c5" stroke="#9d8768" stroke-width="1.5">
  </ellipse>

  <ellipse cx="91" cy="61" rx="7" ry="5.5" fill="#f1e6ca" stroke="#9d8768" stroke-width="1.5">
  </ellipse>

  <!-- Brown hilum inside -->
  <path d="M73 61 L81 61
       M87 61 L95 61" fill="none" stroke="#76543c" stroke-width="1.8" stroke-linecap="round">
  </path>

  <!-- Seed highlights -->
  <path d="M73 58 C76 56 79 56 82 58
       M87 58 C90 56 93 56 96 58" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.75">
  </path>

  <!-- Loose ivory Jack Bean seeds -->
  <ellipse cx="33" cy="99" rx="11" ry="8" transform="rotate(-10 33 99)" fill="#ede1c4" stroke="#9b8567" stroke-width="2">
  </ellipse>

  <ellipse cx="57" cy="106" rx="11" ry="8" transform="rotate(7 57 106)" fill="#f1e6cb" stroke="#9f896b" stroke-width="2">
  </ellipse>

  <ellipse cx="82" cy="105" rx="11" ry="8" transform="rotate(-7 82 105)" fill="#e9dcc0" stroke="#978164" stroke-width="2">
  </ellipse>

  <ellipse cx="104" cy="97" rx="11" ry="8" transform="rotate(10 104 97)" fill="#f0e4c7" stroke="#9c8668" stroke-width="2">
  </ellipse>

  <!-- Characteristic brown hila -->
  <path d="M26 99 L40 99
       M50 106 L64 106
       M75 105 L89 105
       M97 97 L111 97" fill="none" stroke="#76533a" stroke-width="2.2" stroke-linecap="round">
  </path>

  <!-- Seed highlights -->
  <path d="M27 95 C31 92 36 92 39 94
       M51 102 C55 99 60 99 63 101
       M76 101 C80 98 85 98 88 100
       M98 93 C102 90 107 90 110 92" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" opacity="0.7">
  </path>

  <!-- Ground shadow -->
  <ellipse cx="67" cy="119" rx="46" ry="4" fill="#81664a" opacity="0.17">
  </ellipse>

</svg>