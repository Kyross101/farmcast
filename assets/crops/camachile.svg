<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Camachile</title>

  <desc id="desc">
    Detailed botanical illustration of Camachile or Kamatsile
    showing a curved reddish pod with segmented seed bulges,
    paired green leaflets, warm highlights, shadows and depth.
  </desc>

  <defs>

    <linearGradient id="branchGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b7656"></stop>
      <stop offset="0.52" stop-color="#674b38"></stop>
      <stop offset="1" stop-color="#382c26"></stop>
    </linearGradient>

    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9bd06a"></stop>
      <stop offset="0.42" stop-color="#55984e"></stop>
      <stop offset="1" stop-color="#245d38"></stop>
    </linearGradient>

    <linearGradient id="leafDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#65a754"></stop>
      <stop offset="0.48" stop-color="#347846"></stop>
      <stop offset="1" stop-color="#184931"></stop>
    </linearGradient>

    <linearGradient id="podOuter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3a694"></stop>
      <stop offset="0.28" stop-color="#dc7269"></stop>
      <stop offset="0.65" stop-color="#b24f55"></stop>
      <stop offset="1" stop-color="#743640"></stop>
    </linearGradient>

    <linearGradient id="podInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7b7a7"></stop>
      <stop offset="0.45" stop-color="#df7e73"></stop>
      <stop offset="1" stop-color="#8f4048"></stop>
    </linearGradient>

    <linearGradient id="seedBulge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d89f"></stop>
      <stop offset="0.4" stop-color="#d9b46e"></stop>
      <stop offset="1" stop-color="#9c7b45"></stop>
    </linearGradient>

    <filter id="dropShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.4" flood-color="#213228" flood-opacity="0.30"></feDropShadow>
    </filter>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5"></feGaussianBlur>
    </filter>

  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="66" cy="111" rx="38" ry="6" fill="#20382a" opacity="0.15" filter="url(#softShadow)"></ellipse>

  <g filter="url(#dropShadow)">

    <!-- main branch -->
    <path d="M28 104
             C39 88 48 71 58 57
             C67 44 78 34 92 27" fill="none" stroke="url(#branchGradient)" stroke-width="5.5" stroke-linecap="round"></path>

    <!-- branch highlight -->
    <path d="M31 101
             C42 84 51 69 61 55" fill="none" stroke="#c59a74" stroke-width="1.4" stroke-linecap="round" opacity="0.48"></path>

    <!-- upper leaflet stem -->
    <path d="M65 50
             C59 41 56 31 56 20" fill="none" stroke="#55713e" stroke-width="3" stroke-linecap="round"></path>

    <!-- upper paired leaves -->
    <path d="M59 42
             C49 41 42 36 37 30
             C46 29 54 32 61 37Z" fill="url(#leafGreen)"></path>

    <path d="M61 42
             C70 38 77 33 80 27
             C71 28 64 32 58 37Z" fill="url(#leafDark)"></path>

    <path d="M57 33
             C49 31 43 27 40 22
             C48 22 54 25 59 29Z" fill="url(#leafDark)"></path>

    <path d="M59 33
             C66 29 71 25 74 20
             C67 21 61 24 57 29Z" fill="url(#leafGreen)"></path>

    <!-- left leaflet pair -->
    <path d="M51 61
             C40 60 31 56 25 49
             C36 48 46 51 54 56Z" fill="url(#leafGreen)"></path>

    <path d="M53 61
             C62 55 68 49 71 42
             C62 44 55 49 50 55Z" fill="url(#leafDark)"></path>

    <!-- middle leaflet pair -->
    <path d="M45 73
             C33 73 24 69 18 62
             C30 60 40 63 49 68Z" fill="url(#leafDark)"></path>

    <path d="M48 73
             C57 68 63 62 66 55
             C57 57 50 62 45 68Z" fill="url(#leafGreen)"></path>

    <!-- right leaflet pair -->
    <path d="M77 49
             C87 40 97 37 108 38
             C101 47 91 52 80 54Z" fill="url(#leafGreen)"></path>

    <path d="M82 61
             C94 53 105 53 114 58
             C105 65 94 68 83 66Z" fill="url(#leafDark)"></path>

    <!-- fruit stalk -->
    <path d="M62 55
             C66 63 70 68 76 72" fill="none" stroke="#5e713b" stroke-width="4" stroke-linecap="round"></path>

    <path d="M64 56
             C67 62 71 66 75 69" fill="none" stroke="#a7b66c" stroke-width="1.2" stroke-linecap="round" opacity="0.48"></path>

    <!-- main camachile pod -->
    <path d="M76 69
             C93 66 105 73 107 84
             C109 95 101 102 90 103
             C76 104 66 99 59 92
             C51 85 47 79 39 80" fill="none" stroke="url(#podOuter)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"></path>

    <!-- lower curl -->
    <path d="M40 80
             C31 81 27 88 30 95
             C33 102 42 104 49 100" fill="none" stroke="url(#podOuter)" stroke-width="12" stroke-linecap="round"></path>

    <!-- pod highlights -->
    <path d="M77 72
             C91 69 101 75 103 84" fill="none" stroke="#ffd0c4" stroke-width="2.2" stroke-linecap="round" opacity="0.58"></path>

    <path d="M38 83
             C32 84 31 90 34 94" fill="none" stroke="#ffd2c7" stroke-width="1.8" stroke-linecap="round" opacity="0.56"></path>

    <!-- opened inner seam -->
    <path d="M57 90
             C66 93 75 95 85 95
             C91 95 96 94 100 92" fill="none" stroke="url(#podInner)" stroke-width="7.5" stroke-linecap="round"></path>

    <!-- seed bulges instead of eye-like arils -->
    <ellipse cx="60" cy="90" rx="5.2" ry="4" transform="rotate(18 60 90)" fill="url(#seedBulge)"></ellipse>

    <ellipse cx="70.5" cy="93" rx="5.2" ry="4" transform="rotate(10 70.5 93)" fill="url(#seedBulge)"></ellipse>

    <ellipse cx="81" cy="94.5" rx="5" ry="3.9" transform="rotate(-2 81 94.5)" fill="url(#seedBulge)"></ellipse>

    <ellipse cx="91.5" cy="93" rx="4.8" ry="3.8" transform="rotate(-14 91.5 93)" fill="url(#seedBulge)"></ellipse>

    <!-- soft bulge highlights -->
    <ellipse cx="58.7" cy="88.8" rx="1.6" ry="0.9" transform="rotate(18 58.7 88.8)" fill="#fff3c8" opacity="0.72"></ellipse>

    <ellipse cx="69.2" cy="91.8" rx="1.6" ry="0.9" transform="rotate(10 69.2 91.8)" fill="#fff2c3" opacity="0.7"></ellipse>

    <ellipse cx="79.7" cy="93.3" rx="1.5" ry="0.85" transform="rotate(-2 79.7 93.3)" fill="#fff0be" opacity="0.68"></ellipse>

    <ellipse cx="90.2" cy="91.9" rx="1.45" ry="0.82" transform="rotate(-14 90.2 91.9)" fill="#ffeeb7" opacity="0.66"></ellipse>

    <!-- pod segment lines -->
    <g fill="none" stroke="#863d47" stroke-width="1.15" opacity="0.46">
      <path d="M86 69
               C85 74 86 78 88 81"></path>
      <path d="M99 73
               C96 77 96 81 98 85"></path>
      <path d="M103 88
               C98 88 95 90 93 93"></path>
      <path d="M51 87
               C49 91 48 95 49 99"></path>
      <path d="M35 82
               C36 87 37 91 40 95"></path>
    </g>

    <!-- small thorn -->
    <path d="M49 69
             L42 65
             L50 66Z" fill="#77533d"></path>

    <path d="M80 42
             L87 37
             L82 45Z" fill="#77533d"></path>

  </g>

  <!-- leaf veins -->
  <g fill="none" stroke="#d8eaaa" stroke-width="1.05" stroke-linecap="round" opacity="0.44">
    <path d="M40 32
             C47 33 53 36 58 39"></path>
    <path d="M28 51
             C36 52 44 55 50 58"></path>
    <path d="M22 64
             C30 65 38 68 44 70"></path>
    <path d="M104 40
             C95 42 87 46 81 50"></path>
  </g>

  <!-- inner seam highlight -->
  <path d="M56 88
           C65 91 74 93 84 93" fill="none" stroke="#ffdcca" stroke-width="1.4" stroke-linecap="round" opacity="0.44"></path>

</svg>