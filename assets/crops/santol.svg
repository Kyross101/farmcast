<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Santol</title>
  <desc id="desc">
    A santol tree branch with green leaves,
    round yellow-brown fruits, and a cut fruit.
  </desc>

  <!-- Main branch -->
  <path d="M25 108
       C39 87 51 69 65 51
       C76 37 89 27 104 20" fill="none" stroke="#70543d" stroke-width="7" stroke-linecap="round"></path>

  <!-- Side branches -->
  <path d="M51 70
       C40 59 33 49 29 39" fill="none" stroke="#74583f" stroke-width="4" stroke-linecap="round"></path>

  <path d="M72 44
       C84 46 95 43 106 36" fill="none" stroke="#74583f" stroke-width="4" stroke-linecap="round"></path>

  <!-- Leaves -->
  <ellipse cx="29" cy="35" rx="14" ry="8" transform="rotate(48 29 35)" fill="#64994c" stroke="#45763c" stroke-width="2"></ellipse>

  <ellipse cx="42" cy="54" rx="15" ry="8" transform="rotate(31 42 54)" fill="#73a657" stroke="#45763c" stroke-width="2"></ellipse>

  <ellipse cx="84" cy="39" rx="15" ry="8" transform="rotate(-26 84 39)" fill="#6da152" stroke="#45763c" stroke-width="2"></ellipse>

  <ellipse cx="103" cy="32" rx="14" ry="8" transform="rotate(-27 103 32)" fill="#78aa5a" stroke="#45763c" stroke-width="2"></ellipse>

  <ellipse cx="94" cy="18" rx="13" ry="7" transform="rotate(-10 94 18)" fill="#609348" stroke="#45763c" stroke-width="2"></ellipse>

  <!-- Fruit stems -->
  <path d="M62 55 C62 63 61 69 60 75" fill="none" stroke="#627b42" stroke-width="3"></path>

  <path d="M82 43 C85 51 86 58 85 64" fill="none" stroke="#627b42" stroke-width="3"></path>

  <!-- Whole santol fruit -->
  <circle cx="59" cy="87" r="17" fill="#c6a95a" stroke="#927b3e" stroke-width="2.5"></circle>

  <circle cx="55" cy="82" r="5" fill="#ddc37a" opacity="0.65"></circle>

  <!-- Second fruit -->
  <circle cx="86" cy="75" r="14" fill="#bda052" stroke="#8b743b" stroke-width="2.5"></circle>

  <circle cx="82" cy="71" r="4" fill="#d6bb70" opacity="0.65"></circle>

  <!-- Cut santol -->
  <circle cx="31" cy="99" r="17" fill="#c2a45a" stroke="#8e763e" stroke-width="2.5"></circle>

  <!-- White inner flesh -->
  <circle cx="31" cy="99" r="12" fill="#eee6cf"></circle>

  <!-- Fruit segments -->
  <path d="M31 87
       C28 92 28 97 31 100
       C34 96 35 92 31 87Z" fill="#f8f4e7" stroke="#d5cbb4" stroke-width="1"></path>

  <path d="M20 98
       C25 95 29 96 31 100
       C27 103 23 103 20 98Z" fill="#f8f4e7" stroke="#d5cbb4" stroke-width="1"></path>

  <path d="M31 100
       C36 96 40 96 42 100
       C39 105 35 105 31 100Z" fill="#f8f4e7" stroke="#d5cbb4" stroke-width="1"></path>

  <path d="M31 101
       C34 105 34 110 31 111
       C27 108 27 104 31 101Z" fill="#f8f4e7" stroke="#d5cbb4" stroke-width="1"></path>

  <!-- Seeds -->
  <ellipse cx="31" cy="96" rx="2" ry="3" fill="#9c7950"></ellipse>
  <ellipse cx="26" cy="101" rx="2" ry="3" fill="#9c7950"></ellipse>
  <ellipse cx="36" cy="101" rx="2" ry="3" fill="#9c7950"></ellipse>

  <!-- Ground shadow -->
  <ellipse cx="61" cy="117" rx="45" ry="5" fill="#80664a" opacity="0.35"></ellipse>
</svg>