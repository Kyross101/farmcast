<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Lemon</title>
  <desc id="desc">
    A lemon branch with green citrus leaves,
    ripe yellow fruits, and a sliced lemon.
  </desc>

  <!-- Main branch -->
  <path d="M23 108
       C38 88 50 69 64 51
       C77 35 91 25 106 18" fill="none" stroke="#70523a" stroke-width="7" stroke-linecap="round"></path>

  <!-- Side branches -->
  <path d="M49 72
       C39 61 33 50 29 39" fill="none" stroke="#75573e" stroke-width="4" stroke-linecap="round"></path>

  <path d="M72 45
       C84 45 96 41 106 34" fill="none" stroke="#75573e" stroke-width="4" stroke-linecap="round"></path>

  <!-- Citrus leaves -->
  <ellipse cx="29" cy="35" rx="15" ry="8" transform="rotate(48 29 35)" fill="#609548" stroke="#42743a" stroke-width="2"></ellipse>

  <ellipse cx="43" cy="54" rx="16" ry="8" transform="rotate(30 43 54)" fill="#71a554" stroke="#42743a" stroke-width="2"></ellipse>

  <ellipse cx="85" cy="39" rx="16" ry="8" transform="rotate(-25 85 39)" fill="#679d4d" stroke="#42743a" stroke-width="2"></ellipse>

  <ellipse cx="103" cy="30" rx="14" ry="8" transform="rotate(-28 103 30)" fill="#76a957" stroke="#42743a" stroke-width="2"></ellipse>

  <ellipse cx="95" cy="16" rx="13" ry="7" transform="rotate(-8 95 16)" fill="#5d9146" stroke="#42743a" stroke-width="2"></ellipse>

  <!-- Fruit stems -->
  <path d="M62 54 C61 62 61 68 61 73" fill="none" stroke="#607941" stroke-width="3"></path>

  <path d="M85 43 C87 50 88 56 87 62" fill="none" stroke="#607941" stroke-width="3"></path>

  <!-- Main lemon -->
  <path d="M61 70
       C50 70 44 78 45 88
       C46 98 52 106 58 110
       C60 114 62 116 64 112
       C71 108 77 100 78 90
       C80 79 73 70 61 70Z" fill="#e5d044" stroke="#b4a22c" stroke-width="2.5"></path>

  <!-- Lemon tip -->
  <path d="M58 70
       C60 66 63 65 66 69" fill="#e5d044" stroke="#b4a22c" stroke-width="2"></path>

  <!-- Highlight -->
  <path d="M52 79
       C48 85 49 94 53 99" fill="none" stroke="#f4e77a" stroke-width="4" stroke-linecap="round"></path>

  <!-- Peel texture -->
  <circle cx="58" cy="82" r="1" fill="#c9b738"></circle>
  <circle cx="69" cy="86" r="1" fill="#c9b738"></circle>
  <circle cx="57" cy="98" r="1" fill="#c9b738"></circle>
  <circle cx="67" cy="103" r="1" fill="#c9b738"></circle>

  <!-- Second lemon -->
  <path d="M87 59
       C78 59 74 66 75 75
       C76 84 81 90 86 93
       C89 96 91 93 93 91
       C98 87 101 80 100 73
       C99 64 95 59 87 59Z" fill="#dfca40" stroke="#ae9b2b" stroke-width="2.5"></path>

  <!-- Cut lemon -->
  <circle cx="29" cy="100" r="17" fill="#e5ce43" stroke="#ad9b2c" stroke-width="2.5"></circle>

  <!-- White rind -->
  <circle cx="29" cy="100" r="13" fill="#f4edc5"></circle>

  <!-- Lemon flesh -->
  <circle cx="29" cy="100" r="10" fill="#efd958"></circle>

  <!-- Segments -->
  <path d="M29 90 L29 110
       M19 100 L39 100
       M22 93 L36 107
       M36 93 L22 107" stroke="#d7bb3c" stroke-width="1.4"></path>

  <!-- Center -->
  <circle cx="29" cy="100" r="2.5" fill="#f6e49a"></circle>

  <!-- Ground -->
  <ellipse cx="62" cy="118" rx="46" ry="5" fill="#80654a" opacity="0.35"></ellipse>
</svg>