<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Thyme</title>

  <desc id="desc">
    A common thyme plant with woody branching stems,
    many small oval green leaves, and tiny pale-purple flowers.
  </desc>

  <!-- Main woody stem -->
  <path d="M64 116
       C63 96 64 78 63 60
       C62 44 61 30 60 18" fill="none" stroke="#776047" stroke-width="5" stroke-linecap="round">
  </path>

  <!-- Branches -->
  <path d="M62 48
       C51 43 43 36 36 27" fill="none" stroke="#776047" stroke-width="3.5" stroke-linecap="round">
  </path>

  <path d="M65 54
       C77 49 87 41 95 32" fill="none" stroke="#776047" stroke-width="3.5" stroke-linecap="round">
  </path>

  <path d="M62 67
       C50 63 41 56 34 49" fill="none" stroke="#776047" stroke-width="3" stroke-linecap="round">
  </path>

  <path d="M65 73
       C78 68 88 62 97 54" fill="none" stroke="#776047" stroke-width="3" stroke-linecap="round">
  </path>

  <path d="M62 84
       C51 81 43 76 36 70" fill="none" stroke="#776047" stroke-width="2.8" stroke-linecap="round">
  </path>

  <path d="M66 88
       C77 84 86 79 94 73" fill="none" stroke="#776047" stroke-width="2.8" stroke-linecap="round">
  </path>

  <!-- Small thyme leaves -->
  <g fill="#748f62" stroke="#526f4a" stroke-width="1">

    <ellipse cx="37" cy="29" rx="7" ry="3" transform="rotate(35 37 29)">
    </ellipse>

    <ellipse cx="45" cy="37" rx="7" ry="3" transform="rotate(25 45 37)">
    </ellipse>

    <ellipse cx="53" cy="43" rx="7" ry="3" transform="rotate(16 53 43)">
    </ellipse>

    <ellipse cx="94" cy="34" rx="7" ry="3" transform="rotate(-35 94 34)">
    </ellipse>

    <ellipse cx="86" cy="42" rx="7" ry="3" transform="rotate(-25 86 42)">
    </ellipse>

    <ellipse cx="78" cy="49" rx="7" ry="3" transform="rotate(-16 78 49)">
    </ellipse>

    <ellipse cx="35" cy="51" rx="7" ry="3" transform="rotate(32 35 51)">
    </ellipse>

    <ellipse cx="44" cy="58" rx="7" ry="3" transform="rotate(22 44 58)">
    </ellipse>

    <ellipse cx="53" cy="64" rx="7" ry="3" transform="rotate(14 53 64)">
    </ellipse>

    <ellipse cx="95" cy="56" rx="7" ry="3" transform="rotate(-32 95 56)">
    </ellipse>

    <ellipse cx="86" cy="63" rx="7" ry="3" transform="rotate(-22 86 63)">
    </ellipse>

    <ellipse cx="77" cy="69" rx="7" ry="3" transform="rotate(-14 77 69)">
    </ellipse>

    <ellipse cx="39" cy="72" rx="7" ry="3" transform="rotate(26 39 72)">
    </ellipse>

    <ellipse cx="49" cy="79" rx="7" ry="3" transform="rotate(16 49 79)">
    </ellipse>

    <ellipse cx="91" cy="75" rx="7" ry="3" transform="rotate(-26 91 75)">
    </ellipse>

    <ellipse cx="81" cy="82" rx="7" ry="3" transform="rotate(-16 81 82)">
    </ellipse>

  </g>

  <!-- Flower stems -->
  <path d="M60 18 L58 9
       M61 18 L65 8" fill="none" stroke="#65794f" stroke-width="2" stroke-linecap="round">
  </path>

  <!-- Tiny thyme flowers -->
  <circle cx="56" cy="9" r="3" fill="#c1abc8">
  </circle>

  <circle cx="62" cy="6" r="3" fill="#d0bfd4">
  </circle>

  <circle cx="67" cy="10" r="3" fill="#b59abe">
  </circle>

  <circle cx="70" cy="6" r="2.5" fill="#d8cadb">
  </circle>

  <!-- Ground -->
  <ellipse cx="64" cy="117" rx="30" ry="5" fill="#81664a" opacity="0.35">
  </ellipse>

</svg>