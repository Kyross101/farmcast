<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Sword Bean</title>

  <desc id="desc">
    Detailed illustration of long green sword bean pods, dark red mature seeds, and green trifoliate leaves.
  </desc>

  <!-- Trifoliate leaves -->
  <ellipse cx="45" cy="25" rx="16" ry="9" transform="rotate(-28 45 25)" fill="#618e49" stroke="#3e6839" stroke-width="1.8">
  </ellipse>

  <ellipse cx="65" cy="20" rx="16" ry="9" fill="#69974f" stroke="#3e6839" stroke-width="1.8">
  </ellipse>

  <ellipse cx="86" cy="26" rx="16" ry="9" transform="rotate(28 86 26)" fill="#618e49" stroke="#3e6839" stroke-width="1.8">
  </ellipse>

  <!-- Leaf veins -->
  <path d="M32 31 L58 22
       M65 28 L65 13
       M73 23 L99 33" fill="none" stroke="#91ad77" stroke-width="1.4" stroke-linecap="round">
  </path>

  <!-- Leaf stems -->
  <path d="M65 43
       L65 27

       M65 35
       L48 28

       M65 35
       L82 29" fill="none" stroke="#607040" stroke-width="2.6" stroke-linecap="round">
  </path>

  <!-- Large left sword pod -->
  <path d="M28 43
       C22 53 22 72 28 90
       C32 101 42 107 50 101
       C57 96 54 85 49 73
       C44 60 39 48 28 43Z" fill="#72a353" stroke="#48753d" stroke-width="2.4">
  </path>

  <!-- Pod edge -->
  <path d="M31 48
       C31 64 38 84 46 99" fill="none" stroke="#99be78" stroke-width="1.7" stroke-linecap="round">
  </path>

  <!-- Pod highlight -->
  <path d="M28 55
       C27 65 30 76 34 83" fill="none" stroke="#b5d499" stroke-width="2" stroke-linecap="round" opacity="0.8">
  </path>

  <!-- Large right sword pod -->
  <path d="M78 43
       C72 55 72 73 79 91
       C83 102 93 107 101 101
       C108 95 104 83 100 72
       C95 58 89 47 78 43Z" fill="#79a958" stroke="#4b7840" stroke-width="2.4">
  </path>

  <!-- Right pod edge -->
  <path d="M81 48
       C82 64 89 84 97 99" fill="none" stroke="#a0c47f" stroke-width="1.7" stroke-linecap="round">
  </path>

  <!-- Right pod highlight -->
  <path d="M79 55
       C78 65 81 76 85 83" fill="none" stroke="#bad89e" stroke-width="2" stroke-linecap="round" opacity="0.8">
  </path>

  <!-- Mature Sword Bean seeds -->
  <ellipse cx="38" cy="106" rx="10" ry="7" transform="rotate(-10 38 106)" fill="#8e3835" stroke="#5d2928" stroke-width="2">
  </ellipse>

  <ellipse cx="60" cy="111" rx="10" ry="7" transform="rotate(7 60 111)" fill="#a33d38" stroke="#672b29" stroke-width="2">
  </ellipse>

  <ellipse cx="82" cy="110" rx="10" ry="7" transform="rotate(-7 82 110)" fill="#873431" stroke="#592625" stroke-width="2">
  </ellipse>

  <ellipse cx="103" cy="104" rx="10" ry="7" transform="rotate(10 103 104)" fill="#a3423a" stroke="#692e2a" stroke-width="2">
  </ellipse>

  <!-- Long seed hilum -->
  <path d="M32 106 L44 106
       M54 111 L66 111
       M76 110 L88 110
       M97 104 L109 104" fill="none" stroke="#d3af8e" stroke-width="2" stroke-linecap="round">
  </path>

  <!-- Seed highlights -->
  <path d="M34 102 C37 100 41 100 44 102
       M56 107 C59 105 63 105 66 107
       M78 106 C81 104 85 104 88 106" fill="none" stroke="#c96d65" stroke-width="1.2" stroke-linecap="round" opacity="0.75">
  </path>

  <!-- Ground shadow -->
  <ellipse cx="67" cy="119" rx="45" ry="4" fill="#81664a" opacity="0.17">
  </ellipse>

</svg>