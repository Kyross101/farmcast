<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Long Pepper</title>

  <desc id="desc">
    Detailed botanical illustration of Indian long pepper with climbing stems,
    heart-shaped leaves, immature green spikes, mature dark spice spikes,
    and soft botanical shading.
  </desc>

  <defs>
    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8db16b"></stop>
      <stop offset="0.52" stop-color="#557f4b"></stop>
      <stop offset="1" stop-color="#2d5738"></stop>
    </linearGradient>

    <linearGradient id="leafLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9c583"></stop>
      <stop offset="1" stop-color="#477247"></stop>
    </linearGradient>

    <linearGradient id="stemGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b9254"></stop>
      <stop offset="1" stop-color="#465d37"></stop>
    </linearGradient>

    <linearGradient id="youngSpike" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aebc66"></stop>
      <stop offset="0.5" stop-color="#788d49"></stop>
      <stop offset="1" stop-color="#506633"></stop>
    </linearGradient>

    <linearGradient id="ripeSpike" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7e6250"></stop>
      <stop offset="0.5" stop-color="#563c31"></stop>
      <stop offset="1" stop-color="#2f241f"></stop>
    </linearGradient>

    <radialGradient id="berryDot" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#c3b18c"></stop>
      <stop offset="1" stop-color="#6f5846"></stop>
    </radialGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#273029" flood-opacity="0.24"></feDropShadow>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="64" cy="119" rx="44" ry="5" fill="#554d45" opacity="0.16"></ellipse>

  <!-- Main climbing stem -->
  <path d="M65 108
       C62 94 62 79 66 66
       C70 52 69 38 63 24" fill="none" stroke="url(#stemGreen)" stroke-width="5" stroke-linecap="round"></path>

  <!-- Stem highlight -->
  <path d="M68 105
       C65 91 65 79 68 66
       C72 52 71 39 65 25" fill="none" stroke="#a0b476" stroke-width="1.2" stroke-linecap="round" opacity="0.62"></path>

  <!-- Side stems -->
  <path d="M64 84
       C51 77 42 69 34 59" fill="none" stroke="#536b3b" stroke-width="2.5" stroke-linecap="round"></path>

  <path d="M67 67
       C79 60 88 52 96 43" fill="none" stroke="#536b3b" stroke-width="2.5" stroke-linecap="round"></path>

  <path d="M67 49
       C57 43 50 35 45 29" fill="none" stroke="#536b3b" stroke-width="2.2" stroke-linecap="round"></path>

  <!-- Leaves -->
  <g filter="url(#softShadow)">

    <path d="M58 91
         C45 82 31 80 20 86
         C29 98 43 103 58 98Z" fill="url(#leafGreen)" stroke="#31533a" stroke-width="2"></path>

    <path d="M56 72
         C43 62 30 60 20 66
         C29 78 43 83 57 78Z" fill="url(#leafLight)" stroke="#31533a" stroke-width="2"></path>

    <path d="M72 77
         C85 67 99 65 109 72
         C101 84 87 89 72 83Z" fill="url(#leafGreen)" stroke="#31533a" stroke-width="2"></path>

    <path d="M73 59
         C86 49 99 46 108 53
         C100 65 87 69 73 65Z" fill="url(#leafLight)" stroke="#31533a" stroke-width="2"></path>

    <path d="M59 49
         C47 39 36 36 27 42
         C35 53 46 57 59 55Z" fill="url(#leafGreen)" stroke="#31533a" stroke-width="1.8"></path>

  </g>

  <!-- Leaf veins -->
  <g fill="none" stroke="#afc79c" stroke-linecap="round" opacity="0.8">

    <path d="M23 87 C36 89 48 94 56 97" stroke-width="1.2"></path>

    <path d="M23 67 C36 69 47 74 55 77" stroke-width="1.2"></path>

    <path d="M106 73 C94 74 83 79 74 82" stroke-width="1.2"></path>

    <path d="M105 54 C94 56 83 60 75 64" stroke-width="1.2"></path>

    <path d="M30 43 C40 46 49 50 57 54" stroke-width="1"></path>

  </g>

  <!-- Leaf highlights -->
  <g fill="none" stroke="#dfead5" stroke-width="1" stroke-linecap="round" opacity="0.42">

    <path d="M29 84 C38 84 46 87 52 91"></path>

    <path d="M82 70 C91 68 99 69 104 72"></path>

  </g>

  <!-- Spike stems -->
  <path d="M66 65
       C75 69 82 73 88 78" fill="none" stroke="#64713f" stroke-width="2" stroke-linecap="round"></path>

  <path d="M62 84
       C53 88 47 92 42 98" fill="none" stroke="#64713f" stroke-width="2" stroke-linecap="round"></path>

  <!-- Young green pepper spike -->
  <g transform="translate(92 84) rotate(18)" filter="url(#softShadow)">

    <path d="M0 -17
         C5 -14 7 -9 7 -2
         C7 7 4 14 0 18
         C-4 14 -7 7 -7 -2
         C-7 -9 -5 -14 0 -17Z" fill="url(#youngSpike)" stroke="#455b31" stroke-width="1.8"></path>

    <g fill="#d4d28a" opacity="0.9">

      <circle cx="-2" cy="-10" r="1.2"></circle>
      <circle cx="2" cy="-7" r="1.2"></circle>
      <circle cx="-2.5" cy="-3" r="1.2"></circle>
      <circle cx="2.5" cy="0" r="1.2"></circle>
      <circle cx="-2" cy="5" r="1.2"></circle>
      <circle cx="2" cy="9" r="1.2"></circle>

    </g>

  </g>

  <!-- Mature dried spice spike -->
  <g transform="translate(38 103) rotate(-20)" filter="url(#softShadow)">

    <path d="M0 -20
         C6 -17 8 -10 8 -2
         C8 8 4 16 0 21
         C-4 16 -8 8 -8 -2
         C-8 -10 -6 -17 0 -20Z" fill="url(#ripeSpike)" stroke="#2f241f" stroke-width="1.8"></path>

    <g fill="url(#berryDot)" opacity="0.9">

      <circle cx="-2.5" cy="-13" r="1.35"></circle>
      <circle cx="2.5" cy="-10" r="1.35"></circle>
      <circle cx="-3" cy="-6" r="1.35"></circle>
      <circle cx="2.8" cy="-3" r="1.35"></circle>
      <circle cx="-2.8" cy="1" r="1.35"></circle>
      <circle cx="3" cy="4" r="1.35"></circle>
      <circle cx="-2.3" cy="8" r="1.35"></circle>
      <circle cx="2.2" cy="12" r="1.35"></circle>
      <circle cx="-1.5" cy="16" r="1.2"></circle>

    </g>

  </g>

  <!-- Second mature spike -->
  <g transform="translate(82 104) rotate(8)" filter="url(#softShadow)">

    <path d="M0 -18
         C5 -15 7 -9 7 -2
         C7 7 4 14 0 18
         C-4 14 -7 7 -7 -2
         C-7 -9 -5 -15 0 -18Z" fill="url(#ripeSpike)" stroke="#2f241f" stroke-width="1.8"></path>

    <g fill="#8e7158" opacity="0.85">

      <circle cx="-2.3" cy="-11" r="1.2"></circle>
      <circle cx="2.4" cy="-8" r="1.2"></circle>
      <circle cx="-2.5" cy="-3" r="1.2"></circle>
      <circle cx="2.6" cy="0" r="1.2"></circle>
      <circle cx="-2.2" cy="5" r="1.2"></circle>
      <circle cx="2" cy="9" r="1.2"></circle>
      <circle cx="-1.5" cy="13" r="1.1"></circle>

    </g>

  </g>

  <!-- Tiny flower cluster -->
  <path d="M96 44
       C99 39 104 36 109 35" fill="none" stroke="#6e7543" stroke-width="1.8" stroke-linecap="round"></path>

  <g transform="translate(111 34)" filter="url(#softShadow)">

    <ellipse cx="0" cy="0" rx="3" ry="5" fill="#d8d68f" stroke="#7c8249" stroke-width="1"></ellipse>

    <ellipse cx="-4" cy="1" rx="2.4" ry="4" fill="#e4dfa2" stroke="#7c8249" stroke-width="0.9" transform="rotate(-35 -4 1)"></ellipse>

    <ellipse cx="4" cy="1" rx="2.4" ry="4" fill="#e4dfa2" stroke="#7c8249" stroke-width="0.9" transform="rotate(35 4 1)"></ellipse>

  </g>

  <!-- Botanical highlights -->
  <g fill="#eee1b8" opacity="0.6">

    <circle cx="47" cy="65" r="1.1"></circle>
    <circle cx="87" cy="61" r="1"></circle>
    <circle cx="57" cy="35" r="1"></circle>

  </g>

</svg>