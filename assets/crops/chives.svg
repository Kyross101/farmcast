<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Chives</title>

  <desc id="desc">
    A clump of chives with slender green leaves
    and round purple flower heads.
  </desc>

  <!-- Chive leaves -->
  <g fill="none" stroke-linecap="round">

    <path d="M45 112 C44 87 43 58 47 26" stroke="#659b55" stroke-width="6">
    </path>

    <path d="M55 113 C54 83 55 48 57 20" stroke="#73a75f" stroke-width="6">
    </path>

    <path d="M65 113 C64 85 64 48 65 17" stroke="#619650" stroke-width="6">
    </path>

    <path d="M75 113 C76 84 75 51 72 25" stroke="#71a55e" stroke-width="6">
    </path>

    <path d="M84 111 C85 86 84 61 80 35" stroke="#5e914d" stroke-width="6">
    </path>

    <path d="M37 111 C38 90 38 69 41 48" stroke="#76a963" stroke-width="5">
    </path>

    <path d="M92 110 C91 90 90 72 87 51" stroke="#699d57" stroke-width="5">
    </path>

  </g>

  <!-- Flower stems -->
  <path d="M52 76 C51 51 50 30 49 15" fill="none" stroke="#638f50" stroke-width="4" stroke-linecap="round">
  </path>

  <path d="M77 75 C78 51 80 32 82 18" fill="none" stroke="#638f50" stroke-width="4" stroke-linecap="round">
  </path>

  <!-- Left flower -->
  <g transform="translate(49 14)">
    <circle cx="-6" cy="0" r="5" fill="#9673af">
    </circle>

    <circle cx="6" cy="0" r="5" fill="#9d78b6">
    </circle>

    <circle cx="0" cy="-6" r="5" fill="#aa86bf">
    </circle>

    <circle cx="0" cy="6" r="5" fill="#8f69a8">
    </circle>

    <circle cx="-4" cy="-5" r="4" fill="#b08bc4">
    </circle>

    <circle cx="5" cy="-5" r="4" fill="#9c75b5">
    </circle>

    <circle cx="0" cy="0" r="4" fill="#b490c7">
    </circle>
  </g>

  <!-- Right flower -->
  <g transform="translate(82 17)">
    <circle cx="-6" cy="0" r="5" fill="#9470ad">
    </circle>

    <circle cx="6" cy="0" r="5" fill="#a17cba">
    </circle>

    <circle cx="0" cy="-6" r="5" fill="#ae89c3">
    </circle>

    <circle cx="0" cy="6" r="5" fill="#9069a8">
    </circle>

    <circle cx="-4" cy="-5" r="4" fill="#b28fc7">
    </circle>

    <circle cx="5" cy="-5" r="4" fill="#9b74b3">
    </circle>

    <circle cx="0" cy="0" r="4" fill="#b58fc9">
    </circle>
  </g>

  <!-- Base -->
  <path d="M34 111
       C45 106 82 106 94 111
       C86 117 43 118 34 111Z" fill="#79905a" opacity="0.55">
  </path>

  <!-- Roots -->
  <path d="M48 112 C45 117 42 120 39 123
       M56 113 C54 118 53 120 52 124
       M64 113 C64 119 64 121 64 125
       M73 113 C75 118 76 121 78 124
       M82 112 C86 117 89 120 92 122" fill="none" stroke="#ac9068" stroke-width="1.8" stroke-linecap="round">
  </path>

</svg>