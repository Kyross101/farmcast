<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Fig</title>

  <desc id="desc">
    A common fig branch with broad lobed green leaves
    and ripe purple-green fig fruits.
  </desc>

  <!-- Main branch -->
  <path d="M27 114
       C39 95 50 77 62 59
