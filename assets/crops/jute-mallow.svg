<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Jute Mallow</title>
  <desc id="desc">
    An upright Saluyot plant with slender stems,
    pointed green leaves, flowers, and seed capsules.
  </desc>

  <!-- Main stem -->
  <path d="M64 116
       C63 95 64 75 63 55
       C62 38 63 24 64 12" fill="none" stroke="#5e7740" stroke-width="6" stroke-linecap="round"></path>

  <!-- Upper green stem -->
  <path d="M64 82
       C64 59 63 35 64 12" fill="none" stroke="#668946" stroke-width="4" stroke-linecap="round"></path>

  <!-- Branches -->
  <path d="M63 37 C50 33 39 27 30 20" fill="none" stroke="#648b47" stroke-width="3" stroke-linecap="round"></path>

  <path d="M64 47 C78 42 88 35 97 27" fill="none" stroke="#648b47" stroke-width="3" stroke-linecap="round"></path>

  <path d="M63 62 C49 58 39 52 30 45" fill="none" stroke="#648b47" stroke-width="3" stroke-linecap="round"></path>

  <path d="M64 70 C78 66 89 59 98 51" fill="none" stroke="#648b47" stroke-width="3" stroke-linecap="round"></path>

  <!-- Long pointed leaves -->
  <path d="M31 20
       C21 17 14 21 13 27
