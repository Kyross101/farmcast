       C106 65 97 62 89 56
       C91 53 95 52 98 51Z" fill="#6ba04b"></path>

  <path d="M63 26
       C54 19 48 21 47 28
       C51 36 59 37 65 32Z" fill="#76a653"></path>

  <path d="M64 57
       C74 50 82 53 82 61
       C78 69 70 69 63 64Z" fill="#72a34f"></path>

  <!-- Small yellow flowers -->
  <circle cx="48" cy="55" r="4.5" fill="#e6ba42"></circle>
  <circle cx="82" cy="42" r="4.5" fill="#efc44d"></circle>

  <circle cx="48" cy="55" r="1.5" fill="#a66b2e"></circle>
  <circle cx="82" cy="42" r="1.5" fill="#a66b2e"></circle>

  <!-- Slender seed capsules -->
  <path d="M48 64
