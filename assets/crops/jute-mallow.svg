  <path d="M112 34 L94 31" fill="none" stroke="#598144" stroke-width="1.3"></path>

  <path d="M17 52 L36 49" fill="none" stroke="#598144" stroke-width="1.3"></path>

  <!-- Ground -->
  <path d="M30 117
