<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="capersTitle capersDesc">
  <title id="capersTitle">Capers</title>
  <desc id="capersDesc">
    Detailed caper plant with rounded green leaves, unopened edible
    flower buds, and a white-purple caper flower.
  </desc>

  <defs>
    <linearGradient id="caperStem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f8f49"></stop>
      <stop offset="55%" stop-color="#34733c"></stop>
      <stop offset="100%" stop-color="#20572e"></stop>
    </linearGradient>

    <linearGradient id="caperLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8dcc75"></stop>
      <stop offset="42%" stop-color="#54a85d"></stop>
      <stop offset="100%" stop-color="#287444"></stop>
    </linearGradient>

    <linearGradient id="caperLeafDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#68b665"></stop>
      <stop offset="100%" stop-color="#1e6138"></stop>
    </linearGradient>

    <radialGradient id="caperBud" cx="35%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#a5d57c"></stop>
      <stop offset="45%" stop-color="#629d56"></stop>
      <stop offset="100%" stop-color="#376d40"></stop>
    </radialGradient>

    <linearGradient id="petalWhite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"></stop>
      <stop offset="55%" stop-color="#f1eef4"></stop>
      <stop offset="100%" stop-color="#d9d2df"></stop>
    </linearGradient>

    <linearGradient id="petalShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffefe"></stop>
      <stop offset="100%" stop-color="#d7c8dc"></stop>
    </linearGradient>

    <linearGradient id="purpleStamen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9b66b9"></stop>
      <stop offset="100%" stop-color="#633980"></stop>
    </linearGradient>

    <filter id="caperShadow" x="-35%" y="-35%" width="170%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#173621" flood-opacity="0.22"></feDropShadow>
    </filter>
  </defs>

  <ellipse cx="64" cy="112" rx="35" ry="6" fill="#163920" opacity="0.13"></ellipse>

  <!-- Branch structure -->
  <g fill="none" stroke="url(#caperStem)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M29 103 C45 91 59 75 68 55 C74 41 78 30 80 19" stroke-width="5"></path>
    <path d="M48 88 C39 76 31 64 26 52" stroke-width="3.5"></path>
    <path d="M58 75 C71 73 86 68 99 57" stroke-width="3.4"></path>
    <path d="M40 94 C54 96 69 95 83 89" stroke-width="3"></path>
  </g>

  <!-- Left leaf cluster -->
  <g filter="url(#caperShadow)">
    <path d="M31 57
         C21 55 14 59 12 68
         C17 78 29 80 37 72
         C41 66 38 60 31 57Z" fill="url(#caperLeaf)"></path>

    <path d="M34 65
         C27 66 20 67 14 68" fill="none" stroke="#d7ecc6" stroke-width="1.35" stroke-linecap="round" opacity="0.68"></path>

    <path d="M36 53
         C30 44 32 34 40 29
         C50 32 54 42 49 51
         C46 57 40 58 36 53Z" fill="url(#caperLeafDark)"></path>

    <path d="M40 51 C41 43 41 36 40 30" fill="none" stroke="#d4e9c2" stroke-width="1.3" opacity="0.68"></path>
  </g>

  <!-- Center leaf -->
  <g filter="url(#caperShadow)">
    <path d="M53 79
         C45 72 45 62 52 56
         C63 56 69 65 66 74
         C64 82 58 84 53 79Z" fill="url(#caperLeaf)"></path>

    <path d="M58 78
         C58 69 56 62 53 57" fill="none" stroke="#d9ecc8" stroke-width="1.35" stroke-linecap="round" opacity="0.7"></path>
  </g>

  <!-- Right leaf cluster -->
  <g filter="url(#caperShadow)">
    <path d="M87 69
         C94 60 105 59 112 65
         C113 76 104 84 94 82
         C87 80 84 74 87 69Z" fill="url(#caperLeaf)"></path>

    <path d="M90 74
         C98 71 105 68 111 66" fill="none" stroke="#d9ecc8" stroke-width="1.35" opacity="0.72"></path>

    <path d="M75 91
         C80 81 90 77 99 82
         C102 92 95 101 85 102
         C77 102 72 97 75 91Z" fill="url(#caperLeafDark)"></path>

    <path d="M80 96
         C86 91 92 87 98 83" fill="none" stroke="#cee6bc" stroke-width="1.3" opacity="0.7"></path>
  </g>

  <!-- Caper buds -->
  <g filter="url(#caperShadow)">
    <path d="M27 51 C25 45 27 40 31 37" fill="none" stroke="#3d7941" stroke-width="2.5" stroke-linecap="round"></path>

    <ellipse cx="31" cy="34" rx="7" ry="9" transform="rotate(-15 31 34)" fill="url(#caperBud)"></ellipse>

    <path d="M27 31 C30 28 34 28 37 30" fill="none" stroke="#d4e5a8" stroke-width="1.25" stroke-linecap="round" opacity="0.7"></path>

    <path d="M98 57 C101 51 102 46 101 41" fill="none" stroke="#3b7440" stroke-width="2.5" stroke-linecap="round"></path>

    <ellipse cx="101" cy="37" rx="6.6" ry="8.8" transform="rotate(10 101 37)" fill="url(#caperBud)"></ellipse>

    <path d="M97 35 C100 32 104 32 107 34" fill="none" stroke="#d4e6aa" stroke-width="1.2" opacity="0.72"></path>

    <path d="M83 88 C88 83 91 79 92 74" fill="none" stroke="#3d7941" stroke-width="2.3" stroke-linecap="round"></path>

    <ellipse cx="93" cy="70" rx="5.6" ry="7.7" transform="rotate(20 93 70)" fill="url(#caperBud)"></ellipse>
  </g>

  <!-- Flower stalk -->
  <path d="M78 28 C85 28 90 29 94 31" fill="none" stroke="#3e7941" stroke-width="2.8" stroke-linecap="round"></path>

  <!-- Open caper flower -->
  <g filter="url(#caperShadow)">
    <path d="M91 33
         C82 29 76 22 78 16
         C87 13 94 19 97 28
         C96 32 94 34 91 33Z" fill="url(#petalWhite)"></path>

    <path d="M95 31
         C97 21 104 15 112 17
         C116 25 111 34 101 36
         C98 36 96 34 95 31Z" fill="url(#petalShade)"></path>

    <path d="M94 34
         C87 40 80 47 82 54
         C91 57 99 51 101 41
         C100 37 98 35 94 34Z" fill="url(#petalWhite)"></path>

    <path d="M99 35
         C107 35 115 39 117 46
         C112 54 102 55 96 47
         C94 42 95 38 99 35Z" fill="url(#petalShade)"></path>

    <!-- petal highlights -->
    <g fill="none" stroke="#ffffff" stroke-width="1.35" stroke-linecap="round" opacity="0.74">
      <path d="M82 18 C86 19 90 23 92 28"></path>
      <path d="M108 20 C105 23 102 27 101 31"></path>
      <path d="M86 50 C90 47 93 43 95 39"></path>
    </g>

    <!-- Purple stamens -->
    <g fill="none" stroke="url(#purpleStamen)" stroke-width="1.2" stroke-linecap="round">
      <path d="M97 35 C100 24 102 17 105 10"></path>
      <path d="M98 35 C104 26 108 20 113 15"></path>
      <path d="M98 36 C108 29 114 26 120 24"></path>
      <path d="M97 36 C105 35 113 35 121 36"></path>
      <path d="M96 35 C96 24 96 17 97 10"></path>
      <path d="M95 35 C91 25 88 20 84 15"></path>
      <path d="M99 37 C108 39 115 42 120 46"></path>
      <path d="M96 37 C101 45 105 51 108 57"></path>
      <path d="M94 36 C91 44 89 50 89 56"></path>
      <path d="M95 35 C88 29 84 25 79 23"></path>
    </g>

    <!-- stamen tips -->
    <g fill="#9a5ab3">
      <circle cx="105" cy="10" r="1.7"></circle>
      <circle cx="113" cy="15" r="1.7"></circle>
      <circle cx="120" cy="24" r="1.7"></circle>
      <circle cx="121" cy="36" r="1.7"></circle>
      <circle cx="97" cy="10" r="1.7"></circle>
      <circle cx="84" cy="15" r="1.7"></circle>
      <circle cx="120" cy="46" r="1.7"></circle>
      <circle cx="108" cy="57" r="1.7"></circle>
      <circle cx="89" cy="56" r="1.7"></circle>
      <circle cx="79" cy="23" r="1.7"></circle>
    </g>

    <!-- flower center -->
    <circle cx="96" cy="36" r="4.2" fill="#d9c45f"></circle>
    <circle cx="95" cy="35" r="1.6" fill="#fff0a2" opacity="0.85"></circle>
  </g>

  <!-- Stem highlight -->
  <path d="M30 100 C46 88 58 73 66 55 C72 42 76 30 78 21" fill="none" stroke="#80b96d" stroke-width="1.1" stroke-linecap="round" opacity="0.5"></path>
</svg>