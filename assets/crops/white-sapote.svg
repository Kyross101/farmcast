<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">White Sapote</title>

  <desc id="desc">
    Two ripe pale yellow-green white sapote fruits and one cut fruit showing creamy flesh.
  </desc>

  <!-- Leaves -->
  <ellipse cx="40" cy="28" rx="18" ry="8" transform="rotate(-27 40 28)" fill="#608c4c" stroke="#3f693b" stroke-width="1.8">
  </ellipse>

  <ellipse cx="92" cy="29" rx="18" ry="8" transform="rotate(27 92 29)" fill="#608c4c" stroke="#3f693b" stroke-width="1.8">
  </ellipse>

  <!-- Leaf veins -->
  <path d="M26 35 L55 24
       M78 24 L106 36" fill="none" stroke="#94ad7d" stroke-width="1.4" stroke-linecap="round">
  </path>

  <!-- Small fruit stems -->
  <path d="M64 22
       C56 33 52 43 50 54

       M64 22
       C75 33 82 43 87 54" fill="none" stroke="#696a43" stroke-width="3" stroke-linecap="round">
  </path>

  <!-- Left white sapote -->
  <path d="M49 51
       C37 51 30 61 31 75
       C32 90 40 100 50 102
       C61 101 68 91 68 76
       C68 62 61 52 49 51Z" fill="#b9bd69" stroke="#7e8248" stroke-width="2.3">
  </path>

  <!-- Left yellow ripe side -->
  <path d="M56 54
       C66 61 68 76 64 88
       C61 95 56 99 50 101
       C55 89 58 72 56 54Z" fill="#c9c36b" opacity="0.82">
  </path>

  <!-- Left highlight -->
  <path d="M40 61
       C36 70 37 82 42 88" fill="none" stroke="#dde09a" stroke-width="2.2" stroke-linecap="round">
  </path>

  <!-- Right white sapote -->
  <path d="M89 51
       C78 51 71 61 71 74
       C71 88 79 98 89 100
       C99 98 107 89 107 75
       C107 62 100 52 89 51Z" fill="#b4ba65" stroke="#7a8046" stroke-width="2.3">
  </path>

  <!-- Right ripe side -->
  <path d="M96 54
       C105 61 108 74 104 86
       C101 93 96 97 90 99
       C95 87 98 71 96 54Z" fill="#c9c36a" opacity="0.8">
  </path>

  <!-- Right highlight -->
  <path d="M80 61
       C77 69 78 80 82 86" fill="none" stroke="#dce097" stroke-width="2.1" stroke-linecap="round">
  </path>

  <!-- Cut white sapote -->
  <g transform="translate(69 101)">

    <!-- Peel -->
    <ellipse cx="0" cy="0" rx="23" ry="15" fill="#adb45f" stroke="#747d43" stroke-width="2.2">
    </ellipse>

    <!-- Creamy flesh -->
    <ellipse cx="0" cy="0" rx="18" ry="11" fill="#eee3bd">
    </ellipse>

    <!-- Seeds -->
    <ellipse cx="-5" cy="0" rx="4" ry="6" transform="rotate(-20 -5 0)" fill="#7a6047">
    </ellipse>

    <ellipse cx="5" cy="1" rx="4" ry="6" transform="rotate(20 5 1)" fill="#725942">
    </ellipse>

    <!-- Flesh highlight -->
    <path d="M-12 -4
         C-6 -8 5 -8 11 -4" fill="none" stroke="#fff4d7" stroke-width="1.8" stroke-linecap="round">
    </path>

  </g>

  <!-- Shadow -->
  <ellipse cx="69" cy="118" rx="40" ry="5" fill="#81664a" opacity="0.2">
  </ellipse>

</svg>