<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Adzuki Bean</title>

  <desc id="desc">
    Red adzuki bean seeds with mature pods and small green trifoliate leaves.
  </desc>

  <!-- Trifoliate leaves -->
  <ellipse cx="49" cy="26" rx="14" ry="7" transform="rotate(-30 49 26)" fill="#638f4a" stroke="#406b39" stroke-width="1.7">
  </ellipse>

  <ellipse cx="66" cy="22" rx="14" ry="7" fill="#699650" stroke="#406b39" stroke-width="1.7">
  </ellipse>

  <ellipse cx="84" cy="27" rx="14" ry="7" transform="rotate(30 84 27)" fill="#638f4a" stroke="#406b39" stroke-width="1.7">
  </ellipse>

  <!-- Leaf stems -->
  <path d="M66 43
       L66 28

       M66 35
       L51 28

       M66 35
       L82 29" fill="none" stroke="#5e7040" stroke-width="2.4" stroke-linecap="round">
  </path>

  <!-- Mature left pod -->
  <path d="M23 57
       C35 49 52 50 65 58
       C70 62 70 69 65 73
       C53 80 36 78 25 70
       C21 67 20 61 23 57Z" fill="#ad8150" stroke="#705438" stroke-width="2.2">
  </path>

  <path d="M27 63
       C39 59 52 60 63 65" fill="none" stroke="#81613f" stroke-width="1.6" stroke-linecap="round">
  </path>

  <!-- Open right pod -->
  <path d="M66 56
       C79 49 97 51 104 62
       C109 70 102 78 91 80
       C79 82 69 77 65 68
       C63 64 64 59 66 56Z" fill="#bd925b" stroke="#785d3c" stroke-width="2.2">
  </path>

  <path d="M71 61
       C80 56 94 57 99 64
       C103 69 98 75 89 76
       C80 77 72 73 69 67
       C68 65 69 63 71 61Z" fill="#dfc596">
  </path>

  <!-- Red seeds inside pod -->
  <ellipse cx="78" cy="67" rx="5" ry="4" fill="#a5453d" stroke="#6d302d" stroke-width="1.3">
  </ellipse>

  <ellipse cx="90" cy="67" rx="5" ry="4" fill="#b34b41" stroke="#71322e" stroke-width="1.3">
  </ellipse>

  <!-- Loose adzuki beans -->
  <ellipse cx="35" cy="97" rx="9" ry="7" transform="rotate(-10 35 97)" fill="#a84039" stroke="#702e2b" stroke-width="2">
  </ellipse>

  <ellipse cx="56" cy="101" rx="9" ry="7" transform="rotate(7 56 101)" fill="#b4483e" stroke="#75312d" stroke-width="2">
  </ellipse>

  <ellipse cx="78" cy="99" rx="9" ry="7" transform="rotate(-7 78 99)" fill="#a33e37" stroke="#6c2d29" stroke-width="2">
  </ellipse>

  <ellipse cx="99" cy="94" rx="9" ry="7" transform="rotate(11 99 94)" fill="#b44a40" stroke="#73312d" stroke-width="2">
  </ellipse>

  <!-- Characteristic pale seed hilum -->
  <ellipse cx="35" cy="97" rx="1.8" ry="4" fill="#e2c9ad"></ellipse>
  <ellipse cx="56" cy="101" rx="1.8" ry="4" fill="#e6ceb1"></ellipse>
  <ellipse cx="78" cy="99" rx="1.8" ry="4" fill="#dfc5a8"></ellipse>
  <ellipse cx="99" cy="94" rx="1.8" ry="4" fill="#e5ccb0"></ellipse>

  <!-- Shadow -->
  <ellipse cx="67" cy="116" rx="43" ry="5" fill="#81664a" opacity="0.18">
  </ellipse>

</svg>