<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Cranberry</title>

  <desc id="desc">
    Detailed botanical illustration of an American cranberry vine with
    small glossy evergreen leaves, delicate pink flowers, clusters of
    ripe red cranberries, highlights, shadows, and natural depth.
  </desc>

  <defs>

    <linearGradient id="vineBrown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d6852"></stop>
      <stop offset="0.55" stop-color="#624838"></stop>
      <stop offset="1" stop-color="#3f322b"></stop>
    </linearGradient>

    <linearGradient id="leafGreen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#214f35"></stop>
      <stop offset="0.5" stop-color="#477d48"></stop>
      <stop offset="1" stop-color="#8bb36d"></stop>
    </linearGradient>

    <linearGradient id="leafDark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#183d2b"></stop>
      <stop offset="1" stop-color="#5c8c55"></stop>
    </linearGradient>

    <radialGradient id="berryRed" cx="32%" cy="25%" r="75%">
      <stop offset="0" stop-color="#ff9b8c"></stop>
      <stop offset="0.38" stop-color="#df4c50"></stop>
      <stop offset="0.72" stop-color="#af2638"></stop>
      <stop offset="1" stop-color="#731c2b"></stop>
    </radialGradient>

    <radialGradient id="berryDark" cx="32%" cy="25%" r="75%">
      <stop offset="0" stop-color="#ed7b72"></stop>
      <stop offset="0.42" stop-color="#c63b43"></stop>
      <stop offset="1" stop-color="#761d2e"></stop>
    </radialGradient>

    <linearGradient id="petalPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4f4"></stop>
      <stop offset="0.65" stop-color="#efc7cf"></stop>
      <stop offset="1" stop-color="#d99aa9"></stop>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#1e2921" flood-opacity="0.26"></feDropShadow>
    </filter>

  </defs>

  <!-- Ground shadow -->
  <ellipse cx="64" cy="116" rx="40" ry="6" fill="#263128" opacity="0.16"></ellipse>

  <!-- Main creeping vine -->
  <path d="
    M13 103
    C28 94 38 84 50 73
    C61 62 72 49 84 38
    C95 28 106 20 117 16" fill="none" stroke="url(#vineBrown)" stroke-width="4.8" stroke-linecap="round" filter="url(#softShadow)"></path>

  <!-- Secondary runners -->
  <g fill="none" stroke="url(#vineBrown)" stroke-linecap="round">

    <path d="
      M40 82
      C34 69 30 58 30 47" stroke-width="2.7"></path>

    <path d="
      M58 66
      C53 53 51 42 53 31" stroke-width="2.6"></path>

    <path d="
      M76 46
      C87 49 98 46 108 40" stroke-width="2.6"></path>

    <path d="
      M29 92
      C22 88 16 83 11 78" stroke-width="2.4"></path>

  </g>

  <!-- Vine highlight -->
  <path d="
    M17 100
    C31 91 42 80 53 70
    C64 59 75 47 87 36
    C98 27 107 21 114 18" fill="none" stroke="#ad8669" stroke-width="0.8" stroke-linecap="round" opacity="0.58"></path>

  <!-- Small evergreen leaves -->
  <g stroke="#214a33" stroke-width="0.9" filter="url(#softShadow)">

    <path d="
      M29 47
      C20 40 13 42 11 49
      C18 55 26 54 32 50
      C34 48 32 47 29 47Z" fill="url(#leafGreen)"></path>

    <path d="
      M36 60
      C27 53 19 56 18 63
      C25 69 33 68 39 64
      C41 62 39 60 36 60Z" fill="url(#leafDark)"></path>

    <path d="
      M53 31
      C45 24 37 27 36 34
      C43 40 51 39 57 35
      C59 33 57 31 53 31Z" fill="url(#leafGreen)"></path>

    <path d="
      M67 53
      C75 45 84 46 89 52
      C84 60 76 62 68 58
      C65 57 65 55 67 53Z" fill="url(#leafGreen)"></path>

    <path d="
      M86 37
      C94 29 103 30 108 36
      C103 44 95 46 87 42
      C84 41 84 39 86 37Z" fill="url(#leafDark)"></path>

    <path d="
      M101 42
      C109 35 117 38 120 45
      C114 52 106 52 100 48
      C98 46 99 44 101 42Z" fill="url(#leafGreen)"></path>

    <path d="
      M23 78
      C15 72 8 75 8 82
      C15 87 22 86 28 82
      C30 80 27 78 23 78Z" fill="url(#leafDark)"></path>

  </g>

  <!-- Leaf veins -->
  <g fill="none" stroke="#b2ca92" stroke-width="0.65" stroke-linecap="round" opacity="0.7">

    <path d="M13 49 C19 49 25 49 30 49"></path>
    <path d="M20 63 C26 62 32 62 37 62"></path>
    <path d="M38 34 C44 34 50 33 55 33"></path>

    <path d="M87 53 C80 55 74 56 69 57"></path>
    <path d="M106 36 C100 38 94 40 88 41"></path>
    <path d="M118 45 C112 46 106 47 101 47"></path>

  </g>

  <!-- Berry stems -->
  <g fill="none" stroke="#5c6841" stroke-width="1.5" stroke-linecap="round">

    <path d="M49 72 C48 78 47 84 48 89"></path>
    <path d="M63 61 C66 67 68 72 69 77"></path>
    <path d="M77 51 C82 57 84 62 85 67"></path>

    <path d="M37 81 C35 86 34 91 35 96"></path>

  </g>

  <!-- Cranberry cluster -->
  <g stroke="#791f30" stroke-width="1.1" filter="url(#softShadow)">

    <circle cx="48" cy="95" r="10" fill="url(#berryRed)"></circle>

    <circle cx="68" cy="84" r="10" fill="url(#berryDark)"></circle>

    <circle cx="85" cy="75" r="9.5" fill="url(#berryRed)"></circle>

    <circle cx="35" cy="104" r="8.5" fill="url(#berryDark)"></circle>

    <circle cx="57" cy="106" r="9" fill="url(#berryRed)"></circle>

    <circle cx="80" cy="103" r="8.7" fill="url(#berryDark)"></circle>

  </g>

  <!-- Characteristic berry blossom scars -->
  <g fill="#581828" stroke="#e48b88" stroke-width="0.5">

    <path d="
      M44 89
      L48 87
      L52 89
      L50 92
      L48 90
      L46 92Z"></path>

    <path d="
      M64 78
      L68 76
      L72 78
      L70 81
      L68 79
      L66 81Z"></path>

    <path d="
      M81 69
      L85 67
      L89 69
      L87 72
      L85 70
      L83 72Z"></path>

    <path d="
      M31 99
      L35 97
      L39 99
      L37 102
      L35 100
      L33 102Z"></path>

  </g>

  <!-- Berry highlights -->
  <g fill="#ffd0c5" opacity="0.67">

    <ellipse cx="44" cy="91" rx="2.7" ry="3.8" transform="rotate(-28 44 91)"></ellipse>

    <ellipse cx="64" cy="80" rx="2.7" ry="3.8" transform="rotate(-28 64 80)"></ellipse>

    <ellipse cx="81" cy="71" rx="2.5" ry="3.5" transform="rotate(-28 81 71)"></ellipse>

    <ellipse cx="53" cy="102" rx="2.3" ry="3.3" transform="rotate(-28 53 102)"></ellipse>

  </g>

  <!-- Cranberry flower stem -->
  <path d="
    M77 45
    C80 36 84 29 89 23" fill="none" stroke="#607044" stroke-width="1.4" stroke-linecap="round"></path>

  <!-- Reflexed cranberry flower -->
  <g transform="translate(90 21)" filter="url(#softShadow)">

    <!-- four swept-back petals -->
    <path d="
      M0 0
      C-6 -3 -8 -8 -5 -11
      C-1 -12 2 -8 2 -3Z" fill="url(#petalPink)" stroke="#cc929e" stroke-width="0.65"></path>

    <path d="
      M0 0
      C3 -6 8 -8 11 -5
      C12 -1 8 2 3 2Z" fill="url(#petalPink)" stroke="#cc929e" stroke-width="0.65"></path>

    <path d="
      M0 0
      C6 3 8 8 5 11
      C1 12 -2 8 -2 3Z" fill="url(#petalPink)" stroke="#cc929e" stroke-width="0.65"></path>

    <path d="
      M0 0
      C-3 6 -8 8 -11 5
      C-12 1 -8 -2 -3 -2Z" fill="url(#petalPink)" stroke="#cc929e" stroke-width="0.65"></path>

    <!-- central stamens -->
    <g stroke="#b88638" stroke-width="0.65" stroke-linecap="round">

      <path d="M0 0 L0 7"></path>
      <path d="M0 1 L-3 6"></path>
      <path d="M0 1 L3 6"></path>

    </g>

    <g fill="#7d5b26">

      <circle cx="0" cy="7" r="0.9"></circle>

      <circle cx="-3" cy="6" r="0.8"></circle>

      <circle cx="3" cy="6" r="0.8"></circle>

    </g>

  </g>

  <!-- Additional flower bud -->
  <g transform="translate(103 32) scale(.72)">

    <path d="
      M0 0
      C-4 -4 -7 -3 -8 1
      C-5 5 -2 6 1 4

      C4 6 7 4 8 1
      C7 -3 4 -4 0 0Z" fill="#e4a8b1" stroke="#ad727f" stroke-width="0.8"></path>

  </g>

  <!-- Tiny runner roots suggestion -->
  <g fill="none" stroke="#7b624c" stroke-width="0.75" stroke-linecap="round" opacity="0.8">

    <path d="M25 96 C24 102 22 107 19 112"></path>
    <path d="M29 95 C30 102 30 107 29 112"></path>

  </g>

</svg>