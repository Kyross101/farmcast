<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Lemongrass</title>
  <desc id="desc">
    A dense clump of lemongrass with long narrow arching green leaves
    and pale thickened bases.
  </desc>

  <!-- Pale basal clump -->
  <path d="M45 111
       C48 99 51 87 54 73
       L61 72
       C60 88 59 101 58 114Z" fill="#c7d38a" stroke="#809452" stroke-width="2"></path>

  <path d="M58 114
