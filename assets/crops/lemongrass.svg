  <!-- Additional blades for dense clump -->
  <path d="M59 84
       C50 67 50 50 50 35" fill="none" stroke="#86ae5c" stroke-width="4" stroke-linecap="round"></path>

  <path d="M69 84
       C79 67 82 52 82 38" fill="none" stroke="#659548" stroke-width="4" stroke-linecap="round"></path>

  <path d="M62 88
