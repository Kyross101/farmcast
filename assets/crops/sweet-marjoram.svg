<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Sweet Marjoram</title>

  <desc id="desc">
    Detailed botanical illustration of sweet marjoram with soft gray-green leaves,
    branching stems, clustered pale flowers, fresh sprigs, and natural shading.
  </desc>

  <defs>
    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b0bf91"></stop>
      <stop offset="0.52" stop-color="#7f9d6b"></stop>
      <stop offset="1" stop-color="#4e714e"></stop>
    </linearGradient>

    <linearGradient id="leafLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c6d1aa"></stop>
      <stop offset="1" stop-color="#67865c"></stop>
    </linearGradient>

    <linearGradient id="stemGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fa06d"></stop>
      <stop offset="1" stop-color="#5f6f4b"></stop>
    </linearGradient>

    <linearGradient id="flowerWhite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf5"></stop>
      <stop offset="1" stop-color="#e5e3d2"></stop>
    </linearGradient>

    <linearGradient id="flowerPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c6d2"></stop>
      <stop offset="1" stop-color="#b98b9c"></stop>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#2d3029" flood-opacity="0.22"></feDropShadow>
    </filter>
  </defs>

  <ellipse cx="64" cy="119" rx="44" ry="5" fill="#565049" opacity="0.15"></ellipse>

  <!-- Main branching stems -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round">

    <path d="M63 109
             C62 92 63 74 64 57
             C65 42 64 29 61 18" stroke-width="4.8"></path>

    <path d="M52 108
             C52 92 50 77 47 64
             C44 52 41 43 36 34" stroke-width="3.1"></path>

    <path d="M75 108
             C75 92 78 77 82 64
             C86 52 91 43 96 35" stroke-width="3.1"></path>

  </g>

  <!-- Stem highlights -->
  <g fill="none" stroke="#bec7a0" stroke-linecap="round" opacity="0.62">

    <path d="M66 105
             C65 85 66 65 66 46" stroke-width="1.05"></path>

    <path d="M54 104
             C54 87 52 72 49 59" stroke-width="0.9"></path>

  </g>

  <!-- Branches -->
  <g fill="none" stroke="#667752" stroke-width="1.7" stroke-linecap="round">

    <path d="M61 91 C51 84 42 77 33 69"></path>
    <path d="M63 82 C75 75 85 68 95 59"></path>
    <path d="M61 72 C51 66 43 59 36 51"></path>
    <path d="M64 64 C75 58 84 51 91 43"></path>
    <path d="M60 54 C51 49 45 42 40 36"></path>

  </g>

  <!-- Rounded gray-green leaves -->
  <g filter="url(#softShadow)">

    <ellipse cx="31" cy="68" rx="10" ry="5.2" transform="rotate(24 31 68)" fill="url(#leafGreen)" stroke="#486444" stroke-width="1.2"></ellipse>

    <ellipse cx="40" cy="76" rx="9.5" ry="4.9" transform="rotate(20 40 76)" fill="url(#leafLight)" stroke="#486444" stroke-width="1.2"></ellipse>

    <ellipse cx="48" cy="83" rx="9" ry="4.7" transform="rotate(18 48 83)" fill="url(#leafGreen)" stroke="#486444" stroke-width="1.2"></ellipse>

    <ellipse cx="34" cy="50" rx="9.7" ry="5" transform="rotate(23 34 50)" fill="url(#leafGreen)" stroke="#486444" stroke-width="1.2"></ellipse>

    <ellipse cx="43" cy="58" rx="9" ry="4.7" transform="rotate(18 43 58)" fill="url(#leafLight)" stroke="#486444" stroke-width="1.2"></ellipse>

    <ellipse cx="98" cy="58" rx="10" ry="5.1" transform="rotate(-22 98 58)" fill="url(#leafGreen)" stroke="#486444" stroke-width="1.2"></ellipse>

    <ellipse cx="89" cy="66" rx="9.5" ry="4.9" transform="rotate(-19 89 66)" fill="url(#leafLight)" stroke="#486444" stroke-width="1.2"></ellipse>

    <ellipse cx="81" cy="73" rx="9" ry="4.7" transform="rotate(-17 81 73)" fill="url(#leafGreen)" stroke="#486444" stroke-width="1.2"></ellipse>

    <ellipse cx="94" cy="42" rx="9.6" ry="4.9" transform="rotate(-23 94 42)" fill="url(#leafGreen)" stroke="#486444" stroke-width="1.2"></ellipse>

    <ellipse cx="85" cy="49" rx="8.8" ry="4.6" transform="rotate(-18 85 49)" fill="url(#leafLight)" stroke="#486444" stroke-width="1.2"></ellipse>

  </g>

  <!-- Soft leaf veins -->
  <g fill="none" stroke="#d3dac1" stroke-width="0.8" stroke-linecap="round" opacity="0.68">

    <path d="M23 65 C29 67 34 69 39 71"></path>
    <path d="M32 74 C38 76 43 78 48 79"></path>
    <path d="M106 55 C100 58 95 60 90 62"></path>
    <path d="M97 64 C92 66 87 68 82 70"></path>
    <path d="M42 49 C38 50 34 51 29 52"></path>
    <path d="M102 40 C98 42 94 44 89 45"></path>

  </g>

  <!-- Upper flowering stems -->
  <g fill="none" stroke="#71784e" stroke-width="1.25" stroke-linecap="round">

    <path d="M62 47 L52 38"></path>
    <path d="M64 44 L65 33"></path>
    <path d="M65 45 L77 36"></path>
    <path d="M52 38 L45 31"></path>
    <path d="M52 38 L53 29"></path>
    <path d="M77 36 L76 28"></path>
    <path d="M77 36 L84 30"></path>

  </g>

  <!-- Ball-like flower clusters -->
  <g filter="url(#softShadow)">

    <g transform="translate(45 30)">
      <circle cx="-3" cy="-1" r="3.2" fill="url(#flowerWhite)" stroke="#bdbbab" stroke-width="0.7"></circle>
      <circle cx="2" cy="-2" r="3.1" fill="url(#flowerPink)" stroke="#aa7d8c" stroke-width="0.7"></circle>
      <circle cx="0" cy="3" r="3.2" fill="url(#flowerWhite)" stroke="#bdbbab" stroke-width="0.7"></circle>
      <circle cx="0" cy="0" r="1.1" fill="#d5b55b"></circle>
    </g>

    <g transform="translate(66 31) scale(0.92)">
      <circle cx="-3" cy="-1" r="3.2" fill="url(#flowerWhite)" stroke="#bdbbab" stroke-width="0.7"></circle>
      <circle cx="2" cy="-2" r="3.1" fill="url(#flowerPink)" stroke="#aa7d8c" stroke-width="0.7"></circle>
      <circle cx="0" cy="3" r="3.2" fill="url(#flowerWhite)" stroke="#bdbbab" stroke-width="0.7"></circle>
      <circle cx="0" cy="0" r="1.1" fill="#d5b55b"></circle>
    </g>

    <g transform="translate(84 29) scale(0.84)">
      <circle cx="-3" cy="-1" r="3.2" fill="url(#flowerWhite)" stroke="#bdbbab" stroke-width="0.7"></circle>
      <circle cx="2" cy="-2" r="3.1" fill="url(#flowerPink)" stroke="#aa7d8c" stroke-width="0.7"></circle>
      <circle cx="0" cy="3" r="3.2" fill="url(#flowerWhite)" stroke="#bdbbab" stroke-width="0.7"></circle>
      <circle cx="0" cy="0" r="1.1" fill="#d5b55b"></circle>
    </g>

  </g>

  <!-- Harvested sprig -->
  <g transform="translate(37 107) rotate(-13)" filter="url(#softShadow)">

    <path d="M-15 2 C-5 1 6 -1 18 -3" fill="none" stroke="#5d7249" stroke-width="2.2" stroke-linecap="round"></path>

    <ellipse cx="-9" cy="0" rx="6.2" ry="3" transform="rotate(18 -9 0)" fill="url(#leafGreen)" stroke="#486444" stroke-width="0.9"></ellipse>

    <ellipse cx="0" cy="-1" rx="6.2" ry="3" transform="rotate(14 0 -1)" fill="url(#leafLight)" stroke="#486444" stroke-width="0.9"></ellipse>

    <ellipse cx="9" cy="-2" rx="6.2" ry="3" transform="rotate(12 9 -2)" fill="url(#leafGreen)" stroke="#486444" stroke-width="0.9"></ellipse>

  </g>

  <!-- Second sprig -->
  <g transform="translate(92 109) rotate(15)" opacity="0.95">

    <path d="M-12 1 C-3 0 6 -1 14 -2" fill="none" stroke="#5d7249" stroke-width="2" stroke-linecap="round"></path>

    <ellipse cx="-6" cy="0" rx="5.8" ry="2.8" transform="rotate(16 -6 0)" fill="url(#leafGreen)" stroke="#486444" stroke-width="0.8"></ellipse>

    <ellipse cx="3" cy="-1" rx="5.8" ry="2.8" transform="rotate(12 3 -1)" fill="url(#leafLight)" stroke="#486444" stroke-width="0.8"></ellipse>

    <ellipse cx="11" cy="-2" rx="5.5" ry="2.7" transform="rotate(10 11 -2)" fill="url(#leafGreen)" stroke="#486444" stroke-width="0.8"></ellipse>

  </g>

  <!-- Subtle botanical highlights -->
  <g fill="#f0e5be" opacity="0.6">
    <circle cx="49" cy="64" r="1"></circle>
    <circle cx="84" cy="62" r="1"></circle>
    <circle cx="58" cy="43" r="0.9"></circle>
  </g>

</svg>