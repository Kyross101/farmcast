    </path>

    <circle cx="51" cy="91" r="6" fill="#8a5c40" stroke="#4b3022" stroke-width="2">
    </circle>

    <path d="M72 98
         C69 95 69 90 72 88
         C75 86 79 88 80 92
         L83 111
         C82 115 78 116 75 113Z" fill="#6d452f" stroke="#462c20" stroke-width="2">
    </path>

    <circle cx="74" cy="90" r="6" fill="#805038" stroke="#462c20" stroke-width="2">
    </circle>

    <path d="M96 94
         C93 91 93 87 96 84
         C99 82 103 84 104 88
