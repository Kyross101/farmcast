    </path>

    <circle cx="98" cy="86" r="6" fill="#87563c" stroke="#492e20" stroke-width="2">
    </circle>

  </g>

  <!-- Clove head divisions -->
  <g fill="none" stroke="#ad7655" stroke-width="1.2" stroke-linecap="round">

    <path d="M25 84 L33 90 M33 84 L26 90"></path>
    <path d="M47 88 L55 94 M55 88 L48 94"></path>
    <path d="M70 87 L78 93 M78 87 L71 93"></path>
    <path d="M94 83 L102 89 M102 83 L95 89"></path>

  </g>

  <!-- Dried stem highlights -->
  <g fill="none" stroke="#9d6a4a" stroke-width="1.2" stroke-linecap="round" opacity="0.85">

    <path d="M31 94 L35 106"></path>
    <path d="M53 98 L56 110"></path>
    <path d="M76 97 L79 110"></path>
    <path d="M100 93 L103 105"></path>

  </g>

</svg>