<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Nigella</title>

  <desc id="desc">
    Detailed botanical illustration of Nigella sativa, also known as black cumin,
    showing finely divided feathery leaves, pale blue star-shaped flowers,
    slender green stems, and a mature inflated seed capsule containing black seeds.
  </desc>

  <defs>

    <linearGradient id="stemGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fbd77"></stop>
      <stop offset="0.55" stop-color="#698f59"></stop>
      <stop offset="1" stop-color="#416948"></stop>
    </linearGradient>

    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b7cf8d"></stop>
      <stop offset="0.5" stop-color="#77a264"></stop>
      <stop offset="1" stop-color="#436e4c"></stop>
    </linearGradient>

    <linearGradient id="petalBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef5ef"></stop>
      <stop offset="0.48" stop-color="#cbdce4"></stop>
      <stop offset="1" stop-color="#8daebc"></stop>
    </linearGradient>

    <linearGradient id="capsuleGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bdc98a"></stop>
      <stop offset="0.52" stop-color="#8e9f65"></stop>
      <stop offset="1" stop-color="#65764f"></stop>
    </linearGradient>

    <radialGradient id="flowerCenter">
      <stop offset="0" stop-color="#e1c676"></stop>
      <stop offset="0.55" stop-color="#a48251"></stop>
      <stop offset="1" stop-color="#66513e"></stop>
    </radialGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#253229" flood-opacity="0.22"></feDropShadow>
    </filter>

  </defs>

  <!-- Ground shadow -->
  <ellipse cx="64" cy="119" rx="43" ry="5" fill="#4b5149" opacity="0.15"></ellipse>

  <!-- Main stems -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round">

    <path d="M63 110
         C62 92 63 73 63 55
         C63 40 62 27 59 16" stroke-width="4"></path>

    <path d="M55 108
         C54 93 51 80 47 68
         C44 57 40 49 35 42" stroke-width="2.6"></path>

    <path d="M72 109
         C73 94 77 81 81 69
         C85 57 90 49 96 42" stroke-width="2.6"></path>

    <path d="M62 72
         C54 63 48 56 41 51" stroke-width="2"></path>

    <path d="M65 70
         C74 62 81 55 88 50" stroke-width="2"></path>

  </g>

  <!-- Stem highlights -->
  <g fill="none" stroke="#c5d6a4" stroke-linecap="round" opacity="0.6">

    <path d="M65 105
         C65 84 66 64 65 44" stroke-width="0.9"></path>

    <path d="M57 103
         C56 89 53 76 49 65" stroke-width="0.7"></path>

  </g>

  <!-- Feathery foliage left -->
  <g fill="none" stroke="url(#leafGreen)" stroke-linecap="round" stroke-linejoin="round">

    <path d="M57 96
         C48 92 41 86 35 79" stroke-width="2.4"></path>

    <path d="M48 91 L40 89 L34 85" stroke-width="1.3"></path>
    <path d="M46 89 L40 82 L37 76" stroke-width="1.2"></path>
    <path d="M42 86 L33 84 L27 80" stroke-width="1.2"></path>
    <path d="M40 83 L34 76 L32 70" stroke-width="1.15"></path>

    <path d="M55 79
         C47 76 40 70 34 64" stroke-width="2.1"></path>

    <path d="M48 75 L40 74 L34 71" stroke-width="1.15"></path>
    <path d="M45 72 L39 65 L37 59" stroke-width="1.15"></path>
    <path d="M42 70 L33 68 L28 64" stroke-width="1.05"></path>
    <path d="M39 66 L34 59 L33 54" stroke-width="1.05"></path>

    <path d="M52 63
         C45 60 40 55 35 50" stroke-width="1.8"></path>

    <path d="M46 59 L39 58 L34 55" stroke-width="1"></path>
    <path d="M44 57 L40 51 L39 46" stroke-width="1"></path>
    <path d="M41 55 L34 53 L30 50" stroke-width="0.95"></path>

  </g>

  <!-- Feathery foliage right -->
  <g fill="none" stroke="url(#leafGreen)" stroke-linecap="round" stroke-linejoin="round">

    <path d="M70 97
         C80 93 88 87 94 80" stroke-width="2.4"></path>

    <path d="M79 92 L87 90 L94 86" stroke-width="1.3"></path>
    <path d="M82 90 L88 83 L91 77" stroke-width="1.2"></path>
    <path d="M86 87 L95 85 L101 81" stroke-width="1.2"></path>
    <path d="M88 84 L94 77 L96 71" stroke-width="1.15"></path>

    <path d="M72 80
         C81 76 88 71 94 65" stroke-width="2.1"></path>

    <path d="M80 76 L88 75 L94 72" stroke-width="1.15"></path>
    <path d="M83 73 L89 66 L91 60" stroke-width="1.15"></path>
    <path d="M87 71 L96 69 L101 65" stroke-width="1.05"></path>
    <path d="M90 67 L95 60 L96 55" stroke-width="1.05"></path>

    <path d="M75 63
         C82 60 87 55 92 50" stroke-width="1.8"></path>

    <path d="M81 59 L88 58 L94 55" stroke-width="1"></path>
    <path d="M84 57 L88 51 L89 46" stroke-width="1"></path>
    <path d="M87 55 L94 53 L98 50" stroke-width="0.95"></path>

  </g>

  <!-- Fine leaf tips -->
  <g fill="none" stroke="#71945f" stroke-linecap="round" opacity="0.9">

    <path d="M35 79 L27 74" stroke-width="0.8"></path>
    <path d="M34 64 L26 60" stroke-width="0.8"></path>
    <path d="M35 50 L29 45" stroke-width="0.75"></path>

    <path d="M94 80 L102 75" stroke-width="0.8"></path>
    <path d="M94 65 L102 61" stroke-width="0.8"></path>
    <path d="M92 50 L99 45" stroke-width="0.75"></path>

  </g>

  <!-- Main flower stalk -->
  <path d="M63 55
       C63 44 62 34 61 26" fill="none" stroke="url(#stemGreen)" stroke-width="2.2" stroke-linecap="round"></path>

  <!-- Nigella flower -->
  <g transform="translate(60 22)" filter="url(#softShadow)">

    <path d="M0 0
         C-7 -3 -12 -9 -10 -14
         C-4 -14 1 -10 3 -4Z" fill="url(#petalBlue)" stroke="#7898a6" stroke-width="1"></path>

    <path d="M1 -1
         C-1 -8 1 -15 6 -18
         C10 -14 9 -7 5 -2Z" fill="url(#petalBlue)" stroke="#7898a6" stroke-width="1"></path>

    <path d="M4 0
         C9 -5 16 -7 20 -3
         C18 3 11 5 5 4Z" fill="url(#petalBlue)" stroke="#7898a6" stroke-width="1"></path>

    <path d="M3 3
         C9 7 11 14 7 18
         C1 16 -2 10 0 4Z" fill="url(#petalBlue)" stroke="#7898a6" stroke-width="1"></path>

    <path d="M0 3
         C-5 8 -12 9 -16 5
         C-14 -1 -7 -4 -1 -2Z" fill="url(#petalBlue)" stroke="#7898a6" stroke-width="1"></path>

    <circle cx="2" cy="1" r="4.5" fill="url(#flowerCenter)" stroke="#5b5145" stroke-width="0.8"></circle>

    <!-- Dark stamens -->
    <g stroke="#57493f" stroke-width="0.75" stroke-linecap="round">

      <path d="M2 1 L-2 -6"></path>
      <path d="M2 1 L7 -6"></path>
      <path d="M2 1 L10 1"></path>
      <path d="M2 1 L7 7"></path>
      <path d="M2 1 L-3 7"></path>
      <path d="M2 1 L-7 1"></path>

    </g>

    <g fill="#d8c177">
      <circle cx="-2" cy="-6" r="1"></circle>
      <circle cx="7" cy="-6" r="1"></circle>
      <circle cx="10" cy="1" r="1"></circle>
      <circle cx="7" cy="7" r="1"></circle>
      <circle cx="-3" cy="7" r="1"></circle>
      <circle cx="-7" cy="1" r="1"></circle>
    </g>

  </g>

  <!-- Seed capsule branch -->
  <path d="M80 69
       C84 58 87 47 88 37" fill="none" stroke="url(#stemGreen)" stroke-width="2" stroke-linecap="round"></path>

  <!-- Mature inflated seed capsule -->
  <g transform="translate(88 34)" filter="url(#softShadow)">

    <path d="M0 12
         C-7 8 -9 1 -6 -5
         C-3 -9 3 -10 7 -6
         C11 -2 10 6 5 12Z" fill="url(#capsuleGreen)" stroke="#596b4b" stroke-width="1.4"></path>

    <!-- Capsule ribs -->
    <g fill="none" stroke="#71805a" stroke-width="0.8" opacity="0.85">

      <path d="M0 11 C-1 5 -1 -1 0 -7"></path>
      <path d="M-3 10 C-5 4 -5 -1 -4 -5"></path>
      <path d="M3 10 C6 4 6 -1 5 -5"></path>

    </g>

    <!-- Characteristic horn-like capsule tips -->
    <g fill="none" stroke="#58684a" stroke-width="1.4" stroke-linecap="round">

      <path d="M-5 -4 L-10 -10"></path>
      <path d="M-2 -7 L-4 -14"></path>
      <path d="M1 -8 L2 -15"></path>
      <path d="M4 -7 L8 -13"></path>
      <path d="M7 -4 L12 -9"></path>

    </g>

  </g>

  <!-- Black cumin seeds -->
  <g fill="#292b27" stroke="#55584c" stroke-width="0.45">

    <path d="M94 104 l4 -2 l3 3 l-3 4 l-4 -1Z"></path>
    <path d="M102 110 l4 -2 l3 3 l-2 4 l-4 0Z"></path>
    <path d="M88 112 l4 -3 l4 2 l-1 4 l-5 1Z"></path>
    <path d="M98 117 l4 -2 l4 2 l-1 4 l-5 1Z"></path>
    <path d="M108 103 l3 -2 l3 2 l-1 4 l-4 0Z"></path>

  </g>

  <!-- Small seed highlights -->
  <g fill="#737568" opacity="0.65">

    <circle cx="97" cy="105" r="0.6"></circle>
    <circle cx="105" cy="111" r="0.6"></circle>
    <circle cx="92" cy="112" r="0.6"></circle>
    <circle cx="102" cy="118" r="0.6"></circle>

  </g>

  <!-- Basal crown -->
  <path d="M48 108
       C53 104 58 102 64 102
       C70 102 76 104 81 108
       C76 113 70 116 64 116
       C57 116 52 113 48 108Z" fill="#75654d" stroke="#51483c" stroke-width="1.4"></path>

</svg>