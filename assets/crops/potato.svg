<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Potato</title>
  <desc id="desc">
    A potato plant with green leaves and several underground tubers.
  </desc>

  <!-- Stem -->
  <path d="M64 63 C63 49 63 36 64 23" fill="none" stroke="#4f7f3b" stroke-width="5" stroke-linecap="round"></path>

  <!-- Left branch -->
  <path d="M63 43 C51 40 43 34 36 27" fill="none" stroke="#4f7f3b" stroke-width="4" stroke-linecap="round"></path>

  <!-- Right branch -->
  <path d="M64 38 C76 35 84 29 91 23" fill="none" stroke="#4f7f3b" stroke-width="4" stroke-linecap="round"></path>

  <!-- Leaves -->
  <ellipse cx="35" cy="25" rx="13" ry="8" transform="rotate(28 35 25)" fill="#659c4a"></ellipse>

  <ellipse cx="49" cy="38" rx="12" ry="7" transform="rotate(20 49 38)" fill="#75aa55"></ellipse>

  <ellipse cx="92" cy="22" rx="13" ry="8" transform="rotate(-28 92 22)" fill="#659c4a"></ellipse>

  <ellipse cx="79" cy="35" rx="12" ry="7" transform="rotate(-20 79 35)" fill="#75aa55"></ellipse>

  <ellipse cx="64" cy="19" rx="9" ry="13" fill="#6da24d"></ellipse>

  <!-- Soil line -->
  <path d="M18 68 C35 65 48 70 64 68 C81 66 95 70 110 67" fill="none" stroke="#8a6547" stroke-width="4" stroke-linecap="round"></path>

  <!-- Underground roots -->
  <path d="M63 68 C52 77 45 84 40 94" fill="none" stroke="#96704d" stroke-width="3" stroke-linecap="round"></path>

  <path d="M64 68 C66 79 68 88 70 98" fill="none" stroke="#96704d" stroke-width="3" stroke-linecap="round"></path>

  <path d="M66 69 C80 76 88 85 91 95" fill="none" stroke="#96704d" stroke-width="3" stroke-linecap="round"></path>

  <!-- Potatoes -->
  <ellipse cx="38" cy="99" rx="16" ry="12" transform="rotate(-12 38 99)" fill="#c99a58" stroke="#9b7040" stroke-width="3"></ellipse>

  <ellipse cx="69" cy="105" rx="18" ry="13" transform="rotate(8 69 105)" fill="#d2a45f" stroke="#9b7040" stroke-width="3"></ellipse>

  <ellipse cx="96" cy="98" rx="14" ry="11" transform="rotate(15 96 98)" fill="#c99a58" stroke="#9b7040" stroke-width="3"></ellipse>

  <!-- Potato eyes -->
  <circle cx="33" cy="96" r="1.8" fill="#8c6339"></circle>
  <circle cx="43" cy="102" r="1.8" fill="#8c6339"></circle>

  <circle cx="63" cy="101" r="1.8" fill="#8c6339"></circle>
  <circle cx="75" cy="108" r="1.8" fill="#8c6339"></circle>

  <circle cx="92" cy="95" r="1.8" fill="#8c6339"></circle>
</svg>