<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Peach</title>

  <desc id="desc">
    Two ripe orange-red peach fruits with green leaves.
  </desc>

  <!-- Top stems -->
  <path d="M59 39
       C61 32 65 27 70 23

       M76 43
       C78 35 82 30 87 27" fill="none" stroke="#6d673f" stroke-width="3" stroke-linecap="round">
  </path>

  <!-- Left leaf -->
  <ellipse cx="49" cy="34" rx="18" ry="6" transform="rotate(-27 49 34)" fill="#67954e" stroke="#426d3b" stroke-width="1.8">
  </ellipse>

  <path d="M35 40 L63 29" fill="none" stroke="#98b37f" stroke-width="1.4" stroke-linecap="round">
  </path>

  <!-- Right leaf -->
  <ellipse cx="89" cy="35" rx="18" ry="6" transform="rotate(25 89 35)" fill="#67954e" stroke="#426d3b" stroke-width="1.8">
  </ellipse>

  <path d="M75 30 L103 41" fill="none" stroke="#98b37f" stroke-width="1.4" stroke-linecap="round">
  </path>

  <!-- Main peach -->
  <path d="M59 43
       C45 41 34 51 32 67
       C30 83 37 99 50 106
       C60 112 69 108 75 100
       C83 91 86 75 80 60
       C76 50 68 44 59 43Z" fill="#ed9b58" stroke="#b8643c" stroke-width="2.4">
  </path>

  <!-- Main peach red blush -->
  <path d="M68 47
       C79 52 84 64 82 77
       C80 91 72 101 63 106
       C68 93 71 77 70 63
       C70 56 69 51 68 47Z" fill="#dc6857" opacity="0.85">
  </path>

  <!-- Peach crease -->
  <path d="M60 47
       C56 61 56 79 60 96
       C61 101 63 105 65 107" fill="none" stroke="#c4714d" stroke-width="2.2" stroke-linecap="round">
  </path>

  <!-- Peach highlight -->
  <path d="M43 58
       C39 66 39 76 42 82" fill="none" stroke="#f5c18d" stroke-width="2.5" stroke-linecap="round">
  </path>

  <!-- Second peach -->
  <path d="M88 50
       C78 49 71 57 71 69
       C70 82 76 94 86 99
       C96 104 106 97 110 87
       C115 75 111 61 103 54
       C99 51 94 49 88 50Z" fill="#f0a15d" stroke="#bb693e" stroke-width="2.2">
  </path>

  <!-- Second peach blush -->
  <path d="M98 53
       C108 59 112 71 108 83
       C106 91 101 97 95 100
       C99 88 101 71 98 53Z" fill="#df705a" opacity="0.8">
  </path>

  <!-- Second peach crease -->
  <path d="M89 53
       C86 65 86 80 90 96" fill="none" stroke="#c87850" stroke-width="2" stroke-linecap="round">
  </path>

  <!-- Ground shadow -->
  <ellipse cx="70" cy="113" rx="38" ry="6" fill="#81664a" opacity="0.2">
  </ellipse>

</svg>