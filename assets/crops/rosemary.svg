<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Rosemary</title>

  <desc id="desc">
    An upright rosemary plant with woody stems,
    narrow needle-like green leaves, and small blue flowers.
  </desc>

  <!-- Main woody stem -->
  <path d="M64 116
       C63 96 64 76 63 57
       C62 41 61 27 60 15" fill="none" stroke="#765d43" stroke-width="6" stroke-linecap="round">
  </path>

  <!-- Side stems -->
  <path d="M62 48
       C50 42 42 33 36 23" fill="none" stroke="#765d43" stroke-width="4" stroke-linecap="round">
  </path>

  <path d="M65 55
       C78 47 87 38 94 27" fill="none" stroke="#765d43" stroke-width="4" stroke-linecap="round">
  </path>

  <path d="M62 70
       C50 65 41 58 34 49" fill="none" stroke="#765d43" stroke-width="3.5" stroke-linecap="round">
  </path>

  <path d="M65 77
       C78 71 88 64 96 55" fill="none" stroke="#765d43" stroke-width="3.5" stroke-linecap="round">
  </path>

  <!-- Narrow rosemary leaves -->
  <g fill="#547d5b" stroke="#3f684c" stroke-width="1">

    <ellipse cx="38" cy="25" rx="10" ry="2.4" transform="rotate(42 38 25)">
    </ellipse>

    <ellipse cx="45" cy="34" rx="10" ry="2.4" transform="rotate(35 45 34)">
    </ellipse>

    <ellipse cx="52" cy="42" rx="10" ry="2.4" transform="rotate(28 52 42)">
    </ellipse>

    <ellipse cx="92" cy="29" rx="10" ry="2.4" transform="rotate(-42 92 29)">
    </ellipse>

    <ellipse cx="85" cy="38" rx="10" ry="2.4" transform="rotate(-35 85 38)">
    </ellipse>

    <ellipse cx="78" cy="47" rx="10" ry="2.4" transform="rotate(-28 78 47)">
    </ellipse>

    <ellipse cx="36" cy="51" rx="10" ry="2.4" transform="rotate(38 36 51)">
    </ellipse>

    <ellipse cx="44" cy="59" rx="10" ry="2.4" transform="rotate(30 44 59)">
    </ellipse>

    <ellipse cx="52" cy="67" rx="10" ry="2.4" transform="rotate(22 52 67)">
    </ellipse>

    <ellipse cx="94" cy="57" rx="10" ry="2.4" transform="rotate(-38 94 57)">
    </ellipse>

    <ellipse cx="86" cy="65" rx="10" ry="2.4" transform="rotate(-30 86 65)">
    </ellipse>

    <ellipse cx="78" cy="73" rx="10" ry="2.4" transform="rotate(-22 78 73)">
    </ellipse>

    <ellipse cx="57" cy="26" rx="9" ry="2.2" transform="rotate(-12 57 26)">
    </ellipse>

    <ellipse cx="68" cy="34" rx="9" ry="2.2" transform="rotate(14 68 34)">
    </ellipse>

  </g>

  <!-- Pale undersides -->
  <path d="M31 28 L43 20
       M87 33 L98 24
       M29 55 L42 47
       M90 61 L102 53" fill="none" stroke="#9dad99" stroke-width="1.5" stroke-linecap="round">
  </path>

  <!-- Blue flowers -->
  <g>
    <circle cx="32" cy="20" r="3.5" fill="#778eb7">
    </circle>

    <circle cx="38" cy="18" r="3" fill="#8aa0c5">
    </circle>

    <circle cx="96" cy="23" r="3.5" fill="#778eb7">
    </circle>

    <circle cx="101" cy="27" r="3" fill="#8aa0c5">
    </circle>

    <circle cx="59" cy="11" r="3" fill="#8298bf">
    </circle>

    <circle cx="65" cy="14" r="3" fill="#7289b1">
    </circle>
  </g>

  <!-- Ground -->
  <ellipse cx="64" cy="117" rx="30" ry="5" fill="#81664a" opacity="0.35">
  </ellipse>

</svg>