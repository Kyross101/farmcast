<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Star Anise</title>

  <desc id="desc">
    Detailed botanical illustration of glossy star anise leaves,
    a pink-red flower, green developing fruit, and dried brown
    star-shaped spice fruits with visible seeds.
  </desc>

  <defs>
    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78a965"></stop>
      <stop offset="0.5" stop-color="#477c48"></stop>
      <stop offset="1" stop-color="#28573a"></stop>
    </linearGradient>

    <linearGradient id="leafLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#91b978"></stop>
      <stop offset="1" stop-color="#3c7042"></stop>
    </linearGradient>

    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a7555"></stop>
      <stop offset="1" stop-color="#5a3d2b"></stop>
    </linearGradient>

    <linearGradient id="fruitBrown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bd7650"></stop>
      <stop offset="0.55" stop-color="#8f5035"></stop>
      <stop offset="1" stop-color="#5f3427"></stop>
    </linearGradient>

    <linearGradient id="fruitHighlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d99669"></stop>
      <stop offset="1" stop-color="#8a4b32"></stop>
    </linearGradient>

    <radialGradient id="seedBrown" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#80634d"></stop>
      <stop offset="0.55" stop-color="#4e3429"></stop>
      <stop offset="1" stop-color="#241915"></stop>
    </radialGradient>

    <linearGradient id="flowerPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ed9c9b"></stop>
      <stop offset="0.55" stop-color="#c96471"></stop>
      <stop offset="1" stop-color="#924353"></stop>
    </linearGradient>

    <linearGradient id="youngFruit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9eb565"></stop>
      <stop offset="1" stop-color="#647b45"></stop>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#342d28" flood-opacity="0.25"></feDropShadow>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="64" cy="119" rx="45" ry="5" fill="#5e5145" opacity="0.16"></ellipse>

  <!-- Main woody stem -->
  <path d="M65 101
       C64 83 64 66 66 51
       C68 38 72 28 77 18" fill="none" stroke="url(#wood)" stroke-width="5" stroke-linecap="round"></path>

  <!-- Bark highlight -->
  <path d="M67 98
       C66 81 66 65 68 51
       C69 39 73 29 77 20" fill="none" stroke="#b49370" stroke-width="1.4" stroke-linecap="round" opacity="0.75"></path>

  <!-- Side branches -->
  <g fill="none" stroke="#654832" stroke-linecap="round">
    <path d="M66 68 C55 60 46 52 36 43" stroke-width="3"></path>

    <path d="M67 60 C79 53 88 46 98 36" stroke-width="3"></path>

    <path d="M68 47 C57 40 50 33 44 26" stroke-width="2.5"></path>

    <path d="M69 44 C79 37 86 30 91 23" stroke-width="2.5"></path>
  </g>

  <!-- Leaves -->
  <g filter="url(#softShadow)">
    <path d="M58 76
         C45 66 31 63 20 69
         C28 82 43 88 59 82Z" fill="url(#leafGreen)" stroke="#294f35" stroke-width="2"></path>

    <path d="M55 58
         C43 48 30 44 21 50
         C29 61 42 66 56 63Z" fill="url(#leafLight)" stroke="#294f35" stroke-width="2"></path>

    <path d="M73 75
         C86 66 100 64 110 71
         C101 82 86 87 72 82Z" fill="url(#leafGreen)" stroke="#294f35" stroke-width="2"></path>

    <path d="M75 57
         C88 47 101 44 110 51
         C101 62 88 65 74 63Z" fill="url(#leafLight)" stroke="#294f35" stroke-width="2"></path>

    <path d="M57 43
         C47 33 36 28 28 32
         C35 43 45 48 57 49Z" fill="url(#leafGreen)" stroke="#294f35" stroke-width="1.8"></path>

    <path d="M79 42
         C88 32 99 27 107 31
         C101 42 91 47 79 48Z" fill="url(#leafGreen)" stroke="#294f35" stroke-width="1.8"></path>
  </g>

  <!-- Leaf veins -->
  <g fill="none" stroke="#9fc397" stroke-linecap="round" opacity="0.8">
    <path d="M23 70 C36 72 48 77 57 81" stroke-width="1.2"></path>

    <path d="M23 51 C36 53 47 58 55 62" stroke-width="1.2"></path>

    <path d="M107 72 C94 73 83 77 73 81" stroke-width="1.2"></path>

    <path d="M107 52 C95 54 84 58 76 62" stroke-width="1.2"></path>

    <path d="M30 33 C40 36 49 42 56 47" stroke-width="1"></path>

    <path d="M105 32 C95 36 87 41 80 46" stroke-width="1"></path>
  </g>

  <!-- Flower stem -->
  <path d="M67 51 C61 48 57 45 53 41" fill="none" stroke="#687340" stroke-width="2" stroke-linecap="round"></path>

  <!-- Pink-red star anise flower -->
  <g transform="translate(48 36)" filter="url(#softShadow)">
    <g fill="url(#flowerPink)" stroke="#85414d" stroke-width="1">

      <ellipse cx="0" cy="-7" rx="3.2" ry="8" transform="rotate(0)"></ellipse>

      <ellipse cx="0" cy="-7" rx="3.2" ry="8" transform="rotate(45)"></ellipse>

      <ellipse cx="0" cy="-7" rx="3.2" ry="8" transform="rotate(90)"></ellipse>

      <ellipse cx="0" cy="-7" rx="3.2" ry="8" transform="rotate(135)"></ellipse>

      <ellipse cx="0" cy="-7" rx="3.2" ry="8" transform="rotate(180)"></ellipse>

      <ellipse cx="0" cy="-7" rx="3.2" ry="8" transform="rotate(225)"></ellipse>

      <ellipse cx="0" cy="-7" rx="3.2" ry="8" transform="rotate(270)"></ellipse>

      <ellipse cx="0" cy="-7" rx="3.2" ry="8" transform="rotate(315)"></ellipse>
    </g>

    <circle cx="0" cy="0" r="4" fill="#b8914d" stroke="#785e34" stroke-width="1.2"></circle>

    <circle cx="-1" cy="-1" r="1.2" fill="#ead49b"></circle>
  </g>

  <!-- Developing green star fruit -->
  <g transform="translate(91 72) scale(0.72)" filter="url(#softShadow)">
    <g fill="url(#youngFruit)" stroke="#536b39" stroke-width="2">

      <path d="M0 0 C5 -11 9 -15 13 -15 C14 -8 11 -3 0 0Z"></path>
      <path d="M0 0 C11 -5 17 -5 20 -2 C16 4 10 5 0 0Z"></path>
      <path d="M0 0 C12 3 16 8 16 12 C9 14 4 10 0 0Z"></path>
      <path d="M0 0 C6 10 6 16 3 19 C-3 15 -4 9 0 0Z"></path>
      <path d="M0 0 C-3 11 -8 16 -12 16 C-14 9 -10 4 0 0Z"></path>
      <path d="M0 0 C-11 6 -17 5 -20 2 C-17 -4 -11 -5 0 0Z"></path>
      <path d="M0 0 C-11 -3 -16 -8 -16 -12 C-9 -14 -4 -10 0 0Z"></path>
      <path d="M0 0 C-5 -11 -5 -16 -2 -19 C4 -16 5 -10 0 0Z"></path>
    </g>

    <circle cx="0" cy="0" r="4" fill="#687948"></circle>
  </g>

  <!-- Dried star anise fruit -->
  <g transform="translate(52 94)" filter="url(#softShadow)">

    <!-- Eight woody follicles -->
    <g fill="url(#fruitBrown)" stroke="#573126" stroke-width="1.8" stroke-linejoin="round">

      <path d="M0 0
           C3 -11 7 -17 12 -19
           C14 -12 11 -5 0 0Z"></path>

      <path d="M0 0
           C9 -8 16 -10 21 -7
           C19 0 12 4 0 0Z"></path>

      <path d="M0 0
           C12 -2 19 1 21 6
           C16 11 9 10 0 0Z"></path>

      <path d="M0 0
           C10 6 14 12 12 17
           C5 18 1 12 0 0Z"></path>

      <path d="M0 0
           C3 11 1 18 -4 21
           C-10 17 -9 10 0 0Z"></path>

      <path d="M0 0
           C-7 9 -14 13 -19 10
           C-20 3 -14 -1 0 0Z"></path>

      <path d="M0 0
           C-11 3 -18 0 -21 -5
           C-17 -11 -10 -10 0 0Z"></path>

      <path d="M0 0
           C-8 -8 -11 -15 -8 -19
           C-1 -18 3 -11 0 0Z"></path>
    </g>

    <!-- Follicle highlights -->
    <g fill="none" stroke="#d28c61" stroke-width="1.1" stroke-linecap="round" opacity="0.8">

      <path d="M3 -3 L10 -15"></path>
      <path d="M4 -1 L17 -6"></path>
      <path d="M4 2 L17 6"></path>
      <path d="M3 4 L9 14"></path>
      <path d="M-1 4 L-4 17"></path>
      <path d="M-4 3 L-16 8"></path>
      <path d="M-4 -1 L-17 -5"></path>
      <path d="M-2 -4 L-7 -16"></path>
    </g>

    <!-- Visible dark seeds -->
    <g fill="url(#seedBrown)" stroke="#251914" stroke-width="0.9">

      <ellipse cx="8" cy="-11" rx="3" ry="4.4" transform="rotate(32 8 -11)"></ellipse>

      <ellipse cx="13" cy="-3" rx="3" ry="4.3" transform="rotate(72 13 -3)"></ellipse>

      <ellipse cx="11" cy="7" rx="3" ry="4.2" transform="rotate(120 11 7)"></ellipse>

      <ellipse cx="-11" cy="6" rx="3" ry="4.2" transform="rotate(60 -11 6)"></ellipse>

      <ellipse cx="-12" cy="-5" rx="3" ry="4.2" transform="rotate(110 -12 -5)"></ellipse>
    </g>

    <circle cx="0" cy="0" r="4.2" fill="#6d3d2d" stroke="#4b2c22" stroke-width="1.2"></circle>
  </g>

  <!-- Second dried fruit for depth -->
  <g transform="translate(86 101) rotate(18) scale(0.68)" opacity="0.94" filter="url(#softShadow)">

    <g fill="url(#fruitHighlight)" stroke="#593126" stroke-width="2">

      <path d="M0 0 C3 -11 7 -16 11 -18 C14 -11 10 -5 0 0Z"></path>
      <path d="M0 0 C10 -7 16 -8 20 -5 C18 2 11 4 0 0Z"></path>
      <path d="M0 0 C11 1 17 5 18 10 C12 14 6 11 0 0Z"></path>
      <path d="M0 0 C7 8 9 15 5 19 C-1 17 -3 10 0 0Z"></path>
      <path d="M0 0 C-4 10 -9 14 -14 13 C-16 6 -11 1 0 0Z"></path>
      <path d="M0 0 C-11 4 -17 2 -19 -3 C-15 -9 -9 -8 0 0Z"></path>
      <path d="M0 0 C-8 -7 -10 -14 -7 -18 C0 -17 3 -10 0 0Z"></path>
      <path d="M0 0 C-1 -10 2 -17 7 -19 C12 -13 9 -6 0 0Z"></path>
    </g>

    <circle cx="0" cy="0" r="4" fill="#68402e"></circle>
  </g>

  <!-- Small botanical highlights -->
  <g fill="#e8d8b8" opacity="0.65">
    <circle cx="86" cy="46" r="1.2"></circle>
    <circle cx="42" cy="67" r="1.1"></circle>
    <circle cx="102" cy="65" r="1"></circle>
  </g>

</svg>