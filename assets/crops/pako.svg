<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Pako</title>

  <desc id="desc">
    Detailed botanical illustration of Philippine Pako or Vegetable Fern
    with layered mature fronds, tender curled fiddleheads, bright green
    stems, highlights, shadows and natural depth.
  </desc>

  <defs>

    <linearGradient id="stemGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8d86f"></stop>
      <stop offset="0.45" stop-color="#569b42"></stop>
      <stop offset="1" stop-color="#286532"></stop>
    </linearGradient>

    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#83ca55"></stop>
      <stop offset="0.48" stop-color="#3f9641"></stop>
      <stop offset="1" stop-color="#17602f"></stop>
    </linearGradient>

    <linearGradient id="leafDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa348"></stop>
      <stop offset="0.55" stop-color="#27783a"></stop>
      <stop offset="1" stop-color="#154f2d"></stop>
    </linearGradient>

    <linearGradient id="youngGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d0eb75"></stop>
      <stop offset="0.45" stop-color="#79bd4b"></stop>
      <stop offset="1" stop-color="#377f39"></stop>
    </linearGradient>

    <radialGradient id="curlGlow" cx="38%" cy="30%" r="70%">
      <stop offset="0" stop-color="#e5f69a"></stop>
      <stop offset="0.35" stop-color="#91ce57"></stop>
      <stop offset="1" stop-color="#347b38"></stop>
    </radialGradient>

    <filter id="fernShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.4" flood-color="#173b26" flood-opacity="0.28"></feDropShadow>
    </filter>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5"></feGaussianBlur>
    </filter>

  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="64" cy="111" rx="34" ry="7" fill="#1d442b" opacity="0.16" filter="url(#softShadow)"></ellipse>

  <g filter="url(#fernShadow)">

    <!-- left mature frond -->
    <path d="M58 108
             C53 88 45 64 31 31" fill="none" stroke="url(#stemGreen)" stroke-width="4" stroke-linecap="round"></path>

    <path d="M48 80
             C38 80 31 76 25 70
             C34 69 42 71 50 75
             Z" fill="url(#leafGreen)"></path>

    <path d="M45 72
             C34 71 27 66 21 60
             C31 60 39 63 47 67
             Z" fill="url(#leafDark)"></path>

    <path d="M42 63
             C31 62 25 57 19 51
             C30 51 37 54 44 59
             Z" fill="url(#leafGreen)"></path>

    <path d="M38 54
