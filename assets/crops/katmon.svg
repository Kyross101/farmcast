<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Katmon</title>

  <desc id="desc">
    Detailed botanical illustration of Philippine Katmon with
    a segmented round green fruit, large white flower,
    broad serrated leaves, highlights and natural depth.
  </desc>

  <defs>

    <linearGradient id="branch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9c7655"></stop>
      <stop offset="0.52" stop-color="#654936"></stop>
      <stop offset="1" stop-color="#382d27"></stop>
    </linearGradient>

    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9acb60"></stop>
      <stop offset="0.44" stop-color="#4d9349"></stop>
      <stop offset="1" stop-color="#215d39"></stop>
    </linearGradient>

    <linearGradient id="leafDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#65a653"></stop>
      <stop offset="0.5" stop-color="#347747"></stop>
      <stop offset="1" stop-color="#174830"></stop>
    </linearGradient>

    <radialGradient id="fruitGreen" cx="32%" cy="25%" r="78%">
      <stop offset="0" stop-color="#d2df83"></stop>
      <stop offset="0.38" stop-color="#9db553"></stop>
      <stop offset="0.72" stop-color="#657d3e"></stop>
      <stop offset="1" stop-color="#405532"></stop>
    </radialGradient>

    <linearGradient id="fruitSegment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c6d978"></stop>
      <stop offset="0.5" stop-color="#859d4b"></stop>
      <stop offset="1" stop-color="#536a39"></stop>
    </linearGradient>

    <linearGradient id="petalWhite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffef5"></stop>
      <stop offset="0.55" stop-color="#f1edda"></stop>
      <stop offset="1" stop-color="#d2cbb6"></stop>
    </linearGradient>

    <radialGradient id="flowerCenter" cx="45%" cy="38%" r="70%">
      <stop offset="0" stop-color="#d6423f"></stop>
      <stop offset="0.55" stop-color="#a92632"></stop>
      <stop offset="1" stop-color="#6d1e2a"></stop>
    </radialGradient>

    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#1f3528" flood-opacity="0.30"></feDropShadow>
    </filter>

    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5"></feGaussianBlur>
    </filter>

  </defs>

  <!-- ground depth -->
  <ellipse cx="65" cy="111" rx="37" ry="7" fill="#1e3929" opacity="0.15" filter="url(#blur)"></ellipse>

  <g filter="url(#shadow)">

    <!-- main branch -->
    <path d="M30 106
             C41 87 52 68 64 52
             C75 38 87 29 101 24" fill="none" stroke="url(#branch)" stroke-width="6" stroke-linecap="round"></path>

    <!-- secondary branch -->
    <path d="M57 64
             C47 50 37 41 24 35" fill="none" stroke="url(#branch)" stroke-width="4" stroke-linecap="round"></path>

    <!-- upper left leaf -->
    <path d="M52 55
             C36 52 24 43 18 30
             C33 28 47 34 57 45
             C56 49 54 52 52 55Z" fill="url(#leafGreen)"></path>

    <!-- serrated edge hints -->
    <path d="M20 31
             L24 34
             L25 30
             L29 35
             L31 31
             L35 37
             L38 34
             L42 40" fill="none" stroke="#5a9148" stroke-width="1.2" stroke-linecap="round" opacity="0.7"></path>

    <!-- leaf vein -->
    <path d="M52 51
             C42 43 31 36 21 32" fill="none" stroke="#d6e8aa" stroke-width="1.4" stroke-linecap="round" opacity="0.5"></path>

    <path d="M42 44 L33 44" stroke="#c9df9d" stroke-width="1" opacity="0.42"></path>

    <path d="M37 40 L31 35" stroke="#c9df9d" stroke-width="1" opacity="0.42"></path>

    <!-- lower left leaf -->
    <path d="M52 75
             C37 77 25 72 18 63
             C31 59 45 62 56 69
             C56 72 54 74 52 75Z" fill="url(#leafDark)"></path>

    <path d="M51 72
             C40 68 30 65 21 64" fill="none" stroke="#cce2a0" stroke-width="1.3" stroke-linecap="round" opacity="0.46"></path>

    <!-- upper right leaf -->
    <path d="M74 52
             C84 39 97 33 111 34
             C105 47 95 56 81 61
             C78 59 76 56 74 52Z" fill="url(#leafDark)"></path>

    <path d="M80 56
             C90 49 99 42 107 37" fill="none" stroke="#d2e6a6" stroke-width="1.3" stroke-linecap="round" opacity="0.46"></path>

    <!-- right lower leaf -->
    <path d="M86 72
             C99 66 110 68 117 75
             C108 82 97 84 85 80
             C83 77 84 74 86 72Z" fill="url(#leafGreen)"></path>

    <path d="M89 77
             C99 74 108 73 113 75" fill="none" stroke="#d8eab0" stroke-width="1.2" stroke-linecap="round" opacity="0.43"></path>

    <!-- flower stem -->
    <path d="M64 55
             C67 47 71 41 77 37" fill="none" stroke="#58743c" stroke-width="3" stroke-linecap="round"></path>

    <!-- large katmon flower petals -->
    <ellipse cx="77" cy="29" rx="8" ry="13" transform="rotate(-5 77 29)" fill="url(#petalWhite)"></ellipse>

    <ellipse cx="89" cy="35" rx="8" ry="13" transform="rotate(54 89 35)" fill="url(#petalWhite)"></ellipse>

    <ellipse cx="87" cy="48" rx="8" ry="13" transform="rotate(112 87 48)" fill="url(#petalWhite)"></ellipse>

    <ellipse cx="72" cy="49" rx="8" ry="13" transform="rotate(-112 72 49)" fill="url(#petalWhite)"></ellipse>

    <ellipse cx="65" cy="36" rx="8" ry="13" transform="rotate(-55 65 36)" fill="url(#petalWhite)"></ellipse>

    <!-- red flower center -->
    <circle cx="77" cy="39" r="7" fill="url(#flowerCenter)"></circle>

    <!-- stamens -->
    <g stroke="#f0c66c" stroke-width="1.2" stroke-linecap="round">
      <path d="M77 39 L77 29"></path>
      <path d="M77 39 L83 30"></path>
      <path d="M77 39 L88 34"></path>
      <path d="M77 39 L88 41"></path>
      <path d="M77 39 L84 48"></path>
      <path d="M77 39 L77 50"></path>
      <path d="M77 39 L70 48"></path>
      <path d="M77 39 L66 43"></path>
      <path d="M77 39 L66 35"></path>
      <path d="M77 39 L71 30"></path>
    </g>

    <g fill="#f5d485">
      <circle cx="77" cy="29" r="1.2"></circle>
      <circle cx="83" cy="30" r="1.2"></circle>
      <circle cx="88" cy="34" r="1.2"></circle>
      <circle cx="88" cy="41" r="1.2"></circle>
      <circle cx="84" cy="48" r="1.2"></circle>
      <circle cx="77" cy="50" r="1.2"></circle>
      <circle cx="70" cy="48" r="1.2"></circle>
      <circle cx="66" cy="43" r="1.2"></circle>
      <circle cx="66" cy="35" r="1.2"></circle>
      <circle cx="71" cy="30" r="1.2"></circle>
    </g>

    <!-- fruit stalk -->
    <path d="M63 59
             C62 68 63 75 66 81" fill="none" stroke="#5f743c" stroke-width="4" stroke-linecap="round"></path>

    <!-- Katmon fruit base -->
    <circle cx="69" cy="91" r="22" fill="url(#fruitGreen)"></circle>

    <!-- segmented fleshy sepals -->
    <path d="M69 70
             C62 77 59 85 60 92
             C61 101 65 108 69 112
             C73 106 77 99 78 91
             C79 83 75 76 69 70Z" fill="url(#fruitSegment)" opacity="0.78"></path>

    <path d="M51 79
             C58 81 64 86 69 91
             C64 97 59 102 54 103
             C49 96 47 87 51 79Z" fill="#819849" opacity="0.56"></path>

    <path d="M87 79
             C80 81 74 86 69 91
             C74 97 79 102 84 103
             C89 96 91 87 87 79Z" fill="#627a3e" opacity="0.54"></path>

    <!-- fruit segment seams -->
    <g fill="none" stroke="#4e6335" stroke-width="1.4" stroke-linecap="round" opacity="0.7">
      <path d="M69 70
               C65 78 63 84 63 91
               C63 100 66 107 69 112"></path>
      <path d="M69 70
               C73 78 75 84 75 91
               C75 100 72 107 69 112"></path>
      <path d="M52 79
               C59 84 64 87 69 91"></path>
      <path d="M86 79
               C79 84 74 87 69 91"></path>
      <path d="M49 91
               C57 91 63 91 69 91"></path>
      <path d="M89 91
               C81 91 75 91 69 91"></path>
    </g>

    <!-- fruit top -->
    <path d="M61 73
             C64 68 67 66 69 65
             C72 67 75 69 77 73" fill="none" stroke="#526c38" stroke-width="3" stroke-linecap="round"></path>

  </g>

  <!-- fruit highlight -->
  <path d="M55 82
           C58 76 63 73 67 73" fill="none" stroke="#edf4b5" stroke-width="2.1" stroke-linecap="round" opacity="0.66"></path>

  <ellipse cx="57" cy="86" rx="3" ry="6" transform="rotate(-25 57 86)" fill="#f1f5bd" opacity="0.18"></ellipse>

  <!-- flower highlights -->
  <path d="M72 20
           C75 18 79 18 82 20" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.75"></path>

  <!-- fine branch highlight -->
  <path d="M33 102
           C44 84 54 68 65 53" fill="none" stroke="#c59973" stroke-width="1.4" stroke-linecap="round" opacity="0.48"></path>

</svg>