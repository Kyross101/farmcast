<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Corn Salad</title>

  <desc id="desc">
    Detailed botanical illustration of corn salad, also called lamb's lettuce or mache,
    with a low rosette of spoon-shaped green leaves, slender branching stems,
    clusters of tiny pale blue-white flowers, and small mature fruits.
  </desc>

  <defs>
    <linearGradient id="outerLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4dc9b"></stop>
      <stop offset="0.5" stop-color="#7ba966"></stop>
      <stop offset="1" stop-color="#3f724c"></stop>
    </linearGradient>

    <linearGradient id="innerLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9e7b5"></stop>
      <stop offset="1" stop-color="#6e9c5c"></stop>
    </linearGradient>

    <linearGradient id="stemGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9c481"></stop>
      <stop offset="1" stop-color="#56774d"></stop>
    </linearGradient>

    <radialGradient id="flowerPale" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"></stop>
      <stop offset="0.55" stop-color="#dce9ee"></stop>
      <stop offset="1" stop-color="#9cbac4"></stop>
    </radialGradient>

    <linearGradient id="fruitTan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bba477"></stop>
      <stop offset="1" stop-color="#76684e"></stop>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#283128" flood-opacity="0.2"></feDropShadow>
    </filter>
  </defs>

  <ellipse cx="64" cy="119" rx="45" ry="5" fill="#4e5149" opacity="0.15"></ellipse>

  <!-- Basal rosette petioles -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round">

    <path d="M64 107 C55 100 45 94 33 91" stroke-width="2.5"></path>
    <path d="M63 108 C50 105 39 104 26 105" stroke-width="2.2"></path>
    <path d="M64 107 C73 100 83 94 95 91" stroke-width="2.5"></path>
    <path d="M65 108 C78 105 89 104 102 105" stroke-width="2.2"></path>

    <path d="M64 105 C57 94 53 84 52 73" stroke-width="2.3"></path>
    <path d="M64 105 C71 94 75 84 76 73" stroke-width="2.3"></path>
  </g>

  <!-- Spoon-shaped outer leaves -->
  <g filter="url(#softShadow)">

    <path d="M56 104
         C47 104 38 101 31 96
         C24 91 20 85 21 79
         C22 73 27 69 33 70
         C40 71 46 77 50 84
         C54 91 56 98 56 104Z" fill="url(#outerLeaf)" stroke="#345f40" stroke-width="1.6"></path>

    <path d="M72 104
         C81 104 90 101 97 96
         C104 91 108 85 107 79
         C106 73 101 69 95 70
         C88 71 82 77 78 84
         C74 91 72 98 72 104Z" fill="url(#outerLeaf)" stroke="#345f40" stroke-width="1.6"></path>

    <path d="M52 103
         C43 107 34 109 27 108
         C20 107 15 103 14 98
         C14 92 19 88 25 87
         C32 86 41 91 47 96
         C50 98 52 101 52 103Z" fill="url(#outerLeaf)" stroke="#345f40" stroke-width="1.5"></path>

    <path d="M76 103
         C85 107 94 109 101 108
         C108 107 113 103 114 98
         C114 92 109 88 103 87
         C96 86 87 91 81 96
         C78 98 76 101 76 103Z" fill="url(#outerLeaf)" stroke="#345f40" stroke-width="1.5"></path>
  </g>

  <!-- Upright inner rosette leaves -->
  <g filter="url(#softShadow)">

    <path d="M60 101
         C54 95 50 87 49 80
         C48 73 51 67 56 65
         C61 68 64 75 64 82
         C64 90 63 97 60 101Z" fill="url(#innerLeaf)" stroke="#426846" stroke-width="1.45"></path>

    <path d="M68 101
         C74 95 78 87 79 80
         C80 73 77 67 72 65
         C67 68 64 75 64 82
         C64 90 65 97 68 101Z" fill="url(#innerLeaf)" stroke="#426846" stroke-width="1.45"></path>

    <path d="M63 99
         C58 92 57 84 59 77
         C60 72 62 68 64 65
         C67 69 69 74 69 80
         C69 88 67 95 63 99Z" fill="#d0e1a7" stroke="#607b4d" stroke-width="1.3"></path>
  </g>

  <!-- Leaf midribs -->
  <g fill="none" stroke="#d9e7c2" stroke-linecap="round" opacity="0.78">

    <path d="M53 101 C46 92 37 83 27 76" stroke-width="0.9"></path>
    <path d="M75 101 C82 92 91 83 101 76" stroke-width="0.9"></path>
    <path d="M49 102 C39 99 28 96 18 97" stroke-width="0.8"></path>
    <path d="M79 102 C89 99 100 96 110 97" stroke-width="0.8"></path>
    <path d="M60 98 C57 89 55 79 56 69" stroke-width="0.75"></path>
    <path d="M68 98 C71 89 73 79 72 69" stroke-width="0.75"></path>
  </g>

  <!-- Flowering stem -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round">

    <path d="M64 82
         C64 67 64 54 63 43
         C62 32 61 23 59 14" stroke-width="2.8"></path>

    <path d="M63 55 C54 49 48 43 44 36" stroke-width="1.5"></path>
    <path d="M63 50 C72 45 80 39 85 32" stroke-width="1.5"></path>
    <path d="M61 37 C54 33 50 28 47 23" stroke-width="1.15"></path>
    <path d="M64 36 C72 31 78 26 82 20" stroke-width="1.15"></path>
  </g>

  <!-- Small stem leaves -->
  <g fill="url(#innerLeaf)" stroke="#496f48" stroke-width="0.9">

    <path d="M58 58 C52 57 47 53 46 48 C52 47 57 50 60 54Z"></path>
    <path d="M68 52 C74 49 80 51 83 55 C78 58 73 57 68 55Z"></path>
    <path d="M57 39 C52 37 49 34 49 30 C54 29 58 32 60 36Z"></path>
  </g>

  <!-- Flower clusters -->
  <g filter="url(#softShadow)">

    <g transform="translate(44 34)">
      <circle cx="0" cy="0" r="1.4" fill="#d6c982"></circle>

      <g fill="url(#flowerPale)" stroke="#7d9ca6" stroke-width="0.45">
        <ellipse cx="0" cy="-3.3" rx="1.8" ry="3"></ellipse>
        <ellipse cx="3.1" cy="-1" rx="2.7" ry="1.6" transform="rotate(25 3.1 -1)"></ellipse>
        <ellipse cx="2" cy="2.7" rx="1.7" ry="2.8" transform="rotate(-35 2 2.7)"></ellipse>
        <ellipse cx="-2" cy="2.7" rx="1.7" ry="2.8" transform="rotate(35 -2 2.7)"></ellipse>
        <ellipse cx="-3.1" cy="-1" rx="2.7" ry="1.6" transform="rotate(-25 -3.1 -1)"></ellipse>
      </g>
    </g>

    <g transform="translate(47 21)">
      <circle cx="0" cy="0" r="1.2" fill="#d6c982"></circle>

      <g fill="url(#flowerPale)" stroke="#7d9ca6" stroke-width="0.4">
        <ellipse cx="0" cy="-2.8" rx="1.5" ry="2.5"></ellipse>
        <ellipse cx="2.6" cy="-0.8" rx="2.3" ry="1.4"></ellipse>
        <ellipse cx="1.7" cy="2.2" rx="1.4" ry="2.3"></ellipse>
        <ellipse cx="-1.7" cy="2.2" rx="1.4" ry="2.3"></ellipse>
        <ellipse cx="-2.6" cy="-0.8" rx="2.3" ry="1.4"></ellipse>
      </g>
    </g>

    <g transform="translate(84 30)">
      <circle cx="0" cy="0" r="1.3" fill="#d6c982"></circle>

      <g fill="url(#flowerPale)" stroke="#7d9ca6" stroke-width="0.42">
        <ellipse cx="0" cy="-3" rx="1.6" ry="2.7"></ellipse>
        <ellipse cx="2.8" cy="-0.9" rx="2.5" ry="1.5"></ellipse>
        <ellipse cx="1.8" cy="2.4" rx="1.5" ry="2.5"></ellipse>
        <ellipse cx="-1.8" cy="2.4" rx="1.5" ry="2.5"></ellipse>
        <ellipse cx="-2.8" cy="-0.9" rx="2.5" ry="1.5"></ellipse>
      </g>
    </g>

    <g transform="translate(82 18)">
      <circle cx="0" cy="0" r="1.15" fill="#d6c982"></circle>

      <g fill="url(#flowerPale)" stroke="#7d9ca6" stroke-width="0.4">
        <ellipse cx="0" cy="-2.7" rx="1.45" ry="2.4"></ellipse>
        <ellipse cx="2.4" cy="-0.7" rx="2.2" ry="1.3"></ellipse>
        <ellipse cx="1.5" cy="2" rx="1.3" ry="2.1"></ellipse>
        <ellipse cx="-1.5" cy="2" rx="1.3" ry="2.1"></ellipse>
        <ellipse cx="-2.4" cy="-0.7" rx="2.2" ry="1.3"></ellipse>
      </g>
    </g>
  </g>

  <!-- Tiny mature fruits -->
  <g fill="url(#fruitTan)" stroke="#5f5745" stroke-width="0.55">

    <ellipse cx="92" cy="44" rx="2.6" ry="2.1" transform="rotate(20 92 44)"></ellipse>

    <ellipse cx="98" cy="49" rx="2.4" ry="2" transform="rotate(-12 98 49)"></ellipse>

    <ellipse cx="37" cy="48" rx="2.5" ry="2" transform="rotate(-18 37 48)"></ellipse>
  </g>

  <!-- Root crown -->
  <path d="M49 107
       C54 103 59 101 64 101
       C70 101 76 103 80 107
       C76 112 70 115 64 115
       C58 115 53 112 49 107Z" fill="#79634d" stroke="#51433a" stroke-width="1.3"></path>

  <g fill="none" stroke="#6d5848" stroke-linecap="round">

    <path d="M56 111 C54 116 52 120 49 123" stroke-width="1.25"></path>
    <path d="M63 112 C62 117 62 121 61 124" stroke-width="1.15"></path>
    <path d="M70 111 C72 116 74 120 77 123" stroke-width="1.15"></path>
  </g>

</svg>