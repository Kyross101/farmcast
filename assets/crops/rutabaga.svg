<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Rutabaga</title>

  <desc id="desc">
    Detailed botanical illustration of rutabaga with a rounded
    purple-and-cream edible root, blue-green brassica leaves,
    fine roots, highlights, shadows, and natural depth.
  </desc>

  <defs>

    <linearGradient id="rootCream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e4ad"></stop>
      <stop offset="0.55" stop-color="#d8bd79"></stop>
      <stop offset="1" stop-color="#a98754"></stop>
    </linearGradient>

    <linearGradient id="rootPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9973a3"></stop>
      <stop offset="0.5" stop-color="#704f7f"></stop>
      <stop offset="1" stop-color="#4a395b"></stop>
    </linearGradient>

    <linearGradient id="leafGreen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#355c4b"></stop>
      <stop offset="0.5" stop-color="#5f8166"></stop>
      <stop offset="1" stop-color="#9bb28a"></stop>
    </linearGradient>

    <linearGradient id="leafDark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#29493e"></stop>
      <stop offset="1" stop-color="#789578"></stop>
    </linearGradient>

    <linearGradient id="stemGreen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#556e54"></stop>
      <stop offset="1" stop-color="#9eb38a"></stop>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#27322b" flood-opacity="0.25"></feDropShadow>
    </filter>

  </defs>

  <!-- Ground shadow -->
  <ellipse cx="64" cy="116" rx="34" ry="6" fill="#35372f" opacity="0.17"></ellipse>

  <!-- Fine taproot -->
  <path d="
    M64 102
    C64 110 63 117 60 124" fill="none" stroke="#8d704d" stroke-width="2" stroke-linecap="round"></path>

  <!-- Side roots -->
  <g fill="none" stroke="#977a58" stroke-width="1.1" stroke-linecap="round">

    <path d="M48 96 C39 102 34 108 31 114"></path>
    <path d="M52 104 C46 110 44 116 43 121"></path>

    <path d="M80 96 C89 102 94 108 97 114"></path>
    <path d="M76 104 C82 110 84 116 85 121"></path>

  </g>

  <!-- Main swollen root -->
  <path d="
    M37 65
    C38 52 48 45 64 44
    C81 45 91 53 92 66

    C93 80 86 94 75 103
    C69 108 59 108 52 103

    C41 94 35 80 37 65Z" fill="url(#rootCream)" stroke="#846d51" stroke-width="2" filter="url(#softShadow)"></path>

  <!-- Purple upper shoulder -->
  <path d="
    M38 67
    C38 53 48 45 64 44
    C81 45 91 53 92 67

    C83 63 74 61 64 61
    C54 61 45 63 38 67Z" fill="url(#rootPurple)" stroke="#594363" stroke-width="1.5"></path>

  <!-- Cream side shading -->
  <path d="
    M83 68
    C86 81 81 93 72 101
    C69 104 66 106 63 106

    C73 95 77 82 76 65Z" fill="#a98d5e" opacity="0.35"></path>

  <!-- Root highlight -->
  <path d="
    M47 70
    C45 80 49 90 55 98" fill="none" stroke="#fff0c1" stroke-width="2.4" stroke-linecap="round" opacity="0.72"></path>

  <!-- Purple shoulder highlight -->
  <path d="
    M47 56
    C54 50 64 49 72 52" fill="none" stroke="#b895bd" stroke-width="2" stroke-linecap="round" opacity="0.7"></path>

  <!-- Root surface lines -->
  <g fill="none" stroke="#a58b61" stroke-width="0.8" stroke-linecap="round" opacity="0.62">

    <path d="M41 77 C51 79 76 79 88 76"></path>
    <path d="M45 87 C55 89 72 89 83 86"></path>
    <path d="M51 97 C59 99 70 98 76 95"></path>

  </g>

  <!-- Leaf stems -->
  <g fill="none" stroke="url(#stemGreen)" stroke-width="3.4" stroke-linecap="round">

    <path d="M55 50 C48 39 42 28 34 18"></path>
    <path d="M61 48 C58 35 57 23 58 10"></path>
    <path d="M66 48 C70 35 75 24 82 13"></path>
    <path d="M72 50 C83 42 92 34 100 25"></path>

    <path d="M50 54 C39 51 29 47 20 41"></path>
    <path d="M77 55 C89 53 99 49 108 43"></path>

  </g>

  <!-- Left large brassica leaf -->
  <path d="
    M34 19
    C24 11 15 14 13 22
    C18 27 24 29 30 28

    C23 33 22 39 27 44
    C33 43 38 39 40 34

    C42 40 48 42 53 39
    C52 31 45 23 34 19Z" fill="url(#leafGreen)" stroke="#294d3d" stroke-width="1.3" filter="url(#softShadow)"></path>

  <!-- Central leaf -->
  <path d="
    M58 11
    C49 4 41 7 39 15
    C44 20 50 22 55 20

    C51 27 53 33 59 36
    C65 32 67 26 64 20

    C70 22 76 19 78 14
    C72 8 65 7 58 11Z" fill="url(#leafDark)" stroke="#284a3b" stroke-width="1.3" filter="url(#softShadow)"></path>

  <!-- Right large leaf -->
  <path d="
    M82 14
    C87 5 96 4 102 10
    C101 16 97 21 91 23

    C98 24 102 29 101 35
    C95 38 89 37 85 33

    C84 40 79 44 73 43
    C69 35 73 23 82 14Z" fill="url(#leafGreen)" stroke="#294d3d" stroke-width="1.3" filter="url(#softShadow)"></path>

  <!-- Outer left leaf -->
  <path d="
    M21 41
    C11 34 4 38 5 46
    C11 51 18 52 24 49

    C19 55 21 61 27 63
    C33 58 32 50 28 45Z" fill="url(#leafDark)" stroke="#294d3d" stroke-width="1.1" filter="url(#softShadow)"></path>

  <!-- Outer right leaf -->
  <path d="
    M107 43
    C117 35 124 39 123 47
    C117 52 111 53 104 50

    C109 56 107 62 101 64
    C95 59 96 51 100 46Z" fill="url(#leafDark)" stroke="#294d3d" stroke-width="1.1" filter="url(#softShadow)"></path>

  <!-- Leaf veins -->
  <g fill="none" stroke="#bdcbaa" stroke-width="0.9" stroke-linecap="round" opacity="0.7">

    <path d="M35 20 C36 27 40 33 48 38"></path>
    <path d="M58 12 C58 20 59 27 60 34"></path>
    <path d="M82 15 C79 23 77 31 75 40"></path>

    <path d="M9 45 C15 45 21 46 26 47"></path>
    <path d="M119 46 C113 47 108 47 102 48"></path>

  </g>

  <!-- Root crown -->
  <path d="
    M47 54
    C53 49 75 49 82 54" fill="none" stroke="#c0a7c5" stroke-width="2" stroke-linecap="round" opacity="0.7"></path>

  <!-- Tiny root scars -->
  <g fill="#826b50" opacity="0.65">

    <circle cx="45" cy="82" r="1"></circle>
    <circle cx="84" cy="74" r="1"></circle>
    <circle cx="53" cy="94" r="0.9"></circle>
    <circle cx="77" cy="91" r="0.9"></circle>

  </g>

</svg>