<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Garden Cress</title>

  <desc id="desc">
    Detailed botanical illustration of garden cress with finely divided green leaves,
    slender branching stems, small white flowers, flat seed pods,
    and reddish-brown seeds.
  </desc>

  <defs>

    <linearGradient id="stemGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9dbf78"></stop>
      <stop offset="0.55" stop-color="#6c9558"></stop>
      <stop offset="1" stop-color="#426c48"></stop>
    </linearGradient>

    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b7d58d"></stop>
      <stop offset="0.5" stop-color="#73a45e"></stop>
      <stop offset="1" stop-color="#3f7148"></stop>
    </linearGradient>

    <linearGradient id="leafLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d0e4ac"></stop>
      <stop offset="1" stop-color="#6e9d59"></stop>
    </linearGradient>

    <linearGradient id="podGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9c68a"></stop>
      <stop offset="1" stop-color="#6f8050"></stop>
    </linearGradient>

    <linearGradient id="flowerWhite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffef5"></stop>
      <stop offset="1" stop-color="#e5e8d8"></stop>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">

      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#273128" flood-opacity="0.2"></feDropShadow>

    </filter>

  </defs>

  <ellipse cx="64" cy="119" rx="44" ry="5" fill="#4d5149" opacity="0.15"></ellipse>

  <!-- Main stems -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round">

    <path d="M63 109
         C63 91 63 73 63 56
         C63 40 62 27 60 15" stroke-width="4"></path>

    <path d="M55 108
         C54 93 50 80 45 68
         C41 58 37 50 32 43" stroke-width="2.5"></path>

    <path d="M72 108
         C74 93 78 81 83 69
         C87 58 92 50 98 43" stroke-width="2.5"></path>

    <path d="M61 72
         C54 64 48 58 41 53" stroke-width="1.9"></path>

    <path d="M65 71
         C74 64 81 57 88 52" stroke-width="1.9"></path>

  </g>

  <!-- Stem highlights -->
  <g fill="none" stroke="#c5d9a7" stroke-linecap="round" opacity="0.6">

    <path d="M65 104
         C65 84 65 65 64 46" stroke-width="0.85"></path>

    <path d="M57 104
         C56 90 53 77 49 66" stroke-width="0.7"></path>

  </g>

  <!-- Finely divided leaves -->
  <g filter="url(#softShadow)">

    <path d="M57 98
         C49 95 42 90 36 84
         C32 80 29 75 27 70
         C33 73 38 74 43 73
         C39 68 37 63 38 58
         C44 62 50 67 54 73
         C58 80 59 89 57 98Z" fill="url(#leafGreen)" stroke="#355f3f" stroke-width="1.5"></path>

    <path d="M71 98
         C79 95 86 90 92 84
         C96 80 99 75 101 70
         C95 73 90 74 85 73
         C89 68 91 63 90 58
         C84 62 78 67 74 73
         C70 80 69 89 71 98Z" fill="url(#leafGreen)" stroke="#355f3f" stroke-width="1.5"></path>

    <path d="M58 80
         C51 77 45 73 40 68
         C37 64 35 60 35 56
         C40 59 44 60 48 59
         C45 55 44 51 45 47
         C50 51 55 55 58 60
         C61 66 62 73 58 80Z" fill="url(#leafLight)" stroke="#355f3f" stroke-width="1.4"></path>

    <path d="M70 80
         C77 77 83 73 88 68
         C91 64 93 60 93 56
         C88 59 84 60 80 59
         C83 55 84 51 83 47
         C78 51 73 55 70 60
         C67 66 66 73 70 80Z" fill="url(#leafLight)" stroke="#355f3f" stroke-width="1.4"></path>

    <path d="M60 63
         C54 60 49 56 45 52
         C42 49 41 45 41 42
         C45 44 49 45 52 44
         C50 41 49 38 50 35
         C54 38 58 42 61 46
         C63 51 64 57 60 63Z" fill="url(#leafGreen)" stroke="#355f3f" stroke-width="1.3"></path>

    <path d="M68 63
         C74 60 79 56 83 52
         C86 49 87 45 87 42
         C83 44 79 45 76 44
         C78 41 79 38 78 35
         C74 38 70 42 67 46
         C65 51 64 57 68 63Z" fill="url(#leafGreen)" stroke="#355f3f" stroke-width="1.3"></path>

  </g>

  <!-- Leaf veins -->
  <g fill="none" stroke="#d5e5c0" stroke-linecap="round" opacity="0.75">

    <path d="M56 95 C49 87 41 80 33 73" stroke-width="0.9"></path>
    <path d="M72 95 C79 87 87 80 95 73" stroke-width="0.9"></path>

    <path d="M58 77 C52 70 47 64 41 58" stroke-width="0.8"></path>
    <path d="M70 77 C76 70 81 64 87 58" stroke-width="0.8"></path>

  </g>

  <!-- Flowering branches -->
  <g fill="none" stroke="#708255" stroke-width="1.2" stroke-linecap="round">

    <path d="M62 49 L52 39"></path>
    <path d="M61 43 L63 32"></path>
    <path d="M63 45 L74 37"></path>
    <path d="M52 39 L45 33"></path>
    <path d="M63 32 L59 24"></path>
    <path d="M74 37 L81 30"></path>

  </g>

  <!-- Small four-petaled flowers -->
  <g filter="url(#softShadow)">

    <g transform="translate(45 32)">

      <ellipse cx="0" cy="-3.4" rx="2.1" ry="3.3" fill="url(#flowerWhite)" stroke="#a8ad9d" stroke-width="0.55"></ellipse>

      <ellipse cx="3.4" cy="0" rx="3.3" ry="2.1" fill="url(#flowerWhite)" stroke="#a8ad9d" stroke-width="0.55"></ellipse>

      <ellipse cx="0" cy="3.4" rx="2.1" ry="3.3" fill="url(#flowerWhite)" stroke="#a8ad9d" stroke-width="0.55"></ellipse>

      <ellipse cx="-3.4" cy="0" rx="3.3" ry="2.1" fill="url(#flowerWhite)" stroke="#a8ad9d" stroke-width="0.55"></ellipse>

      <circle cx="0" cy="0" r="1.3" fill="#d8bd64"></circle>

    </g>

    <g transform="translate(59 23)">

      <ellipse cx="0" cy="-3" rx="1.9" ry="3" fill="url(#flowerWhite)" stroke="#a8ad9d" stroke-width="0.5"></ellipse>

      <ellipse cx="3" cy="0" rx="3" ry="1.9" fill="url(#flowerWhite)" stroke="#a8ad9d" stroke-width="0.5"></ellipse>

      <ellipse cx="0" cy="3" rx="1.9" ry="3" fill="url(#flowerWhite)" stroke="#a8ad9d" stroke-width="0.5"></ellipse>

      <ellipse cx="-3" cy="0" rx="3" ry="1.9" fill="url(#flowerWhite)" stroke="#a8ad9d" stroke-width="0.5"></ellipse>

      <circle cx="0" cy="0" r="1.2" fill="#d8bd64"></circle>

    </g>

    <g transform="translate(82 29)">

      <ellipse cx="0" cy="-3.2" rx="2" ry="3.2" fill="url(#flowerWhite)" stroke="#a8ad9d" stroke-width="0.5"></ellipse>

      <ellipse cx="3.2" cy="0" rx="3.2" ry="2" fill="url(#flowerWhite)" stroke="#a8ad9d" stroke-width="0.5"></ellipse>

      <ellipse cx="0" cy="3.2" rx="2" ry="3.2" fill="url(#flowerWhite)" stroke="#a8ad9d" stroke-width="0.5"></ellipse>

      <ellipse cx="-3.2" cy="0" rx="3.2" ry="2" fill="url(#flowerWhite)" stroke="#a8ad9d" stroke-width="0.5"></ellipse>

      <circle cx="0" cy="0" r="1.2" fill="#d8bd64"></circle>

    </g>

  </g>

  <!-- Fruiting branch -->
  <path d="M83 69
       C91 61 97 54 101 46" fill="none" stroke="#708255" stroke-width="1.5" stroke-linecap="round"></path>

  <!-- Flat seed pods -->
  <g fill="url(#podGreen)" stroke="#5d6e49" stroke-width="0.9" filter="url(#softShadow)">

    <path d="M95 58
         C91 55 91 50 95 47
         C99 48 101 52 99 56
         C98 58 97 59 95 58Z"></path>

    <path d="M103 49
         C99 46 99 41 103 38
         C107 39 109 43 107 47
         C106 49 105 50 103 49Z"></path>

    <path d="M90 66
         C86 63 86 59 89 56
         C93 57 95 61 93 64
         C92 66 91 67 90 66Z"></path>

  </g>

  <!-- Pod seams -->
  <g fill="none" stroke="#7f8e64" stroke-width="0.55" opacity="0.9">

    <path d="M95 48 L96 58"></path>
    <path d="M103 39 L104 49"></path>
    <path d="M89 57 L90 66"></path>

  </g>

  <!-- Reddish-brown seeds -->
  <g fill="#8d624e" stroke="#5f473b" stroke-width="0.35">

    <ellipse cx="97" cy="108" rx="2.3" ry="1.6" transform="rotate(18 97 108)"></ellipse>

    <ellipse cx="105" cy="113" rx="2.2" ry="1.5" transform="rotate(-16 105 113)"></ellipse>

    <ellipse cx="89" cy="114" rx="2.1" ry="1.5" transform="rotate(28 89 114)"></ellipse>

    <ellipse cx="99" cy="118" rx="2.1" ry="1.45" transform="rotate(-8 99 118)"></ellipse>

  </g>

  <!-- Basal crown -->
  <path d="M49 107
       C54 103 59 101 64 101
       C70 101 76 103 80 107
       C76 112 70 115 64 115
       C58 115 53 112 49 107Z" fill="#77604b" stroke="#514238" stroke-width="1.3"></path>

  <g fill="none" stroke="#6d5747" stroke-linecap="round">

    <path d="M56 111 C54 116 52 120 49 123" stroke-width="1.3"></path>
    <path d="M63 112 C62 117 62 121 61 124" stroke-width="1.2"></path>
    <path d="M70 111 C72 116 74 120 77 123" stroke-width="1.2"></path>

  </g>

</svg>