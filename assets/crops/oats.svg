<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Oats</title>

  <desc id="desc">
    An oat plant with narrow green leaves,
    a tall stem, and a loose branching grain panicle.
  </desc>

  <!-- Main stalk -->
  <path d="M63 116
       C63 92 63 71 64 51
       C64 36 64 24 65 12" fill="none" stroke="#6e914d" stroke-width="6" stroke-linecap="round">
  </path>

  <!-- Leaves -->
  <path d="M61 82
       C47 69 33 64 18 65
       C32 74 46 84 62 91Z" fill="#72a456" stroke="#4e7c42" stroke-width="2">
  </path>

  <path d="M66 69
       C81 57 96 52 111 54
       C96 63 82 74 66 80Z" fill="#79aa59" stroke="#4e7c42" stroke-width="2">
  </path>

  <path d="M61 99
       C48 90 36 87 24 90
       C37 96 49 103 62 108Z" fill="#65984c" stroke="#4e7c42" stroke-width="2">
  </path>

  <!-- Panicle branches -->
  <path d="M65 20 C54 19 45 14 38 8" fill="none" stroke="#8b7749" stroke-width="2.5" stroke-linecap="round">
  </path>

  <path d="M65 25 C78 22 88 16 96 9" fill="none" stroke="#8b7749" stroke-width="2.5" stroke-linecap="round">
  </path>

  <path d="M65 31 C53 31 44 27 36 22" fill="none" stroke="#8b7749" stroke-width="2.5" stroke-linecap="round">
  </path>

  <path d="M65 36 C78 34 89 29 99 23" fill="none" stroke="#8b7749" stroke-width="2.5" stroke-linecap="round">
  </path>

  <path d="M64 42 C54 42 47 39 40 35" fill="none" stroke="#8b7749" stroke-width="2.5" stroke-linecap="round">
  </path>

  <!-- Hanging oat grains -->
  <ellipse cx="36" cy="8" rx="3.5" ry="7" transform="rotate(-30 36 8)" fill="#d7aa53">
  </ellipse>

  <ellipse cx="98" cy="9" rx="3.5" ry="7" transform="rotate(30 98 9)" fill="#e0b45c">
  </ellipse>

  <ellipse cx="34" cy="22" rx="3.5" ry="7" transform="rotate(-28 34 22)" fill="#cfa04c">
  </ellipse>

  <ellipse cx="101" cy="23" rx="3.5" ry="7" transform="rotate(28 101 23)" fill="#ddb057">
  </ellipse>

  <ellipse cx="39" cy="35" rx="3.5" ry="7" transform="rotate(-25 39 35)" fill="#d5a64f">
  </ellipse>

  <!-- Small branch grains -->
  <ellipse cx="47" cy="14" rx="3" ry="6" transform="rotate(-20 47 14)" fill="#e3b65e">
  </ellipse>

  <ellipse cx="87" cy="16" rx="3" ry="6" transform="rotate(20 87 16)" fill="#d6a44d">
  </ellipse>

  <ellipse cx="47" cy="28" rx="3" ry="6" transform="rotate(-18 47 28)" fill="#ddb055">
  </ellipse>

  <ellipse cx="89" cy="29" rx="3" ry="6" transform="rotate(18 89 29)" fill="#e0b159">
  </ellipse>

  <!-- Ground -->
  <ellipse cx="64" cy="117" rx="30" ry="5" fill="#81664a" opacity="0.4">
  </ellipse>

</svg>