<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Spinach</title>

  <desc id="desc">
    Detailed botanical illustration of spinach with a dense rosette
    of broad dark-green edible leaves, pale stems, leaf veins,
    highlights, shadows, and natural depth.
  </desc>

  <defs>

    <linearGradient id="leafGreen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#174c32"></stop>
      <stop offset="0.5" stop-color="#34784a"></stop>
      <stop offset="1" stop-color="#72ad68"></stop>
    </linearGradient>

    <linearGradient id="leafLight" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2f7044"></stop>
      <stop offset="0.55" stop-color="#5a9b59"></stop>
      <stop offset="1" stop-color="#9aca7c"></stop>
    </linearGradient>

    <linearGradient id="leafDark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#123e2c"></stop>
      <stop offset="1" stop-color="#477f4d"></stop>
    </linearGradient>

    <linearGradient id="stem" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#56824d"></stop>
      <stop offset="1" stop-color="#a6c985"></stop>
    </linearGradient>

    <radialGradient id="crown" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#7fa567"></stop>
      <stop offset="1" stop-color="#385c3c"></stop>
    </radialGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.3" flood-color="#173024" flood-opacity="0.27"></feDropShadow>
    </filter>

  </defs>

  <!-- ground shadow -->
  <ellipse cx="64" cy="115" rx="39" ry="7" fill="#183426" opacity="0.18"></ellipse>

  <!-- rear stems -->
  <g fill="none" stroke="url(#stem)" stroke-width="3" stroke-linecap="round">

    <path d="M61 105 C55 88 48 72 39 58"></path>
    <path d="M64 105 C63 84 63 65 62 45"></path>
    <path d="M68 105 C73 87 81 71 90 57"></path>

    <path d="M57 105 C47 94 37 85 27 78"></path>
    <path d="M71 105 C82 94 93 86 103 79"></path>

  </g>

  <!-- rear left leaf -->
  <path d="
    M42 64
    C31 54 18 54 11 62
    C16 72 25 79 35 81

    C30 86 31 93 37 97
    C47 90 51 79 48 69

    C47 66 45 65 42 64Z" fill="url(#leafDark)" stroke="#123d2b" stroke-width="1.4" filter="url(#softShadow)"></path>

  <!-- rear right leaf -->
  <path d="
    M86 63
    C97 53 110 54 117 63
    C112 73 103 79 93 81

    C98 87 97 93 91 97
    C81 90 77 79 80 69

    C81 66 83 65 86 63Z" fill="url(#leafDark)" stroke="#123d2b" stroke-width="1.4" filter="url(#softShadow)"></path>

  <!-- upper left leaf -->
  <path d="
    M48 51
    C39 37 27 32 18 38
    C20 49 27 58 37 63

    C33 68 36 74 42 76
    C51 68 54 59 52 53Z" fill="url(#leafGreen)" stroke="#17482f" stroke-width="1.5" filter="url(#softShadow)"></path>

  <!-- upper right leaf -->
  <path d="
    M79 50
    C88 36 100 32 110 39
    C107 50 101 58 91 63

    C95 68 92 74 86 76
    C77 68 74 58 76 53Z" fill="url(#leafGreen)" stroke="#17482f" stroke-width="1.5" filter="url(#softShadow)"></path>

  <!-- tallest center leaf -->
  <path d="
    M62 48
    C52 36 51 22 60 12
    C65 8 70 11 73 17

    C79 29 73 42 67 50
    C65 53 63 52 62 48Z" fill="url(#leafLight)" stroke="#1c5434" stroke-width="1.6" filter="url(#softShadow)"></path>

  <!-- center-left leaf -->
  <path d="
    M58 64
    C47 53 38 50 31 56
    C33 66 40 73 49 77

    C45 82 47 88 53 91
    C61 84 64 73 62 67Z" fill="url(#leafLight)" stroke="#194b31" stroke-width="1.4" filter="url(#softShadow)"></path>

  <!-- center-right leaf -->
  <path d="
    M70 64
    C81 53 90 50 97 56
    C95 66 88 73 79 77

    C83 82 81 88 75 91
    C67 84 64 73 66 67Z" fill="url(#leafGreen)" stroke="#194b31" stroke-width="1.4" filter="url(#softShadow)"></path>

  <!-- lower left broad leaf -->
  <path d="
    M52 83
    C40 73 26 72 17 80
    C23 91 34 96 45 97

    C40 102 43 108 49 110
    C57 102 60 92 57 86Z" fill="url(#leafGreen)" stroke="#18472f" stroke-width="1.5" filter="url(#softShadow)"></path>

  <!-- lower right broad leaf -->
  <path d="
    M76 83
    C88 73 102 73 111 81
    C105 91 94 96 83 97

    C88 102 85 108 79 110
    C71 102 68 92 71 86Z" fill="url(#leafGreen)" stroke="#18472f" stroke-width="1.5" filter="url(#softShadow)"></path>

  <!-- central young leaf -->
  <path d="
    M64 88
    C57 79 57 68 63 61
    C70 67 72 78 67 88
    C66 91 65 91 64 88Z" fill="#77ae62" stroke="#285f3d" stroke-width="1.2"></path>

  <!-- leaf midribs -->
  <g fill="none" stroke="#b3d399" stroke-width="1.1" stroke-linecap="round" opacity="0.76">

    <path d="M42 92 C42 80 42 70 40 61"></path>
    <path d="M88 92 C87 80 87 70 89 61"></path>

    <path d="M44 72 C42 61 35 50 23 41"></path>
    <path d="M84 72 C87 61 94 50 106 42"></path>

    <path d="M64 49 C65 37 66 25 65 15"></path>

    <path d="M54 88 C52 77 46 67 34 58"></path>
    <path d="M74 88 C76 77 82 67 94 58"></path>

  </g>

  <!-- smaller side veins -->
  <g fill="none" stroke="#8fbd77" stroke-width="0.7" stroke-linecap="round" opacity="0.72">

    <path d="M40 67 L29 61"></path>
    <path d="M41 73 L30 72"></path>
    <path d="M42 80 L31 83"></path>

    <path d="M88 67 L99 61"></path>
    <path d="M87 73 L98 72"></path>
    <path d="M86 80 L97 83"></path>

    <path d="M64 28 L57 23"></path>
    <path d="M65 34 L72 28"></path>
    <path d="M64 41 L56 37"></path>

    <path d="M51 70 L42 66"></path>
    <path d="M53 77 L44 77"></path>

    <path d="M77 70 L86 66"></path>
    <path d="M75 77 L84 77"></path>

  </g>

  <!-- spinach crown -->
  <path d="
    M50 105
    C54 98 58 95 64 95
    C71 95 76 99 79 106

    C72 111 56 111 50 105Z" fill="url(#crown)" stroke="#31533a" stroke-width="1.4" filter="url(#softShadow)"></path>

  <!-- crown highlight -->
  <path d="
    M55 104
    C60 100 69 100 74 104" fill="none" stroke="#a6c783" stroke-width="1.8" stroke-linecap="round" opacity="0.75"></path>

</svg>