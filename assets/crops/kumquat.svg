<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Kumquat</title>

  <desc id="desc">
    Detailed botanical illustration of Kumquat with several
    small golden-orange citrus fruits, glossy green leaves,
    white blossoms, highlights, shadows and natural depth.
  </desc>

  <defs>

    <linearGradient id="branchBrown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a17a58"></stop>
      <stop offset="0.52" stop-color="#6b4d39"></stop>
      <stop offset="1" stop-color="#3c3028"></stop>
    </linearGradient>

    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a0d06b"></stop>
      <stop offset="0.42" stop-color="#55994f"></stop>
      <stop offset="1" stop-color="#245e39"></stop>
    </linearGradient>

    <linearGradient id="leafDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#69a853"></stop>
      <stop offset="0.5" stop-color="#367b47"></stop>
      <stop offset="1" stop-color="#194a31"></stop>
    </linearGradient>

    <radialGradient id="fruitOrange" cx="31%" cy="23%" r="79%">
      <stop offset="0" stop-color="#ffe18a"></stop>
      <stop offset="0.34" stop-color="#f6b943"></stop>
      <stop offset="0.7" stop-color="#e78324"></stop>
      <stop offset="1" stop-color="#a84e20"></stop>
    </radialGradient>

    <radialGradient id="fruitGold" cx="30%" cy="23%" r="78%">
      <stop offset="0" stop-color="#ffeca0"></stop>
      <stop offset="0.38" stop-color="#f4c352"></stop>
      <stop offset="0.74" stop-color="#df8c2b"></stop>
      <stop offset="1" stop-color="#9e5625"></stop>
    </radialGradient>

    <radialGradient id="flowerWhite" cx="35%" cy="28%" r="75%">
      <stop offset="0" stop-color="#ffffff"></stop>
      <stop offset="0.55" stop-color="#f6f2dd"></stop>
      <stop offset="1" stop-color="#d7d1b7"></stop>
    </radialGradient>

    <radialGradient id="flowerCenter" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#f3d46e"></stop>
      <stop offset="1" stop-color="#ac873b"></stop>
    </radialGradient>

    <filter id="mainShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#213328" flood-opacity="0.30"></feDropShadow>
    </filter>

    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5"></feGaussianBlur>
    </filter>

  </defs>

  <!-- ground shadow -->
  <ellipse cx="65" cy="112" rx="37" ry="6" fill="#20392a" opacity="0.15" filter="url(#softBlur)"></ellipse>

  <g filter="url(#mainShadow)">

    <!-- main branch -->
    <path d="M29 105
             C40 87 50 69 62 53
             C74 38 87 29 102 24" fill="none" stroke="url(#branchBrown)" stroke-width="6" stroke-linecap="round"></path>

    <!-- secondary branch -->
    <path d="M58 63
             C48 51 38 43 25 38" fill="none" stroke="url(#branchBrown)" stroke-width="4" stroke-linecap="round"></path>

    <!-- upper-left leaf -->
    <path d="M52 54
             C38 51 27 43 21 32
             C34 30 47 35 56 44
             C57 48 55 52 52 54Z" fill="url(#leafGreen)"></path>

    <path d="M52 50
             C42 43 32 37 24 34" fill="none" stroke="#dcebb2" stroke-width="1.3" stroke-linecap="round" opacity="0.48"></path>

    <!-- middle-left leaf -->
    <path d="M52 69
             C39 70 28 66 21 58
             C33 55 45 58 55 64
             C55 66 54 68 52 69Z" fill="url(#leafDark)"></path>

    <path d="M51 66
             C42 62 33 59 24 59" fill="none" stroke="#d3e7a8" stroke-width="1.2" stroke-linecap="round" opacity="0.44"></path>

    <!-- upper-right leaf -->
    <path d="M74 51
             C84 39 97 34 111 35
             C105 47 95 56 81 60
             C78 58 76 55 74 51Z" fill="url(#leafDark)"></path>

    <path d="M80 55
             C90 48 99 42 107 38" fill="none" stroke="#d8e9ad" stroke-width="1.3" stroke-linecap="round" opacity="0.46"></path>

    <!-- right-middle leaf -->
    <path d="M84 67
             C97 61 109 63 116 70
             C107 78 96 81 84 77
             C82 74 82 71 84 67Z" fill="url(#leafGreen)"></path>

    <path d="M88 73
             C98 70 107 69 112 71" fill="none" stroke="#dcecb3" stroke-width="1.2" stroke-linecap="round" opacity="0.43"></path>

    <!-- lower-left leaf -->
    <path d="M51 83
             C39 86 29 83 22 77
             C33 73 44 75 54 79
             C54 81 53 82 51 83Z" fill="url(#leafGreen)"></path>

    <!-- lower-right leaf -->
    <path d="M87 84
             C99 79 109 82 115 89
             C105 96 95 97 84 93
             C83 89 84 86 87 84Z" fill="url(#leafDark)"></path>


    <!-- fruiting stems -->
    <path d="M64 57
             C64 67 66 74 69 81" fill="none" stroke="#5e733c" stroke-width="3.5" stroke-linecap="round"></path>

    <path d="M66 71
             C58 75 53 80 51 86" fill="none" stroke="#5e733c" stroke-width="2.6" stroke-linecap="round"></path>

    <path d="M68 73
             C76 76 82 80 86 86" fill="none" stroke="#5e733c" stroke-width="2.6" stroke-linecap="round"></path>

    <!-- left kumquat -->
    <path d="M50 81
             C43 82 39 88 40 96
             C41 104 46 109 52 110
             C59 109 63 102 62 94
             C61 86 57 81 50 81Z" fill="url(#fruitGold)"></path>

    <!-- center kumquat -->
    <path d="M67 79
             C59 80 55 87 56 96
             C57 106 63 112 70 112
             C78 110 82 102 81 93
             C80 84 75 79 67 79Z" fill="url(#fruitOrange)"></path>

    <!-- right kumquat -->
    <path d="M86 82
             C79 83 76 89 77 96
             C78 104 84 108 90 107
             C96 105 99 98 98 91
             C97 85 93 82 86 82Z" fill="url(#fruitGold)"></path>

    <!-- rear smaller fruit -->
    <path d="M70 68
             C64 68 61 73 62 79
             C63 85 67 89 72 88
             C77 87 79 82 78 76
             C77 71 74 68 70 68Z" fill="url(#fruitOrange)"></path>

    <!-- fruit caps -->
    <path d="M47 82
             C50 79 54 79 57 82" fill="none" stroke="#506738" stroke-width="2.2" stroke-linecap="round"></path>

    <path d="M64 80
             C67 77 71 77 74 80" fill="none" stroke="#506738" stroke-width="2.3" stroke-linecap="round"></path>

    <path d="M83 83
             C86 80 90 80 93 83" fill="none" stroke="#506738" stroke-width="2.2" stroke-linecap="round"></path>

    <!-- citrus rind texture -->
    <g fill="#d27727" opacity="0.32">

      <circle cx="47" cy="91" r="0.75"></circle>
      <circle cx="53" cy="87" r="0.7"></circle>
      <circle cx="57" cy="96" r="0.75"></circle>
      <circle cx="49" cy="102" r="0.65"></circle>

      <circle cx="63" cy="89" r="0.75"></circle>
      <circle cx="70" cy="85" r="0.7"></circle>
      <circle cx="76" cy="92" r="0.75"></circle>
      <circle cx="65" cy="101" r="0.7"></circle>
      <circle cx="73" cy="105" r="0.7"></circle>

      <circle cx="83" cy="91" r="0.7"></circle>
      <circle cx="90" cy="87" r="0.65"></circle>
      <circle cx="93" cy="96" r="0.75"></circle>
      <circle cx="86" cy="102" r="0.65"></circle>

    </g>


    <!-- small flower stem -->
    <path d="M65 55
             C69 48 73 44 78 41" fill="none" stroke="#67854a" stroke-width="2.6" stroke-linecap="round"></path>

    <!-- white kumquat flower -->
    <g transform="translate(80 38)">

      <ellipse cx="0" cy="-5" rx="3.2" ry="5.4" fill="url(#flowerWhite)"></ellipse>

      <ellipse cx="5" cy="-1" rx="3.2" ry="5.4" transform="rotate(70 5 -1)" fill="url(#flowerWhite)"></ellipse>

      <ellipse cx="3" cy="5" rx="3.2" ry="5.4" transform="rotate(145 3 5)" fill="url(#flowerWhite)"></ellipse>

      <ellipse cx="-3" cy="5" rx="3.2" ry="5.4" transform="rotate(-145 -3 5)" fill="url(#flowerWhite)"></ellipse>

      <ellipse cx="-5" cy="-1" rx="3.2" ry="5.4" transform="rotate(-70 -5 -1)" fill="url(#flowerWhite)"></ellipse>

      <circle cx="0" cy="0" r="2" fill="url(#flowerCenter)"></circle>

    </g>

  </g>


  <!-- fruit highlights -->
  <path d="M44 89
           C46 85 49 83 52 83" fill="none" stroke="#fff2b5" stroke-width="1.8" stroke-linecap="round" opacity="0.72"></path>

  <path d="M60 88
           C63 83 66 82 69 82" fill="none" stroke="#fff1ad" stroke-width="2" stroke-linecap="round" opacity="0.75"></path>

  <path d="M81 89
           C83 85 86 84 89 84" fill="none" stroke="#fff2b6" stroke-width="1.7" stroke-linecap="round" opacity="0.68"></path>


  <!-- leaf highlights -->
  <path d="M24 33
           C34 34 44 39 51 46" fill="none" stroke="#eef5cf" stroke-width="1.4" stroke-linecap="round" opacity="0.34"></path>

  <path d="M106 38
           C97 41 89 46 82 52" fill="none" stroke="#edf4ca" stroke-width="1.4" stroke-linecap="round" opacity="0.33"></path>


  <!-- branch highlight -->
  <path d="M32 102
           C43 84 53 68 64 53" fill="none" stroke="#c49a74" stroke-width="1.4" stroke-linecap="round" opacity="0.48"></path>

</svg>