<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="tomatilloTitle tomatilloDesc">
  <title id="tomatilloTitle">Tomatillo</title>
  <desc id="tomatilloDesc">
    Detailed tomatillo plant with green leaves, yellow flower,
    papery husks, and a ripe green tomatillo fruit.
  </desc>

  <defs>
    <linearGradient id="stemGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a9b4d"></stop>
      <stop offset="55%" stop-color="#367940"></stop>
      <stop offset="100%" stop-color="#205d34"></stop>
    </linearGradient>

    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8dd06d"></stop>
      <stop offset="45%" stop-color="#52a854"></stop>
      <stop offset="100%" stop-color="#267440"></stop>
    </linearGradient>

    <linearGradient id="leafDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#66b65b"></stop>
      <stop offset="100%" stop-color="#1d6538"></stop>
    </linearGradient>

    <radialGradient id="fruitGreen" cx="35%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#d1eb75"></stop>
      <stop offset="40%" stop-color="#9ac94f"></stop>
      <stop offset="100%" stop-color="#5e9639"></stop>
    </radialGradient>

    <linearGradient id="huskLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dce7a2"></stop>
      <stop offset="50%" stop-color="#b8ca78"></stop>
      <stop offset="100%" stop-color="#81974e"></stop>
    </linearGradient>

    <linearGradient id="huskDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8db8b"></stop>
      <stop offset="100%" stop-color="#738d49"></stop>
    </linearGradient>

    <radialGradient id="flowerYellow" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fff69a"></stop>
      <stop offset="55%" stop-color="#f3d54c"></stop>
      <stop offset="100%" stop-color="#d3a72d"></stop>
    </radialGradient>

    <filter id="tomatilloShadow" x="-35%" y="-35%" width="170%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#183b24" flood-opacity="0.22"></feDropShadow>
    </filter>
  </defs>

  <ellipse cx="64" cy="113" rx="36" ry="6" fill="#153920" opacity="0.13"></ellipse>

  <!-- Main stems -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M61 111 C61 91 62 70 67 49 C70 37 73 27 76 18" stroke-width="5"></path>

    <path d="M64 83 C49 74 39 64 31 52" stroke-width="3.6"></path>

    <path d="M66 68 C80 62 91 53 99 42" stroke-width="3.5"></path>

    <path d="M62 96 C48 93 36 87 27 78" stroke-width="3.2"></path>

    <path d="M63 92 C78 88 91 80 101 70" stroke-width="3.2"></path>
  </g>

  <!-- Upper left leaf -->
  <g filter="url(#tomatilloShadow)">
    <path d="M35 54
         C24 56 15 51 13 42
         C20 34 31 33 40 39
         C46 44 43 51 35 54Z" fill="url(#leafGreen)"></path>

    <path d="M39 46
         C31 44 23 43 15 43" fill="none" stroke="#d8efc2" stroke-width="1.35" stroke-linecap="round" opacity="0.7"></path>

    <path d="M27 39 L23 35
         M31 41 L30 35
         M35 43 L38 38" fill="none" stroke="#b6dc9c" stroke-width="1" stroke-linecap="round" opacity="0.65"></path>
  </g>

  <!-- Upper right leaf -->
  <g filter="url(#tomatilloShadow)">
    <path d="M95 45
         C92 34 97 25 106 22
         C115 28 116 39 110 47
         C105 53 98 51 95 45Z" fill="url(#leafDark)"></path>

    <path d="M101 47
         C103 38 105 30 106 23" fill="none" stroke="#d3eabb" stroke-width="1.3" opacity="0.7"></path>
  </g>

  <!-- Lower left leaf -->
  <g filter="url(#tomatilloShadow)">
    <path d="M31 80
         C21 76 12 80 10 89
         C17 98 29 100 38 92
         C42 87 38 82 31 80Z" fill="url(#leafDark)"></path>

    <path d="M34 87
         C26 88 19 89 12 90" fill="none" stroke="#d0e9b9" stroke-width="1.3" opacity="0.68"></path>
  </g>

  <!-- Center leaf -->
  <g filter="url(#tomatilloShadow)">
    <path d="M55 75
         C46 70 43 60 48 53
         C58 50 67 57 68 67
         C68 75 62 79 55 75Z" fill="url(#leafGreen)"></path>

    <path d="M60 73
         C57 65 53 59 49 54" fill="none" stroke="#d9efc4" stroke-width="1.3" opacity="0.7"></path>
  </g>

  <!-- Lower right leaf -->
  <g filter="url(#tomatilloShadow)">
    <path d="M91 82
         C98 73 109 71 116 78
         C116 89 107 97 96 95
         C88 93 86 87 91 82Z" fill="url(#leafGreen)"></path>

    <path d="M94 88
         C101 84 108 81 114 79" fill="none" stroke="#d9efc5" stroke-width="1.3" opacity="0.7"></path>
  </g>

  <!-- Left tomatillo husk -->
  <g filter="url(#tomatilloShadow)">
    <path d="M28 51
         C25 57 24 66 28 73" fill="none" stroke="#4f8448" stroke-width="2.4" stroke-linecap="round"></path>

    <path d="M28 72
         C21 77 19 87 24 95
         C28 101 37 103 43 98
         C49 92 48 82 43 75
         C39 70 33 69 28 72Z" fill="url(#huskLight)" stroke="#708c48" stroke-width="1.3"></path>

    <path d="M24 78
         C30 83 36 91 40 98
         M28 73
         C30 82 31 92 31 100
         M41 75
         C37 83 35 92 35 100" fill="none" stroke="#eef1bc" stroke-width="1.05" opacity="0.68"></path>

    <path d="M24 75 L20 70
         M28 72 L26 66
         M43 75 L47 70" fill="none" stroke="#6d8848" stroke-width="1.2" stroke-linecap="round"></path>

    <!-- Fruit peeking through -->
    <path d="M29 91
         C31 84 37 81 42 84
         C46 88 44 94 40 98
         C35 100 31 97 29 91Z" fill="url(#fruitGreen)" opacity="0.96"></path>

    <ellipse cx="34" cy="87" rx="3" ry="2" fill="#e8f4a0" opacity="0.65"></ellipse>
  </g>

  <!-- Right ripe tomatillo -->
  <g filter="url(#tomatilloShadow)">
    <path d="M99 69
         C103 63 104 57 102 51" fill="none" stroke="#4e8446" stroke-width="2.5" stroke-linecap="round"></path>

    <!-- opened husk behind fruit -->
    <path d="M91 73
         C85 78 83 88 88 96
         C91 100 94 102 97 103
         C92 94 93 83 99 75
         C97 72 94 71 91 73Z" fill="url(#huskDark)"></path>

    <path d="M108 72
         C115 78 117 87 113 96
         C110 101 106 103 102 104
         C108 94 107 83 101 75
         C103 72 106 71 108 72Z" fill="url(#huskLight)"></path>

    <!-- main fruit -->
    <circle cx="100" cy="89" r="16" fill="url(#fruitGreen)" stroke="#568b38" stroke-width="1.5"></circle>

    <ellipse cx="94" cy="83" rx="6" ry="4" fill="#e6f49a" opacity="0.55" transform="rotate(-25 94 83)"></ellipse>

    <path d="M88 95 C92 101 100 105 107 101" fill="none" stroke="#477a35" stroke-width="1" opacity="0.5"></path>

    <path d="M99 72
         L95 67
         M100 73
         L101 66
         M102 73
         L107 68" fill="none" stroke="#607f43" stroke-width="1.5" stroke-linecap="round"></path>
  </g>

  <!-- Yellow tomatillo flower -->
  <g filter="url(#tomatilloShadow)">
    <path d="M76 24 C82 24 87 27 90 31" fill="none" stroke="#4d8246" stroke-width="2.4" stroke-linecap="round"></path>

    <path d="M90 32
         L87 22
         L94 27
         L101 20
         L101 30
         L112 30
         L104 36
         L109 45
         L99 40
         L94 48
         L92 38
         L81 41
         L88 34
         Z" fill="url(#flowerYellow)" stroke="#d1ac34" stroke-width="1" stroke-linejoin="round"></path>

    <circle cx="96" cy="34" r="6" fill="#69502c"></circle>

    <g fill="#49382b">
      <ellipse cx="96" cy="29" rx="1.4" ry="3"></ellipse>
      <ellipse cx="101" cy="32" rx="1.4" ry="3" transform="rotate(65 101 32)"></ellipse>
      <ellipse cx="99" cy="38" rx="1.4" ry="3" transform="rotate(145 99 38)"></ellipse>
      <ellipse cx="93" cy="38" rx="1.4" ry="3" transform="rotate(215 93 38)"></ellipse>
      <ellipse cx="91" cy="32" rx="1.4" ry="3" transform="rotate(290 91 32)"></ellipse>
    </g>

    <circle cx="96" cy="34" r="2.2" fill="#d4c350"></circle>
  </g>

  <!-- stem highlight -->
  <path d="M59.5 108
       C59.5 89 60.5 70 65 49
       C68 36 71 27 74 19" fill="none" stroke="#8bc273" stroke-width="1.1" stroke-linecap="round" opacity="0.5"></path>
</svg>