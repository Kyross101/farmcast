<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Hyssop</title>

  <desc id="desc">
    Detailed botanical illustration of culinary hyssop with narrow dark-green leaves,
    upright branching stems, violet-blue flower spikes, and harvested herb sprigs.
  </desc>

  <defs>
    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9bb478"></stop>
      <stop offset="0.5" stop-color="#668553"></stop>
      <stop offset="1" stop-color="#395d3f"></stop>
    </linearGradient>

    <linearGradient id="leafLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b2c78e"></stop>
      <stop offset="1" stop-color="#52744a"></stop>
    </linearGradient>

    <linearGradient id="stemGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#899d65"></stop>
      <stop offset="1" stop-color="#536c44"></stop>
    </linearGradient>

    <linearGradient id="flowerBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9c9fe0"></stop>
      <stop offset="0.5" stop-color="#6f70ba"></stop>
      <stop offset="1" stop-color="#4b4d8e"></stop>
    </linearGradient>

    <linearGradient id="flowerLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d2c8ed"></stop>
      <stop offset="1" stop-color="#8d79bd"></stop>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#292f29" flood-opacity="0.23"></feDropShadow>
    </filter>
  </defs>

  <ellipse cx="64" cy="119" rx="44" ry="5" fill="#565048" opacity="0.15"></ellipse>

  <!-- Main stems -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round">

    <path d="M64 109
         C63 91 64 73 64 56
         C65 41 64 28 61 16" stroke-width="4.8"></path>

    <path d="M52 108
         C52 92 50 77 47 63
         C45 51 41 41 36 32" stroke-width="3.2"></path>

    <path d="M76 108
         C75 92 78 77 82 63
         C86 51 91 41 96 33" stroke-width="3.2"></path>

  </g>

  <!-- Stem highlights -->
  <g fill="none" stroke="#b7c68f" stroke-linecap="round" opacity="0.62">

    <path d="M66 105
         C65 84 66 64 66 45" stroke-width="1.05"></path>

    <path d="M54 104
         C54 87 52 71 49 58" stroke-width="0.9"></path>

  </g>

  <!-- Side branches -->
  <g fill="none" stroke="#61764c" stroke-width="1.7" stroke-linecap="round">

    <path d="M61 90 C51 83 42 76 33 68"></path>
    <path d="M63 81 C74 74 85 67 95 58"></path>
    <path d="M61 70 C51 64 43 57 36 49"></path>
    <path d="M64 62 C75 56 84 49 91 41"></path>

  </g>

  <!-- Narrow aromatic leaves -->
  <g filter="url(#softShadow)">

    <path d="M34 68
         C26 63 20 62 16 66
         C21 72 28 75 35 72Z" fill="url(#leafGreen)" stroke="#31543a" stroke-width="1.2"></path>

    <path d="M42 76
         C34 70 28 70 23 74
         C28 81 35 83 43 79Z" fill="url(#leafLight)" stroke="#31543a" stroke-width="1.2"></path>

    <path d="M49 83
         C41 78 35 78 30 82
         C35 88 42 90 50 86Z" fill="url(#leafGreen)" stroke="#31543a" stroke-width="1.2"></path>

    <path d="M36 49
         C28 44 22 43 18 47
         C23 54 30 56 37 53Z" fill="url(#leafGreen)" stroke="#31543a" stroke-width="1.2"></path>

    <path d="M44 57
         C36 52 30 52 25 56
         C30 62 37 64 45 60Z" fill="url(#leafLight)" stroke="#31543a" stroke-width="1.2"></path>

    <path d="M95 58
         C103 52 109 52 113 56
         C108 63 101 65 94 62Z" fill="url(#leafGreen)" stroke="#31543a" stroke-width="1.2"></path>

    <path d="M87 66
         C95 60 102 60 106 64
         C101 71 94 73 86 69Z" fill="url(#leafLight)" stroke="#31543a" stroke-width="1.2"></path>

    <path d="M80 73
         C88 68 95 68 99 72
         C94 78 87 80 79 76Z" fill="url(#leafGreen)" stroke="#31543a" stroke-width="1.2"></path>

    <path d="M91 41
         C99 36 105 36 109 40
         C104 47 97 49 90 46Z" fill="url(#leafGreen)" stroke="#31543a" stroke-width="1.2"></path>

    <path d="M84 49
         C92 44 98 44 103 48
         C98 54 91 56 83 52Z" fill="url(#leafLight)" stroke="#31543a" stroke-width="1.2"></path>

  </g>

  <!-- Leaf highlights -->
  <g fill="none" stroke="#d0ddc0" stroke-width="0.75" stroke-linecap="round" opacity="0.72">

    <path d="M18 67 C24 68 30 70 34 71"></path>
    <path d="M25 75 C32 76 37 78 42 79"></path>
    <path d="M111 57 C104 58 99 60 95 61"></path>
    <path d="M104 65 C97 66 92 68 87 69"></path>

  </g>

  <!-- Flower branches -->
  <g fill="none" stroke="#68754a" stroke-width="1.3" stroke-linecap="round">

    <path d="M63 48 L54 38"></path>
    <path d="M64 45 L65 33"></path>
    <path d="M65 46 L76 36"></path>
    <path d="M54 38 L48 30"></path>
    <path d="M65 33 L64 24"></path>
    <path d="M76 36 L82 28"></path>

  </g>

  <!-- Violet-blue flowers -->
  <g filter="url(#softShadow)">

    <g transform="translate(48 29)">
      <path d="M0 0
           C-5 -4 -6 -9 -2 -11
           C2 -10 4 -7 3 -3
           C6 -5 10 -4 11 -1
           C9 3 5 4 1 2
           C0 5 -3 7 -6 5
           C-7 2 -5 0 0 0Z" fill="url(#flowerBlue)" stroke="#44477e" stroke-width="0.8"></path>

      <path d="M2 -2 C5 -2 7 -1 8 1" fill="none" stroke="#ddd7f3" stroke-width="0.8" opacity="0.75"></path>
    </g>

    <g transform="translate(65 24) scale(0.9)">
      <path d="M0 0
           C-5 -4 -6 -9 -2 -11
           C2 -10 4 -7 3 -3
           C6 -5 10 -4 11 -1
           C9 3 5 4 1 2
           C0 5 -3 7 -6 5
           C-7 2 -5 0 0 0Z" fill="url(#flowerLight)" stroke="#5c538a" stroke-width="0.8"></path>

      <path d="M2 -2 C5 -2 7 -1 8 1" fill="none" stroke="#f0eafa" stroke-width="0.8" opacity="0.75"></path>
    </g>

    <g transform="translate(82 27) scale(0.84)">
      <path d="M0 0
           C-5 -4 -6 -9 -2 -11
           C2 -10 4 -7 3 -3
           C6 -5 10 -4 11 -1
           C9 3 5 4 1 2
           C0 5 -3 7 -6 5
           C-7 2 -5 0 0 0Z" fill="url(#flowerBlue)" stroke="#44477e" stroke-width="0.8"></path>
    </g>

    <g transform="translate(60 38) scale(0.72)">
      <path d="M0 0
           C-5 -4 -6 -9 -2 -11
           C2 -10 4 -7 3 -3
           C6 -5 10 -4 11 -1
           C9 3 5 4 1 2
           C0 5 -3 7 -6 5
           C-7 2 -5 0 0 0Z" fill="url(#flowerLight)" stroke="#5c538a" stroke-width="0.8"></path>
    </g>

    <g transform="translate(74 38) scale(0.7)">
      <path d="M0 0
           C-5 -4 -6 -9 -2 -11
           C2 -10 4 -7 3 -3
           C6 -5 10 -4 11 -1
           C9 3 5 4 1 2
           C0 5 -3 7 -6 5
           C-7 2 -5 0 0 0Z" fill="url(#flowerBlue)" stroke="#44477e" stroke-width="0.8"></path>
    </g>

  </g>

  <!-- Root crown -->
  <path d="M55 103
       C59 99 70 99 75 104
       L74 110
       C69 113 59 113 55 109Z" fill="#6e7650" stroke="#4a5339" stroke-width="1.7"></path>

  <g fill="none" stroke="#75634a" stroke-width="1.5" stroke-linecap="round">

    <path d="M59 109 C55 114 52 119 51 123"></path>
    <path d="M65 110 C64 116 64 121 64 125"></path>
    <path d="M71 109 C76 114 79 118 81 122"></path>

  </g>

  <!-- Harvested sprig -->
  <g transform="translate(37 107) rotate(-13)" filter="url(#softShadow)">

    <path d="M-15 2 C-5 1 6 -1 18 -3" fill="none" stroke="#586e48" stroke-width="2.2" stroke-linecap="round"></path>

    <path d="M-8 0 C-13 -4 -17 -3 -18 0 C-14 3 -11 3 -8 2Z" fill="url(#leafGreen)" stroke="#31543a" stroke-width="0.9"></path>

    <path d="M0 -1 C-5 -5 -8 -4 -10 -1 C-6 2 -3 2 0 1Z" fill="url(#leafLight)" stroke="#31543a" stroke-width="0.9"></path>

    <path d="M8 -2 C3 -6 0 -5 -2 -2 C2 1 5 1 8 0Z" fill="url(#leafGreen)" stroke="#31543a" stroke-width="0.9"></path>

    <path d="M15 -3 C10 -7 7 -6 5 -3 C9 0 12 0 15 -1Z" fill="url(#leafLight)" stroke="#31543a" stroke-width="0.9"></path>

  </g>

  <!-- Second harvested sprig -->
  <g transform="translate(92 109) rotate(16)" opacity="0.95">

    <path d="M-12 1 C-3 0 6 -1 14 -2" fill="none" stroke="#586e48" stroke-width="2" stroke-linecap="round"></path>

    <path d="M-5 0 C-9 -4 -12 -4 -14 -2 C-11 1 -8 2 -5 2Z" fill="url(#leafGreen)" stroke="#31543a" stroke-width="0.8"></path>

    <path d="M3 -1 C-1 -5 -4 -5 -6 -3 C-3 0 0 1 3 1Z" fill="url(#leafLight)" stroke="#31543a" stroke-width="0.8"></path>

    <path d="M10 -2 C6 -6 3 -6 1 -4 C4 -1 7 0 10 0Z" fill="url(#leafGreen)" stroke="#31543a" stroke-width="0.8"></path>

  </g>

  <!-- Highlights -->
  <g fill="#eee2b9" opacity="0.6">
    <circle cx="49" cy="64" r="1"></circle>
    <circle cx="84" cy="62" r="1"></circle>
    <circle cx="58" cy="43" r="0.9"></circle>
  </g>

</svg>