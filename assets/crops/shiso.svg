         C62 89 63 70 65 51
         C67 36 68 24 69 13" stroke-width="5"></path>

    <path d="M63 78
         C50 70 40 61 33 50" stroke-width="3.5"></path>

    <path d="M64 67
         C78 62 89 53 97 43" stroke-width="3.4"></path>

    <path d="M62 93
         C49 90 38 84 29 75" stroke-width="3"></path>

    <path d="M63 88
         C77 85 89 78 99 69" stroke-width="3"></path>
  </g>

