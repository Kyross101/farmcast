<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="shisoTitle shisoDesc">
  <title id="shisoTitle">Shiso</title>
  <desc id="shisoDesc">
    Detailed shiso herb with serrated green and purple aromatic
    leaves, square stems and a small pale flower spike.
  </desc>

  <defs>
    <linearGradient id="shisoStem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7f9960"></stop>
      <stop offset="52%" stop-color="#557545"></stop>
      <stop offset="100%" stop-color="#355438"></stop>
    </linearGradient>

    <linearGradient id="shisoLeafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5d77a"></stop>
      <stop offset="38%" stop-color="#64ad59"></stop>
      <stop offset="72%" stop-color="#3c8247"></stop>
      <stop offset="100%" stop-color="#23613a"></stop>
    </linearGradient>

    <linearGradient id="shisoLeafDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#79bb65"></stop>
      <stop offset="52%" stop-color="#43884d"></stop>
      <stop offset="100%" stop-color="#1d5634"></stop>
    </linearGradient>

    <linearGradient id="shisoPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a16ba7"></stop>
      <stop offset="42%" stop-color="#794f89"></stop>
      <stop offset="100%" stop-color="#4e365e"></stop>
    </linearGradient>

    <linearGradient id="shisoPurpleDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#85588f"></stop>
      <stop offset="100%" stop-color="#402c50"></stop>
    </linearGradient>

    <linearGradient id="shisoFlower" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffdfc"></stop>
      <stop offset="55%" stop-color="#eee6f2"></stop>
      <stop offset="100%" stop-color="#cdbbd6"></stop>
    </linearGradient>

    <filter id="shisoShadow" x="-35%" y="-35%" width="170%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#142f1e" flood-opacity="0.22"></feDropShadow>
    </filter>
  </defs>

  <ellipse cx="64" cy="112" rx="38" ry="6" fill="#15351f" opacity="0.12"></ellipse>

  <!-- Main square stems -->
  <g fill="none" stroke="url(#shisoStem)" stroke-linecap="round" stroke-linejoin="round">
