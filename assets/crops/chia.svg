<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Chia</title>

  <desc id="desc">
    Detailed botanical illustration of a chia plant with branching green
    stems, serrated leaves, purple-blue flower spikes, and mature brown
    seed heads containing small chia seeds.
  </desc>

  <defs>

    <linearGradient id="stemGreen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#315b39"></stop>
      <stop offset="0.55" stop-color="#63894b"></stop>
      <stop offset="1" stop-color="#aac176"></stop>
    </linearGradient>

    <linearGradient id="leafGreen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1e5033"></stop>
      <stop offset="0.48" stop-color="#428044"></stop>
      <stop offset="1" stop-color="#98c26f"></stop>
    </linearGradient>

    <linearGradient id="leafDark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#173d2a"></stop>
      <stop offset="1" stop-color="#5e9250"></stop>
    </linearGradient>

    <linearGradient id="flowerPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3b1ee"></stop>
      <stop offset="0.45" stop-color="#856fc7"></stop>
      <stop offset="1" stop-color="#51438f"></stop>
    </linearGradient>

    <linearGradient id="flowerBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b1c7ed"></stop>
      <stop offset="0.5" stop-color="#6d8fc9"></stop>
      <stop offset="1" stop-color="#405c91"></stop>
    </linearGradient>

    <linearGradient id="dryHead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c5a66d"></stop>
      <stop offset="0.5" stop-color="#947147"></stop>
      <stop offset="1" stop-color="#624931"></stop>
    </linearGradient>

    <radialGradient id="seedDark" cx="30%" cy="25%" r="78%">
      <stop offset="0" stop-color="#d8c8b0"></stop>
      <stop offset="0.28" stop-color="#746b64"></stop>
      <stop offset="0.72" stop-color="#3e3938"></stop>
      <stop offset="1" stop-color="#211f20"></stop>
    </radialGradient>

    <radialGradient id="seedLight" cx="30%" cy="25%" r="78%">
      <stop offset="0" stop-color="#f1e6cc"></stop>
      <stop offset="0.45" stop-color="#c5ab82"></stop>
      <stop offset="1" stop-color="#826d56"></stop>
    </radialGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#1f2921" flood-opacity="0.25"></feDropShadow>
    </filter>

  </defs>

  <!-- ground shadow -->
  <ellipse cx="64" cy="117" rx="40" ry="6" fill="#293129" opacity="0.16"></ellipse>

  <!-- main stem -->
  <path d="
    M61 113
    C61 94 62 77 62 61
    C62 46 63 31 64 17" fill="none" stroke="url(#stemGreen)" stroke-width="6" stroke-linecap="round" filter="url(#softShadow)"></path>

  <!-- stem highlight -->
  <path d="
    M63 109
    C63 91 64 75 64 60
    C64 44 65 31 65 19" fill="none" stroke="#c8d99a" stroke-width="1" stroke-linecap="round" opacity="0.58"></path>

  <!-- branching stems -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round">

    <path d="
      M62 80
      C49 73 38 64 31 53" stroke-width="3.6"></path>

    <path d="
      M62 69
      C76 62 87 54 95 43" stroke-width="3.4"></path>

    <path d="
      M63 57
      C51 49 44 40 41 31" stroke-width="3.1"></path>

    <path d="
      M63 46
      C75 40 84 32 89 23" stroke-width="3"></path>

  </g>

  <!-- chia leaves -->
  <g stroke="#204931" stroke-width="1" filter="url(#softShadow)">

    <path d="
      M51 83
      C38 73 25 74 16 82
      C24 93 38 94 51 88
      C55 86 55 84 51 83Z" fill="url(#leafGreen)"></path>

    <path d="
      M72 75
      C85 64 99 66 108 75
      C100 85 86 87 73 81
      C69 79 69 77 72 75Z" fill="url(#leafDark)"></path>

    <path d="
      M51 63
      C39 53 28 55 20 63
      C28 73 40 74 51 68
      C55 66 55 64 51 63Z" fill="url(#leafDark)"></path>

    <path d="
      M73 57
      C84 47 96 49 104 57
      C97 67 85 69 74 63
      C70 61 70 59 73 57Z" fill="url(#leafGreen)"></path>

    <path d="
      M52 46
      C42 37 33 39 27 46
      C34 55 44 57 53 51
      C56 49 55 47 52 46Z" fill="url(#leafGreen)"></path>

    <path d="
      M73 40
      C83 31 93 32 100 39
      C94 48 84 50 74 45
      C71 43 71 41 73 40Z" fill="url(#leafDark)"></path>

  </g>

  <!-- serrated leaf margins -->
  <g fill="none" stroke="#173e2a" stroke-width="0.7" opacity="0.8">

    <path d="
      M18 82
      L23 78
      L28 83
      L34 79
      L39 84
      L45 80
      L50 84"></path>

    <path d="
      M75 77
      L81 72
      L87 77
      L93 73
      L100 77
      L106 74"></path>

    <path d="
      M22 63
      L27 59
      L32 64
      L38 60
      L43 65
      L49 62"></path>

    <path d="
      M76 59
      L82 54
      L87 59
      L93 55
      L100 58"></path>

    <path d="
      M29 46
      L34 42
      L39 47
      L45 43
      L50 47"></path>

  </g>

  <!-- leaf veins -->
  <g fill="none" stroke="#b6d69b" stroke-width="0.8" stroke-linecap="round" opacity="0.74">

    <path d="M18 83 C29 84 40 85 50 86"></path>
    <path d="M75 79 C86 77 97 76 106 76"></path>

    <path d="M22 64 C32 64 41 65 50 65"></path>
    <path d="M76 61 C86 59 95 58 102 58"></path>

    <path d="M30 47 C38 48 45 48 51 49"></path>
    <path d="M75 43 C83 41 91 40 98 40"></path>

  </g>

  <!-- central flower-spike stem -->
  <path d="
    M64 19
    C64 13 64 8 64 4" fill="none" stroke="#607b47" stroke-width="2.3" stroke-linecap="round"></path>

  <!-- central chia inflorescence -->
  <g filter="url(#softShadow)">

    <g fill="url(#flowerPurple)" stroke="#56458b" stroke-width="0.55">

      <path d="M60 5 C55 4 53 0 56 -3 C61 -2 63 1 60 5Z"></path>
      <path d="M68 5 C73 4 75 0 72 -3 C67 -2 65 1 68 5Z"></path>

      <path d="M59 10 C54 9 52 5 55 2 C60 3 62 6 59 10Z"></path>
      <path d="M69 10 C74 9 76 5 73 2 C68 3 66 6 69 10Z"></path>

      <path d="M58 15 C53 14 51 10 54 7 C59 8 61 11 58 15Z"></path>
      <path d="M70 15 C75 14 77 10 74 7 C69 8 67 11 70 15Z"></path>

      <path d="M58 20 C53 19 51 15 54 12 C59 13 61 16 58 20Z"></path>
      <path d="M70 20 C75 19 77 15 74 12 C69 13 67 16 70 20Z"></path>

      <path d="M58 25 C53 24 51 20 54 17 C59 18 61 21 58 25Z"></path>
      <path d="M70 25 C75 24 77 20 74 17 C69 18 67 21 70 25Z"></path>

    </g>

    <!-- blue flower accents -->
    <g fill="url(#flowerBlue)" opacity="0.9">

      <ellipse cx="60" cy="8" rx="2" ry="3" transform="rotate(-35 60 8)"></ellipse>

      <ellipse cx="68" cy="13" rx="2" ry="3" transform="rotate(35 68 13)"></ellipse>

      <ellipse cx="59" cy="18" rx="2" ry="3" transform="rotate(-35 59 18)"></ellipse>

      <ellipse cx="69" cy="23" rx="2" ry="3" transform="rotate(35 69 23)"></ellipse>

    </g>

  </g>

  <!-- left flower spike -->
  <g transform="translate(40 31) scale(.76)" filter="url(#softShadow)">

    <path d="M0 5 L0 -20" stroke="#607b47" stroke-width="2.4"></path>

    <g fill="url(#flowerPurple)" stroke="#59498d" stroke-width="0.65">

      <path d="M-1 -19 C-7 -20 -9 -15 -5 -12 C0 -13 2 -16 -1 -19Z"></path>
      <path d="M1 -15 C7 -16 9 -11 5 -8 C0 -9 -2 -12 1 -15Z"></path>

      <path d="M-1 -10 C-7 -11 -9 -6 -5 -3 C0 -4 2 -7 -1 -10Z"></path>
      <path d="M1 -6 C7 -7 9 -2 5 1 C0 0 -2 -3 1 -6Z"></path>

      <path d="M-1 -1 C-7 -2 -9 3 -5 6 C0 5 2 2 -1 -1Z"></path>

    </g>

  </g>

  <!-- right flower spike -->
  <g transform="translate(90 24) scale(.72)" filter="url(#softShadow)">

    <path d="M0 5 L0 -20" stroke="#607b47" stroke-width="2.4"></path>

    <g fill="url(#flowerBlue)" stroke="#405d92" stroke-width="0.65">

      <path d="M-1 -19 C-7 -20 -9 -15 -5 -12 C0 -13 2 -16 -1 -19Z"></path>
      <path d="M1 -15 C7 -16 9 -11 5 -8 C0 -9 -2 -12 1 -15Z"></path>

      <path d="M-1 -10 C-7 -11 -9 -6 -5 -3 C0 -4 2 -7 -1 -10Z"></path>
      <path d="M1 -6 C7 -7 9 -2 5 1 C0 0 -2 -3 1 -6Z"></path>

      <path d="M-1 -1 C-7 -2 -9 3 -5 6 C0 5 2 2 -1 -1Z"></path>

    </g>

  </g>

  <!-- mature drying seed head -->
  <g transform="translate(96 68)" filter="url(#softShadow)">

    <path d="M0 23 L0 -15" stroke="#776145" stroke-width="2.4" stroke-linecap="round"></path>

    <g fill="url(#dryHead)" stroke="#65503a" stroke-width="0.6">

      <path d="M-1 -15 C-7 -16 -10 -11 -6 -7 C-1 -8 2 -11 -1 -15Z"></path>
      <path d="M1 -12 C7 -13 10 -8 6 -4 C1 -5 -2 -8 1 -12Z"></path>

      <path d="M-1 -6 C-8 -7 -10 -2 -6 2 C-1 1 2 -2 -1 -6Z"></path>
      <path d="M1 -3 C8 -4 10 1 6 5 C1 4 -2 1 1 -3Z"></path>

      <path d="M-1 3 C-8 2 -10 7 -6 11 C-1 10 2 7 -1 3Z"></path>
      <path d="M1 6 C8 5 10 10 6 14 C1 13 -2 10 1 6Z"></path>

      <path d="M-1 12 C-7 11 -9 16 -5 19 C0 18 2 15 -1 12Z"></path>

    </g>

  </g>

  <!-- loose chia seeds -->
  <g stroke="#302b2a" stroke-width="0.3" filter="url(#softShadow)">

    <ellipse cx="86" cy="108" rx="3.2" ry="2.3" fill="url(#seedDark)" transform="rotate(18 86 108)"></ellipse>

    <ellipse cx="93" cy="112" rx="3" ry="2.1" fill="url(#seedLight)" transform="rotate(-15 93 112)"></ellipse>

    <ellipse cx="101" cy="107" rx="3.1" ry="2.2" fill="url(#seedDark)" transform="rotate(25 101 107)"></ellipse>

    <ellipse cx="108" cy="112" rx="2.9" ry="2" fill="url(#seedLight)" transform="rotate(-20 108 112)"></ellipse>

    <ellipse cx="99" cy="116" rx="2.8" ry="1.9" fill="url(#seedDark)" transform="rotate(12 99 116)"></ellipse>

  </g>

  <!-- seed highlights -->
  <g fill="#f4ebdc" opacity="0.55">

    <ellipse cx="85" cy="107" rx="0.8" ry="0.45" transform="rotate(18 85 107)"></ellipse>

    <ellipse cx="92" cy="111" rx="0.75" ry="0.42" transform="rotate(-15 92 111)"></ellipse>

    <ellipse cx="100" cy="106" rx="0.8" ry="0.45" transform="rotate(25 100 106)"></ellipse>

  </g>

</svg>