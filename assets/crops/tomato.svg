<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="tomatoTitle tomatoDesc">
  <title id="tomatoTitle">Tomato</title>
  <desc id="tomatoDesc">
    Detailed ripe red tomato with green sepals,
    short stem, highlights, shadows and natural fruit contours.
  </desc>

  <defs>
    <radialGradient id="tomatoFruit" cx="34%" cy="27%" r="74%">
      <stop offset="0%" stop-color="#ff8a70"></stop>
      <stop offset="28%" stop-color="#ef5545"></stop>
      <stop offset="65%" stop-color="#d63232"></stop>
      <stop offset="100%" stop-color="#9f242a"></stop>
    </radialGradient>

    <radialGradient id="tomatoFruitDark" cx="42%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#f26853"></stop>
      <stop offset="55%" stop-color="#d93c36"></stop>
      <stop offset="100%" stop-color="#98252a"></stop>
    </radialGradient>

    <linearGradient id="tomatoLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#85c765"></stop>
      <stop offset="45%" stop-color="#4f9c4c"></stop>
      <stop offset="100%" stop-color="#286b3b"></stop>
    </linearGradient>

    <linearGradient id="tomatoLeafDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64ad55"></stop>
      <stop offset="100%" stop-color="#1d5734"></stop>
    </linearGradient>

    <linearGradient id="tomatoStem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#719e51"></stop>
      <stop offset="100%" stop-color="#395f38"></stop>
    </linearGradient>

    <filter id="tomatoShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#551d22" flood-opacity="0.24"></feDropShadow>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="64" cy="110" rx="38" ry="7" fill="#4b2528" opacity="0.13"></ellipse>

  <!-- Main fruit -->
  <g filter="url(#tomatoShadow)">
    <path d="M64 35
         C46 32 30 38 21 51
         C12 64 15 83 28 96
         C38 106 51 111 65 111
         C80 111 94 106 103 96
         C116 82 117 63 107 50
         C97 37 82 32 64 35Z" fill="url(#tomatoFruit)" stroke="#9b2b2c" stroke-width="1.7"></path>

    <!-- Lower fruit depth -->
    <path d="M26 80
         C34 97 49 104 65 104
         C82 104 96 96 104 81
         C102 97 87 110 65 111
         C43 110 28 98 26 80Z" fill="url(#tomatoFruitDark)" opacity="0.48"></path>

    <!-- Left fruit lobe -->
    <path d="M48 39
         C36 47 30 61 32 76
         C34 89 41 99 51 105" fill="none" stroke="#ff7463" stroke-width="2" stroke-linecap="round" opacity="0.28"></path>

    <!-- Right fruit lobe -->
    <path d="M82 39
         C94 49 99 63 96 77
         C94 90 86 100 77 105" fill="none" stroke="#851f27" stroke-width="2" stroke-linecap="round" opacity="0.27"></path>

    <!-- Main glossy highlight -->
    <path d="M34 54
         C39 46 47 42 55 42
         C49 47 45 53 43 61
         C41 67 39 70 35 69
         C30 67 31 60 34 54Z" fill="#ffffff" opacity="0.34"></path>

    <ellipse cx="40" cy="52" rx="4" ry="7" transform="rotate(38 40 52)" fill="#ffffff" opacity="0.42"></ellipse>

    <!-- Small surface shine -->
    <ellipse cx="50" cy="45" rx="3" ry="2" fill="#ffd6ca" opacity="0.52"></ellipse>
  </g>

  <!-- Stem -->
  <path d="M64 37
       C63 30 64 23 68 17
       C71 13 75 11 79 10" fill="none" stroke="url(#tomatoStem)" stroke-width="6" stroke-linecap="round"></path>

  <path d="M65 34
       C65 27 67 21 71 17" fill="none" stroke="#a6c47b" stroke-width="1.4" stroke-linecap="round" opacity="0.48"></path>

  <!-- Sepal star -->
  <g filter="url(#tomatoShadow)">
    <path d="M64 38
         C57 31 50 27 42 27
         C47 32 50 36 52 40

         C44 40 36 43 31 48
         C40 47 47 48 53 51

         C48 56 45 62 44 68
         C50 62 56 57 61 54

         C64 61 69 66 75 70
         C73 62 72 56 72 51

         C79 53 87 53 94 50
         C86 46 79 43 73 42

         C79 37 84 32 86 26
         C78 29 71 33 64 38Z" fill="url(#tomatoLeaf)" stroke="#28673a" stroke-width="1.3" stroke-linejoin="round"></path>

    <!-- Sepal depth -->
    <path d="M64 40
         C58 37 54 34 50 31
         C55 37 58 42 61 47" fill="none" stroke="#b4dc91" stroke-width="1.2" stroke-linecap="round" opacity="0.6"></path>

    <path d="M67 43
         C75 42 81 44 87 47" fill="none" stroke="#1e5633" stroke-width="1.2" stroke-linecap="round" opacity="0.5"></path>

    <circle cx="64" cy="42" r="5" fill="url(#tomatoLeafDark)"></circle>

    <circle cx="62.5" cy="40.5" r="1.6" fill="#96c577" opacity="0.55"></circle>
  </g>

  <!-- Fine tomato skin details -->
  <g fill="none" stroke="#7d2026" stroke-width="0.8" stroke-linecap="round" opacity="0.22">
    <path d="M36 91 C43 96 49 98 55 99"></path>
    <path d="M74 100 C83 98 90 94 95 88"></path>
    <path d="M27 70 C28 77 30 82 34 87"></path>
  </g>
</svg>