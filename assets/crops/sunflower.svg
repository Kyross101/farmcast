<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Sunflower</title>

  <desc id="desc">
    Detailed illustration of a yellow sunflower head, green leaves, stem, and mature striped sunflower seeds.
  </desc>

  <!-- Ground shadow -->
  <ellipse cx="66" cy="118" rx="42" ry="5" fill="#786449" opacity="0.16">
  </ellipse>

  <!-- Main stem -->
  <path d="M65 107
       C63 88 64 68 64 51" fill="none" stroke="#557a42" stroke-width="5" stroke-linecap="round">
  </path>

  <!-- Stem highlight -->
  <path d="M62 103
       C61 85 62 70 62 55" fill="none" stroke="#789958" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
  </path>

  <!-- Left leaf stem -->
  <path d="M63 79
       C54 74 48 68 43 62" fill="none" stroke="#557a42" stroke-width="3" stroke-linecap="round">
  </path>

  <!-- Left leaf -->
  <path d="M44 63
       C33 54 21 57 17 67
       C24 77 36 81 48 75
       C49 70 47 66 44 63Z" fill="#699751" stroke="#416c3a" stroke-width="2">
  </path>

  <!-- Left leaf vein -->
  <path d="M20 67
       C29 67 37 68 45 72

       M30 67
       L27 61

       M36 69
       L35 62" fill="none" stroke="#91b078" stroke-width="1.4" stroke-linecap="round">
  </path>

  <!-- Right leaf stem -->
  <path d="M66 72
       C75 68 82 62 87 56" fill="none" stroke="#557a42" stroke-width="3" stroke-linecap="round">
  </path>

  <!-- Right leaf -->
  <path d="M86 57
       C98 49 109 53 112 64
       C104 73 92 76 82 69
       C81 65 83 60 86 57Z" fill="#6e9b54" stroke="#416c3a" stroke-width="2">
  </path>

  <!-- Right leaf veins -->
  <path d="M108 63
       C99 62 91 64 84 67

       M99 62
       L102 57

       M93 64
       L94 58" fill="none" stroke="#94b37a" stroke-width="1.4" stroke-linecap="round">
  </path>

  <!-- Sunflower petals - back layer -->
  <g fill="#eaaa21" stroke="#c88616" stroke-width="1.4">

    <ellipse cx="64" cy="17" rx="6" ry="16"></ellipse>
    <ellipse cx="64" cy="55" rx="6" ry="16"></ellipse>

    <ellipse cx="45" cy="23" rx="6" ry="16" transform="rotate(-45 45 23)">
    </ellipse>

    <ellipse cx="83" cy="23" rx="6" ry="16" transform="rotate(45 83 23)">
    </ellipse>

    <ellipse cx="39" cy="36" rx="6" ry="16" transform="rotate(-90 39 36)">
    </ellipse>

    <ellipse cx="89" cy="36" rx="6" ry="16" transform="rotate(90 89 36)">
    </ellipse>

    <ellipse cx="46" cy="50" rx="6" ry="16" transform="rotate(-135 46 50)">
    </ellipse>

    <ellipse cx="82" cy="50" rx="6" ry="16" transform="rotate(135 82 50)">
    </ellipse>

  </g>

  <!-- Front petal layer -->
  <g fill="#f4bd2c" stroke="#d49318" stroke-width="1.4">

    <ellipse cx="53" cy="19" rx="5" ry="15" transform="rotate(-22 53 19)">
    </ellipse>

    <ellipse cx="75" cy="19" rx="5" ry="15" transform="rotate(22 75 19)">
    </ellipse>

    <ellipse cx="42" cy="29" rx="5" ry="15" transform="rotate(-66 42 29)">
    </ellipse>

    <ellipse cx="86" cy="29" rx="5" ry="15" transform="rotate(66 86 29)">
    </ellipse>

    <ellipse cx="41" cy="44" rx="5" ry="15" transform="rotate(-112 41 44)">
    </ellipse>

    <ellipse cx="87" cy="44" rx="5" ry="15" transform="rotate(112 87 44)">
    </ellipse>

    <ellipse cx="54" cy="54" rx="5" ry="15" transform="rotate(-158 54 54)">
    </ellipse>

    <ellipse cx="74" cy="54" rx="5" ry="15" transform="rotate(158 74 54)">
    </ellipse>

  </g>

  <!-- Flower center outer disk -->
  <circle cx="64" cy="36" r="23" fill="#714922" stroke="#563719" stroke-width="2.4">
  </circle>

  <!-- Middle seed disk -->
  <circle cx="64" cy="36" r="18" fill="#895828">
  </circle>

  <!-- Seed spiral texture -->
  <g fill="#b9873a" stroke="#5e3d20" stroke-width="0.6">

    <circle cx="64" cy="23" r="2"></circle>
    <circle cx="57" cy="25" r="2"></circle>
    <circle cx="71" cy="25" r="2"></circle>

    <circle cx="51" cy="30" r="2"></circle>
    <circle cx="59" cy="30" r="2"></circle>
    <circle cx="67" cy="30" r="2"></circle>
    <circle cx="75" cy="30" r="2"></circle>

    <circle cx="49" cy="37" r="2"></circle>
    <circle cx="57" cy="37" r="2"></circle>
    <circle cx="64" cy="36" r="2.2"></circle>
    <circle cx="72" cy="37" r="2"></circle>
    <circle cx="79" cy="37" r="2"></circle>

    <circle cx="52" cy="44" r="2"></circle>
    <circle cx="60" cy="43" r="2"></circle>
    <circle cx="68" cy="44" r="2"></circle>
    <circle cx="76" cy="44" r="2"></circle>

    <circle cx="58" cy="49" r="2"></circle>
    <circle cx="65" cy="50" r="2"></circle>
    <circle cx="72" cy="49" r="2"></circle>

  </g>

  <!-- Center highlight dots -->
  <g fill="#d2a54b" opacity="0.8">
    <circle cx="55" cy="28" r="1"></circle>
    <circle cx="65" cy="27" r="1"></circle>
    <circle cx="73" cy="33" r="1"></circle>
    <circle cx="60" cy="39" r="1"></circle>
    <circle cx="69" cy="41" r="1"></circle>
    <circle cx="55" cy="45" r="1"></circle>
  </g>

  <!-- Loose mature sunflower seeds -->
  <ellipse cx="35" cy="103" rx="5" ry="10" transform="rotate(-18 35 103)" fill="#3e3830" stroke="#24211d" stroke-width="1.7">
  </ellipse>

  <ellipse cx="51" cy="109" rx="5" ry="10" transform="rotate(10 51 109)" fill="#e4d6b6" stroke="#6d6250" stroke-width="1.7">
  </ellipse>

  <ellipse cx="68" cy="108" rx="5" ry="10" transform="rotate(-7 68 108)" fill="#3b362f" stroke="#211f1b" stroke-width="1.7">
  </ellipse>

  <ellipse cx="86" cy="106" rx="5" ry="10" transform="rotate(13 86 106)" fill="#ddd0b2" stroke="#685e4e" stroke-width="1.7">
  </ellipse>

  <ellipse cx="102" cy="99" rx="5" ry="10" transform="rotate(20 102 99)" fill="#403a32" stroke="#24211d" stroke-width="1.7">
  </ellipse>

  <!-- Seed stripes -->
  <path d="M33 95 L37 111
       M49 100 L53 117
       M66 99 L70 116
       M84 97 L88 114
       M99 90 L105 107" fill="none" stroke="#bcae90" stroke-width="1.2" stroke-linecap="round" opacity="0.8">
  </path>

</svg>