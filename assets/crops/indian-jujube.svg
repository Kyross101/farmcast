<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Indian Jujube</title>

  <desc id="desc">
    A cluster of ripe golden-green Indian jujube fruits with small green leaves.
  </desc>

  <!-- Leaves -->
  <ellipse cx="42" cy="29" rx="17" ry="8" transform="rotate(-27 42 29)" fill="#65934d" stroke="#416d3b" stroke-width="1.8">
  </ellipse>

  <ellipse cx="91" cy="31" rx="17" ry="8" transform="rotate(27 91 31)" fill="#65934d" stroke="#416d3b" stroke-width="1.8">
  </ellipse>

  <!-- Leaf veins -->
  <path d="M29 36 L55 25
       M78 26 L104 38" fill="none" stroke="#96b17e" stroke-width="1.4" stroke-linecap="round">
  </path>

  <!-- Small fruit stems -->
  <path d="M64 23
       C56 34 52 44 50 55

       M64 23
       C65 36 67 46 68 56

       M64 23
       C75 33 82 44 86 56" fill="none" stroke="#6b6b40" stroke-width="3" stroke-linecap="round">
  </path>

  <!-- Left fruit -->
  <ellipse cx="49" cy="70" rx="15" ry="19" fill="#c5a54f" stroke="#917833" stroke-width="2.2">
  </ellipse>

  <path d="M42 59
       C38 66 39 76 43 82" fill="none" stroke="#e5cf83" stroke-width="2.2" stroke-linecap="round">
  </path>

  <!-- Center fruit -->
  <ellipse cx="68" cy="81" rx="17" ry="21" fill="#d1ad50" stroke="#967a34" stroke-width="2.3">
  </ellipse>

  <!-- Center ripe blush -->
  <path d="M74 62
       C85 69 87 84 81 95
       C78 100 74 103 69 103
       C74 91 76 76 74 62Z" fill="#ad743f" opacity="0.72">
  </path>

  <path d="M59 69
       C55 77 56 88 61 94" fill="none" stroke="#e9d38a" stroke-width="2.2" stroke-linecap="round">
  </path>

  <!-- Right fruit -->
  <ellipse cx="89" cy="70" rx="15" ry="19" fill="#caa24a" stroke="#907432" stroke-width="2.2">
  </ellipse>

  <!-- Right ripe blush -->
  <path d="M94 53
       C103 60 105 72 100 81
       C97 85 94 88 90 89
       C94 78 96 65 94 53Z" fill="#a96f3d" opacity="0.68">
  </path>

  <path d="M81 60
       C78 67 79 76 83 81" fill="none" stroke="#e6ce80" stroke-width="2" stroke-linecap="round">
  </path>

  <!-- Lower fruit -->
  <ellipse cx="67" cy="101" rx="13" ry="11" fill="#bd8f43" stroke="#89672f" stroke-width="2">
  </ellipse>

  <!-- Soft ground shadow -->
  <ellipse cx="68" cy="116" rx="37" ry="5" fill="#81664a" opacity="0.2">
  </ellipse>

</svg>