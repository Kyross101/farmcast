<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Orange</title>

  <desc id="desc">
    Detailed botanical illustration of sweet orange with glossy green citrus
    leaves, fragrant white blossom, ripe orange fruits, and one sliced fruit
    showing juicy segments, highlights, shadows, and natural depth.
  </desc>

  <defs>

    <linearGradient id="branchBrown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#987051"></stop>
      <stop offset="0.55" stop-color="#694a36"></stop>
      <stop offset="1" stop-color="#423129"></stop>
    </linearGradient>

    <linearGradient id="leafGreen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1f5834"></stop>
      <stop offset="0.5" stop-color="#438942"></stop>
      <stop offset="1" stop-color="#91c66c"></stop>
    </linearGradient>

    <linearGradient id="leafDark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#19472f"></stop>
      <stop offset="1" stop-color="#5d9850"></stop>
    </linearGradient>

    <radialGradient id="orangeFruit" cx="32%" cy="25%" r="75%">
      <stop offset="0" stop-color="#ffd56a"></stop>
      <stop offset="0.38" stop-color="#f6a62f"></stop>
      <stop offset="0.72" stop-color="#e3771e"></stop>
      <stop offset="1" stop-color="#b74d17"></stop>
    </radialGradient>

    <radialGradient id="orangeDark" cx="32%" cy="25%" r="75%">
      <stop offset="0" stop-color="#ffc55a"></stop>
      <stop offset="0.45" stop-color="#ef9426"></stop>
      <stop offset="1" stop-color="#bd5518"></stop>
    </radialGradient>

    <radialGradient id="orangeFlesh" cx="45%" cy="42%" r="65%">
      <stop offset="0" stop-color="#ffe494"></stop>
      <stop offset="0.45" stop-color="#ffc85b"></stop>
      <stop offset="1" stop-color="#ef8c28"></stop>
    </radialGradient>

    <linearGradient id="petalWhite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf7"></stop>
      <stop offset="1" stop-color="#e5e0d5"></stop>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#202a21" flood-opacity="0.26"></feDropShadow>
    </filter>

  </defs>

  <!-- Ground shadow -->
  <ellipse cx="64" cy="116" rx="39" ry="6" fill="#273128" opacity="0.17"></ellipse>

  <!-- Main branch -->
  <path d="
    M18 105
    C34 91 47 75 58 59
    C71 42 85 28 106 15" fill="none" stroke="url(#branchBrown)" stroke-width="6" stroke-linecap="round" filter="url(#softShadow)"></path>

  <!-- Side branches -->
  <g fill="none" stroke="url(#branchBrown)" stroke-linecap="round">

    <path d="
      M48 75
      C39 63 33 52 31 40" stroke-width="3.4"></path>

    <path d="
      M61 56
      C55 44 52 33 53 21" stroke-width="3.1"></path>

    <path d="
      M76 39
      C88 41 100 37 112 29" stroke-width="3"></path>

    <path d="
      M38 90
      C30 86 23 81 17 76" stroke-width="2.7"></path>

  </g>

  <!-- Branch highlight -->
  <path d="
    M22 101
    C38 87 50 72 61 57
    C74 41 88 28 103 18" fill="none" stroke="#ba9270" stroke-width="1" stroke-linecap="round" opacity="0.58"></path>

  <!-- Leaves -->
  <g stroke="#235137" stroke-width="1.2" filter="url(#softShadow)">

    <path d="
      M31 41
      C20 31 10 34 7 43
      C15 52 26 52 34 46
      C37 44 35 42 31 41Z" fill="url(#leafGreen)"></path>

    <path d="
      M41 58
      C30 49 20 53 18 62
      C27 70 38 68 45 62
      C48 60 45 58 41 58Z" fill="url(#leafDark)"></path>

    <path d="
      M53 22
      C43 14 34 17 31 26
      C39 34 49 33 56 27
      C59 25 57 23 53 22Z" fill="url(#leafGreen)"></path>

    <path d="
      M70 46
      C79 36 90 36 97 43
      C91 53 81 56 71 52
      C68 51 68 48 70 46Z" fill="url(#leafGreen)"></path>

    <path d="
      M92 30
      C101 20 112 21 118 29
      C111 38 101 40 92 35
      C89 34 89 31 92 30Z" fill="url(#leafDark)"></path>

    <path d="
      M96 49
      C106 40 116 43 120 51
      C113 59 103 60 95 55
      C92 53 93 51 96 49Z" fill="url(#leafGreen)"></path>

  </g>

  <!-- Leaf veins -->
  <g fill="none" stroke="#b9d89c" stroke-width="0.85" stroke-linecap="round" opacity="0.72">

    <path d="M10 43 C18 43 26 44 33 44"></path>
    <path d="M21 62 C29 61 38 61 43 60"></path>
    <path d="M34 26 C42 26 49 25 55 25"></path>

    <path d="M94 44 C85 47 78 49 72 50"></path>
    <path d="M115 29 C107 31 100 33 93 34"></path>
    <path d="M117 51 C109 52 102 53 96 53"></path>

  </g>

  <!-- Fruit stems -->
  <g fill="none" stroke="#5d6539" stroke-width="2" stroke-linecap="round">

    <path d="M52 65 C51 72 51 78 52 84"></path>
    <path d="M69 55 C72 62 74 68 75 74"></path>
    <path d="M40 77 C39 84 39 89 40 95"></path>

  </g>

  <!-- Orange 1 -->
  <circle cx="52" cy="94" r="16" fill="url(#orangeFruit)" stroke="#ad5119" stroke-width="1.6" filter="url(#softShadow)"></circle>

  <!-- Orange 2 -->
  <circle cx="77" cy="84" r="15" fill="url(#orangeDark)" stroke="#ab4e17" stroke-width="1.6" filter="url(#softShadow)"></circle>

  <!-- Smaller fruit -->
  <circle cx="38" cy="103" r="12" fill="url(#orangeFruit)" stroke="#ad5119" stroke-width="1.4" filter="url(#softShadow)"></circle>

  <!-- Fruit highlights -->
  <g fill="#ffe5a0" opacity="0.72">

    <ellipse cx="46" cy="87" rx="3.4" ry="4.8" transform="rotate(-30 46 87)"></ellipse>

    <ellipse cx="72" cy="78" rx="3" ry="4.4" transform="rotate(-30 72 78)"></ellipse>

    <ellipse cx="34" cy="98" rx="2.4" ry="3.6" transform="rotate(-30 34 98)"></ellipse>

  </g>

  <!-- Orange peel texture -->
  <g fill="#a94c18" opacity="0.45">

    <circle cx="59" cy="91" r="0.65"></circle>
    <circle cx="48" cy="101" r="0.6"></circle>
    <circle cx="61" cy="101" r="0.55"></circle>
    <circle cx="83" cy="80" r="0.65"></circle>
    <circle cx="72" cy="89" r="0.6"></circle>
    <circle cx="84" cy="91" r="0.55"></circle>

  </g>

  <!-- Cut orange -->
  <circle cx="94" cy="102" r="20" fill="#d36a1f" stroke="#a94c17" stroke-width="1.7" filter="url(#softShadow)"></circle>

  <circle cx="94" cy="102" r="16.7" fill="url(#orangeFlesh)" stroke="#ffd176" stroke-width="1.2"></circle>

  <!-- Central pith -->
  <circle cx="94" cy="102" r="3.2" fill="#fff0c2"></circle>

  <!-- Orange segments -->
  <g fill="none" stroke="#fff0b9" stroke-width="1.25" stroke-linecap="round">

    <path d="M94 99 L94 86"></path>
    <path d="M96 100 L105 90"></path>
    <path d="M97 102 L110 99"></path>
    <path d="M97 104 L106 113"></path>

    <path d="M94 105 L94 118"></path>
    <path d="M92 104 L83 114"></path>
    <path d="M91 102 L78 100"></path>
    <path d="M92 100 L83 90"></path>

  </g>

  <!-- Juice highlights -->
  <g fill="#fff5cf" opacity="0.58">

    <ellipse cx="98" cy="92" rx="1.4" ry="3" transform="rotate(35 98 92)"></ellipse>

    <ellipse cx="104" cy="103" rx="3" ry="1.3" transform="rotate(5 104 103)"></ellipse>

    <ellipse cx="88" cy="111" rx="1.4" ry="3" transform="rotate(35 88 111)"></ellipse>

  </g>

  <!-- Flower branch -->
  <path d="
    M76 39
    C78 32 82 26 87 20" fill="none" stroke="#607443" stroke-width="1.5" stroke-linecap="round"></path>

  <!-- Orange blossom -->
  <g transform="translate(88 18)" filter="url(#softShadow)">

    <path d="
      M0 0
      C-7 -1 -10 -6 -7 -10
      C-3 -14 2 -10 2 -4Z" fill="url(#petalWhite)" stroke="#cbc7bb" stroke-width="0.7"></path>

    <path d="
      M0 0
      C2 -7 7 -10 11 -7
      C14 -3 10 2 5 2Z" fill="url(#petalWhite)" stroke="#cbc7bb" stroke-width="0.7"></path>

    <path d="
      M0 0
      C7 2 9 7 6 11
      C2 14 -2 9 -2 4Z" fill="url(#petalWhite)" stroke="#cbc7bb" stroke-width="0.7"></path>

    <path d="
      M0 0
      C-2 7 -7 10 -11 6
      C-14 2 -10 -2 -4 -2Z" fill="url(#petalWhite)" stroke="#cbc7bb" stroke-width="0.7"></path>

    <path d="
      M0 0
      C-4 -5 -2 -10 2 -11
      C7 -10 8 -5 4 -2Z" fill="url(#petalWhite)" stroke="#cbc7bb" stroke-width="0.7"></path>

    <circle cx="0" cy="0" r="3.2" fill="#e3bd43"></circle>

    <g fill="#826626">
      <circle cx="-1.5" cy="-1" r="0.55"></circle>

      <circle cx="1.4" cy="-1" r="0.55"></circle>

      <circle cx="0" cy="1.4" r="0.55"></circle>
    </g>

  </g>

  <!-- Small calyxes -->
  <path d="
    M48 80
    L52 77
    L56 80
    L54 84
    L50 84Z" fill="#507a39" stroke="#355c32" stroke-width="0.7"></path>

  <path d="
    M71 71
    L75 68
    L79 71
    L77 75
    L73 75Z" fill="#507a39" stroke="#355c32" stroke-width="0.7"></path>

</svg>