<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Lemon Balm</title>

  <desc id="desc">
    Detailed botanical illustration of lemon balm with textured green leaves,
    square branching stems, small pale flowers, and fresh harvested sprigs.
  </desc>

  <defs>
    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fc487"></stop>
      <stop offset="0.5" stop-color="#67a064"></stop>
      <stop offset="1" stop-color="#3d744d"></stop>
    </linearGradient>

    <linearGradient id="leafLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b7d59d"></stop>
      <stop offset="1" stop-color="#5a8e58"></stop>
    </linearGradient>

    <linearGradient id="stemGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86a96b"></stop>
      <stop offset="1" stop-color="#4f7449"></stop>
    </linearGradient>

    <linearGradient id="flowerWhite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffef7"></stop>
      <stop offset="1" stop-color="#e6e9dc"></stop>
    </linearGradient>

    <linearGradient id="flowerPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efd4dd"></stop>
      <stop offset="1" stop-color="#c48fa4"></stop>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#283129" flood-opacity="0.23"></feDropShadow>
    </filter>
  </defs>

  <ellipse cx="64" cy="119" rx="44" ry="5" fill="#535048" opacity="0.15"></ellipse>

  <!-- Main square stems -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round">

    <path d="M63 109
         C62 91 63 74 64 57
         C65 42 64 29 61 17" stroke-width="5"></path>

    <path d="M52 108
         C52 92 50 77 47 64
         C45 52 41 42 36 33" stroke-width="3.4"></path>

    <path d="M75 108
         C75 92 78 77 82 64
         C86 52 91 42 96 34" stroke-width="3.4"></path>

  </g>

  <!-- Stem highlights -->
  <g fill="none" stroke="#b5cb94" stroke-linecap="round" opacity="0.65">

    <path d="M66 105
         C65 85 66 65 66 46" stroke-width="1.1"></path>

    <path d="M54 104
         C54 87 52 72 49 59" stroke-width="0.9"></path>

  </g>

  <!-- Left leaves -->
  <g filter="url(#softShadow)">

    <path d="M58 90
         C46 80 33 77 22 83
         C30 95 44 100 59 96Z" fill="url(#leafGreen)" stroke="#35623f" stroke-width="2"></path>

    <path d="M56 71
         C44 61 32 58 22 64
         C30 76 43 81 57 77Z" fill="url(#leafLight)" stroke="#35623f" stroke-width="2"></path>

    <path d="M57 53
         C46 43 34 40 25 46
         C33 57 45 62 58 59Z" fill="url(#leafGreen)" stroke="#35623f" stroke-width="1.8"></path>

  </g>

  <!-- Right leaves -->
  <g filter="url(#softShadow)">

    <path d="M72 90
         C84 80 98 77 109 84
         C101 96 87 100 72 96Z" fill="url(#leafGreen)" stroke="#35623f" stroke-width="2"></path>

    <path d="M73 71
         C85 61 98 59 108 65
         C100 77 87 81 73 77Z" fill="url(#leafLight)" stroke="#35623f" stroke-width="2"></path>

    <path d="M73 53
         C84 43 96 40 105 46
         C97 57 85 61 72 59Z" fill="url(#leafGreen)" stroke="#35623f" stroke-width="1.8"></path>

  </g>

  <!-- Serrated edges -->
  <g fill="none" stroke="#2f5939" stroke-width="1" stroke-linecap="round" opacity="0.8">

    <path d="M26 84 l3 -3 l3 4 l4 -3 l3 4 l4 -2 l3 4 l4 -1"></path>
    <path d="M26 65 l3 -3 l3 4 l4 -3 l3 4 l4 -2 l3 4 l4 -1"></path>
    <path d="M105 85 l-3 -3 l-3 4 l-4 -3 l-3 4 l-4 -2 l-3 4 l-4 -1"></path>
    <path d="M104 66 l-3 -3 l-3 4 l-4 -3 l-3 4 l-4 -2 l-3 4 l-4 -1"></path>

  </g>

  <!-- Leaf veins -->
  <g fill="none" stroke="#c2d8b4" stroke-linecap="round" opacity="0.8">

    <path d="M25 84 C38 86 49 91 57 95" stroke-width="1.1"></path>
    <path d="M25 65 C37 68 47 72 55 76" stroke-width="1.1"></path>
    <path d="M28 47 C39 50 49 55 56 58" stroke-width="1"></path>

    <path d="M106 85 C94 87 83 91 74 95" stroke-width="1.1"></path>
    <path d="M105 66 C94 69 83 72 75 76" stroke-width="1.1"></path>
    <path d="M102 47 C92 50 82 55 74 58" stroke-width="1"></path>

  </g>

  <!-- Leaf texture -->
  <g fill="none" stroke="#8fb384" stroke-width="0.75" opacity="0.62">

    <path d="M34 84 C39 87 43 89 48 91"></path>
    <path d="M34 66 C39 69 43 71 48 73"></path>
    <path d="M95 84 C90 87 86 89 81 91"></path>
    <path d="M95 66 C90 69 86 71 81 73"></path>

  </g>

  <!-- Flower branches -->
  <g fill="none" stroke="#6f7c4d" stroke-width="1.3" stroke-linecap="round">

    <path d="M63 47 L52 38"></path>
    <path d="M64 44 L65 33"></path>
    <path d="M65 45 L77 36"></path>
    <path d="M52 38 L45 31"></path>
    <path d="M52 38 L53 29"></path>
    <path d="M77 36 L76 28"></path>
    <path d="M77 36 L84 30"></path>

  </g>

  <!-- Pale flowers -->
  <g filter="url(#softShadow)">

    <g transform="translate(45 30)">
      <path d="M0 0
           C-5 -5 -4 -10 0 -12
           C4 -10 5 -5 0 0Z" fill="url(#flowerWhite)" stroke="#b8beb0" stroke-width="0.8"></path>

      <path d="M0 0
           C5 -4 9 -3 10 1
           C8 5 4 5 0 0Z" fill="url(#flowerWhite)" stroke="#b8beb0" stroke-width="0.8"></path>

      <path d="M0 0
           C2 5 0 9 -4 9
           C-7 6 -6 2 0 0Z" fill="url(#flowerPink)" stroke="#9b7388" stroke-width="0.8"></path>

      <circle cx="0" cy="0" r="1.6" fill="#d6b75f"></circle>
    </g>

    <g transform="translate(66 31) scale(0.9)">
      <path d="M0 0 C-5 -5 -4 -10 0 -12 C4 -10 5 -5 0 0Z" fill="url(#flowerWhite)" stroke="#b8beb0" stroke-width="0.8"></path>

      <path d="M0 0 C5 -4 9 -3 10 1 C8 5 4 5 0 0Z" fill="url(#flowerWhite)" stroke="#b8beb0" stroke-width="0.8"></path>

      <path d="M0 0 C2 5 0 9 -4 9 C-7 6 -6 2 0 0Z" fill="url(#flowerPink)" stroke="#9b7388" stroke-width="0.8"></path>

      <circle cx="0" cy="0" r="1.6" fill="#d6b75f"></circle>
    </g>

    <g transform="translate(84 29) scale(0.82)">
      <path d="M0 0 C-5 -5 -4 -10 0 -12 C4 -10 5 -5 0 0Z" fill="url(#flowerWhite)" stroke="#b8beb0" stroke-width="0.8"></path>

      <path d="M0 0 C5 -4 9 -3 10 1 C8 5 4 5 0 0Z" fill="url(#flowerWhite)" stroke="#b8beb0" stroke-width="0.8"></path>

      <path d="M0 0 C2 5 0 9 -4 9 C-7 6 -6 2 0 0Z" fill="url(#flowerPink)" stroke="#9b7388" stroke-width="0.8"></path>

      <circle cx="0" cy="0" r="1.6" fill="#d6b75f"></circle>
    </g>

  </g>

  <!-- Harvested sprig -->
  <g transform="translate(37 107) rotate(-14)" filter="url(#softShadow)">

    <path d="M-15 2 C-5 1 6 -1 18 -3" fill="none" stroke="#557247" stroke-width="2.2" stroke-linecap="round"></path>

    <path d="M-8 0 C-13 -4 -17 -3 -18 0 C-14 3 -11 3 -8 2Z" fill="url(#leafGreen)" stroke="#35623f" stroke-width="1"></path>

    <path d="M0 -1 C-5 -5 -8 -4 -10 -1 C-6 2 -3 2 0 1Z" fill="url(#leafLight)" stroke="#35623f" stroke-width="1"></path>

    <path d="M8 -2 C3 -6 0 -5 -2 -2 C2 1 5 1 8 0Z" fill="url(#leafGreen)" stroke="#35623f" stroke-width="1"></path>

    <path d="M15 -3 C10 -7 7 -6 5 -3 C9 0 12 0 15 -1Z" fill="url(#leafLight)" stroke="#35623f" stroke-width="1"></path>

  </g>

  <!-- Second harvested sprig -->
  <g transform="translate(92 109) rotate(16)" opacity="0.95">

    <path d="M-12 1 C-3 0 6 -1 14 -2" fill="none" stroke="#557247" stroke-width="2" stroke-linecap="round"></path>

    <path d="M-5 0 C-9 -4 -12 -4 -14 -2 C-11 1 -8 2 -5 2Z" fill="url(#leafGreen)" stroke="#35623f" stroke-width="0.9"></path>

    <path d="M3 -1 C-1 -5 -4 -5 -6 -3 C-3 0 0 1 3 1Z" fill="url(#leafLight)" stroke="#35623f" stroke-width="0.9"></path>

    <path d="M10 -2 C6 -6 3 -6 1 -4 C4 -1 7 0 10 0Z" fill="url(#leafGreen)" stroke="#35623f" stroke-width="0.9"></path>

  </g>

  <!-- Highlights -->
  <g fill="#efe4bd" opacity="0.6">
    <circle cx="49" cy="64" r="1"></circle>
    <circle cx="84" cy="62" r="1"></circle>
    <circle cx="58" cy="43" r="0.9"></circle>
  </g>

</svg>