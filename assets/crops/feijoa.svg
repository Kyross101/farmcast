<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Feijoa</title>

  <desc id="desc">
    Three ripe green feijoa fruits with silvery-green leaves.
  </desc>

  <!-- Leaves -->
  <ellipse cx="42" cy="29" rx="18" ry="8" transform="rotate(-27 42 29)" fill="#668c67" stroke="#496c4a" stroke-width="1.8">
  </ellipse>

  <ellipse cx="91" cy="30" rx="18" ry="8" transform="rotate(27 91 30)" fill="#668c67" stroke="#496c4a" stroke-width="1.8">
  </ellipse>

  <!-- Leaf highlights -->
  <path d="M29 36 L55 25
       M78 25 L104 37" fill="none" stroke="#a6b9a1" stroke-width="1.4" stroke-linecap="round">
  </path>

  <!-- Small fruit stems -->
  <path d="M64 22
       C56 34 52 44 50 55

       M64 22
       C64 35 66 45 68 56

       M64 22
       C75 33 82 44 86 55" fill="none" stroke="#667043" stroke-width="3" stroke-linecap="round">
  </path>

  <!-- Left feijoa -->
  <ellipse cx="49" cy="71" rx="15" ry="21" fill="#78964f" stroke="#526e3c" stroke-width="2.2">
  </ellipse>

  <path d="M41 59
       C38 67 39 77 43 84" fill="none" stroke="#a9c17b" stroke-width="2.2" stroke-linecap="round">
  </path>

  <!-- Center feijoa -->
  <ellipse cx="68" cy="83" rx="17" ry="23" fill="#829f55" stroke="#566f3d" stroke-width="2.3">
  </ellipse>

  <path d="M59 69
       C55 78 56 90 61 97" fill="none" stroke="#b4ca84" stroke-width="2.2" stroke-linecap="round">
  </path>

  <!-- Right feijoa -->
  <ellipse cx="89" cy="71" rx="15" ry="21" fill="#74914d" stroke="#506b3b" stroke-width="2.2">
  </ellipse>

  <path d="M81 59
       C78 67 79 77 83 84" fill="none" stroke="#a7be78" stroke-width="2" stroke-linecap="round">
  </path>

  <!-- Blossom-end marks -->
  <path d="M45 91 L49 87 L53 91
       M64 105 L68 101 L72 105
       M85 91 L89 87 L93 91" fill="none" stroke="#52613b" stroke-width="1.6" stroke-linecap="round">
  </path>

  <!-- Shadow -->
  <ellipse cx="69" cy="116" rx="37" ry="5" fill="#81664a" opacity="0.2">
  </ellipse>

</svg>