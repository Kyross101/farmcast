<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Almond</title>

  <desc id="desc">
    Detailed botanical illustration of an almond branch with narrow green
    leaves, pale pink-white blossom, green almond hulls, a mature split hull,
    and a visible brown almond shell with natural highlights and shadows.
  </desc>

  <defs>

    <linearGradient id="branchBrown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b765a"></stop>
      <stop offset="0.55" stop-color="#6b4e3e"></stop>
      <stop offset="1" stop-color="#40322b"></stop>
    </linearGradient>

    <linearGradient id="leafGreen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#285c38"></stop>
      <stop offset="0.52" stop-color="#55934f"></stop>
      <stop offset="1" stop-color="#9ac778"></stop>
    </linearGradient>

    <linearGradient id="leafDark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#204831"></stop>
      <stop offset="1" stop-color="#669d58"></stop>
    </linearGradient>

    <radialGradient id="greenHull" cx="32%" cy="24%" r="75%">
      <stop offset="0" stop-color="#d1d983"></stop>
      <stop offset="0.42" stop-color="#8eaa55"></stop>
      <stop offset="0.78" stop-color="#637d43"></stop>
      <stop offset="1" stop-color="#435b35"></stop>
    </radialGradient>

    <linearGradient id="splitHull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6bf71"></stop>
      <stop offset="0.55" stop-color="#778c4c"></stop>
      <stop offset="1" stop-color="#51663c"></stop>
    </linearGradient>

    <radialGradient id="almondShell" cx="32%" cy="24%" r="78%">
      <stop offset="0" stop-color="#e4bc7f"></stop>
      <stop offset="0.48" stop-color="#bc8655"></stop>
      <stop offset="0.82" stop-color="#83583d"></stop>
      <stop offset="1" stop-color="#5a3c30"></stop>
    </radialGradient>

    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf7"></stop>
      <stop offset="0.72" stop-color="#f1d5d6"></stop>
      <stop offset="1" stop-color="#ddb5bd"></stop>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#222a22" flood-opacity="0.26"></feDropShadow>
    </filter>

  </defs>

  <!-- ground shadow -->
  <ellipse cx="64" cy="116" rx="39" ry="6" fill="#273128" opacity="0.16"></ellipse>

  <!-- main branch -->
  <path d="
    M18 105
    C34 91 47 76 58 60
    C71 42 85 28 106 15" fill="none" stroke="url(#branchBrown)" stroke-width="6" stroke-linecap="round" filter="url(#softShadow)"></path>

  <!-- side branches -->
  <g fill="none" stroke="url(#branchBrown)" stroke-linecap="round">

    <path d="
      M47 77
      C39 64 33 52 31 40" stroke-width="3.4"></path>

    <path d="
      M61 56
      C55 44 52 32 53 20" stroke-width="3.1"></path>

    <path d="
      M76 39
      C88 41 100 37 112 29" stroke-width="3"></path>

    <path d="
      M38 90
      C30 86 23 81 17 76" stroke-width="2.7"></path>

  </g>

  <!-- bark highlight -->
  <path d="
    M22 101
    C38 87 50 73 61 57
    C74 41 88 28 103 18" fill="none" stroke="#bc9676" stroke-width="1" stroke-linecap="round" opacity="0.58"></path>

  <!-- almond leaves -->
  <g stroke="#285138" stroke-width="1.1" filter="url(#softShadow)">

    <path d="
      M31 41
      C20 33 10 36 7 44
      C16 51 26 51 34 46
      C37 44 35 42 31 41Z" fill="url(#leafGreen)"></path>

    <path d="
      M41 58
      C30 50 20 54 18 63
      C27 70 38 68 45 62
      C48 60 45 58 41 58Z" fill="url(#leafDark)"></path>

    <path d="
      M53 22
      C43 14 34 17 31 26
      C39 34 49 33 56 27
      C59 25 57 23 53 22Z" fill="url(#leafGreen)"></path>

    <path d="
      M70 46
      C79 36 90 36 97 43
      C91 53 81 56 71 52
      C68 51 68 48 70 46Z" fill="url(#leafGreen)"></path>

    <path d="
      M92 30
      C101 20 112 21 118 29
      C111 38 101 40 92 35
      C89 34 89 31 92 30Z" fill="url(#leafDark)"></path>

    <path d="
      M96 49
      C106 40 116 43 120 51
      C113 59 103 60 95 55
      C92 53 93 51 96 49Z" fill="url(#leafGreen)"></path>

  </g>

  <!-- fine leaf veins -->
  <g fill="none" stroke="#bed7a0" stroke-width="0.8" stroke-linecap="round" opacity="0.73">

    <path d="M10 44 C18 44 26 44 33 44"></path>
    <path d="M21 63 C29 62 37 61 43 60"></path>
    <path d="M34 26 C42 26 49 25 55 25"></path>

    <path d="M94 44 C85 47 78 49 72 50"></path>
    <path d="M115 29 C107 31 100 33 93 34"></path>
    <path d="M117 51 C109 52 102 53 96 53"></path>

  </g>

  <!-- fruit stems -->
  <g fill="none" stroke="#615f3d" stroke-width="1.8" stroke-linecap="round">

    <path d="M52 65 C51 72 51 78 52 84"></path>
    <path d="M69 55 C72 62 74 68 75 74"></path>
    <path d="M40 77 C39 84 39 89 40 95"></path>

  </g>

  <!-- green almond hull 1 -->
  <path d="
    M51 80
    C43 82 39 90 40 98
    C41 108 47 114 54 114

    C62 113 68 106 68 97
    C68 88 61 80 54 79
    C53 79 52 79 51 80Z" fill="url(#greenHull)" stroke="#445f37" stroke-width="1.5" filter="url(#softShadow)"></path>

  <!-- green almond hull 2 -->
  <path d="
    M74 69
    C67 71 63 78 64 86
    C65 95 70 101 77 101

    C84 100 90 94 90 86
    C90 78 84 70 77 69
    C76 69 75 69 74 69Z" fill="url(#greenHull)" stroke="#445f37" stroke-width="1.5" filter="url(#softShadow)"></path>

  <!-- hull surface details -->
  <g fill="none" stroke="#779553" stroke-width="0.75" opacity="0.62">

    <path d="M48 84 C52 91 54 101 53 110"></path>
    <path d="M72 73 C76 80 78 89 77 97"></path>

  </g>

  <!-- fruit highlights -->
  <g fill="#e6e9a6" opacity="0.58">

    <ellipse cx="48" cy="89" rx="2.5" ry="4.5" transform="rotate(-25 48 89)"></ellipse>

    <ellipse cx="71" cy="78" rx="2.3" ry="4" transform="rotate(-25 71 78)"></ellipse>

  </g>

  <!-- split mature hull -->
  <g transform="translate(38 102)" filter="url(#softShadow)">

    <path d="
      M-11 -8
      C-17 -2 -16 9 -8 15
      C-4 18 0 17 2 13

      C-2 6 -3 -1 -1 -9
      C-4 -11 -8 -11 -11 -8Z" fill="url(#splitHull)" stroke="#4b6039" stroke-width="1.2"></path>

    <path d="
      M10 -8
      C16 -2 15 9 7 15
      C3 18 -1 17 -3 13

      C1 6 2 -1 0 -9
      C3 -11 7 -11 10 -8Z" fill="url(#splitHull)" stroke="#4b6039" stroke-width="1.2"></path>

    <!-- almond shell -->
    <path d="
      M0 -7
      C-7 -5 -10 3 -8 10
      C-6 17 -2 21 0 22

      C3 21 7 17 9 10
      C11 3 7 -5 0 -7Z" fill="url(#almondShell)" stroke="#69452f" stroke-width="1.3"></path>

    <!-- shell grooves -->
    <g fill="none" stroke="#835d3d" stroke-width="0.7" stroke-linecap="round" opacity="0.8">

      <path d="M0 -3 C-2 4 -2 11 0 18"></path>
      <path d="M-4 0 C-6 5 -5 10 -3 15"></path>
      <path d="M4 0 C6 5 5 10 3 15"></path>
      <path d="M-6 5 C-2 7 2 7 6 5"></path>
      <path d="M-5 11 C-1 13 2 13 5 11"></path>

    </g>

    <path d="
      M-3 -3
      C-5 1 -5 4 -4 7" fill="none" stroke="#f0d29f" stroke-width="1.2" stroke-linecap="round" opacity="0.58"></path>

  </g>

  <!-- blossom branch -->
  <path d="
    M76 39
    C78 32 82 26 87 20" fill="none" stroke="#6e5941" stroke-width="1.5" stroke-linecap="round"></path>

  <!-- almond blossom -->
  <g transform="translate(88 18)" filter="url(#softShadow)">

    <path d="
      M0 0
      C-7 -1 -10 -6 -7 -10
      C-3 -14 2 -10 2 -4Z" fill="url(#petal)" stroke="#d3a7af" stroke-width="0.7"></path>

    <path d="
      M0 0
      C2 -7 7 -10 11 -7
      C14 -3 10 2 5 2Z" fill="url(#petal)" stroke="#d3a7af" stroke-width="0.7"></path>

    <path d="
      M0 0
      C7 2 9 7 6 11
      C2 14 -2 9 -2 4Z" fill="url(#petal)" stroke="#d3a7af" stroke-width="0.7"></path>

    <path d="
      M0 0
      C-2 7 -7 10 -11 6
      C-14 2 -10 -2 -4 -2Z" fill="url(#petal)" stroke="#d3a7af" stroke-width="0.7"></path>

    <path d="
      M0 0
      C-4 -5 -2 -10 2 -11
      C7 -10 8 -5 4 -2Z" fill="url(#petal)" stroke="#d3a7af" stroke-width="0.7"></path>

    <circle cx="0" cy="0" r="3.2" fill="#dcb548"></circle>

    <!-- stamens -->
    <g stroke="#aa7b3c" stroke-width="0.55" stroke-linecap="round">

      <path d="M0 0 L-4 -1"></path>
      <path d="M0 0 L4 -1"></path>
      <path d="M0 0 L-3 3"></path>
      <path d="M0 0 L3 3"></path>
      <path d="M0 0 L0 -4"></path>

    </g>

    <g fill="#8e692e">

      <circle cx="-4" cy="-1" r="0.7"></circle>

      <circle cx="4" cy="-1" r="0.7"></circle>

      <circle cx="-3" cy="3" r="0.7"></circle>

      <circle cx="3" cy="3" r="0.7"></circle>

      <circle cx="0" cy="-4" r="0.7"></circle>

    </g>

  </g>

</svg>