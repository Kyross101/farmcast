<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Moth Bean</title>

  <desc id="desc">
    Moth bean pods and small brown seeds with green trifoliate leaves.
  </desc>

  <!-- Trifoliate leaves -->
  <ellipse cx="49" cy="26" rx="14" ry="7" transform="rotate(-30 49 26)" fill="#638f4a" stroke="#406b39" stroke-width="1.7">
  </ellipse>

  <ellipse cx="66" cy="22" rx="14" ry="7" fill="#699650" stroke="#406b39" stroke-width="1.7">
  </ellipse>

  <ellipse cx="84" cy="27" rx="14" ry="7" transform="rotate(30 84 27)" fill="#638f4a" stroke="#406b39" stroke-width="1.7">
  </ellipse>

  <!-- Leaf stems -->
  <path d="M66 43
       L66 28

       M66 35
       L51 28

       M66 35
       L82 29" fill="none" stroke="#5e7040" stroke-width="2.4" stroke-linecap="round">
  </path>

  <!-- Left narrow pod -->
  <path d="M24 58
       C36 51 52 52 65 59
       C69 62 69 68 64 71
       C52 77 36 75 25 68
       C21 65 21 61 24 58Z" fill="#b68a4e" stroke="#745836" stroke-width="2.2">
  </path>

  <path d="M28 63
       C39 60 51 61 62 65" fill="none" stroke="#87663d" stroke-width="1.6" stroke-linecap="round">
  </path>

  <!-- Right open pod -->
  <path d="M66 57
       C79 50 96 52 104 62
       C109 69 103 77 92 79
       C80 81 70 77 66 69
       C64 65 64 60 66 57Z" fill="#c1975a" stroke="#7c603b" stroke-width="2.2">
  </path>

  <path d="M71 61
       C80 57 93 58 99 64
       C103 69 98 74 89 75
       C80 76 73 73 70 68
       C69 65 69 63 71 61Z" fill="#dfc493">
  </path>

  <!-- Seeds inside pod -->
  <ellipse cx="78" cy="67" rx="4.8" ry="3.8" fill="#9a6642" stroke="#67432f" stroke-width="1.3">
  </ellipse>

  <ellipse cx="89" cy="67" rx="4.8" ry="3.8" fill="#ad7549" stroke="#714932" stroke-width="1.3">
  </ellipse>

  <!-- Loose moth bean seeds -->
  <ellipse cx="36" cy="96" rx="9" ry="7" transform="rotate(-10 36 96)" fill="#a46b46" stroke="#69422f" stroke-width="2">
  </ellipse>

  <ellipse cx="56" cy="101" rx="9" ry="7" transform="rotate(8 56 101)" fill="#8f593e" stroke="#5f3a2c" stroke-width="2">
  </ellipse>

  <ellipse cx="77" cy="99" rx="9" ry="7" transform="rotate(-7 77 99)" fill="#b07749" stroke="#704730" stroke-width="2">
  </ellipse>

  <ellipse cx="97" cy="94" rx="9" ry="7" transform="rotate(11 97 94)" fill="#996143" stroke="#633e2e" stroke-width="2">
  </ellipse>

  <!-- Seed eye marks -->
  <ellipse cx="36" cy="96" rx="1.8" ry="3" fill="#59382a"></ellipse>
  <ellipse cx="56" cy="101" rx="1.8" ry="3" fill="#503328"></ellipse>
  <ellipse cx="77" cy="99" rx="1.8" ry="3" fill="#5e3a2a"></ellipse>
  <ellipse cx="97" cy="94" rx="1.8" ry="3" fill="#57372a"></ellipse>

  <!-- Shadow -->
  <ellipse cx="66" cy="116" rx="43" ry="5" fill="#81664a" opacity="0.18">
  </ellipse>

</svg>