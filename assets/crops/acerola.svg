<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Acerola</title>

  <desc id="desc">
    Detailed botanical illustration of acerola with glossy green leaves,
    pink flowers, clusters of ripe red cherry-like fruits,
    highlights, shadows, and branching stems.
  </desc>

  <defs>
    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ac776"></stop>
      <stop offset="0.5" stop-color="#558f4e"></stop>
      <stop offset="1" stop-color="#285c39"></stop>
    </linearGradient>

    <linearGradient id="leafDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#659e55"></stop>
      <stop offset="1" stop-color="#224d32"></stop>
    </linearGradient>

    <radialGradient id="fruitRed" cx="35%" cy="28%" r="75%">
      <stop offset="0" stop-color="#ff7a67"></stop>
      <stop offset="0.42" stop-color="#e3473e"></stop>
      <stop offset="0.78" stop-color="#b92732"></stop>
      <stop offset="1" stop-color="#7e1d2b"></stop>
    </radialGradient>

    <linearGradient id="stemBrown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#907154"></stop>
      <stop offset="1" stop-color="#4d3e32"></stop>
    </linearGradient>

    <linearGradient id="petalPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6b2c2"></stop>
      <stop offset="1" stop-color="#cb6888"></stop>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#263428" flood-opacity="0.25"></feDropShadow>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="64" cy="115" rx="39" ry="6" fill="#283928" opacity="0.16"></ellipse>

  <!-- Main branches -->
  <g fill="none" stroke="url(#stemBrown)" stroke-linecap="round" stroke-linejoin="round">

    <path d="M62 109
             C62 91 61 75 59 60
             C57 44 53 30 48 18" stroke-width="5"></path>

    <path d="M62 79
             C73 67 83 53 91 36" stroke-width="3.6"></path>

    <path d="M59 65
             C47 57 37 47 30 35" stroke-width="3.3"></path>

    <path d="M69 70
             C82 72 94 68 105 60" stroke-width="2.8"></path>

    <path d="M53 82
             C42 84 31 80 21 73" stroke-width="2.8"></path>
  </g>

  <!-- Leaves -->
  <g stroke="#28573a" stroke-width="1.2" filter="url(#shadow)">

    <path d="
      M52 29
      C39 24 31 27 26 36
      C36 42 47 40 55 33Z" fill="url(#leafGreen)"></path>

    <path d="
      M42 51
      C29 46 21 50 18 59
      C29 64 40 61 47 55Z" fill="url(#leafDark)"></path>

    <path d="
      M48 74
      C35 69 26 72 21 82
      C33 87 44 84 52 78Z" fill="url(#leafGreen)"></path>

    <path d="
      M71 42
      C80 31 91 29 101 35
      C96 46 85 51 73 48Z" fill="url(#leafGreen)"></path>

    <path d="
      M77 61
      C89 53 100 55 108 63
      C101 72 90 75 79 69Z" fill="url(#leafDark)"></path>

    <path d="
      M72 84
      C84 76 96 78 103 87
      C95 95 84 97 73 91Z" fill="url(#leafGreen)"></path>

    <path d="
      M57 94
      C48 89 39 91 34 99
      C42 105 52 104 60 99Z" fill="url(#leafDark)"></path>
  </g>

  <!-- Leaf veins -->
  <g fill="none" stroke="#b4d399" stroke-width="0.9" stroke-linecap="round" opacity="0.75">

    <path d="M29 36 C39 34 47 33 53 32"></path>
    <path d="M21 58 C31 56 39 55 45 54"></path>
    <path d="M24 81 C35 79 43 78 50 77"></path>

    <path d="M98 36 C88 39 80 43 73 47"></path>
    <path d="M105 63 C95 64 87 66 80 68"></path>
    <path d="M100 87 C90 87 82 89 75 90"></path>

    <path d="M37 99 C45 98 52 98 58 98"></path>
  </g>

  <!-- Fruit stems -->
  <g fill="none" stroke="#668348" stroke-width="1.6" stroke-linecap="round">

    <path d="M68 70 C69 77 70 82 72 87"></path>
    <path d="M76 65 C79 72 82 78 85 83"></path>
    <path d="M57 61 C56 68 55 74 54 79"></path>
    <path d="M51 82 C49 88 47 93 45 97"></path>
  </g>

  <!-- Acerola fruits -->
  <g fill="url(#fruitRed)" stroke="#852333" stroke-width="1.4" filter="url(#shadow)">

    <path d="
      M61 84
      C59 76 64 70 72 70
      C80 70 85 76 84 84
      C83 94 77 101 72 104
      C66 101 61 94 61 84Z"></path>

    <path d="
      M76 82
      C75 74 80 69 87 70
      C95 71 99 77 97 85
      C95 94 90 100 84 102
      C79 98 76 91 76 82Z"></path>

    <path d="
      M43 78
      C42 70 47 65 54 66
      C62 67 66 73 64 81
      C62 90 57 96 51 98
      C46 94 43 87 43 78Z"></path>

    <path d="
      M35 96
      C34 89 39 84 46 85
      C53 86 57 91 55 98
      C53 106 48 111 43 112
      C38 108 35 103 35 96Z"></path>
  </g>

  <!-- Characteristic fruit lobes -->
  <g fill="none" stroke="#741d2a" stroke-width="1" opacity="0.65">

    <path d="M72 73 C69 82 69 93 72 101"></path>
    <path d="M86 73 C84 82 84 92 85 99"></path>
    <path d="M54 69 C52 77 52 88 51 95"></path>
    <path d="M46 88 C43 95 43 103 43 109"></path>
  </g>

  <!-- Fruit highlights -->
  <g fill="#ffc0aa" opacity="0.72">

    <ellipse cx="68" cy="78" rx="3" ry="4" transform="rotate(25 68 78)"></ellipse>

    <ellipse cx="83" cy="77" rx="2.7" ry="3.7" transform="rotate(25 83 77)"></ellipse>

    <ellipse cx="50" cy="73" rx="2.7" ry="3.7" transform="rotate(25 50 73)"></ellipse>

    <ellipse cx="42" cy="92" rx="2.4" ry="3.2" transform="rotate(25 42 92)"></ellipse>
  </g>

  <!-- Pink flower branch -->
  <path d="M91 36 C98 31 103 27 108 22" fill="none" stroke="#668348" stroke-width="1.5" stroke-linecap="round"></path>

  <!-- Acerola flower -->
  <g transform="translate(108 20)" filter="url(#shadow)">

    <path d="M0 0
             C-9 -2 -11 -8 -6 -12
             C-1 -15 3 -10 3 -5Z" fill="url(#petalPink)" stroke="#a75172" stroke-width="0.8"></path>

    <path d="M0 0
             C3 -9 9 -11 13 -6
             C15 -1 10 3 5 3Z" fill="url(#petalPink)" stroke="#a75172" stroke-width="0.8"></path>

    <path d="M0 0
             C9 2 11 8 6 12
             C1 14 -3 10 -3 5Z" fill="url(#petalPink)" stroke="#a75172" stroke-width="0.8"></path>

    <path d="M0 0
             C-2 9 -8 11 -12 6
             C-14 1 -10 -3 -5 -3Z" fill="url(#petalPink)" stroke="#a75172" stroke-width="0.8"></path>

    <path d="M0 0
             C-5 -6 -3 -12 2 -13
             C7 -12 8 -6 4 -2Z" fill="url(#petalPink)" stroke="#a75172" stroke-width="0.8"></path>

    <circle cx="0" cy="0" r="3.2" fill="#e7c74c" stroke="#9e8130" stroke-width="0.7"></circle>

    <circle cx="-1" cy="-1" r="1" fill="#7d6629"></circle>
  </g>

  <!-- New shoot -->
  <path d="M48 19
           C46 13 47 9 51 5" fill="none" stroke="#739c59" stroke-width="2" stroke-linecap="round"></path>

  <path d="
    M50 8
    C55 4 59 5 61 9
    C57 12 53 12 50 10Z" fill="#9bc977" stroke="#3d6e43" stroke-width="0.9"></path>

  <!-- Branch highlights -->
  <g fill="none" stroke="#b79674" stroke-width="0.8" stroke-linecap="round" opacity="0.58">

    <path d="M64 104 C64 88 63 72 61 58"></path>
    <path d="M63 75 C74 64 83 51 89 39"></path>
  </g>

</svg>