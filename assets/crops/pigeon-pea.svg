<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Pigeon Pea</title>
  <desc id="desc">
    An upright pigeon pea shrub with narrow green leaves,
    yellow flowers, and hanging green pods.
  </desc>

  <!-- Main woody stem -->
  <path d="M62 114
       C61 94 63 76 62 57
       C61 40 63 27 65 14" fill="none" stroke="#66513a" stroke-width="6" stroke-linecap="round"></path>

  <!-- Green upper stem -->
  <path d="M63 69
       C62 49 63 31 65 14" fill="none" stroke="#4f7d3e" stroke-width="4" stroke-linecap="round"></path>

  <!-- Branches -->
  <path d="M62 45
       C50 40 40 33 32 24" fill="none" stroke="#528340" stroke-width="4" stroke-linecap="round"></path>

  <path d="M63 38
       C76 34 86 27 95 20" fill="none" stroke="#528340" stroke-width="4" stroke-linecap="round"></path>

  <path d="M62 65
       C49 61 40 55 32 48" fill="none" stroke="#598844" stroke-width="3.5" stroke-linecap="round"></path>

  <path d="M63 59
       C77 56 88 50 96 43" fill="none" stroke="#598844" stroke-width="3.5" stroke-linecap="round"></path>

  <!-- Trifoliate leaves left -->
  <ellipse cx="27" cy="21" rx="5" ry="13" transform="rotate(-42 27 21)" fill="#6fa350"></ellipse>

  <ellipse cx="38" cy="25" rx="5" ry="13" transform="rotate(-15 38 25)" fill="#78aa56"></ellipse>

  <ellipse cx="34" cy="35" rx="5" ry="12" transform="rotate(35 34 35)" fill="#659a49"></ellipse>

  <!-- Trifoliate leaves right -->
  <ellipse cx="101" cy="17" rx="5" ry="13" transform="rotate(43 101 17)" fill="#6fa350"></ellipse>

  <ellipse cx="89" cy="23" rx="5" ry="13" transform="rotate(14 89 23)" fill="#78aa56"></ellipse>

  <ellipse cx="95" cy="32" rx="5" ry="12" transform="rotate(-35 95 32)" fill="#659a49"></ellipse>

  <!-- Lower leaves -->
  <ellipse cx="27" cy="47" rx="5" ry="12" transform="rotate(-42 27 47)" fill="#72a653"></ellipse>

  <ellipse cx="39" cy="52" rx="5" ry="12" transform="rotate(-8 39 52)" fill="#659b49"></ellipse>

  <ellipse cx="98" cy="42" rx="5" ry="12" transform="rotate(42 98 42)" fill="#72a653"></ellipse>

  <ellipse cx="87" cy="49" rx="5" ry="12" transform="rotate(7 87 49)" fill="#659b49"></ellipse>

  <!-- Yellow flowers -->
  <circle cx="50" cy="40" r="5" fill="#e7b33e"></circle>
  <circle cx="55" cy="36" r="5" fill="#f0c34d"></circle>
  <circle cx="78" cy="34" r="5" fill="#e7b33e"></circle>

  <circle cx="53" cy="38" r="2" fill="#a96a2c"></circle>
  <circle cx="78" cy="34" r="2" fill="#a96a2c"></circle>

  <!-- Pod stems -->
  <path d="M53 55 C50 62 49 69 48 75" fill="none" stroke="#4e7c3e" stroke-width="2.5"></path>

  <path d="M72 52 C76 61 78 69 79 76" fill="none" stroke="#4e7c3e" stroke-width="2.5"></path>

  <!-- Pigeon pea pods -->
  <path d="M47 72
       C39 76 38 89 44 99
       C50 96 53 83 50 73Z" fill="#7ca855" stroke="#557e3d" stroke-width="2.5"></path>

  <path d="M79 73
       C87 77 89 90 83 100
       C77 97 74 84 76 74Z" fill="#719e4e" stroke="#557e3d" stroke-width="2.5"></path>

  <!-- Seed bulges -->
  <circle cx="46" cy="80" r="2.2" fill="#628b43"></circle>
  <circle cx="46" cy="87" r="2.2" fill="#628b43"></circle>
  <circle cx="46" cy="94" r="2.2" fill="#628b43"></circle>

  <circle cx="80" cy="81" r="2.2" fill="#5e8741"></circle>
  <circle cx="81" cy="88" r="2.2" fill="#5e8741"></circle>
  <circle cx="81" cy="95" r="2.2" fill="#5e8741"></circle>

  <!-- Ground -->
  <path d="M30 116
       C47 112 78 113 97 116" fill="none" stroke="#8c684b" stroke-width="4" stroke-linecap="round"></path>
</svg>