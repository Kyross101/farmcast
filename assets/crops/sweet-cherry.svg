<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Sweet Cherry</title>

  <desc id="desc">
    A fruit-focused sweet cherry icon with two ripe dark-red cherries and green leaves.
  </desc>

  <!-- Leaves -->
  <ellipse cx="46" cy="33" rx="17" ry="7" transform="rotate(-28 46 33)" fill="#67954e" stroke="#426d3b" stroke-width="1.8">
  </ellipse>

  <path d="M33 39 L59 29" fill="none" stroke="#99b480" stroke-width="1.4" stroke-linecap="round">
  </path>

  <ellipse cx="88" cy="33" rx="17" ry="7" transform="rotate(26 88 33)" fill="#67954e" stroke="#426d3b" stroke-width="1.8">
  </ellipse>

  <path d="M75 28 L101 38" fill="none" stroke="#99b480" stroke-width="1.4" stroke-linecap="round">
  </path>

  <!-- Top stem junction -->
  <path d="M64 24
       C64 29 63 34 62 39

       M64 24
       C70 31 76 40 80 50

       M64 24
       C56 31 50 41 47 51" fill="none" stroke="#6d663f" stroke-width="3" stroke-linecap="round">
  </path>

  <!-- Left cherry stem -->
  <path d="M47 51
       C46 57 46 62 47 68" fill="none" stroke="#6f7640" stroke-width="2.4" stroke-linecap="round">
  </path>

  <!-- Right cherry stem -->
  <path d="M80 50
       C83 56 84 62 83 68" fill="none" stroke="#6f7640" stroke-width="2.4" stroke-linecap="round">
  </path>

  <!-- Left sweet cherry -->
  <circle cx="48" cy="82" r="18" fill="#b7333c" stroke="#842930" stroke-width="2.4">
  </circle>

  <!-- Left darker side -->
  <path d="M56 66
       C67 73 69 87 62 97
       C58 102 53 105 48 105
       C54 94 57 80 56 66Z" fill="#982730" opacity="0.82">
  </path>

  <!-- Left highlight -->
  <path d="M39 75
       C35 80 35 88 39 93" fill="none" stroke="#e2838b" stroke-width="2.3" stroke-linecap="round">
  </path>

  <!-- Right sweet cherry -->
  <circle cx="82" cy="82" r="18" fill="#c13a42" stroke="#882b33" stroke-width="2.4">
  </circle>

  <!-- Right darker side -->
  <path d="M89 66
       C100 74 102 87 96 97
       C92 102 87 105 82 105
       C88 94 91 80 89 66Z" fill="#a62d35" opacity="0.82">
  </path>

  <!-- Right highlight -->
  <path d="M73 75
       C69 80 70 88 73 93" fill="none" stroke="#ea9195" stroke-width="2.3" stroke-linecap="round">
  </path>

  <!-- Soft base shadow -->
  <ellipse cx="65" cy="112" rx="35" ry="6" fill="#81664a" opacity="0.2">
  </ellipse>

</svg>