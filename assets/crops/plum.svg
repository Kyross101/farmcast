<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Plum</title>

  <desc id="desc">
    Two ripe purple plum fruits with green leaves.
  </desc>

  <!-- Top stems -->
  <path d="M58 40
       C60 33 64 28 69 24

       M76 43
       C79 35 83 30 88 27" fill="none" stroke="#6a643f" stroke-width="3" stroke-linecap="round">
  </path>

  <!-- Left leaf -->
  <ellipse cx="47" cy="35" rx="16" ry="7" transform="rotate(-28 47 35)" fill="#67954e" stroke="#426d3b" stroke-width="1.8">
  </ellipse>

  <path d="M34 41 L59 31" fill="none" stroke="#99b480" stroke-width="1.4" stroke-linecap="round">
  </path>

  <!-- Right leaf -->
  <ellipse cx="90" cy="35" rx="16" ry="7" transform="rotate(26 90 35)" fill="#67954e" stroke="#426d3b" stroke-width="1.8">
  </ellipse>

  <path d="M77 30 L102 40" fill="none" stroke="#99b480" stroke-width="1.4" stroke-linecap="round">
  </path>

  <!-- Main plum -->
  <path d="M58 44
       C45 43 35 53 33 67
       C31 82 38 97 50 104
       C61 110 72 107 79 98
       C86 89 88 74 83 61
       C79 50 69 45 58 44Z" fill="#7b5397" stroke="#54396a" stroke-width="2.4">
  </path>

  <!-- Main plum darker side -->
  <path d="M68 47
       C79 53 84 65 82 78
       C80 91 73 100 64 104
       C69 92 71 77 70 63
       C70 56 69 51 68 47Z" fill="#664283" opacity="0.88">
  </path>

  <!-- Main plum highlight -->
  <path d="M44 58
       C40 66 40 76 43 83" fill="none" stroke="#b895cb" stroke-width="2.4" stroke-linecap="round">
  </path>

  <!-- Main plum crease -->
  <path d="M59 48
       C56 61 56 79 60 95
       C61 100 63 103 65 105" fill="none" stroke="#8b63a4" stroke-width="2" stroke-linecap="round">
  </path>

  <!-- Second plum -->
  <path d="M89 50
       C79 50 72 58 72 70
       C71 82 76 93 86 98
       C96 103 106 98 111 88
       C116 76 112 63 104 55
       C100 52 95 50 89 50Z" fill="#875aa2" stroke="#5a3b70" stroke-width="2.2">
  </path>

  <!-- Second plum darker side -->
  <path d="M99 53
       C109 60 113 72 109 84
       C107 91 102 96 96 99
       C100 87 101 72 99 53Z" fill="#6d4688" opacity="0.85">
  </path>

  <!-- Second plum highlight -->
  <path d="M82 61
       C79 68 80 76 83 81" fill="none" stroke="#c09bd1" stroke-width="2.2" stroke-linecap="round">
  </path>

  <!-- Second plum crease -->
  <path d="M90 54
       C87 65 87 80 91 95" fill="none" stroke="#9268a8" stroke-width="1.9" stroke-linecap="round">
  </path>

  <!-- Ground shadow -->
  <ellipse cx="71" cy="112" rx="37" ry="6" fill="#81664a" opacity="0.2">
  </ellipse>

</svg>