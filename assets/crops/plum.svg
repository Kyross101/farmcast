<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Plum</title>

  <desc id="desc">
    A plum branch with green leaves
    and ripe purple plum fruits.
  </desc>

  <!-- Main branch -->
  <path d="M27 114
       C39 95 50 77 62 59
       C73 42 84 27 97 14" fill="none" stroke="#73583f" stroke-width="6" stroke-linecap="round"></path>

  <!-- Side branches -->
  <path d="M54 73
       C45 61 37 49 31 37" fill="none" stroke="#557b45" stroke-width="3.5" stroke-linecap="round"></path>

  <path d="M67 55
       C79 48 89 39 98 29" fill="none" stroke="#557b45" stroke-width="3.5" stroke-linecap="round"></path>

  <!-- Plum leaves -->
  <g fill="#65934f" stroke="#416d3c" stroke-width="1.4">

    <ellipse cx="31" cy="39" rx="14" ry="6" transform="rotate(-29 31 39)">
    </ellipse>

    <ellipse cx="46" cy="48" rx="14" ry="6" transform="rotate(27 46 48)">
    </ellipse>

    <ellipse cx="82" cy="44" rx="14" ry="6" transform="rotate(26 82 44)">
    </ellipse>

    <ellipse cx="95" cy="33" rx="14" ry="6" transform="rotate(-28 95 33)">
    </ellipse>

  </g>

  <!-- Leaf veins -->
  <g fill="none" stroke="#93ae80" stroke-width="1.3" stroke-linecap="round">

    <path d="M22 43 L40 35"></path>

    <path d="M37 45 L55 51"></path>

    <path d="M73 48 L91 40"></path>

    <path d="M86 37 L104 29"></path>

  </g>

  <!-- Fruit stems -->
  <path d="M68 59
       C77 66 83 74 87 82

       M75 61
       C87 65 97 72 104 81" fill="none" stroke="#557644" stroke-width="2.5" stroke-linecap="round"></path>

  <!-- Plum 1 -->
  <path d="M88 78
       C78 79 73 87 74 98
       C75 110 83 116 92 114
       C102 111 107 100 104 89
       C102 81 96 77 88 78Z" fill="#73508f" stroke="#503866" stroke-width="2"></path>

  <!-- Plum highlight -->
  <path d="M82 86
       C79 94 81 103 86 108" fill="none" stroke="#a47aba" stroke-width="2" stroke-linecap="round"></path>

  <!-- Plum 2 -->
  <path d="M106 79
       C98 80 94 87 95 96
       C96 106 103 111 111 108
       C119 105 122 95 118 87
       C115 81 111 78 106 79Z" fill="#81559a" stroke="#56396b" stroke-width="2"></path>

  <!-- Plum 2 highlight -->
  <path d="M102 86
       C100 92 102 99 106 103" fill="none" stroke="#ad82c0" stroke-width="2" stroke-linecap="round"></path>

  <!-- Ground -->
  <ellipse cx="48" cy="117" rx="28" ry="5" fill="#81664a" opacity="0.3">
  </ellipse>

</svg>