<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Custard Apple</title>

  <desc id="desc">
    Detailed botanical illustration of Custard Apple or Anonas
    with a ripe heart-shaped reticulated fruit, layered glossy
    leaves, warm highlights, soft shadows and natural depth.
  </desc>

  <defs>

    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fc95b"></stop>
      <stop offset="0.45" stop-color="#4d963f"></stop>
      <stop offset="1" stop-color="#225f32"></stop>
    </linearGradient>

    <linearGradient id="leafDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ca246"></stop>
      <stop offset="0.55" stop-color="#31753b"></stop>
      <stop offset="1" stop-color="#174a2c"></stop>
    </linearGradient>

    <linearGradient id="branchBrown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#977354"></stop>
      <stop offset="0.5" stop-color="#674936"></stop>
      <stop offset="1" stop-color="#3b2d27"></stop>
    </linearGradient>

    <radialGradient id="fruitBase" cx="36%" cy="25%" r="78%">
      <stop offset="0" stop-color="#d8c26d"></stop>
      <stop offset="0.35" stop-color="#bea953"></stop>
      <stop offset="0.72" stop-color="#967e3d"></stop>
      <stop offset="1" stop-color="#6b5732"></stop>
    </radialGradient>

    <linearGradient id="fruitWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3d18a"></stop>
      <stop offset="0.5" stop-color="#b89b52"></stop>
      <stop offset="1" stop-color="#7c6439"></stop>
    </linearGradient>

    <radialGradient id="fruitGlow" cx="32%" cy="26%" r="70%">
      <stop offset="0" stop-color="#fff1b0" stop-opacity="0.88"></stop>
      <stop offset="0.46" stop-color="#e4c96f" stop-opacity="0.34"></stop>
      <stop offset="1" stop-color="#8b713a" stop-opacity="0"></stop>
    </radialGradient>

    <filter id="mainShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#2c3828" flood-opacity="0.30"></feDropShadow>
    </filter>

    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8"></feGaussianBlur>
    </filter>

  </defs>


  <!-- ground depth -->
  <ellipse cx="65" cy="111" rx="34" ry="7" fill="#243a27" opacity="0.16" filter="url(#softBlur)"></ellipse>


  <g filter="url(#mainShadow)">

    <!-- rear branch -->
    <path d="M31 43
             C48 51 59 62 68 78
             C73 87 76 98 76 108" fill="none" stroke="url(#branchBrown)" stroke-width="5" stroke-linecap="round"></path>


    <!-- upper left leaf -->
    <path d="M51 60
             C35 55 22 43 19 29
             C34 29 48 35 58 47
             C57 52 55 57 51 60Z" fill="url(#leafGreen)"></path>

    <path d="M52 57
             C42 48 33 40 23 33" fill="none" stroke="#d3e99c" stroke-width="1.3" stroke-linecap="round" opacity="0.55"></path>

    <path d="M45 50
             L34 49" stroke="#b2d685" stroke-width="1" stroke-linecap="round" opacity="0.42"></path>

    <path d="M39 44
             L31 40" stroke="#b2d685" stroke-width="1" stroke-linecap="round" opacity="0.42"></path>


    <!-- upper right leaf -->
    <path d="M66 57
             C75 42 88 34 105 32
             C101 47 91 59 75 65
             C71 63 68 60 66 57Z" fill="url(#leafDark)"></path>

    <path d="M72 59
             C82 51 91 43 101 37" fill="none" stroke="#cae49a" stroke-width="1.2" stroke-linecap="round" opacity="0.5"></path>

    <path d="M80 53" stroke="#cae49a" stroke-width="1"></path>


    <!-- left middle leaf -->
    <path d="M45 72
             C31 72 20 66 14 56
             C27 53 40 56 51 64
             C50 68 48 70 45 72Z" fill="url(#leafDark)"></path>

    <path d="M46 68
             C35 64 26 61 18 59" fill="none" stroke="#c7e293" stroke-width="1.2" stroke-linecap="round" opacity="0.48"></path>


    <!-- right middle leaf -->
    <path d="M81 71
             C94 63 107 61 116 66
             C108 76 96 82 83 81
             C81 77 80 74 81 71Z" fill="url(#leafGreen)"></path>

    <path d="M84 76
             C95 72 105 69 112 68" fill="none" stroke="#d6eca7" stroke-width="1.2" stroke-linecap="round" opacity="0.48"></path>


    <!-- lower left leaf -->
    <path d="M46 88
             C33 89 22 85 17 77
             C29 74 41 77 51 83
             C50 86 48 88 46 88Z" fill="url(#leafGreen)"></path>

    <path d="M47 85
             C37 82 28 80 20 79" fill="none" stroke="#d6eca7" stroke-width="1.1" stroke-linecap="round" opacity="0.44"></path>


    <!-- lower right leaf -->
    <path d="M86 88
             C99 82 110 83 117 89
             C108 97 97 100 85 97
             C84 93 84 90 86 88Z" fill="url(#leafDark)"></path>

    <path d="M88 93
             C98 91 107 90 113 91" fill="none" stroke="#cbe5a0" stroke-width="1.1" stroke-linecap="round" opacity="0.44"></path>


    <!-- fruit stem -->
    <path d="M64 58
             C66 61 67 65 66 70" fill="none" stroke="#546b32" stroke-width="5" stroke-linecap="round"></path>

    <path d="M65 59
             C66 62 66 65 65 68" fill="none" stroke="#acc774" stroke-width="1.4" stroke-linecap="round" opacity="0.65"></path>


    <!-- main heart-shaped fruit -->
    <path d="M64 67
             C49 62 37 70 37 84
             C37 100 51 110 64 115
             C78 109 91 99 91 84
             C91 70 79 62 64 67Z" fill="url(#fruitBase)"></path>

    <!-- warm side depth -->
    <path d="M64 69
             C77 65 87 72 87 84
             C87 96 77 106 65 111
             C72 101 74 87 64 69Z" fill="url(#fruitWarm)" opacity="0.48"></path>

    <!-- fruit glow -->
    <path d="M64 68
             C50 64 40 72 40 84
             C40 96 50 105 61 110
             C53 97 52 81 64 68Z" fill="url(#fruitGlow)"></path>


    <!-- reticulated fruit pattern -->
    <g fill="none" stroke="#725d34" stroke-width="1.5" stroke-linecap="round" opacity="0.74">

      <path d="M49 72
               C53 76 57 78 64 78
               C70 78 76 76 80 72"></path>

      <path d="M43 80
               C49 84 56 86 64 86
               C73 86 80 83 86 79"></path>

      <path d="M42 89
               C49 93 56 95 64 95
               C73 95 80 92 87 88"></path>

      <path d="M46 99
               C51 102 57 104 64 104
               C71 104 77 102 82 98"></path>

      <path d="M55 68
               C51 77 51 88 55 101
               C57 106 60 110 64 113"></path>

      <path d="M72 68
               C77 77 77 88 73 101
               C71 106 68 110 64 113"></path>

      <path d="M64 67
               C61 77 61 88 64 96
               C67 88 67 77 64 67"></path>

    </g>


    <!-- small polygon-like skin cells -->
    <g fill="none" stroke="#8c743d" stroke-width="0.9" opacity="0.58">

      <path d="M48 76
               L54 72
               L60 77
               L56 83
               L49 82Z"></path>

      <path d="M61 76
               L66 72
               L72 77
               L69 84
               L62 84Z"></path>

      <path d="M73 78
               L80 74
               L85 80
               L82 86
               L75 85Z"></path>

      <path d="M43 86
               L49 82
               L55 87
               L52 94
               L45 93Z"></path>

      <path d="M55 87
               L62 83
               L68 88
               L65 96
               L58 96Z"></path>

      <path d="M68 87
               L75 84
               L82 89
               L78 96
               L71 96Z"></path>

      <path d="M49 97
               L56 94
               L63 99
               L60 106
               L53 105Z"></path>

      <path d="M64 98
               L71 95
               L78 99
               L74 106
               L67 108Z"></path>

    </g>

  </g>


  <!-- fruit highlights -->
  <path d="M46 77
           C48 72 53 69 58 69" fill="none" stroke="#fff2bd" stroke-width="2.3" stroke-linecap="round" opacity="0.68"></path>

  <ellipse cx="49" cy="81" rx="3.2" ry="6" transform="rotate(-28 49 81)" fill="#fff6cd" opacity="0.24"></ellipse>

  <path d="M47 91
           C50 97 54 101 59 104" fill="none" stroke="#ead991" stroke-width="1.4" stroke-linecap="round" opacity="0.42"></path>


  <!-- branch highlight -->
  <path d="M33 42
           C49 52 58 62 65 76" fill="none" stroke="#c19a72" stroke-width="1.4" stroke-linecap="round" opacity="0.5"></path>


  <!-- small leaf shine -->
  <path d="M27 33
           C35 34 43 39 49 46" fill="none" stroke="#edf5c7" stroke-width="1.6" stroke-linecap="round" opacity="0.38"></path>

  <path d="M96 37
           C88 40 81 45 75 51" fill="none" stroke="#e7f3be" stroke-width="1.5" stroke-linecap="round" opacity="0.34"></path>

</svg>