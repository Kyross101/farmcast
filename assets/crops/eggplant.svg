<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="eggplantTitle eggplantDesc">
  <title id="eggplantTitle">Eggplant</title>
  <desc id="eggplantDesc">
    Detailed ripe purple eggplant with green calyx,
    short stem, glossy highlights and natural fruit shading.
  </desc>

  <defs>
    <radialGradient id="eggplantFruit" cx="35%" cy="25%" r="78%">
      <stop offset="0%" stop-color="#b47ad1"></stop>
      <stop offset="30%" stop-color="#8d55b7"></stop>
      <stop offset="67%" stop-color="#67388f"></stop>
      <stop offset="100%" stop-color="#452766"></stop>
    </radialGradient>

    <linearGradient id="eggplantFruitDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#74439a"></stop>
      <stop offset="100%" stop-color="#382052"></stop>
    </linearGradient>

    <linearGradient id="eggplantCalyx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8bc46a"></stop>
      <stop offset="45%" stop-color="#559c50"></stop>
      <stop offset="100%" stop-color="#286b3b"></stop>
    </linearGradient>

    <linearGradient id="eggplantCalyxDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#68ac59"></stop>
      <stop offset="100%" stop-color="#1e5935"></stop>
    </linearGradient>

    <linearGradient id="eggplantStem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ea85c"></stop>
      <stop offset="100%" stop-color="#3c693d"></stop>
    </linearGradient>

    <filter id="eggplantShadow" x="-35%" y="-35%" width="170%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#271631" flood-opacity="0.26"></feDropShadow>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="64" cy="111" rx="34" ry="6" fill="#2e1b36" opacity="0.14"></ellipse>

  <!-- Main fruit -->
  <g filter="url(#eggplantShadow)">
    <path d="M67 34
         C80 35 94 42 101 53
         C108 65 105 80 96 92
         C87 103 75 110 61 115
         C49 119 37 115 30 106
         C22 96 23 84 29 73
         C34 64 42 57 49 51
         C57 45 62 40 67 34Z" fill="url(#eggplantFruit)" stroke="#4e286c" stroke-width="1.7"></path>

    <!-- Lower depth -->
    <path d="M32 91
         C39 105 51 111 63 110
         C76 108 88 100 96 89
         C91 103 77 113 61 117
         C47 120 34 114 28 105
         C25 100 25 95 26 90
         C27 94 29 96 32 91Z" fill="url(#eggplantFruitDark)" opacity="0.5"></path>

    <!-- Main glossy highlight -->
    <path d="M48 58
         C54 49 62 44 70 43
         C62 49 57 56 53 65
         C50 72 48 78 43 79
         C38 80 36 74 39 68
         C41 64 44 61 48 58Z" fill="#ffffff" opacity="0.28"></path>

    <ellipse cx="50" cy="55" rx="4" ry="8" transform="rotate(39 50 55)" fill="#ffffff" opacity="0.34"></ellipse>

    <!-- Purple reflected highlight -->
    <path d="M43 87
         C48 96 55 100 64 101" fill="none" stroke="#c79bdd" stroke-width="2" stroke-linecap="round" opacity="0.25"></path>

    <!-- Fruit contour -->
    <path d="M84 47
         C98 60 99 76 91 90" fill="none" stroke="#351b50" stroke-width="2" stroke-linecap="round" opacity="0.27"></path>
  </g>

  <!-- Stem -->
  <path d="M68 38
       C67 30 69 23 74 17
       C78 13 82 11 87 10" fill="none" stroke="url(#eggplantStem)" stroke-width="6" stroke-linecap="round"></path>

  <path d="M69 35
       C69 28 72 21 77 17" fill="none" stroke="#accb82" stroke-width="1.4" stroke-linecap="round" opacity="0.5"></path>

  <!-- Green calyx -->
  <g filter="url(#eggplantShadow)">
    <path d="M67 39
         C61 32 54 29 46 28
         C50 34 53 39 54 44

         C47 42 40 43 34 47
         C43 48 50 51 55 55

         C54 61 55 67 58 72
         C61 64 64 58 68 53

         C73 59 80 63 87 64
         C83 57 80 52 76 48

         C83 47 90 44 96 39
         C88 38 80 38 73 40

         C78 34 81 29 82 23
         C76 28 71 33 67 39Z" fill="url(#eggplantCalyx)" stroke="#28673a" stroke-width="1.3" stroke-linejoin="round"></path>

    <path d="M66 42
         C61 38 57 34 53 31" fill="none" stroke="#b7d99a" stroke-width="1.2" stroke-linecap="round" opacity="0.62"></path>

    <path d="M71 44
         C79 42 85 42 91 41" fill="none" stroke="#1d5733" stroke-width="1.2" stroke-linecap="round" opacity="0.48"></path>

    <circle cx="68" cy="43" r="5" fill="url(#eggplantCalyxDark)"></circle>

    <circle cx="66.5" cy="41.5" r="1.6" fill="#99c77b" opacity="0.55"></circle>
  </g>

  <!-- Fine fruit texture -->
  <g fill="none" stroke="#321a49" stroke-width="0.8" stroke-linecap="round" opacity="0.2">
    <path d="M39 101 C46 107 53 109 61 109"></path>
    <path d="M73 105 C81 101 86 96 90 90"></path>
    <path d="M31 79 C30 85 31 90 34 95"></path>
  </g>
</svg>