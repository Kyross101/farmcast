<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Sour Cherry</title>

  <desc id="desc">
    Three ripe bright-red sour cherries with small green leaves.
  </desc>

  <!-- Leaves -->
  <ellipse cx="43" cy="31" rx="16" ry="7" transform="rotate(-28 43 31)" fill="#67954e" stroke="#426d3b" stroke-width="1.8">
  </ellipse>

  <path d="M30 37 L56 27" fill="none" stroke="#99b480" stroke-width="1.4" stroke-linecap="round">
  </path>

  <ellipse cx="88" cy="31" rx="16" ry="7" transform="rotate(27 88 31)" fill="#67954e" stroke="#426d3b" stroke-width="1.8">
  </ellipse>

  <path d="M75 26 L101 36" fill="none" stroke="#99b480" stroke-width="1.4" stroke-linecap="round">
  </path>

  <!-- Small stem junction -->
  <path d="M64 23
       C58 31 52 40 48 51

       M64 23
       C66 32 66 42 65 53

       M64 23
       C73 31 81 41 87 53" fill="none" stroke="#6d663f" stroke-width="3" stroke-linecap="round">
  </path>

  <!-- Left fruit stem -->
  <path d="M48 51
       C46 57 46 62 47 67" fill="none" stroke="#6d7640" stroke-width="2.3" stroke-linecap="round">
  </path>

  <!-- Center fruit stem -->
  <path d="M65 53
       C64 58 64 62 65 68" fill="none" stroke="#6d7640" stroke-width="2.3" stroke-linecap="round">
  </path>

  <!-- Right fruit stem -->
  <path d="M87 53
       C89 58 89 63 88 68" fill="none" stroke="#6d7640" stroke-width="2.3" stroke-linecap="round">
  </path>

  <!-- Left sour cherry -->
  <circle cx="46" cy="82" r="16" fill="#d94a45" stroke="#98332f" stroke-width="2.3">
  </circle>

  <!-- Left darker side -->
  <path d="M53 68
       C62 75 63 86 58 94
       C55 98 51 101 46 101
       C51 92 54 80 53 68Z" fill="#bd3836" opacity="0.82">
  </path>

  <!-- Left highlight -->
  <path d="M38 76
       C35 80 35 86 38 90" fill="none" stroke="#f19a90" stroke-width="2.2" stroke-linecap="round">
  </path>

  <!-- Center sour cherry -->
  <circle cx="66" cy="88" r="17" fill="#cf403f" stroke="#92302f" stroke-width="2.3">
  </circle>

  <!-- Center darker side -->
  <path d="M73 73
       C83 80 84 92 78 101
       C75 105 70 108 66 108
       C71 99 75 86 73 73Z" fill="#b33434" opacity="0.84">
  </path>

  <!-- Center highlight -->
  <path d="M57 81
       C54 85 54 92 58 96" fill="none" stroke="#ef8e87" stroke-width="2.2" stroke-linecap="round">
  </path>

  <!-- Right sour cherry -->
  <circle cx="89" cy="82" r="16" fill="#dd514a" stroke="#9a3531" stroke-width="2.3">
  </circle>

  <!-- Right darker side -->
  <path d="M96 68
       C105 75 106 86 101 94
       C98 98 94 101 89 101
       C94 92 97 80 96 68Z" fill="#c13b38" opacity="0.82">
  </path>

  <!-- Right highlight -->
  <path d="M81 76
       C78 80 78 86 81 90" fill="none" stroke="#f39e94" stroke-width="2.2" stroke-linecap="round">
  </path>

  <!-- Soft base shadow -->
  <ellipse cx="66" cy="113" rx="38" ry="6" fill="#81664a" opacity="0.2">
  </ellipse>

</svg>