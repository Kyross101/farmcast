<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Sour Cherry</title>

  <desc id="desc">
    A sour cherry branch with green leaves
    and clusters of ripe bright-red cherry fruits.
  </desc>

  <!-- Main branch -->
  <path d="M27 114
       C39 95 50 77 62 59
       C73 42 84 27 97 14" fill="none" stroke="#73583f" stroke-width="6" stroke-linecap="round"></path>

  <!-- Side branches -->
  <path d="M54 73
       C45 61 37 49 31 37" fill="none" stroke="#557b45" stroke-width="3.5" stroke-linecap="round"></path>

  <path d="M67 55
       C79 48 89 39 98 29" fill="none" stroke="#557b45" stroke-width="3.5" stroke-linecap="round"></path>

  <!-- Leaves -->
  <g fill="#65944e" stroke="#416d3b" stroke-width="1.4">

    <ellipse cx="31" cy="39" rx="14" ry="6" transform="rotate(-30 31 39)">
    </ellipse>

    <ellipse cx="47" cy="48" rx="14" ry="6" transform="rotate(27 47 48)">
    </ellipse>

    <ellipse cx="82" cy="44" rx="14" ry="6" transform="rotate(26 82 44)">
    </ellipse>

    <ellipse cx="95" cy="33" rx="14" ry="6" transform="rotate(-28 95 33)">
    </ellipse>

  </g>

  <!-- Leaf veins -->
  <g fill="none" stroke="#92ad7d" stroke-width="1.3" stroke-linecap="round">

    <path d="M22 43 L40 35"></path>

    <path d="M38 45 L56 51"></path>

    <path d="M73 48 L91 40"></path>

    <path d="M86 37 L104 29"></path>

  </g>

  <!-- Cherry stems -->
  <path d="M68 59
       C77 67 82 76 85 87

       M70 59
       C88 65 96 74 101 86

       M74 60
       C94 66 106 75 111 87" fill="none" stroke="#547944" stroke-width="2.4" stroke-linecap="round"></path>

  <!-- Sour cherry 1 -->
  <circle cx="85" cy="98" r="12.5" fill="#d44845" stroke="#993332" stroke-width="2">
  </circle>

  <path d="M79 91
       C76 94 76 99 78 102" fill="none" stroke="#ee8980" stroke-width="2" stroke-linecap="round">
  </path>

  <!-- Sour cherry 2 -->
  <circle cx="102" cy="97" r="12.5" fill="#c83e3e" stroke="#92302f" stroke-width="2">
  </circle>

  <path d="M96 90
       C93 94 94 98 96 101" fill="none" stroke="#e87c76" stroke-width="2" stroke-linecap="round">
  </path>

  <!-- Sour cherry 3 -->
  <circle cx="113" cy="101" r="10.5" fill="#d9514b" stroke="#963632" stroke-width="2">
  </circle>

  <path d="M108 95
       C106 98 107 101 109 103" fill="none" stroke="#ee8e84" stroke-width="1.8" stroke-linecap="round">
  </path>

  <!-- Ground -->
  <ellipse cx="48" cy="117" rx="28" ry="5" fill="#81664a" opacity="0.3">
  </ellipse>

</svg>