<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Quinoa</title>

  <desc id="desc">
    Detailed botanical illustration of quinoa with a sturdy green stem,
    broad leaves, branching seed panicles, and dense golden-red mature
    seed clusters with highlights, shadows, and natural depth.
  </desc>

  <defs>

    <linearGradient id="stemGreen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#365a37"></stop>
      <stop offset="0.55" stop-color="#63834a"></stop>
      <stop offset="1" stop-color="#a4b96d"></stop>
    </linearGradient>

    <linearGradient id="leafGreen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#285637"></stop>
      <stop offset="0.5" stop-color="#578b4a"></stop>
      <stop offset="1" stop-color="#a0c174"></stop>
    </linearGradient>

    <linearGradient id="leafDark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#20442f"></stop>
      <stop offset="1" stop-color="#648e50"></stop>
    </linearGradient>

    <linearGradient id="panicleStem" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#766541"></stop>
      <stop offset="0.5" stop-color="#9d8148"></stop>
      <stop offset="1" stop-color="#bea55f"></stop>
    </linearGradient>

    <radialGradient id="seedGold" cx="30%" cy="25%" r="75%">
      <stop offset="0" stop-color="#f4e4a0"></stop>
      <stop offset="0.42" stop-color="#d2b45e"></stop>
      <stop offset="0.78" stop-color="#a27d3f"></stop>
      <stop offset="1" stop-color="#74542f"></stop>
    </radialGradient>

    <radialGradient id="seedRed" cx="30%" cy="25%" r="75%">
      <stop offset="0" stop-color="#e99b7a"></stop>
      <stop offset="0.4" stop-color="#b95f50"></stop>
      <stop offset="0.78" stop-color="#7f3c39"></stop>
      <stop offset="1" stop-color="#552c2f"></stop>
    </radialGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#202820" flood-opacity="0.25"></feDropShadow>
    </filter>

  </defs>

  <!-- Ground shadow -->
  <ellipse cx="64" cy="117" rx="39" ry="6" fill="#293129" opacity="0.16"></ellipse>

  <!-- Main stalk -->
  <path d="
    M62 113
    C61 94 62 77 62 62
    C62 46 63 31 65 18" fill="none" stroke="url(#stemGreen)" stroke-width="6" stroke-linecap="round" filter="url(#softShadow)"></path>

  <!-- Main stalk highlight -->
  <path d="
    M64 109
    C64 90 64 74 64 60
    C64 44 65 31 66 20" fill="none" stroke="#c0ce8b" stroke-width="1" stroke-linecap="round" opacity="0.55"></path>

  <!-- Side stems -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round">

    <path d="
      M62 78
      C49 72 38 64 29 54" stroke-width="3.5"></path>

    <path d="
      M62 66
      C75 61 86 53 96 43" stroke-width="3.3"></path>

    <path d="
      M63 51
      C52 45 45 37 40 29" stroke-width="3"></path>

    <path d="
      M63 42
      C75 37 84 30 91 22" stroke-width="3"></path>

  </g>

  <!-- Large quinoa leaves -->
  <g stroke="#285138" stroke-width="1.1" filter="url(#softShadow)">

    <path d="
      M52 81
      C38 72 25 73 16 82
      C24 93 38 94 51 88
      C56 86 56 83 52 81Z" fill="url(#leafGreen)"></path>

    <path d="
      M72 72
      C85 62 99 64 108 73
      C100 84 86 86 73 79
      C69 77 69 74 72 72Z" fill="url(#leafDark)"></path>

    <path d="
      M51 61
      C39 52 28 54 20 62
      C28 72 40 73 51 67
      C55 65 55 63 51 61Z" fill="url(#leafDark)"></path>

    <path d="
      M73 55
      C84 46 96 48 104 56
      C97 66 85 68 74 62
      C70 60 70 57 73 55Z" fill="url(#leafGreen)"></path>

    <path d="
      M53 44
      C43 36 34 38 28 45
      C34 54 44 56 53 50
      C56 48 56 46 53 44Z" fill="url(#leafGreen)"></path>

    <path d="
      M73 38
      C82 30 92 31 99 38
      C93 47 83 49 74 44
      C71 42 71 40 73 38Z" fill="url(#leafDark)"></path>

  </g>

  <!-- Slightly toothed leaf margins -->
  <g fill="none" stroke="#20452f" stroke-width="0.65" opacity="0.72">

    <path d="
      M19 82
      L24 78
      L29 83
      L35 79
      L41 84
      L48 81"></path>

    <path d="
      M76 75
      L82 70
      L88 75
      L94 71
      L101 75"></path>

    <path d="
      M23 62
      L29 58
      L34 63
      L40 59
      L47 62"></path>

    <path d="
      M76 57
      L82 53
      L88 57
      L94 53
      L101 57"></path>

  </g>

  <!-- Leaf veins -->
  <g fill="none" stroke="#bed49b" stroke-width="0.8" stroke-linecap="round" opacity="0.72">

    <path d="M18 83 C30 84 41 85 51 85"></path>
    <path d="M75 77 C86 75 97 74 106 74"></path>

    <path d="M22 63 C32 63 42 64 50 64"></path>
    <path d="M75 59 C85 57 94 57 102 57"></path>

    <path d="M30 46 C38 47 45 47 52 47"></path>
    <path d="M75 42 C83 40 91 39 97 39"></path>

  </g>

  <!-- Main seed-panicle framework -->
  <g fill="none" stroke="url(#panicleStem)" stroke-linecap="round">

    <path d="
      M65 19
      C64 13 64 8 65 4" stroke-width="2.4"></path>

    <path d="
      M64 23
      C55 18 49 13 46 8" stroke-width="2"></path>

    <path d="
      M65 23
      C74 18 81 13 85 8" stroke-width="2"></path>

    <path d="
      M64 29
      C53 27 46 24 40 19" stroke-width="1.8"></path>

    <path d="
      M65 29
      C77 26 85 23 91 18" stroke-width="1.8"></path>

    <path d="
      M64 35
      C53 34 45 32 38 28" stroke-width="1.7"></path>

    <path d="
      M65 35
      C77 33 86 30 94 26" stroke-width="1.7"></path>

  </g>

  <!-- Main dense quinoa panicle -->
  <g filter="url(#softShadow)">

    <!-- Golden seed clusters -->
    <g fill="url(#seedGold)" stroke="#796238" stroke-width="0.45">

      <circle cx="64" cy="5" r="3"></circle>
      <circle cx="61" cy="9" r="3"></circle>
      <circle cx="67" cy="9" r="3"></circle>

      <circle cx="56" cy="12" r="3"></circle>
      <circle cx="63" cy="14" r="3.2"></circle>
      <circle cx="70" cy="13" r="3"></circle>
      <circle cx="76" cy="11" r="2.8"></circle>

      <circle cx="50" cy="16" r="2.8"></circle>
      <circle cx="57" cy="18" r="3.2"></circle>
      <circle cx="65" cy="19" r="3.3"></circle>
      <circle cx="73" cy="18" r="3.2"></circle>
      <circle cx="81" cy="15" r="2.8"></circle>

      <circle cx="45" cy="21" r="2.7"></circle>
      <circle cx="52" cy="23" r="3.1"></circle>
      <circle cx="60" cy="24" r="3.3"></circle>
      <circle cx="68" cy="24" r="3.3"></circle>
      <circle cx="77" cy="23" r="3"></circle>
      <circle cx="86" cy="20" r="2.7"></circle>

    </g>

    <!-- Reddish lower seed clusters -->
    <g fill="url(#seedRed)" stroke="#69403a" stroke-width="0.45">

      <circle cx="42" cy="27" r="2.8"></circle>
      <circle cx="49" cy="29" r="3"></circle>
      <circle cx="57" cy="30" r="3.2"></circle>
      <circle cx="65" cy="30" r="3.3"></circle>
      <circle cx="74" cy="29" r="3.2"></circle>
      <circle cx="83" cy="27" r="3"></circle>
      <circle cx="91" cy="24" r="2.7"></circle>

      <circle cx="39" cy="33" r="2.7"></circle>
      <circle cx="47" cy="35" r="3"></circle>
      <circle cx="55" cy="36" r="3.2"></circle>
      <circle cx="64" cy="36" r="3.3"></circle>
      <circle cx="73" cy="35" r="3.2"></circle>
      <circle cx="82" cy="33" r="3"></circle>
      <circle cx="92" cy="30" r="2.7"></circle>

    </g>

  </g>

  <!-- Seed highlights -->
  <g fill="#fff0bd" opacity="0.52">

    <circle cx="62" cy="8" r="0.9"></circle>
    <circle cx="55" cy="16" r="0.9"></circle>
    <circle cx="64" cy="18" r="1"></circle>
    <circle cx="72" cy="17" r="0.9"></circle>

    <circle cx="51" cy="22" r="0.9"></circle>
    <circle cx="59" cy="29" r="0.9"></circle>
    <circle cx="72" cy="28" r="0.9"></circle>
    <circle cx="54" cy="35" r="0.9"></circle>

  </g>

  <!-- Secondary side panicle -->
  <g transform="translate(34 48) scale(.62)" filter="url(#softShadow)">

    <path d="
      M0 20
      C0 11 1 2 2 -8" fill="none" stroke="#887243" stroke-width="2.5" stroke-linecap="round"></path>

    <g fill="url(#seedRed)" stroke="#6d4439" stroke-width="0.6">

      <circle cx="2" cy="-8" r="3"></circle>
      <circle cx="-2" cy="-3" r="3"></circle>
      <circle cx="5" cy="-2" r="3"></circle>
      <circle cx="-5" cy="3" r="3"></circle>
      <circle cx="2" cy="3" r="3.2"></circle>
      <circle cx="8" cy="4" r="3"></circle>
      <circle cx="-5" cy="9" r="2.8"></circle>
      <circle cx="2" cy="10" r="3"></circle>
      <circle cx="8" cy="10" r="2.8"></circle>

    </g>

  </g>

  <!-- Secondary right panicle -->
  <g transform="translate(93 42) scale(.55)" filter="url(#softShadow)">

    <path d="
      M0 22
      C0 12 0 3 -1 -8" fill="none" stroke="#887243" stroke-width="2.6" stroke-linecap="round"></path>

    <g fill="url(#seedGold)" stroke="#776137" stroke-width="0.6">

      <circle cx="-1" cy="-8" r="3"></circle>
      <circle cx="-5" cy="-2" r="3"></circle>
      <circle cx="3" cy="-2" r="3"></circle>
      <circle cx="-7" cy="4" r="3"></circle>
      <circle cx="0" cy="4" r="3.2"></circle>
      <circle cx="7" cy="4" r="3"></circle>
      <circle cx="-6" cy="10" r="2.8"></circle>
      <circle cx="1" cy="10" r="3"></circle>
      <circle cx="7" cy="11" r="2.8"></circle>

    </g>

  </g>

</svg>