<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">French Tarragon</title>

  <desc id="desc">
    Detailed botanical illustration of French tarragon with narrow aromatic leaves,
    slender branching stems, tiny pale flower heads, fresh harvested sprigs,
    and soft botanical shading.
  </desc>

  <defs>
    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ab979"></stop>
      <stop offset="0.52" stop-color="#688c56"></stop>
      <stop offset="1" stop-color="#3a6142"></stop>
    </linearGradient>

    <linearGradient id="leafLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b0ca8c"></stop>
      <stop offset="1" stop-color="#557c4c"></stop>
    </linearGradient>

    <linearGradient id="stemGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8aa363"></stop>
      <stop offset="1" stop-color="#536d43"></stop>
    </linearGradient>

    <radialGradient id="budOlive" cx="35%" cy="30%" r="72%">
      <stop offset="0" stop-color="#c2c282"></stop>
      <stop offset="0.55" stop-color="#898c55"></stop>
      <stop offset="1" stop-color="#5b613d"></stop>
    </radialGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#283029" flood-opacity="0.22"></feDropShadow>
    </filter>
  </defs>

  <ellipse cx="64" cy="119" rx="44" ry="5" fill="#555048" opacity="0.15"></ellipse>

  <!-- Main stems -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round">

    <path d="M63 110
         C62 92 63 75 64 58
         C65 42 64 29 61 17" stroke-width="4.7"></path>

    <path d="M52 108
         C52 92 50 78 47 65
         C45 53 41 43 36 34" stroke-width="3"></path>

    <path d="M75 108
         C75 92 78 77 82 64
         C86 52 91 42 96 34" stroke-width="3"></path>

  </g>

  <!-- Stem highlights -->
  <g fill="none" stroke="#afc183" stroke-linecap="round" opacity="0.62">

    <path d="M66 106
         C65 85 66 65 66 46" stroke-width="1.1"></path>

    <path d="M54 104
         C54 87 52 72 49 59" stroke-width="0.9"></path>

  </g>

  <!-- Leaf-bearing branches -->
  <g fill="none" stroke="#587848" stroke-width="1.7" stroke-linecap="round">

    <path d="M61 91 C51 84 42 77 33 69"></path>
    <path d="M63 82 C75 75 85 68 95 59"></path>
    <path d="M61 72 C51 66 43 59 36 51"></path>
    <path d="M64 64 C75 58 84 51 91 43"></path>
    <path d="M60 54 C51 49 45 42 40 36"></path>

  </g>

  <!-- Narrow aromatic leaves -->
  <g filter="url(#softShadow)">

    <path d="M34 69 C26 64 20 63 16 67 C21 73 28 76 35 73Z" fill="url(#leafGreen)" stroke="#37593c" stroke-width="1.2"></path>

    <path d="M42 76 C34 71 28 71 23 75 C28 81 35 83 43 80Z" fill="url(#leafLight)" stroke="#37593c" stroke-width="1.2"></path>

    <path d="M49 83 C41 78 35 78 30 82 C35 88 42 90 50 87Z" fill="url(#leafGreen)" stroke="#37593c" stroke-width="1.2"></path>

    <path d="M36 51 C28 46 22 45 18 49 C23 55 30 58 37 55Z" fill="url(#leafGreen)" stroke="#37593c" stroke-width="1.2"></path>

    <path d="M44 58 C36 53 30 53 25 57 C30 63 37 65 45 62Z" fill="url(#leafLight)" stroke="#37593c" stroke-width="1.2"></path>

    <path d="M95 59 C103 53 109 53 113 57 C108 64 101 66 94 63Z" fill="url(#leafGreen)" stroke="#37593c" stroke-width="1.2"></path>

    <path d="M87 66 C95 60 102 60 106 64 C101 71 94 73 86 69Z" fill="url(#leafLight)" stroke="#37593c" stroke-width="1.2"></path>

    <path d="M80 73 C88 68 95 68 99 72 C94 78 87 80 79 76Z" fill="url(#leafGreen)" stroke="#37593c" stroke-width="1.2"></path>

    <path d="M91 43 C99 37 105 37 109 41 C104 48 97 50 90 47Z" fill="url(#leafGreen)" stroke="#37593c" stroke-width="1.2"></path>

    <path d="M84 50 C92 45 98 45 103 49 C98 55 91 57 83 53Z" fill="url(#leafLight)" stroke="#37593c" stroke-width="1.2"></path>

  </g>

  <!-- Leaf highlights -->
  <g fill="none" stroke="#d0ddc2" stroke-width="0.75" stroke-linecap="round" opacity="0.7">

    <path d="M18 68 C24 69 30 71 34 72"></path>
    <path d="M25 76 C32 77 37 79 42 80"></path>
    <path d="M111 58 C104 59 99 61 95 62"></path>
    <path d="M104 65 C97 66 92 68 87 69"></path>

  </g>

  <!-- Upper flowering branches -->
  <g fill="none" stroke="#697649" stroke-width="1.3" stroke-linecap="round">

    <path d="M62 47 L52 38"></path>
    <path d="M64 44 L65 33"></path>
    <path d="M65 45 L77 36"></path>
    <path d="M52 38 L45 31"></path>
    <path d="M52 38 L53 29"></path>
    <path d="M77 36 L76 28"></path>
    <path d="M77 36 L84 30"></path>

  </g>

  <!-- Tiny flower heads -->
  <g filter="url(#softShadow)">

    <g transform="translate(45 30)">
      <ellipse cx="0" cy="0" rx="4.2" ry="3.4" fill="url(#budOlive)" stroke="#606742" stroke-width="0.8"></ellipse>
      <circle cx="-1.5" cy="-0.5" r="0.8" fill="#efe4ae"></circle>
      <circle cx="1.3" cy="-0.8" r="0.8" fill="#e8db9e"></circle>
      <circle cx="0.4" cy="1.1" r="0.7" fill="#d7c982"></circle>
    </g>

    <g transform="translate(66 31) scale(0.9)">
      <ellipse cx="0" cy="0" rx="4.2" ry="3.4" fill="url(#budOlive)" stroke="#606742" stroke-width="0.8"></ellipse>
      <circle cx="-1.5" cy="-0.5" r="0.8" fill="#efe4ae"></circle>
      <circle cx="1.3" cy="-0.8" r="0.8" fill="#e8db9e"></circle>
      <circle cx="0.4" cy="1.1" r="0.7" fill="#d7c982"></circle>
    </g>

    <g transform="translate(84 29) scale(0.82)">
      <ellipse cx="0" cy="0" rx="4.2" ry="3.4" fill="url(#budOlive)" stroke="#606742" stroke-width="0.8"></ellipse>
      <circle cx="-1.5" cy="-0.5" r="0.8" fill="#efe4ae"></circle>
      <circle cx="1.3" cy="-0.8" r="0.8" fill="#e8db9e"></circle>
      <circle cx="0.4" cy="1.1" r="0.7" fill="#d7c982"></circle>
    </g>

  </g>

  <!-- Root crown -->
  <path d="M55 103
       C59 99 70 99 75 104
       L74 110
       C69 113 59 113 55 109Z" fill="#758b53" stroke="#50663f" stroke-width="1.7"></path>

  <!-- Root division -->
  <g filter="url(#softShadow)">

    <path d="M58 108
         C56 114 55 120 57 124
         C61 122 64 117 64 109Z" fill="#aa8b69" stroke="#6d5945" stroke-width="1.5"></path>

    <path d="M68 109
         C69 116 72 121 76 123
         C77 118 75 113 73 108Z" fill="#a28565" stroke="#6d5945" stroke-width="1.5"></path>

  </g>

  <!-- Harvested sprig -->
  <g transform="translate(36 105) rotate(-12)" filter="url(#softShadow)">

    <path d="M-14 3 C-4 1 7 -1 18 -3" fill="none" stroke="#586f45" stroke-width="2.2" stroke-linecap="round"></path>

    <path d="M-8 0 C-12 -3 -15 -3 -17 -1 C-14 2 -11 3 -8 2Z" fill="url(#leafGreen)" stroke="#37593c" stroke-width="0.9"></path>

    <path d="M-1 -1 C-5 -5 -8 -5 -10 -3 C-7 0 -4 1 -1 1Z" fill="url(#leafLight)" stroke="#37593c" stroke-width="0.9"></path>

    <path d="M6 -2 C2 -6 -1 -6 -3 -4 C0 -1 3 0 6 0Z" fill="url(#leafGreen)" stroke="#37593c" stroke-width="0.9"></path>

    <path d="M13 -3 C9 -7 6 -7 4 -5 C7 -2 10 -1 13 -1Z" fill="url(#leafLight)" stroke="#37593c" stroke-width="0.9"></path>

  </g>

  <!-- Second harvested sprig -->
  <g transform="translate(91 108) rotate(16)" opacity="0.95">

    <path d="M-12 1 C-3 0 6 -1 14 -2" fill="none" stroke="#586f45" stroke-width="2" stroke-linecap="round"></path>

    <path d="M-5 0 C-9 -4 -12 -4 -14 -2 C-11 1 -8 2 -5 2Z" fill="url(#leafGreen)" stroke="#37593c" stroke-width="0.8"></path>

    <path d="M3 -1 C-1 -5 -4 -5 -6 -3 C-3 0 0 1 3 1Z" fill="url(#leafLight)" stroke="#37593c" stroke-width="0.8"></path>

    <path d="M10 -2 C6 -6 3 -6 1 -4 C4 -1 7 0 10 0Z" fill="url(#leafGreen)" stroke="#37593c" stroke-width="0.8"></path>

  </g>

  <g fill="#eee1b7" opacity="0.6">
    <circle cx="49" cy="64" r="1"></circle>
    <circle cx="84" cy="62" r="1"></circle>
    <circle cx="58" cy="43" r="0.9"></circle>
  </g>

</svg>