<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Oregano</title>

  <desc id="desc">
    A culinary oregano plant with upright branching stems,
    opposite oval green leaves, and small purple-white flowers.
  </desc>

  <!-- Main stem -->
  <path d="M64 116
       C64 96 64 77 63 58
       C62 42 62 28 61 16" fill="none" stroke="#5a844d" stroke-width="5" stroke-linecap="round">
  </path>

  <!-- Branches -->
  <path d="M63 49
       C51 43 42 35 35 27" fill="none" stroke="#5a844d" stroke-width="3.5" stroke-linecap="round">
  </path>

  <path d="M65 55
       C78 49 88 42 96 33" fill="none" stroke="#5a844d" stroke-width="3.5" stroke-linecap="round">
  </path>

  <path d="M63 70
       C51 66 42 59 34 52" fill="none" stroke="#5a844d" stroke-width="3" stroke-linecap="round">
  </path>

  <path d="M65 77
       C77 73 88 66 96 59" fill="none" stroke="#5a844d" stroke-width="3" stroke-linecap="round">
  </path>

  <!-- Leaves -->
  <ellipse cx="36" cy="30" rx="10" ry="6" transform="rotate(32 36 30)" fill="#739b62" stroke="#507947" stroke-width="1.5">
  </ellipse>

  <ellipse cx="47" cy="40" rx="10" ry="6" transform="rotate(20 47 40)" fill="#6d955c" stroke="#507947" stroke-width="1.5">
  </ellipse>

  <ellipse cx="94" cy="36" rx="10" ry="6" transform="rotate(-32 94 36)" fill="#739b62" stroke="#507947" stroke-width="1.5">
  </ellipse>

  <ellipse cx="83" cy="46" rx="10" ry="6" transform="rotate(-20 83 46)" fill="#6d955c" stroke="#507947" stroke-width="1.5">
  </ellipse>

  <ellipse cx="37" cy="55" rx="10" ry="6" transform="rotate(28 37 55)" fill="#7aa267" stroke="#507947" stroke-width="1.5">
  </ellipse>

  <ellipse cx="48" cy="64" rx="10" ry="6" transform="rotate(15 48 64)" fill="#70995f" stroke="#507947" stroke-width="1.5">
  </ellipse>

  <ellipse cx="93" cy="61" rx="10" ry="6" transform="rotate(-28 93 61)" fill="#7aa267" stroke="#507947" stroke-width="1.5">
  </ellipse>

  <ellipse cx="82" cy="70" rx="10" ry="6" transform="rotate(-15 82 70)" fill="#70995f" stroke="#507947" stroke-width="1.5">
  </ellipse>

  <!-- Leaf veins -->
  <path d="M31 29 L41 32
       M42 39 L52 42
       M89 37 L99 34
       M78 47 L88 44
       M32 54 L42 57
       M43 63 L53 65
       M88 62 L98 59
       M77 71 L87 68" fill="none" stroke="#91b17d" stroke-width="1.5" stroke-linecap="round">
  </path>

  <!-- Flower stems -->
  <path d="M61 17 L59 8
       M62 18 L66 8" fill="none" stroke="#59804b" stroke-width="2.5" stroke-linecap="round">
  </path>

  <!-- Flower clusters -->
  <circle cx="56" cy="8" r="3" fill="#b292ba">
  </circle>

  <circle cx="62" cy="5" r="3" fill="#d8ccd9">
  </circle>

  <circle cx="67" cy="9" r="3" fill="#a985b1">
  </circle>

  <circle cx="71" cy="5" r="2.5" fill="#d9cedc">
  </circle>

  <!-- Ground -->
  <ellipse cx="64" cy="117" rx="30" ry="5" fill="#81664a" opacity="0.35">
  </ellipse>

</svg>