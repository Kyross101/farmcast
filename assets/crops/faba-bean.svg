<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Faba Bean</title>

  <desc id="desc">
    Detailed illustration of broad green faba bean pods, pale mature seeds, and green leaves.
  </desc>

  <!-- Leaves -->
  <ellipse cx="43" cy="25" rx="16" ry="8" transform="rotate(-25 43 25)" fill="#638f4b" stroke="#406b39" stroke-width="1.8">
  </ellipse>

  <ellipse cx="64" cy="20" rx="16" ry="8" fill="#6b9851" stroke="#406b39" stroke-width="1.8">
  </ellipse>

  <ellipse cx="86" cy="26" rx="16" ry="8" transform="rotate(25 86 26)" fill="#638f4b" stroke="#406b39" stroke-width="1.8">
  </ellipse>

  <!-- Leaf veins -->
  <path d="M30 30 L56 22
       M64 28 L64 14
       M73 23 L99 32" fill="none" stroke="#94af7b" stroke-width="1.4" stroke-linecap="round">
  </path>

  <!-- Stems -->
  <path d="M64 43
       L64 27

       M64 35
       L47 28

       M64 35
       L82 29" fill="none" stroke="#607142" stroke-width="2.6" stroke-linecap="round">
  </path>

  <!-- Left broad pod -->
  <path d="M21 53
       C31 44 50 44 64 53
       C72 58 72 67 65 73
       C54 82 35 81 24 72
       C17 66 17 58 21 53Z" fill="#72a553" stroke="#47743d" stroke-width="2.4">
  </path>

  <!-- Pod bulges -->
  <path d="M27 59
       C34 54 40 55 46 59
       C52 54 58 55 64 60" fill="none" stroke="#98bf78" stroke-width="1.7" stroke-linecap="round">
  </path>

  <!-- Left pod highlight -->
  <path d="M26 52
       C36 48 48 48 58 53" fill="none" stroke="#b7d79b" stroke-width="1.8" stroke-linecap="round" opacity="0.8">
  </path>

  <!-- Right open pod -->
  <path d="M64 52
       C77 43 97 46 106 57
       C112 65 106 76 94 81
       C81 85 69 79 64 70
       C61 64 61 57 64 52Z" fill="#7dac59" stroke="#4d7a40" stroke-width="2.4">
  </path>

  <!-- Inner pod -->
  <path d="M70 57
       C80 51 94 52 100 59
       C105 65 100 72 91 75
       C81 78 73 73 70 68
       C68 64 68 60 70 57Z" fill="#d9c99d">
  </path>

  <!-- Seeds inside -->
  <ellipse cx="77" cy="64" rx="7" ry="5.5" fill="#d4b98c" stroke="#8e7558" stroke-width="1.5">
  </ellipse>

  <ellipse cx="91" cy="64" rx="7" ry="5.5" fill="#dec79d" stroke="#927a5c" stroke-width="1.5">
  </ellipse>

  <!-- Hila -->
  <path d="M72 64 L82 64
       M86 64 L96 64" fill="none" stroke="#74543c" stroke-width="1.8" stroke-linecap="round">
  </path>

  <!-- Highlights -->
  <path d="M73 61 C76 59 80 59 83 61
       M87 61 C90 59 94 59 97 61" fill="none" stroke="#fff5df" stroke-width="1.2" stroke-linecap="round" opacity="0.8">
  </path>

  <!-- Loose Faba beans -->
  <ellipse cx="31" cy="99" rx="11" ry="9" transform="rotate(-10 31 99)" fill="#d9c095" stroke="#8d7357" stroke-width="2">
  </ellipse>

  <ellipse cx="56" cy="106" rx="11" ry="9" transform="rotate(7 56 106)" fill="#e1caa1" stroke="#92785b" stroke-width="2">
  </ellipse>

  <ellipse cx="82" cy="104" rx="11" ry="9" transform="rotate(-6 82 104)" fill="#cdb185" stroke="#876e54" stroke-width="2">
  </ellipse>

  <ellipse cx="104" cy="96" rx="11" ry="9" transform="rotate(9 104 96)" fill="#ddc59a" stroke="#90765a" stroke-width="2">
  </ellipse>

  <!-- Seed hila -->
  <path d="M24 99 L38 99
       M49 106 L63 106
       M75 104 L89 104
       M97 96 L111 96" fill="none" stroke="#75533a" stroke-width="2.2" stroke-linecap="round">
  </path>

  <!-- Seed highlights -->
  <path d="M25 94 C29 91 34 91 38 94
       M50 101 C54 98 59 98 63 101
       M76 99 C80 96 85 96 89 99
       M98 91 C102 88 107 88 111 91" fill="none" stroke="#fff6df" stroke-width="1.3" stroke-linecap="round" opacity="0.75">
  </path>

  <!-- Ground shadow -->
  <ellipse cx="67" cy="119" rx="46" ry="4" fill="#81664a" opacity="0.17">
  </ellipse>

</svg>