<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Watercress</title>

  <desc id="desc">
    A watercress plant with creeping green stems,
    rounded leaflets, small white flowers,
    and shallow water below.
  </desc>

  <!-- Water -->
  <path d="M14 105
       C30 100 45 110 61 105
       C78 100 94 110 114 104" fill="none" stroke="#79a9ba" stroke-width="5" stroke-linecap="round" opacity="0.7">
  </path>

  <path d="M20 114
       C36 109 51 118 67 113
       C83 108 96 116 108 112" fill="none" stroke="#91bdc9" stroke-width="3" stroke-linecap="round" opacity="0.65">
  </path>

  <!-- Creeping stems -->
  <path d="M27 98
       C42 88 51 76 60 62
       C69 49 77 38 89 28" fill="none" stroke="#52884c" stroke-width="5" stroke-linecap="round">
  </path>

  <path d="M48 84
       C38 72 31 61 27 49" fill="none" stroke="#52884c" stroke-width="4" stroke-linecap="round">
  </path>

  <path d="M62 60
       C74 67 87 70 99 68" fill="none" stroke="#52884c" stroke-width="4" stroke-linecap="round">
  </path>

  <!-- Rounded leaflets -->
  <ellipse cx="27" cy="48" rx="9" ry="7" transform="rotate(25 27 48)" fill="#6da65d">
  </ellipse>

  <ellipse cx="37" cy="59" rx="9" ry="7" transform="rotate(-10 37 59)" fill="#74ae63">
  </ellipse>

  <ellipse cx="45" cy="72" rx="10" ry="7" transform="rotate(20 45 72)" fill="#639c55">
  </ellipse>

  <ellipse cx="57" cy="65" rx="10" ry="7" transform="rotate(-20 57 65)" fill="#75ad62">
  </ellipse>

  <ellipse cx="72" cy="51" rx="10" ry="7" transform="rotate(20 72 51)" fill="#699f58">
  </ellipse>

  <ellipse cx="83" cy="40" rx="10" ry="7" transform="rotate(-15 83 40)" fill="#78b066">
  </ellipse>

  <ellipse cx="95" cy="67" rx="10" ry="7" transform="rotate(12 95 67)" fill="#6ca25b">
  </ellipse>

  <ellipse cx="83" cy="65" rx="9" ry="7" transform="rotate(-18 83 65)" fill="#75ad62">
  </ellipse>

  <!-- Small white flowers -->
  <g transform="translate(94 25)">
    <circle cx="-4" cy="0" r="3.5" fill="#f4f2ea"></circle>
    <circle cx="4" cy="0" r="3.5" fill="#f4f2ea"></circle>
    <circle cx="0" cy="-4" r="3.5" fill="#f7f5ed"></circle>
    <circle cx="0" cy="4" r="3.5" fill="#f7f5ed"></circle>
    <circle cx="0" cy="0" r="2" fill="#d6bd55"></circle>
  </g>

  <!-- Roots at lower nodes -->
  <path d="M29 96 C27 104 24 109 21 114
       M36 92 C35 102 34 108 32 115
       M47 83 C46 94 45 101 43 108" fill="none" stroke="#a38963" stroke-width="2" stroke-linecap="round">
  </path>

</svg>