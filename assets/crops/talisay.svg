<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Talisay</title>

  <desc id="desc">
    Detailed botanical illustration of Philippine Talisay or Tropical Almond
    with broad green and reddish leaves, clustered almond-shaped fruits,
    warm highlights, layered shadows and natural botanical depth.
  </desc>

  <defs>

    <linearGradient id="branchBrown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a47a58"></stop>
      <stop offset="0.5" stop-color="#6d4d38"></stop>
      <stop offset="1" stop-color="#3b2e27"></stop>
    </linearGradient>

    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8cf70"></stop>
      <stop offset="0.42" stop-color="#5d994f"></stop>
      <stop offset="1" stop-color="#285e39"></stop>
    </linearGradient>

    <linearGradient id="leafDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ba357"></stop>
      <stop offset="0.5" stop-color="#397749"></stop>
      <stop offset="1" stop-color="#194a31"></stop>
    </linearGradient>

    <linearGradient id="leafRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#de9b62"></stop>
      <stop offset="0.45" stop-color="#bd664f"></stop>
      <stop offset="1" stop-color="#7d3d3d"></stop>
    </linearGradient>

    <radialGradient id="fruitGreen" cx="32%" cy="24%" r="78%">
      <stop offset="0" stop-color="#d6dc83"></stop>
      <stop offset="0.38" stop-color="#a8b65d"></stop>
      <stop offset="0.74" stop-color="#718246"></stop>
      <stop offset="1" stop-color="#495b35"></stop>
    </radialGradient>

    <radialGradient id="fruitYellow" cx="31%" cy="24%" r="78%">
      <stop offset="0" stop-color="#f0df88"></stop>
      <stop offset="0.4" stop-color="#d1b85f"></stop>
      <stop offset="0.76" stop-color="#9c7d42"></stop>
      <stop offset="1" stop-color="#675137"></stop>
    </radialGradient>

    <radialGradient id="fruitRed" cx="31%" cy="23%" r="78%">
      <stop offset="0" stop-color="#e9aa78"></stop>
      <stop offset="0.38" stop-color="#cf7459"></stop>
      <stop offset="0.75" stop-color="#974b48"></stop>
      <stop offset="1" stop-color="#66373a"></stop>
    </radialGradient>

    <filter id="mainShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#203328" flood-opacity="0.30"></feDropShadow>
    </filter>

    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5"></feGaussianBlur>
    </filter>

  </defs>


  <!-- soft ground shadow -->
  <ellipse cx="64" cy="112" rx="38" ry="6" fill="#203a2a" opacity="0.15" filter="url(#softBlur)"></ellipse>


  <g filter="url(#mainShadow)">

    <!-- main branch -->
    <path d="M29 106
             C40 87 51 68 63 52
             C75 37 87 29 101 24" fill="none" stroke="url(#branchBrown)" stroke-width="6" stroke-linecap="round"></path>

    <!-- secondary branch -->
    <path d="M57 64
             C47 51 36 42 22 36" fill="none" stroke="url(#branchBrown)" stroke-width="4" stroke-linecap="round"></path>


    <!-- large upper-left leaf -->
    <path d="M54 54
             C37 53 24 44 18 30
             C34 27 48 33 58 44
             C58 48 56 51 54 54Z" fill="url(#leafGreen)"></path>

    <path d="M53 50
             C42 42 31 35 21 31" fill="none" stroke="#dce9b2" stroke-width="1.5" stroke-linecap="round" opacity="0.52"></path>

    <path d="M42 44 L32 44" stroke="#d0e3a5" stroke-width="1" opacity="0.42"></path>

    <path d="M36 39 L29 34" stroke="#d0e3a5" stroke-width="1" opacity="0.42"></path>


    <!-- red mature leaf -->
    <path d="M53 72
             C37 76 25 72 17 62
             C30 56 45 59 57 66
             C57 69 55 71 53 72Z" fill="url(#leafRed)"></path>

    <path d="M52 69
             C41 66 30 63 21 63" fill="none" stroke="#f1bd83" stroke-width="1.3" stroke-linecap="round" opacity="0.48"></path>


    <!-- upper-right broad leaf -->
    <path d="M73 52
             C83 38 97 31 112 33
             C106 47 96 57 81 61
             C78 59 75 56 73 52Z" fill="url(#leafDark)"></path>

    <path d="M80 56
             C90 48 99 41 108 36" fill="none" stroke="#d6e7aa" stroke-width="1.4" stroke-linecap="round" opacity="0.48"></path>


    <!-- right middle leaf -->
    <path d="M84 68
             C98 61 110 63 117 70
             C108 79 97 82 84 78
             C82 75 82 72 84 68Z" fill="url(#leafGreen)"></path>

    <path d="M87 74
             C98 71 107 69 113 71" fill="none" stroke="#dcebb3" stroke-width="1.2" stroke-linecap="round" opacity="0.44"></path>


    <!-- lower right reddish leaf -->
    <path d="M86 87
             C99 82 110 85 116 92
             C106 99 95 100 84 96
             C83 92 84 89 86 87Z" fill="url(#leafRed)"></path>

    <path d="M89 92
             C99 90 108 90 113 92" fill="none" stroke="#eeb37e" stroke-width="1.1" stroke-linecap="round" opacity="0.42"></path>


    <!-- fruiting stalk -->
    <path d="M64 57
             C64 68 66 76 70 83" fill="none" stroke="#62753e" stroke-width="4" stroke-linecap="round"></path>

    <path d="M66 71
             C57 75 52 81 50 87" fill="none" stroke="#62753e" stroke-width="2.7" stroke-linecap="round"></path>

    <path d="M68 73
             C77 76 84 81 88 87" fill="none" stroke="#62753e" stroke-width="2.7" stroke-linecap="round"></path>


    <!-- green fruit -->
    <path d="M49 82
             C42 83 38 90 41 97
             C44 104 51 107 57 104
             C63 100 64 92 60 87
             C57 83 53 81 49 82Z" fill="url(#fruitGreen)"></path>

    <!-- fruit keel -->
    <path d="M43 95
             C49 94 55 92 60 87" fill="none" stroke="#60723d" stroke-width="1.5" stroke-linecap="round" opacity="0.75"></path>

    <!-- yellow ripe fruit -->
    <path d="M67 82
             C59 83 55 90 58 98
             C61 106 68 110 75 106
             C82 102 83 94 79 88
             C76 84 72 82 67 82Z" fill="url(#fruitYellow)"></path>

    <path d="M60 97
             C66 96 72 93 78 88" fill="none" stroke="#80683d" stroke-width="1.5" stroke-linecap="round" opacity="0.72"></path>

    <!-- red ripe fruit -->
    <path d="M86 82
             C79 83 76 89 78 96
             C81 103 87 106 93 102
             C99 98 100 92 96 87
             C93 83 90 82 86 82Z" fill="url(#fruitRed)"></path>

    <path d="M80 95
             C85 94 91 91 96 87" fill="none" stroke="#713b3d" stroke-width="1.4" stroke-linecap="round" opacity="0.72"></path>


    <!-- fruit caps -->
    <path d="M46 83
             C49 80 53 80 56 83" fill="none" stroke="#52693a" stroke-width="2.2" stroke-linecap="round"></path>

    <path d="M64 83
             C67 80 71 80 74 83" fill="none" stroke="#52693a" stroke-width="2.3" stroke-linecap="round"></path>

    <path d="M83 83
             C86 80 89 80 92 82" fill="none" stroke="#52693a" stroke-width="2.2" stroke-linecap="round"></path>

  </g>


  <!-- fruit highlights -->
  <path d="M44 89
           C46 85 49 84 52 84" fill="none" stroke="#f2f2b3" stroke-width="1.8" stroke-linecap="round" opacity="0.70"></path>

  <path d="M61 89
           C63 85 67 84 70 84" fill="none" stroke="#fff0ae" stroke-width="2" stroke-linecap="round" opacity="0.73"></path>

  <path d="M81 88
           C83 85 86 84 89 84" fill="none" stroke="#ffd5af" stroke-width="1.8" stroke-linecap="round" opacity="0.68"></path>


  <!-- broad leaf highlights -->
  <path d="M23 31
           C34 32 45 37 52 45" fill="none" stroke="#edf3ca" stroke-width="1.5" stroke-linecap="round" opacity="0.35"></path>

  <path d="M106 36
           C97 39 89 44 82 51" fill="none" stroke="#edf3c8" stroke-width="1.4" stroke-linecap="round" opacity="0.34"></path>

  <!-- branch highlight -->
  <path d="M32 102
           C43 84 53 68 64 53" fill="none" stroke="#c59a74" stroke-width="1.4" stroke-linecap="round" opacity="0.48"></path>

</svg>