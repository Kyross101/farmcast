<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Canistel</title>

  <desc id="desc">
    Three ripe golden-yellow canistel fruits with green leaves.
  </desc>

  <!-- Leaves -->
  <ellipse cx="42" cy="29" rx="18" ry="7" transform="rotate(-27 42 29)" fill="#608c49" stroke="#3f6939" stroke-width="1.8">
  </ellipse>

  <ellipse cx="91" cy="30" rx="18" ry="7" transform="rotate(27 91 30)" fill="#608c49" stroke="#3f6939" stroke-width="1.8">
  </ellipse>

  <!-- Leaf veins -->
  <path d="M28 35 L56 25
       M77 25 L105 37" fill="none" stroke="#93ad7b" stroke-width="1.4" stroke-linecap="round">
  </path>

  <!-- Small fruit stems -->
  <path d="M64 22
       C56 34 52 44 50 55

       M64 22
       C65 35 67 45 68 56

       M64 22
       C75 33 82 44 87 55" fill="none" stroke="#696a42" stroke-width="3" stroke-linecap="round">
  </path>

  <!-- Left canistel -->
  <path d="M49 51
       C39 53 34 63 35 74
       C36 86 42 94 49 98
       C56 94 62 86 63 74
       C64 63 59 53 49 51Z" fill="#e4ae39" stroke="#a57529" stroke-width="2.2">
  </path>

  <!-- Pointed fruit tip -->
  <path d="M45 51
       L49 44
       L53 51" fill="#d79b30" stroke="#a57529" stroke-width="1.8" stroke-linejoin="round">
  </path>

  <!-- Left highlight -->
  <path d="M42 62
       C39 70 40 79 44 84" fill="none" stroke="#f4d278" stroke-width="2.2" stroke-linecap="round">
  </path>

  <!-- Center canistel -->
  <path d="M68 57
       C56 59 50 71 51 84
       C52 98 59 107 68 111
       C77 107 84 98 85 84
       C86 71 80 59 68 57Z" fill="#eab63e" stroke="#aa792b" stroke-width="2.3">
  </path>

  <!-- Center pointed tip -->
  <path d="M63 58
       L68 49
       L73 58" fill="#dda333" stroke="#a9782b" stroke-width="1.9" stroke-linejoin="round">
  </path>

  <!-- Center orange side -->
  <path d="M75 61
       C84 69 87 84 82 96
       C79 103 74 108 68 110
       C74 96 76 78 75 61Z" fill="#d68631" opacity="0.68">
  </path>

  <!-- Center highlight -->
  <path d="M59 70
       C55 79 56 91 61 98" fill="none" stroke="#f6d77e" stroke-width="2.2" stroke-linecap="round">
  </path>

  <!-- Right canistel -->
  <path d="M89 51
       C79 53 74 63 75 74
       C76 86 82 94 89 98
       C96 94 102 86 103 74
       C104 63 99 53 89 51Z" fill="#dfa735" stroke="#a17027" stroke-width="2.2">
  </path>

  <!-- Right pointed tip -->
  <path d="M85 51
       L89 44
       L93 51" fill="#d49a2f" stroke="#a17027" stroke-width="1.8" stroke-linejoin="round">
  </path>

  <!-- Right highlight -->
  <path d="M82 62
       C79 70 80 79 84 84" fill="none" stroke="#f2cd72" stroke-width="2" stroke-linecap="round">
  </path>

  <!-- Shadow -->
  <ellipse cx="69" cy="117" rx="38" ry="5" fill="#81664a" opacity="0.2">
  </ellipse>

</svg>