<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Vanilla</title>

  <desc id="desc">
    Detailed botanical illustration of a climbing vanilla orchid vine
    with glossy leaves, pale green orchid flowers, developing vanilla pods,
    and cured dark vanilla beans.
  </desc>

  <defs>
    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8dbb70"></stop>
      <stop offset="0.48" stop-color="#4f874e"></stop>
      <stop offset="1" stop-color="#2b5d3a"></stop>
    </linearGradient>

    <linearGradient id="leafLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a6ca86"></stop>
      <stop offset="1" stop-color="#477a49"></stop>
    </linearGradient>

    <linearGradient id="vineGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78934e"></stop>
      <stop offset="1" stop-color="#455f36"></stop>
    </linearGradient>

    <linearGradient id="flowerPetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1efba"></stop>
      <stop offset="0.55" stop-color="#d8df91"></stop>
      <stop offset="1" stop-color="#a7b666"></stop>
    </linearGradient>

    <linearGradient id="flowerLip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2b9"></stop>
      <stop offset="0.55" stop-color="#e7cb67"></stop>
      <stop offset="1" stop-color="#b28f3e"></stop>
    </linearGradient>

    <linearGradient id="podGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9aae56"></stop>
      <stop offset="0.5" stop-color="#657c3e"></stop>
      <stop offset="1" stop-color="#3f5930"></stop>
    </linearGradient>

    <linearGradient id="podMature" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bdac58"></stop>
      <stop offset="0.45" stop-color="#8b8540"></stop>
      <stop offset="1" stop-color="#565b31"></stop>
    </linearGradient>

    <linearGradient id="curedBean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#654432"></stop>
      <stop offset="0.45" stop-color="#3e2a22"></stop>
      <stop offset="1" stop-color="#211816"></stop>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#263329" flood-opacity="0.25"></feDropShadow>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="64" cy="119" rx="44" ry="5" fill="#535047" opacity="0.16"></ellipse>

  <!-- Climbing support -->
  <path d="M69 108
       C70 88 71 69 72 51
       C73 37 75 25 78 16" fill="none" stroke="#735744" stroke-width="6" stroke-linecap="round"></path>

  <path d="M71 105
       C72 86 73 68 74 51
       C75 38 77 26 79 18" fill="none" stroke="#a28469" stroke-width="1.5" stroke-linecap="round" opacity="0.7"></path>

  <!-- Main vanilla vine -->
  <path d="M56 108
       C43 96 45 83 58 75
       C74 66 76 52 64 44
       C53 36 55 24 67 17" fill="none" stroke="url(#vineGreen)" stroke-width="5" stroke-linecap="round"></path>

  <!-- Vine highlight -->
  <path d="M58 106
       C48 96 49 85 60 78
       C75 68 79 52 66 42" fill="none" stroke="#a6b66c" stroke-width="1.3" stroke-linecap="round" opacity="0.65"></path>

  <!-- Aerial roots -->
  <g fill="none" stroke="#a89d77" stroke-linecap="round">
    <path d="M57 76 C48 80 44 87 43 94" stroke-width="2"></path>

    <path d="M66 44 C76 42 82 38 86 33" stroke-width="2"></path>

    <path d="M54 99 C46 102 42 107 41 112" stroke-width="1.8"></path>
  </g>

  <!-- Leaves -->
  <g filter="url(#softShadow)">
    <path d="M57 90
         C43 80 30 79 20 86
         C29 98 43 102 57 97Z" fill="url(#leafGreen)" stroke="#315a39" stroke-width="2"></path>

    <path d="M60 73
         C47 63 34 61 24 68
         C33 79 46 83 60 79Z" fill="url(#leafLight)" stroke="#315a39" stroke-width="2"></path>

    <path d="M69 62
         C82 52 96 50 106 57
         C98 69 84 73 69 68Z" fill="url(#leafGreen)" stroke="#315a39" stroke-width="2"></path>

    <path d="M64 46
         C52 36 40 33 31 39
         C39 50 51 55 64 52Z" fill="url(#leafLight)" stroke="#315a39" stroke-width="2"></path>

    <path d="M66 28
         C77 19 90 17 99 22
         C92 32 80 36 67 34Z" fill="url(#leafGreen)" stroke="#315a39" stroke-width="1.8"></path>
  </g>

  <!-- Leaf veins -->
  <g fill="none" stroke="#b2cf9e" stroke-linecap="round" opacity="0.8">
    <path d="M23 87 C36 89 47 93 55 96" stroke-width="1.2"></path>

    <path d="M27 69 C39 71 49 75 58 78" stroke-width="1.2"></path>

    <path d="M103 58 C91 59 80 63 71 67" stroke-width="1.2"></path>

    <path d="M34 40 C45 43 54 48 62 51" stroke-width="1.1"></path>

    <path d="M96 23 C86 25 77 29 69 33" stroke-width="1"></path>
  </g>

  <!-- Leaf gloss -->
  <g fill="none" stroke="#e1efd5" stroke-width="1" stroke-linecap="round" opacity="0.42">
    <path d="M29 84 C38 84 47 87 52 91"></path>
    <path d="M78 57 C87 54 96 55 101 58"></path>
  </g>

  <!-- Flower stem -->
  <path d="M65 47
       C76 47 83 45 89 40" fill="none" stroke="#687943" stroke-width="2" stroke-linecap="round"></path>

  <!-- Vanilla orchid flower -->
  <g transform="translate(93 39)" filter="url(#softShadow)">

    <!-- Sepals and petals -->
    <g fill="url(#flowerPetal)" stroke="#89964e" stroke-width="1.2">

      <ellipse cx="0" cy="-9" rx="4" ry="10"></ellipse>

      <ellipse cx="0" cy="-9" rx="4" ry="10" transform="rotate(72)"></ellipse>

      <ellipse cx="0" cy="-9" rx="4" ry="10" transform="rotate(144)"></ellipse>

      <ellipse cx="0" cy="-9" rx="4" ry="10" transform="rotate(216)"></ellipse>

      <ellipse cx="0" cy="-9" rx="4" ry="10" transform="rotate(288)"></ellipse>
    </g>

    <!-- Orchid lip -->
    <path d="M-7 1
         C-6 9 -2 13 2 12
         C7 11 9 6 7 1
         C4 4 1 5 -1 4
         C-4 5 -6 3 -7 1Z" fill="url(#flowerLip)" stroke="#a98439" stroke-width="1.2"></path>

    <path d="M-2 3
         C0 6 2 7 4 5" fill="none" stroke="#d69f45" stroke-width="1.2" stroke-linecap="round"></path>

    <circle cx="0" cy="0" r="2.5" fill="#e0bc58" stroke="#9b7d36" stroke-width="0.8"></circle>

    <!-- Petal highlight -->
    <path d="M-1 -16 C1 -14 2 -12 2 -9" fill="none" stroke="#fffbd4" stroke-width="1.2" opacity="0.75"></path>
  </g>

  <!-- Pod cluster stem -->
  <path d="M61 72
       C70 76 77 79 82 84" fill="none" stroke="#667444" stroke-width="2.2" stroke-linecap="round"></path>

  <!-- Developing vanilla pods -->
  <g filter="url(#softShadow)">
    <path d="M77 81
         C78 89 78 99 80 110" fill="none" stroke="url(#podGreen)" stroke-width="6" stroke-linecap="round"></path>

    <path d="M86 82
         C87 91 89 100 91 111" fill="none" stroke="url(#podGreen)" stroke-width="6" stroke-linecap="round"></path>

    <path d="M95 81
         C96 90 98 98 101 107" fill="none" stroke="url(#podMature)" stroke-width="6" stroke-linecap="round"></path>
  </g>

  <!-- Pod highlights -->
  <g fill="none" stroke="#c6d27c" stroke-width="1.2" stroke-linecap="round" opacity="0.72">
    <path d="M78 85 C78 94 79 101 80 106"></path>
    <path d="M87 86 C88 94 89 101 90 106"></path>
  </g>

  <!-- Yellowing mature tip -->
  <path d="M101 105
       C102 108 103 110 104 112" fill="none" stroke="#cab451" stroke-width="4" stroke-linecap="round"></path>

  <!-- Cured vanilla bean -->
  <g transform="translate(35 106) rotate(-18)" filter="url(#softShadow)">

    <path d="M-15 0
         C-7 -4 5 -5 17 -2" fill="none" stroke="url(#curedBean)" stroke-width="6" stroke-linecap="round"></path>

    <path d="M-12 -1
         C-4 -2 5 -3 13 -2" fill="none" stroke="#98715c" stroke-width="1" stroke-linecap="round" opacity="0.58"></path>
  </g>

  <!-- Second cured bean -->
  <g transform="translate(43 113) rotate(8)" opacity="0.95">
    <path d="M-14 0
         C-5 -3 6 -3 16 0" fill="none" stroke="#35241e" stroke-width="5" stroke-linecap="round"></path>

    <path d="M-10 -1
         C-2 -2 6 -1 12 0" fill="none" stroke="#806052" stroke-width="0.9" opacity="0.6"></path>
  </g>

  <!-- Botanical highlights -->
  <g fill="#eee4ad" opacity="0.68">
    <circle cx="70" cy="50" r="1"></circle>
    <circle cx="50" cy="64" r="1.1"></circle>
    <circle cx="85" cy="28" r="1"></circle>
  </g>

</svg>