<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Red Currant</title>

  <desc id="desc">
    Detailed botanical illustration of a red currant branch with lobed
    green leaves, small flowers, and hanging clusters of translucent
    glossy red berries with natural highlights, shadows, and depth.
  </desc>

  <defs>

    <linearGradient id="branchBrown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a7559"></stop>
      <stop offset="0.55" stop-color="#694d3d"></stop>
      <stop offset="1" stop-color="#41332c"></stop>
    </linearGradient>

    <linearGradient id="leafGreen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1f5435"></stop>
      <stop offset="0.48" stop-color="#4d8948"></stop>
      <stop offset="1" stop-color="#9dc477"></stop>
    </linearGradient>

    <linearGradient id="leafDark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#173e2b"></stop>
      <stop offset="1" stop-color="#609451"></stop>
    </linearGradient>

    <radialGradient id="berryRed" cx="30%" cy="24%" r="76%">
      <stop offset="0" stop-color="#ffb2a7"></stop>
      <stop offset="0.24" stop-color="#ee665b"></stop>
      <stop offset="0.58" stop-color="#ca2d35"></stop>
      <stop offset="0.84" stop-color="#8f1e2b"></stop>
      <stop offset="1" stop-color="#641824"></stop>
    </radialGradient>

    <radialGradient id="berryLight" cx="30%" cy="24%" r="76%">
      <stop offset="0" stop-color="#ffc5b6"></stop>
      <stop offset="0.28" stop-color="#f37867"></stop>
      <stop offset="0.62" stop-color="#d33a3e"></stop>
      <stop offset="1" stop-color="#7c1b29"></stop>
    </radialGradient>

    <linearGradient id="flowerCream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4efcc"></stop>
      <stop offset="0.55" stop-color="#c8c18a"></stop>
      <stop offset="1" stop-color="#89845a"></stop>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#1e271f" flood-opacity="0.27"></feDropShadow>
    </filter>

  </defs>

  <!-- ground shadow -->
  <ellipse cx="64" cy="116" rx="40" ry="6" fill="#293129" opacity="0.16"></ellipse>

  <!-- main branch -->
  <path d="
    M17 106
    C31 93 44 80 56 63
    C69 45 85 29 106 15" fill="none" stroke="url(#branchBrown)" stroke-width="6" stroke-linecap="round" filter="url(#softShadow)"></path>

  <!-- side branches -->
  <g fill="none" stroke="url(#branchBrown)" stroke-linecap="round">

    <path d="
      M46 78
      C38 65 33 53 32 40" stroke-width="3.4"></path>

    <path d="
      M61 56
      C55 44 53 32 55 20" stroke-width="3.1"></path>

    <path d="
      M77 40
      C89 42 101 38 113 29" stroke-width="3"></path>

    <path d="
      M38 91
      C29 87 22 82 16 76" stroke-width="2.7"></path>

  </g>

  <!-- branch highlight -->
  <path d="
    M21 102
    C36 88 49 74 60 58
    C73 42 88 28 103 18" fill="none" stroke="#bc9678" stroke-width="1" stroke-linecap="round" opacity="0.58"></path>

  <!-- lobed currant leaves -->
  <g stroke="#214b33" stroke-width="1.05" filter="url(#softShadow)">

    <path d="
      M30 41
      C21 33 13 34 10 40
      C13 44 17 46 20 47
      C16 51 17 56 22 59
      C27 58 30 55 32 52
      C35 55 40 54 43 50
      C42 45 38 42 33 41Z" fill="url(#leafGreen)"></path>

    <path d="
      M40 60
      C30 52 20 54 17 61
      C20 65 24 67 28 67
      C24 71 25 76 30 79
      C35 78 38 75 40 72
      C44 75 49 73 51 69
      C50 64 45 61 40 60Z" fill="url(#leafDark)"></path>

    <path d="
      M55 23
      C45 15 36 17 33 24
      C36 28 40 30 44 30
      C40 34 41 39 46 42
      C51 41 54 38 56 35
      C60 38 65 36 67 32
      C66 27 61 24 55 23Z" fill="url(#leafGreen)"></path>

    <path d="
      M73 47
      C82 37 92 36 98 42
      C96 47 92 49 88 50
      C92 53 91 59 86 62
      C81 61 78 58 76 55
      C72 58 67 56 65 52
      C66 49 69 48 73 47Z" fill="url(#leafGreen)"></path>

    <path d="
      M94 31
      C103 21 113 22 118 29
      C116 34 112 36 108 37
      C112 40 111 45 106 48
      C101 47 98 44 96 41
      C92 44 87 42 85 38
      C86 35 90 32 94 31Z" fill="url(#leafDark)"></path>

    <path d="
      M99 50
      C108 41 117 43 121 50
      C118 54 115 56 111 56
      C114 60 112 64 108 66
      C103 65 101 62 99 59
      C95 61 91 59 90 55
      C92 52 95 51 99 50Z" fill="url(#leafGreen)"></path>

  </g>

  <!-- leaf veins -->
  <g fill="none" stroke="#bad59a" stroke-width="0.75" stroke-linecap="round" opacity="0.74">

    <path d="M13 42 C22 44 29 46 38 48"></path>
    <path d="M19 62 C28 64 37 66 47 68"></path>
    <path d="M35 25 C44 27 53 29 63 31"></path>

    <path d="M95 44 C87 49 79 51 70 52"></path>
    <path d="M115 30 C108 34 101 37 91 39"></path>
    <path d="M118 51 C111 54 104 56 96 56"></path>

  </g>

  <!-- central berry truss -->
  <g fill="none" stroke="#657446" stroke-width="1.55" stroke-linecap="round">

    <path d="
      M55 61
      C59 70 60 80 60 91"></path>

    <path d="M59 69 L49 74"></path>
    <path d="M60 76 L70 80"></path>
    <path d="M60 83 L49 88"></path>
    <path d="M60 89 L69 94"></path>

  </g>

  <!-- central berries -->
  <g stroke="#7e1722" stroke-width="1" filter="url(#softShadow)">

    <circle cx="48" cy="78" r="8" fill="url(#berryLight)"></circle>

    <circle cx="71" cy="84" r="8.6" fill="url(#berryRed)"></circle>

    <circle cx="48" cy="92" r="8.7" fill="url(#berryRed)"></circle>

    <circle cx="70" cy="98" r="8.8" fill="url(#berryLight)"></circle>

  </g>

  <!-- right berry truss -->
  <g fill="none" stroke="#657446" stroke-width="1.5" stroke-linecap="round">

    <path d="
      M75 52
      C80 62 83 73 83 85"></path>

    <path d="M81 61 L72 66"></path>
    <path d="M82 68 L92 72"></path>
    <path d="M83 76 L74 81"></path>
    <path d="M83 83 L92 88"></path>

  </g>

  <g stroke="#7e1722" stroke-width="1" filter="url(#softShadow)">

    <circle cx="71" cy="70" r="7.8" fill="url(#berryRed)"></circle>

    <circle cx="93" cy="76" r="8.3" fill="url(#berryLight)"></circle>

    <circle cx="73" cy="85" r="8.1" fill="url(#berryLight)"></circle>

    <circle cx="93" cy="92" r="8.5" fill="url(#berryRed)"></circle>

  </g>

  <!-- translucent berry inner glow -->
  <g fill="#ffd2ca" opacity="0.32">

    <circle cx="48" cy="78" r="4.3"></circle>

    <circle cx="71" cy="84" r="4.5"></circle>

    <circle cx="48" cy="92" r="4.4"></circle>

    <circle cx="93" cy="76" r="4.3"></circle>

    <circle cx="73" cy="85" r="4.2"></circle>

  </g>

  <!-- glossy berry highlights -->
  <g fill="#fff1e9" opacity="0.72">

    <ellipse cx="45" cy="74" rx="2" ry="2.8" transform="rotate(-25 45 74)"></ellipse>

    <ellipse cx="68" cy="80" rx="2.1" ry="2.9" transform="rotate(-25 68 80)"></ellipse>

    <ellipse cx="45" cy="88" rx="2.1" ry="2.9" transform="rotate(-25 45 88)"></ellipse>

    <ellipse cx="90" cy="72" rx="2" ry="2.8" transform="rotate(-25 90 72)"></ellipse>

    <ellipse cx="70" cy="81" rx="1.8" ry="2.6" transform="rotate(-25 70 81)"></ellipse>

  </g>

  <!-- tiny blossom-end scars -->
  <g fill="#743c39" stroke="#551f26" stroke-width="0.4">

    <path d="M45 82 L48 80 L51 82 L49 84 L48 82 L46 84Z"></path>
    <path d="M68 88 L71 86 L74 88 L72 90 L71 88 L69 90Z"></path>
    <path d="M90 80 L93 78 L96 80 L94 82 L93 80 L91 82Z"></path>
    <path d="M90 96 L93 94 L96 96 L94 98 L93 96 L91 98Z"></path>

  </g>

  <!-- small flower raceme -->
  <path d="
    M85 39
    C92 35 98 30 103 24" fill="none" stroke="#657345" stroke-width="1.4" stroke-linecap="round"></path>

  <g filter="url(#softShadow)">

    <g transform="translate(103 24)">

      <path d="
        M0 0
        C-5 -4 -8 -1 -7 3
        C-4 6 -1 6 0 4

        C2 7 6 6 8 3
        C8 -1 5 -4 0 0Z" fill="url(#flowerCream)" stroke="#77774d" stroke-width="0.7"></path>

      <circle cx="0" cy="3" r="1.5" fill="#a78340"></circle>

    </g>

    <g transform="translate(109 32) scale(.85)">

      <path d="
        M0 0
        C-5 -4 -8 -1 -7 3
        C-4 6 -1 6 0 4

        C2 7 6 6 8 3
        C8 -1 5 -4 0 0Z" fill="url(#flowerCream)" stroke="#77774d" stroke-width="0.7"></path>

      <circle cx="0" cy="3" r="1.5" fill="#a78340"></circle>

    </g>

  </g>

</svg>