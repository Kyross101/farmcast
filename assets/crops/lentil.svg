<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Lentil</title>

  <desc id="desc">
    A branching lentil plant with small paired leaves,
    delicate flowers, and flat seed pods.
  </desc>

  <!-- Main stem -->
  <path d="M64 116
       C63 95 64 76 63 58
       C63 42 62 29 61 18" fill="none" stroke="#5e8b4b" stroke-width="5" stroke-linecap="round">
  </path>

  <!-- Branches -->
  <path d="M63 47
       C51 40 42 33 35 25" fill="none" stroke="#5e8b4b" stroke-width="3.5" stroke-linecap="round">
  </path>

  <path d="M64 55
       C77 48 87 40 95 31" fill="none" stroke="#5e8b4b" stroke-width="3.5" stroke-linecap="round">
  </path>

  <path d="M63 69
       C50 63 42 57 35 50" fill="none" stroke="#5e8b4b" stroke-width="3" stroke-linecap="round">
  </path>

  <path d="M64 78
       C76 72 85 66 92 59" fill="none" stroke="#5e8b4b" stroke-width="3" stroke-linecap="round">
  </path>

  <!-- Paired leaflets -->
  <ellipse cx="40" cy="28" rx="7" ry="3.5" transform="rotate(32 40 28)" fill="#76a85b">
  </ellipse>

  <ellipse cx="47" cy="35" rx="7" ry="3.5" transform="rotate(32 47 35)" fill="#6fa254">
  </ellipse>

  <ellipse cx="91" cy="34" rx="7" ry="3.5" transform="rotate(-32 91 34)" fill="#76a85b">
  </ellipse>

  <ellipse cx="83" cy="42" rx="7" ry="3.5" transform="rotate(-32 83 42)" fill="#6fa254">
  </ellipse>

  <ellipse cx="39" cy="53" rx="7" ry="3.5" transform="rotate(28 39 53)" fill="#79aa5d">
  </ellipse>

  <ellipse cx="48" cy="61" rx="7" ry="3.5" transform="rotate(28 48 61)" fill="#6da052">
  </ellipse>

  <ellipse cx="88" cy="62" rx="7" ry="3.5" transform="rotate(-28 88 62)" fill="#75a758">
  </ellipse>

  <ellipse cx="79" cy="69" rx="7" ry="3.5" transform="rotate(-28 79 69)" fill="#6b9d50">
  </ellipse>

  <!-- Small upper leaves -->
  <ellipse cx="58" cy="32" rx="6" ry="3" transform="rotate(-15 58 32)" fill="#7bae5f">
  </ellipse>

  <ellipse cx="68" cy="39" rx="6" ry="3" transform="rotate(15 68 39)" fill="#72a557">
  </ellipse>

  <!-- Lentil flowers -->
  <circle cx="33" cy="22" r="4" fill="#e7e4ee" stroke="#a59bb7" stroke-width="1.5">
  </circle>

  <circle cx="98" cy="28" r="4" fill="#e7e4ee" stroke="#a59bb7" stroke-width="1.5">
  </circle>

  <!-- Flat lentil pods -->
  <path d="M30 43
       C24 41 20 45 21 50
       C22 55 29 58 34 55
       C39 52 38 46 34 44
       C33 43 31 43 30 43Z" fill="#a4bd69" stroke="#668748" stroke-width="2">
  </path>

  <path d="M98 48
       C92 46 88 50 89 55
       C90 60 97 63 102 60
       C107 57 106 51 102 49
       C101 48 99 48 98 48Z" fill="#adc675" stroke="#668748" stroke-width="2">
  </path>

  <path d="M34 68
       C28 66 24 70 25 75
       C26 80 33 83 38 80
       C43 77 42 71 38 69
       C37 68 35 68 34 68Z" fill="#9eb764" stroke="#668748" stroke-width="2">
  </path>

  <!-- Seeds visible inside pods -->
  <circle cx="27" cy="50" r="2.4" fill="#cda86f"></circle>
  <circle cx="32" cy="52" r="2.4" fill="#d5b27a"></circle>

  <circle cx="95" cy="55" r="2.4" fill="#caa46c"></circle>
  <circle cx="100" cy="57" r="2.4" fill="#d4b179"></circle>

  <circle cx="31" cy="75" r="2.4" fill="#cda86f"></circle>
  <circle cx="36" cy="77" r="2.4" fill="#d5b27a"></circle>

  <!-- Ground -->
  <ellipse cx="64" cy="117" rx="30" ry="5" fill="#81664a" opacity="0.4">
  </ellipse>

</svg>