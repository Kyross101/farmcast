<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Water Chestnut</title>

  <desc id="desc">
    Detailed botanical illustration of Chinese water chestnut with upright
    aquatic green stems, shallow water and mud, underground stolons,
    and glossy dark brown edible corms.
  </desc>

  <defs>

    <linearGradient id="stemGreen" x1="0" y1="1" x2="1" y2="0">

      <stop offset="0" stop-color="#2c6646"></stop>

      <stop offset="0.48" stop-color="#55965c"></stop>

      <stop offset="0.78" stop-color="#7db56a"></stop>

      <stop offset="1" stop-color="#b2d17f"></stop>

    </linearGradient>

    <linearGradient id="stemDark" x1="0" y1="1" x2="1" y2="0">

      <stop offset="0" stop-color="#1f513b"></stop>

      <stop offset="0.58" stop-color="#39784c"></stop>

      <stop offset="1" stop-color="#82ae62"></stop>

    </linearGradient>

    <linearGradient id="waterGradient" x1="0" y1="0" x2="0" y2="1">

      <stop offset="0" stop-color="#b5d8d2" stop-opacity="0.75"></stop>

      <stop offset="1" stop-color="#689e99" stop-opacity="0.55"></stop>

    </linearGradient>

    <linearGradient id="mudGradient" x1="0" y1="0" x2="0" y2="1">

      <stop offset="0" stop-color="#98755c"></stop>

      <stop offset="0.5" stop-color="#735845"></stop>

      <stop offset="1" stop-color="#493a32"></stop>

    </linearGradient>

    <radialGradient id="cormBrown" cx="34%" cy="25%" r="74%">

      <stop offset="0" stop-color="#b47b58"></stop>

      <stop offset="0.3" stop-color="#86533e"></stop>

      <stop offset="0.68" stop-color="#593829"></stop>

      <stop offset="1" stop-color="#31271f"></stop>

    </radialGradient>

    <radialGradient id="cormDark" cx="34%" cy="24%" r="76%">

      <stop offset="0" stop-color="#8a6048"></stop>

      <stop offset="0.38" stop-color="#634230"></stop>

      <stop offset="0.76" stop-color="#3f3027"></stop>

      <stop offset="1" stop-color="#251f1b"></stop>

    </radialGradient>

    <linearGradient id="stolonGradient" x1="0" y1="0" x2="1" y2="1">

      <stop offset="0" stop-color="#d8c29a"></stop>

      <stop offset="0.55" stop-color="#a88b69"></stop>

      <stop offset="1" stop-color="#6e5847"></stop>

    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="170%" height="180%">

      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#17251d" flood-opacity="0.28"></feDropShadow>

    </filter>

    <filter id="cormShadow" x="-40%" y="-40%" width="180%" height="190%">

      <feDropShadow dx="1" dy="3" stdDeviation="2.1" flood-color="#292018" flood-opacity="0.34"></feDropShadow>

    </filter>

  </defs>

  <!-- distant stems -->

  <g fill="none" stroke-linecap="round" opacity="0.76">

    <path d="M23 78 C22 59 22 38 25 17" stroke="url(#stemDark)" stroke-width="3"></path>

    <path d="M34 79 C33 55 36 31 39 11" stroke="url(#stemGreen)" stroke-width="3.5"></path>

    <path d="M49 79 C47 57 49 36 52 18" stroke="url(#stemDark)" stroke-width="3.2"></path>

    <path d="M82 79 C83 58 82 37 79 14" stroke="url(#stemGreen)" stroke-width="3.4"></path>

    <path d="M96 80 C96 58 94 39 91 20" stroke="url(#stemDark)" stroke-width="3.1"></path>

    <path d="M108 80 C109 62 109 45 106 27" stroke="url(#stemGreen)" stroke-width="2.8"></path>

  </g>

  <!-- main upright stems -->

  <g fill="none" stroke-linecap="round" filter="url(#softShadow)">

    <path d="
      M42 82
      C41 61 43 39 45 14" stroke="url(#stemGreen)" stroke-width="5"></path>

    <path d="
      M58 82
      C58 57 60 31 62 7" stroke="url(#stemGreen)" stroke-width="5.3"></path>

    <path d="
      M72 82
      C72 59 70 37 69 13" stroke="url(#stemDark)" stroke-width="4.8"></path>

    <path d="
      M87 82
      C87 63 86 45 84 26" stroke="url(#stemGreen)" stroke-width="4.5"></path>

  </g>

  <!-- stem highlights -->

  <g fill="none" stroke="#d3e7a3" stroke-linecap="round" opacity="0.55">

    <path d="M43 76 C43 56 44 36 46 17" stroke-width="0.9"></path>

    <path d="M59 76 C59 53 60 31 62 10" stroke-width="1"></path>

    <path d="M73 76 C73 57 72 38 70 17" stroke-width="0.8"></path>

  </g>

  <!-- terminal spikelets -->

  <g fill="#9b7954" stroke="#68533f" stroke-width="0.7" filter="url(#softShadow)">

    <path d="
      M41 11
      C42 5 49 4 51 10
      C52 15 48 20 45 21
      C42 18 40 15 41 11Z"></path>

    <path d="
      M58 5
      C59 0 66 0 68 6
      C68 11 65 15 62 16
      C59 13 57 9 58 5Z"></path>

    <path d="
      M65 11
      C67 6 73 6 75 12
      C75 17 72 21 69 22
      C66 19 64 15 65 11Z"></path>

    <path d="
      M81 23
      C82 18 88 18 90 24
      C90 29 87 33 84 34
      C81 31 80 27 81 23Z"></path>

  </g>

  <!-- water -->

  <path d="
    M5 77
    C22 73 38 77 54 74
    C70 72 87 77 103 74
    C112 73 119 73 123 72
    L123 91
    C105 94 87 90 67 93
    C47 96 25 91 5 95Z" fill="url(#waterGradient)"></path>

  <!-- reflections -->

  <g fill="none" stroke="#dcece5" stroke-width="1" stroke-linecap="round" opacity="0.7">

    <path d="M9 81 C22 78 35 80 46 79"></path>
    <path d="M57 84 C72 80 89 83 103 80"></path>
    <path d="M22 89 C35 87 46 89 57 87"></path>
    <path d="M78 89 C92 86 108 88 119 85"></path>

  </g>

  <!-- muddy growing bed -->

  <path d="
    M4 93
    C23 89 43 94 61 91
    C81 88 103 94 124 90
    L124 128
    L4 128Z" fill="url(#mudGradient)"></path>

  <!-- mud texture -->

  <g fill="none" stroke="#baa083" stroke-linecap="round" opacity="0.3">

    <path d="M9 103 C22 99 36 103 47 100"></path>
    <path d="M69 100 C82 97 96 101 116 97"></path>
    <path d="M15 116 C27 113 38 115 47 113"></path>
    <path d="M78 117 C92 113 104 116 119 111"></path>

  </g>

  <!-- underground stolons -->

  <g fill="none" stroke="url(#stolonGradient)" stroke-linecap="round" filter="url(#softShadow)">

    <path d="
      M49 91
      C45 100 36 105 26 111" stroke-width="3"></path>

    <path d="
      M61 91
      C61 101 57 109 51 116" stroke-width="3.2"></path>

    <path d="
      M72 91
      C76 100 83 105 92 111" stroke-width="3"></path>

    <path d="
      M82 91
      C90 98 102 101 111 108" stroke-width="2.7"></path>

  </g>

  <!-- small stolon nodes -->

  <g fill="#b59a76" stroke="#705b47" stroke-width="0.7">

    <circle cx="39" cy="104" r="2"></circle>

    <circle cx="57" cy="108" r="2"></circle>

    <circle cx="84" cy="105" r="2"></circle>

    <circle cx="101" cy="102" r="1.8"></circle>

  </g>

  <!-- main edible corm left -->

  <g transform="translate(25 113)" filter="url(#cormShadow)">

    <path d="
      M0 -9
      C8 -12 16 -7 17 1
      C18 10 12 15 3 16
      C-6 17 -13 12 -14 4
      C-15 -4 -9 -9 0 -9Z" fill="url(#cormBrown)" stroke="#3c2c24" stroke-width="1.2"></path>

    <path d="
      M-7 -5
      C-1 -8 7 -7 11 -3" fill="none" stroke="#e0a97e" stroke-width="1.4" stroke-linecap="round" opacity="0.48"></path>

    <path d="
      M-11 2
      C-4 0 6 1 14 4" fill="none" stroke="#2d241f" stroke-width="1" opacity="0.6"></path>

    <path d="
      M-9 8
      C-2 6 7 7 12 10" fill="none" stroke="#2d241f" stroke-width="0.9" opacity="0.55"></path>

    <path d="
      M0 -9
      L2 -14" fill="none" stroke="#67513c" stroke-width="2" stroke-linecap="round"></path>

  </g>

  <!-- center corm -->

  <g transform="translate(52 118)" filter="url(#cormShadow)">

    <path d="
      M0 -10
      C8 -12 15 -7 16 1
      C17 9 11 14 3 15
      C-6 16 -13 11 -13 3
      C-14 -4 -8 -9 0 -10Z" fill="url(#cormDark)" stroke="#352820" stroke-width="1.2"></path>

    <path d="
      M-7 -5
      C-1 -8 7 -7 11 -3" fill="none" stroke="#c18c6a" stroke-width="1.3" stroke-linecap="round" opacity="0.5"></path>

    <path d="
      M-10 3
      C-3 1 5 2 13 5" fill="none" stroke="#221d1a" stroke-width="0.9" opacity="0.62"></path>

  </g>

  <!-- right corm -->

  <g transform="translate(93 114)" filter="url(#cormShadow)">

    <path d="
      M0 -10
      C9 -12 17 -7 18 1
      C19 10 12 16 3 16
      C-7 17 -14 12 -14 3
      C-15 -5 -9 -9 0 -10Z" fill="url(#cormBrown)" stroke="#3b2b23" stroke-width="1.2"></path>

    <path d="
      M-7 -6
      C0 -9 8 -7 12 -3" fill="none" stroke="#daa179" stroke-width="1.4" stroke-linecap="round" opacity="0.48"></path>

    <path d="
      M-11 2
      C-3 1 7 2 15 5" fill="none" stroke="#2c231e" stroke-width="1" opacity="0.62"></path>

    <path d="
      M0 -10
      L2 -15" fill="none" stroke="#69513b" stroke-width="2" stroke-linecap="round"></path>

  </g>

  <!-- small developing corm -->

  <g transform="translate(112 110)" filter="url(#softShadow)">

    <ellipse cx="0" cy="0" rx="8" ry="7" fill="url(#cormDark)" stroke="#372a23" stroke-width="1"></ellipse>

    <path d="
      M-4 -3
      C0 -5 4 -4 6 -2" fill="none" stroke="#ba8769" stroke-width="1" opacity="0.45"></path>

  </g>

  <!-- foreground mud overlays for depth -->

  <path d="
    M5 123
    C17 119 29 122 40 120
    C52 118 62 122 74 120
    C89 117 106 122 124 117
    L124 128
    L5 128Z" fill="#493a31" opacity="0.48"></path>

  <!-- tiny highlights -->

  <g fill="#f1d6b0" opacity="0.45">

    <circle cx="22" cy="108" r="1"></circle>

    <circle cx="88" cy="108" r="0.9"></circle>

    <circle cx="49" cy="113" r="0.8"></circle>

  </g>

</svg>