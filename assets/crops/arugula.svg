<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Arugula</title>

  <desc id="desc">
    Detailed botanical illustration of arugula with deeply lobed green leaves,
    pale cream flowers with violet veins, slender stems, seed pods,
    and harvested salad leaves.
  </desc>

  <defs>
    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9c87b"></stop>
      <stop offset="0.52" stop-color="#6b9b54"></stop>
      <stop offset="1" stop-color="#3b6a43"></stop>
    </linearGradient>

    <linearGradient id="leafLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c1d99a"></stop>
      <stop offset="1" stop-color="#5c8b4f"></stop>
    </linearGradient>

    <linearGradient id="stemGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8aa663"></stop>
      <stop offset="1" stop-color="#527245"></stop>
    </linearGradient>

    <linearGradient id="flowerCream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf0"></stop>
      <stop offset="1" stop-color="#e8e1bf"></stop>
    </linearGradient>

    <linearGradient id="podGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9caf64"></stop>
      <stop offset="1" stop-color="#627a43"></stop>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#263028" flood-opacity="0.22"></feDropShadow>
    </filter>
  </defs>

  <ellipse cx="64" cy="119" rx="45" ry="5" fill="#555048" opacity="0.15"></ellipse>

  <!-- Main stems -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round">

    <path d="M64 108
         C63 91 64 75 65 59
         C66 44 65 30 62 17" stroke-width="4.7"></path>

    <path d="M53 107
         C53 92 51 78 48 65
         C46 53 42 43 37 34" stroke-width="3"></path>

    <path d="M76 107
         C76 92 79 77 83 64
         C87 52 92 43 97 35" stroke-width="3"></path>

  </g>

  <!-- Stem highlights -->
  <g fill="none" stroke="#bed19c" stroke-linecap="round" opacity="0.65">

    <path d="M66 104
         C66 85 67 66 67 47" stroke-width="1"></path>

    <path d="M55 103
         C55 87 53 73 50 60" stroke-width="0.85"></path>

  </g>

  <!-- Lobed leaves -->
  <g filter="url(#softShadow)">

    <path d="M59 91
         C52 84 46 81 40 80
         C36 75 30 73 23 76
         C26 82 30 86 35 88
         C31 91 29 95 29 99
         C37 100 44 98 49 94
         C52 97 56 98 60 97Z" fill="url(#leafGreen)" stroke="#345b3c" stroke-width="2"></path>

    <path d="M57 72
         C50 65 44 62 38 62
         C34 57 28 56 22 59
         C25 65 29 68 34 70
         C30 73 28 77 28 81
         C36 82 43 80 48 76
         C51 78 55 79 58 78Z" fill="url(#leafLight)" stroke="#345b3c" stroke-width="2"></path>

    <path d="M58 53
         C51 46 45 43 39 43
         C35 39 30 38 25 41
         C28 46 32 49 36 50
         C33 53 31 56 31 59
         C39 60 46 58 59 59Z" fill="url(#leafGreen)" stroke="#345b3c" stroke-width="1.8"></path>

    <path d="M72 91
         C79 84 85 81 91 80
         C95 75 101 73 108 76
         C105 82 101 86 96 88
         C100 91 102 95 102 99
         C94 100 87 98 82 94
         C79 97 75 98 71 97Z" fill="url(#leafGreen)" stroke="#345b3c" stroke-width="2"></path>

    <path d="M73 72
         C80 65 86 62 92 62
         C96 57 102 56 108 59
         C105 65 101 68 96 70
         C100 73 102 77 102 81
         C94 82 87 80 82 76
         C79 78 75 79 72 78Z" fill="url(#leafLight)" stroke="#345b3c" stroke-width="2"></path>

    <path d="M73 53
         C80 46 86 43 92 43
         C96 39 101 38 106 41
         C103 46 99 49 95 50
         C98 53 100 56 100 59
         C92 60 85 58 72 59Z" fill="url(#leafGreen)" stroke="#345b3c" stroke-width="1.8"></path>

  </g>

  <!-- Leaf veins -->
  <g fill="none" stroke="#d0dfbe" stroke-linecap="round" opacity="0.78">

    <path d="M31 96 C41 92 50 92 57 95" stroke-width="1"></path>
    <path d="M30 78 C40 74 49 74 56 77" stroke-width="1"></path>
    <path d="M33 56 C42 53 50 54 57 57" stroke-width="0.9"></path>

    <path d="M100 96 C90 92 81 92 74 95" stroke-width="1"></path>
    <path d="M100 78 C90 74 81 74 74 77" stroke-width="1"></path>
    <path d="M98 56 C89 53 81 54 74 57" stroke-width="0.9"></path>

  </g>

  <!-- Flower branches -->
  <g fill="none" stroke="#6f7d4e" stroke-width="1.3" stroke-linecap="round">

    <path d="M64 47 L54 37"></path>
    <path d="M65 44 L66 32"></path>
    <path d="M66 45 L78 36"></path>
    <path d="M54 37 L47 30"></path>
    <path d="M66 32 L63 24"></path>
    <path d="M78 36 L85 29"></path>

  </g>

  <!-- Four-petaled flowers -->
  <g filter="url(#softShadow)">

    <g transform="translate(47 29)">

      <path d="M0 0
           C-4 -5 -4 -10 0 -12
           C4 -10 4 -5 0 0Z" fill="url(#flowerCream)" stroke="#b8b29a" stroke-width="0.8"></path>

      <path d="M0 0
           C5 -4 9 -3 10 1
           C8 5 4 5 0 0Z" fill="url(#flowerCream)" stroke="#b8b29a" stroke-width="0.8"></path>

      <path d="M0 0
           C3 5 1 9 -3 10
           C-6 7 -5 3 0 0Z" fill="url(#flowerCream)" stroke="#b8b29a" stroke-width="0.8"></path>

      <path d="M0 0
           C-5 3 -9 2 -10 -2
           C-8 -6 -4 -5 0 0Z" fill="url(#flowerCream)" stroke="#b8b29a" stroke-width="0.8"></path>

      <g stroke="#88618f" stroke-width="0.7" opacity="0.8">
        <path d="M0 -1 L0 -9"></path>
        <path d="M1 0 L7 1"></path>
        <path d="M0 1 L-2 7"></path>
        <path d="M-1 0 L-7 -2"></path>
      </g>

      <circle cx="0" cy="0" r="1.7" fill="#d8b957"></circle>

    </g>

    <g transform="translate(66 23) scale(0.92)">

      <path d="M0 0 C-4 -5 -4 -10 0 -12 C4 -10 4 -5 0 0Z" fill="url(#flowerCream)" stroke="#b8b29a" stroke-width="0.8"></path>

      <path d="M0 0 C5 -4 9 -3 10 1 C8 5 4 5 0 0Z" fill="url(#flowerCream)" stroke="#b8b29a" stroke-width="0.8"></path>

      <path d="M0 0 C3 5 1 9 -3 10 C-6 7 -5 3 0 0Z" fill="url(#flowerCream)" stroke="#b8b29a" stroke-width="0.8"></path>

      <path d="M0 0 C-5 3 -9 2 -10 -2 C-8 -6 -4 -5 0 0Z" fill="url(#flowerCream)" stroke="#b8b29a" stroke-width="0.8"></path>

      <g stroke="#88618f" stroke-width="0.7" opacity="0.8">
        <path d="M0 -1 L0 -9"></path>
        <path d="M1 0 L7 1"></path>
        <path d="M0 1 L-2 7"></path>
        <path d="M-1 0 L-7 -2"></path>
      </g>

      <circle cx="0" cy="0" r="1.7" fill="#d8b957"></circle>

    </g>

    <g transform="translate(85 28) scale(0.82)">

      <path d="M0 0 C-4 -5 -4 -10 0 -12 C4 -10 4 -5 0 0Z" fill="url(#flowerCream)" stroke="#b8b29a" stroke-width="0.8"></path>

      <path d="M0 0 C5 -4 9 -3 10 1 C8 5 4 5 0 0Z" fill="url(#flowerCream)" stroke="#b8b29a" stroke-width="0.8"></path>

      <path d="M0 0 C3 5 1 9 -3 10 C-6 7 -5 3 0 0Z" fill="url(#flowerCream)" stroke="#b8b29a" stroke-width="0.8"></path>

      <path d="M0 0 C-5 3 -9 2 -10 -2 C-8 -6 -4 -5 0 0Z" fill="url(#flowerCream)" stroke="#b8b29a" stroke-width="0.8"></path>

      <circle cx="0" cy="0" r="1.7" fill="#d8b957"></circle>

    </g>

  </g>

  <!-- Seed pods -->
  <path d="M84 79
       C93 84 99 90 103 97" fill="none" stroke="#69784a" stroke-width="1.4" stroke-linecap="round"></path>

  <g fill="url(#podGreen)" stroke="#4c633b" stroke-width="0.9" filter="url(#softShadow)">

    <path d="M101 93
         C105 97 107 104 106 111
         C102 107 100 100 101 93Z"></path>

    <path d="M94 88
         C98 92 100 99 99 106
         C95 102 93 95 94 88Z"></path>

  </g>

  <!-- Harvested salad leaves -->
  <g transform="translate(37 108) rotate(-13)" filter="url(#softShadow)">

    <path d="M-16 2
         C-5 1 6 -1 19 -3" fill="none" stroke="#5b754b" stroke-width="2.2" stroke-linecap="round"></path>

    <path d="M-10 0
         C-7 -5 -2 -7 3 -6
         C1 -2 -3 1 -10 0Z" fill="url(#leafGreen)" stroke="#345b3c" stroke-width="0.9"></path>

    <path d="M-2 -1
         C1 -6 6 -8 11 -7
         C9 -3 5 0 -2 -1Z" fill="url(#leafLight)" stroke="#345b3c" stroke-width="0.9"></path>

    <path d="M7 -2
         C10 -7 15 -9 20 -8
         C18 -4 14 -1 7 -2Z" fill="url(#leafGreen)" stroke="#345b3c" stroke-width="0.9"></path>

  </g>

  <g fill="#efe3b8" opacity="0.6">

    <circle cx="49" cy="64" r="1"></circle>
    <circle cx="84" cy="62" r="1"></circle>
    <circle cx="58" cy="43" r="0.9"></circle>

  </g>

</svg>