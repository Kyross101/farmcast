<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Rampion</title>

  <desc id="desc">
    Detailed botanical illustration of rampion with a pale edible tapered root,
    lance-shaped green leaves, an upright branching stem,
    and pale violet bell-shaped flowers.
  </desc>

  <defs>

    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bdd493"></stop>
      <stop offset="0.5" stop-color="#78a263"></stop>
      <stop offset="1" stop-color="#416d4d"></stop>
    </linearGradient>

    <linearGradient id="leafDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8caf71"></stop>
      <stop offset="1" stop-color="#365d45"></stop>
    </linearGradient>

    <linearGradient id="stemGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a7bd82"></stop>
      <stop offset="1" stop-color="#567753"></stop>
    </linearGradient>

    <linearGradient id="rootCream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1dfb9"></stop>
      <stop offset="0.55" stop-color="#cdb58c"></stop>
      <stop offset="1" stop-color="#91765c"></stop>
    </linearGradient>

    <radialGradient id="flowerViolet" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#e7ddf0"></stop>
      <stop offset="0.55" stop-color="#a88ac4"></stop>
      <stop offset="1" stop-color="#6d5a91"></stop>
    </radialGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#29302b" flood-opacity="0.2"></feDropShadow>
    </filter>

  </defs>

  <ellipse cx="63" cy="119" rx="43" ry="5" fill="#4e4e49" opacity="0.15"></ellipse>

  <!-- Edible tapered root -->
  <g filter="url(#softShadow)">

    <path d="M55 88
         C52 96 52 105 55 113
         C57 119 60 124 63 127
         C67 121 69 114 70 106
         C71 98 69 92 66 87
         C62 84 58 85 55 88Z" fill="url(#rootCream)" stroke="#806950" stroke-width="1.6"></path>

    <path d="M59 91
         C57 101 59 113 62 121" fill="none" stroke="#f4e8cb" stroke-width="0.95" stroke-linecap="round" opacity="0.75"></path>

  </g>

  <!-- Fine rootlets -->
  <g fill="none" stroke="#8c745b" stroke-linecap="round">

    <path d="M54 102 C48 106 45 111 42 116" stroke-width="0.85"></path>

    <path d="M69 104 C75 108 78 113 80 118" stroke-width="0.85"></path>

    <path d="M58 114 C54 118 52 122 51 125" stroke-width="0.75"></path>

  </g>

  <!-- Crown -->
  <path d="M48 89
       C53 84 58 81 63 81
       C69 81 75 84 79 89
       C75 95 69 98 63 98
       C57 98 52 95 48 89Z" fill="#735f49" stroke="#4c4036" stroke-width="1.3"></path>

  <!-- Main stem -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round">

    <path d="M63 85
         C62 68 63 52 65 39
         C67 27 67 18 66 9" stroke-width="2.7"></path>

    <path d="M64 68
         C53 62 46 54 41 46" stroke-width="1.4"></path>

    <path d="M65 59
         C77 53 85 45 91 36" stroke-width="1.4"></path>

    <path d="M66 41
         C57 36 51 30 48 23" stroke-width="1.15"></path>

    <path d="M67 36
         C76 31 82 25 86 18" stroke-width="1.15"></path>

  </g>

  <!-- Basal leaves -->
  <g fill="url(#leafGreen)" stroke="#396247" stroke-width="1.25" filter="url(#softShadow)">

    <path d="M56 91
         C47 94 38 91 32 86
         C27 81 26 75 29 70
         C34 68 40 70 45 74
         C51 79 55 85 56 91Z"></path>

    <path d="M70 91
         C79 94 88 91 94 86
         C99 81 100 75 97 70
         C92 68 86 70 81 74
         C75 79 71 85 70 91Z"></path>

    <path d="M59 78
         C51 78 44 74 41 69
         C38 64 39 59 43 56
         C49 57 54 61 57 66
         C60 71 61 75 59 78Z"></path>

    <path d="M68 75
         C76 75 83 71 86 66
         C89 61 88 56 84 53
         C78 54 73 58 70 63
         C67 68 66 72 68 75Z"></path>

  </g>

  <!-- Narrow upper leaves -->
  <g fill="url(#leafDark)" stroke="#345940" stroke-width="0.95">

    <path d="M60 61
         C55 58 52 54 53 50
         C54 46 57 44 60 44
         C64 49 64 56 60 61Z"></path>

    <path d="M71 56
         C76 53 79 49 78 45
         C77 41 74 39 71 39
         C67 44 67 51 71 56Z"></path>

    <path d="M62 43
         C58 40 56 36 57 33
         C58 30 60 28 63 28
         C65 33 65 39 62 43Z"></path>

  </g>

  <!-- Leaf veins -->
  <g fill="none" stroke="#d1deba" stroke-linecap="round" opacity="0.72">

    <path d="M55 87 C47 81 39 76 31 73" stroke-width="0.75"></path>

    <path d="M71 87 C79 81 87 76 95 73" stroke-width="0.75"></path>

    <path d="M58 74 C52 68 47 62 44 59" stroke-width="0.65"></path>

    <path d="M69 71 C75 65 80 59 83 56" stroke-width="0.65"></path>

  </g>

  <!-- Flower pedicels -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round">

    <path d="M66 28 L53 19" stroke-width="1"></path>
    <path d="M67 26 L67 13" stroke-width="1"></path>
    <path d="M68 28 L82 19" stroke-width="1"></path>

    <path d="M91 36 L101 28" stroke-width="0.85"></path>
    <path d="M41 46 L31 37" stroke-width="0.85"></path>

  </g>

  <!-- Bell flower left -->
  <g transform="translate(52 17)" filter="url(#softShadow)">

    <path d="M-5 -5
         C-3 -9 3 -9 5 -5
         L6 1
         C4 6 -4 6 -6 1Z" fill="url(#flowerViolet)" stroke="#64517f" stroke-width="1"></path>

    <path d="M-6 1
         L-3 5
         L0 2
         L3 5
         L6 1" fill="none" stroke="#695484" stroke-width="0.8"></path>

    <path d="M0 -5 L0 4" stroke="#efe4b0" stroke-width="0.65" stroke-linecap="round"></path>

    <circle cx="0" cy="4" r="1" fill="#d7bf69"></circle>

  </g>

  <!-- Central bell -->
  <g transform="translate(67 11)" filter="url(#softShadow)">

    <path d="M-5 -5
         C-3 -10 3 -10 5 -5
         L6 1
         C4 6 -4 6 -6 1Z" fill="url(#flowerViolet)" stroke="#64517f" stroke-width="1"></path>

    <path d="M-6 1
         L-3 5
         L0 2
         L3 5
         L6 1" fill="none" stroke="#695484" stroke-width="0.8"></path>

    <path d="M0 -5 L0 4" stroke="#efe4b0" stroke-width="0.65" stroke-linecap="round"></path>

    <circle cx="0" cy="4" r="1" fill="#d7bf69"></circle>

  </g>

  <!-- Right bell -->
  <g transform="translate(83 17)" filter="url(#softShadow)">

    <path d="M-5 -5
         C-3 -9 3 -9 5 -5
         L6 1
         C4 6 -4 6 -6 1Z" fill="url(#flowerViolet)" stroke="#64517f" stroke-width="1"></path>

    <path d="M-6 1
         L-3 5
         L0 2
         L3 5
         L6 1" fill="none" stroke="#695484" stroke-width="0.8"></path>

    <path d="M0 -5 L0 4" stroke="#efe4b0" stroke-width="0.65" stroke-linecap="round"></path>

    <circle cx="0" cy="4" r="1" fill="#d7bf69"></circle>

  </g>

  <!-- Side flowers -->
  <g transform="translate(102 27) scale(.8)" filter="url(#softShadow)">

    <path d="M-5 -5 C-3 -9 3 -9 5 -5 L6 1 C4 6 -4 6 -6 1Z" fill="url(#flowerViolet)" stroke="#64517f" stroke-width="1"></path>

    <path d="M-6 1 L-3 5 L0 2 L3 5 L6 1" fill="none" stroke="#695484" stroke-width="0.8"></path>

  </g>

  <g transform="translate(30 36) scale(.8)" filter="url(#softShadow)">

    <path d="M-5 -5 C-3 -9 3 -9 5 -5 L6 1 C4 6 -4 6 -6 1Z" fill="url(#flowerViolet)" stroke="#64517f" stroke-width="1"></path>

    <path d="M-6 1 L-3 5 L0 2 L3 5 L6 1" fill="none" stroke="#695484" stroke-width="0.8"></path>

  </g>

</svg>