<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Turnip</title>

  <desc id="desc">
    A turnip plant with broad green leaves,
    a purple-topped white root, and a slender taproot.
  </desc>

  <!-- Root body -->
  <path d="M42 68
       C42 56 51 49 64 49
       C77 49 86 56 86 68
       C86 84 76 97 64 103
       C52 97 42 84 42 68Z" fill="#f1eee3" stroke="#b7b19e" stroke-width="3">
  </path>

  <!-- Purple shoulder -->
  <path d="M43 67
       C45 55 53 49 64 49
       C76 49 84 55 86 67
       C77 63 51 63 43 67Z" fill="#8c5b91" stroke="#704676" stroke-width="2">
  </path>

  <!-- Taproot -->
  <path d="M64 102
       C63 110 60 116 57 121" fill="none" stroke="#c6c0ad" stroke-width="3" stroke-linecap="round">
  </path>

  <!-- Leaf stems -->
  <path d="M59 53 C52 42 43 32 34 24" fill="none" stroke="#5d8d4b" stroke-width="4" stroke-linecap="round">
  </path>

  <path d="M64 51 C64 38 64 26 65 15" fill="none" stroke="#5d8d4b" stroke-width="4" stroke-linecap="round">
  </path>

  <path d="M69 53 C77 42 86 34 96 27" fill="none" stroke="#5d8d4b" stroke-width="4" stroke-linecap="round">
  </path>

  <!-- Leaves -->
  <path d="M35 24
       C22 18 15 27 19 39
       C23 51 36 55 50 47
       C48 37 43 29 35 24Z" fill="#6fa154" stroke="#4b793e" stroke-width="2">
  </path>

  <path d="M65 16
       C55 6 46 11 44 22
       C42 34 52 43 64 44
       C76 42 83 31 80 20
       C78 11 70 9 65 16Z" fill="#79aa5b" stroke="#4b793e" stroke-width="2">
  </path>

  <path d="M95 27
       C108 22 114 31 110 42
       C106 53 93 56 79 48
       C82 38 87 31 95 27Z" fill="#6a9e51" stroke="#4b793e" stroke-width="2">
  </path>

  <!-- Leaf veins -->
  <path d="M35 27 L48 45
       M65 18 L64 42
       M94 30 L81 46" fill="none" stroke="#568447" stroke-width="2" stroke-linecap="round">
  </path>

  <!-- Root detail -->
  <path d="M53 76 C55 82 58 86 61 89
       M74 75 C72 82 70 86 67 90" fill="none" stroke="#d7d2c4" stroke-width="2" stroke-linecap="round">
  </path>

  <!-- Ground -->
  <ellipse cx="64" cy="118" rx="30" ry="5" fill="#81664a" opacity="0.35">
  </ellipse>

</svg>