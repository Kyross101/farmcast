<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Sage</title>

  <desc id="desc">
    A common sage plant with woody stems,
    soft gray-green leaves,
    and purple flower spikes.
  </desc>

  <!-- Main woody stem -->
  <path d="M64 116
       C63 96 64 77 63 59
       C62 43 61 29 60 17" fill="none" stroke="#765f49" stroke-width="6" stroke-linecap="round">
  </path>

  <!-- Side branches -->
  <path d="M62 51
       C50 45 42 37 35 29" fill="none" stroke="#765f49" stroke-width="4" stroke-linecap="round">
  </path>

  <path d="M65 57
       C78 51 88 43 96 34" fill="none" stroke="#765f49" stroke-width="4" stroke-linecap="round">
  </path>

  <path d="M62 73
       C50 69 41 62 33 55" fill="none" stroke="#765f49" stroke-width="3.5" stroke-linecap="round">
  </path>

  <path d="M65 79
       C78 75 88 68 97 61" fill="none" stroke="#765f49" stroke-width="3.5" stroke-linecap="round">
  </path>

  <!-- Sage leaves -->
  <g fill="#879b79" stroke="#62745c" stroke-width="1.5">

    <ellipse cx="35" cy="31" rx="13" ry="6" transform="rotate(32 35 31)">
    </ellipse>

    <ellipse cx="47" cy="42" rx="13" ry="6" transform="rotate(22 47 42)">
    </ellipse>

    <ellipse cx="95" cy="36" rx="13" ry="6" transform="rotate(-32 95 36)">
    </ellipse>

    <ellipse cx="83" cy="47" rx="13" ry="6" transform="rotate(-22 83 47)">
    </ellipse>

    <ellipse cx="35" cy="58" rx="14" ry="6.5" transform="rotate(28 35 58)">
    </ellipse>

    <ellipse cx="48" cy="68" rx="13" ry="6" transform="rotate(18 48 68)">
    </ellipse>

    <ellipse cx="95" cy="64" rx="14" ry="6.5" transform="rotate(-28 95 64)">
    </ellipse>

    <ellipse cx="82" cy="74" rx="13" ry="6" transform="rotate(-18 82 74)">
    </ellipse>

  </g>

  <!-- Leaf veins -->
  <g fill="none" stroke="#a6b49a" stroke-width="1.5" stroke-linecap="round">

    <path d="M28 28 L42 34"></path>
    <path d="M40 40 L54 44"></path>

    <path d="M88 39 L102 33"></path>
    <path d="M76 49 L90 44"></path>

    <path d="M28 56 L43 61"></path>
    <path d="M41 67 L55 70"></path>

    <path d="M88 67 L103 61"></path>
    <path d="M75 76 L89 72"></path>

  </g>

  <!-- Flower spike -->
  <path d="M60 18
       C59 13 59 8 59 4" fill="none" stroke="#61764f" stroke-width="3" stroke-linecap="round">
  </path>

  <!-- Purple flowers -->
  <g>
    <ellipse cx="54" cy="13" rx="5" ry="3.5" transform="rotate(-20 54 13)" fill="#8970a5">
    </ellipse>

    <ellipse cx="65" cy="12" rx="5" ry="3.5" transform="rotate(20 65 12)" fill="#9279ad">
    </ellipse>

    <ellipse cx="55" cy="7" rx="5" ry="3.5" transform="rotate(-20 55 7)" fill="#a088b8">
    </ellipse>

    <ellipse cx="64" cy="6" rx="5" ry="3.5" transform="rotate(20 64 6)" fill="#856ba1">
    </ellipse>

    <ellipse cx="59" cy="2" rx="4" ry="3" fill="#a68ebc">
    </ellipse>
  </g>

  <!-- Ground -->
  <ellipse cx="64" cy="117" rx="30" ry="5" fill="#81664a" opacity="0.3">
  </ellipse>

</svg>