<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Artichoke</title>

  <desc id="desc">
    A globe artichoke plant with a green layered flower bud,
    sturdy stem, and broad deeply lobed leaves.
  </desc>

  <!-- Main stem -->
  <path d="M64 113
       C64 94 64 77 64 59" fill="none" stroke="#5a844c" stroke-width="7" stroke-linecap="round">
  </path>

  <!-- Side stems -->
  <path d="M61 84
       C49 79 40 71 33 63" fill="none" stroke="#5a844c" stroke-width="4" stroke-linecap="round">
  </path>

  <path d="M67 82
       C79 76 89 69 96 60" fill="none" stroke="#5a844c" stroke-width="4" stroke-linecap="round">
  </path>

  <!-- Artichoke bud base -->
  <path d="M42 48
       C41 32 50 19 64 17
       C78 19 87 32 86 48
       C84 62 75 70 64 72
       C53 70 44 62 42 48Z" fill="#6e9a5c" stroke="#4c7343" stroke-width="2.5">
  </path>

  <!-- Layered bracts -->
  <path d="M64 20
       L54 37
       L64 33
       L74 37Z" fill="#87ad70">
  </path>

  <path d="M49 29
       L47 47
       L58 40
       L57 26Z" fill="#769f63">
  </path>

  <path d="M79 29
       L81 47
       L70 40
       L71 26Z" fill="#769f63">
  </path>

  <path d="M44 43
       L49 59
       L59 47
       L55 37Z" fill="#7fa86b">
  </path>

  <path d="M84 43
       L79 59
       L69 47
       L73 37Z" fill="#7fa86b">
  </path>

  <path d="M53 55
       L64 68
       L64 48Z" fill="#6f995d">
  </path>

  <path d="M75 55
       L64 68
       L64 48Z" fill="#668f56">
  </path>

  <!-- Purple hint in center -->
  <path d="M58 29
       C61 25 67 25 70 29
       C67 31 61 31 58 29Z" fill="#85719b" opacity="0.75">
  </path>

  <!-- Left lobed leaf -->
  <path d="M34 64
       C23 58 16 62 18 70
       L27 72
       L20 79
       C25 85 33 84 40 79
       L44 88
       C51 84 54 75 49 68
       C44 65 39 63 34 64Z" fill="#709b60" stroke="#4c7445" stroke-width="2">
  </path>

  <!-- Right lobed leaf -->
  <path d="M95 62
