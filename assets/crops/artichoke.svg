  <!-- Lower leaves -->
  <path d="M54 92
       C42 88 34 92 35 100
       C41 106 50 106 59 101Z" fill="#668f58">
  </path>

  <path d="M74 92
       C86 88 94 92 93 100
       C87 106 78 106 69 101Z" fill="#668f58">
  </path>

  <!-- Ground -->
  <ellipse cx="64" cy="116" rx="31" ry="5" fill="#81664a" opacity="0.35">
  </ellipse>

</svg>