<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Oca</title>

  <desc id="desc">
    Detailed botanical illustration of oca with trifoliate green leaves,
    small yellow flowers, red and golden edible tubers,
    fine roots, highlights, shadows, and natural depth.
  </desc>

  <defs>

    <linearGradient id="stemGreen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#496b45"></stop>
      <stop offset="1" stop-color="#8eb56a"></stop>
    </linearGradient>

    <linearGradient id="leafGreen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2d623b"></stop>
      <stop offset="0.52" stop-color="#55954e"></stop>
      <stop offset="1" stop-color="#9ac875"></stop>
    </linearGradient>

    <linearGradient id="leafDark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#244c33"></stop>
      <stop offset="1" stop-color="#6ca65c"></stop>
    </linearGradient>

    <radialGradient id="redTuber" cx="32%" cy="25%" r="75%">
      <stop offset="0" stop-color="#ef8d78"></stop>
      <stop offset="0.45" stop-color="#c9504e"></stop>
      <stop offset="0.8" stop-color="#943238"></stop>
      <stop offset="1" stop-color="#672630"></stop>
    </radialGradient>

    <radialGradient id="goldTuber" cx="32%" cy="25%" r="75%">
      <stop offset="0" stop-color="#ffe18a"></stop>
      <stop offset="0.48" stop-color="#dfaa45"></stop>
      <stop offset="0.82" stop-color="#b27630"></stop>
      <stop offset="1" stop-color="#805027"></stop>
    </radialGradient>

    <linearGradient id="flowerYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff18a"></stop>
      <stop offset="1" stop-color="#d9a82e"></stop>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#253328" flood-opacity="0.25"></feDropShadow>
    </filter>

  </defs>

  <!-- Ground shadow -->
  <ellipse cx="64" cy="116" rx="39" ry="6" fill="#334033" opacity="0.17"></ellipse>

  <!-- Main trailing stems -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round" stroke-linejoin="round">

    <path d="
      M63 100
      C63 83 61 67 58 52
      C55 38 50 27 45 17" stroke-width="4"></path>

    <path d="
      M61 70
      C49 63 39 55 30 44" stroke-width="2.8"></path>

    <path d="
      M64 63
      C75 55 84 45 91 34" stroke-width="2.8"></path>

    <path d="
      M57 82
      C45 82 34 78 23 71" stroke-width="2.5"></path>

    <path d="
      M67 82
      C79 80 91 75 102 67" stroke-width="2.5"></path>

  </g>

  <!-- Left trifoliate leaf -->
  <g filter="url(#softShadow)" stroke="#285637" stroke-width="1.1">

    <path d="
      M31 43
      C23 34 14 34 10 41
      C15 49 24 51 32 47
      C35 46 35 44 31 43Z" fill="url(#leafGreen)"></path>

    <path d="
      M31 42
      C27 31 30 23 38 22
      C44 28 42 37 35 43
      C33 45 32 45 31 42Z" fill="url(#leafDark)"></path>

    <path d="
      M33 44
      C42 36 51 38 54 45
      C49 53 40 54 33 49
      C30 48 30 46 33 44Z" fill="url(#leafGreen)"></path>

  </g>

  <!-- Upper trifoliate leaf -->
  <g filter="url(#softShadow)" stroke="#285637" stroke-width="1.1">

    <path d="
      M46 20
      C39 11 31 11 27 18
      C32 26 40 28 47 24Z" fill="url(#leafGreen)"></path>

    <path d="
      M47 20
      C43 10 47 4 54 4
      C60 11 57 18 51 23Z" fill="url(#leafDark)"></path>

    <path d="
      M49 21
      C57 14 66 16 69 23
      C64 30 56 31 49 26Z" fill="url(#leafGreen)"></path>

  </g>

  <!-- Right trifoliate leaf -->
  <g filter="url(#softShadow)" stroke="#285637" stroke-width="1.1">

    <path d="
      M90 34
      C83 25 74 26 71 33
      C76 40 84 42 91 38Z" fill="url(#leafGreen)"></path>

    <path d="
      M91 34
      C87 24 91 17 98 17
      C104 24 101 32 95 37Z" fill="url(#leafDark)"></path>

    <path d="
      M93 35
      C101 28 110 30 113 37
      C108 44 100 45 93 40Z" fill="url(#leafGreen)"></path>

  </g>

  <!-- Lower side leaves -->
  <g fill="url(#leafGreen)" stroke="#2a5938" stroke-width="1" filter="url(#softShadow)">

    <path d="
      M25 70
      C16 63 8 66 7 74
      C14 80 22 80 29 75Z"></path>

    <path d="
      M101 66
      C110 59 119 63 120 71
      C113 77 105 77 98 72Z"></path>

  </g>

  <!-- Leaf veins -->
  <g fill="none" stroke="#bed99c" stroke-width="0.8" stroke-linecap="round" opacity="0.72">

    <path d="M13 42 C20 43 26 44 31 45"></path>
    <path d="M38 24 C35 31 33 36 32 42"></path>
    <path d="M51 46 C44 46 39 46 34 46"></path>

    <path d="M29 18 C36 20 41 21 46 22"></path>
    <path d="M54 7 C51 13 49 18 48 21"></path>
    <path d="M66 23 C59 23 54 23 50 23"></path>

    <path d="M74 33 C81 35 86 35 91 36"></path>
    <path d="M98 19 C95 25 93 30 92 34"></path>
    <path d="M110 37 C103 37 98 37 94 37"></path>

  </g>

  <!-- Flower stems -->
  <g fill="none" stroke="#67834c" stroke-width="1.5" stroke-linecap="round">

    <path d="M69 55 C75 48 80 42 83 35"></path>
    <path d="M48 58 C42 51 38 46 36 39"></path>

  </g>

  <!-- Yellow flowers -->
  <g filter="url(#softShadow)">

    <g transform="translate(84 34)">
      <path d="M0 0 C-7 -2 -9 -7 -5 -11 C0 -11 2 -7 2 -3Z" fill="url(#flowerYellow)" stroke="#aa8327" stroke-width="0.7"></path>
      <path d="M0 0 C2 -7 7 -9 11 -5 C11 0 7 2 3 2Z" fill="url(#flowerYellow)" stroke="#aa8327" stroke-width="0.7"></path>
      <path d="M0 0 C7 2 9 7 5 11 C0 11 -2 7 -2 3Z" fill="url(#flowerYellow)" stroke="#aa8327" stroke-width="0.7"></path>
      <path d="M0 0 C-2 7 -7 9 -11 5 C-11 0 -7 -2 -3 -2Z" fill="url(#flowerYellow)" stroke="#aa8327" stroke-width="0.7"></path>
      <path d="M0 0 C-4 -5 -2 -10 3 -10 C7 -7 6 -3 3 -1Z" fill="url(#flowerYellow)" stroke="#aa8327" stroke-width="0.7"></path>
      <circle cx="0" cy="0" r="2.2" fill="#9d7330"></circle>
    </g>

    <g transform="translate(35 38) scale(.8)">
      <path d="M0 0 C-7 -2 -9 -7 -5 -11 C0 -11 2 -7 2 -3Z" fill="url(#flowerYellow)" stroke="#aa8327" stroke-width="0.8"></path>
      <path d="M0 0 C2 -7 7 -9 11 -5 C11 0 7 2 3 2Z" fill="url(#flowerYellow)" stroke="#aa8327" stroke-width="0.8"></path>
      <path d="M0 0 C7 2 9 7 5 11 C0 11 -2 7 -2 3Z" fill="url(#flowerYellow)" stroke="#aa8327" stroke-width="0.8"></path>
      <path d="M0 0 C-2 7 -7 9 -11 5 C-11 0 -7 -2 -3 -2Z" fill="url(#flowerYellow)" stroke="#aa8327" stroke-width="0.8"></path>
      <circle cx="0" cy="0" r="2.2" fill="#9d7330"></circle>
    </g>

  </g>

  <!-- Underground stolons -->
  <g fill="none" stroke="#846b4d" stroke-width="1.6" stroke-linecap="round">

    <path d="M62 98 C50 101 43 106 38 111"></path>
    <path d="M64 99 C75 102 83 106 91 111"></path>
    <path d="M61 101 C57 107 55 112 54 117"></path>
    <path d="M66 101 C70 107 73 112 75 117"></path>

  </g>

  <!-- Red oca tuber -->
  <g filter="url(#softShadow)">

    <path d="
      M26 105
      C30 99 39 98 45 102
      C50 106 48 114 43 118
      C37 122 29 119 26 114
      C24 111 24 108 26 105Z" fill="url(#redTuber)" stroke="#762d34" stroke-width="1.5"></path>

    <path d="
      M31 105
      C35 103 40 103 43 105" fill="none" stroke="#f0a18c" stroke-width="1.2" stroke-linecap="round" opacity="0.7"></path>

    <path d="M30 110 C35 111 40 111 45 109" fill="none" stroke="#7e3438" stroke-width="0.8" opacity="0.7"></path>

    <circle cx="37" cy="106" r="1" fill="#62262d"></circle>
    <circle cx="42" cy="113" r="0.9" fill="#62262d"></circle>

  </g>

  <!-- Golden oca tuber -->
  <g filter="url(#softShadow)">

    <path d="
      M78 104
      C83 99 92 99 98 103
      C104 108 102 115 96 119
      C89 123 81 120 77 115
      C74 111 75 107 78 104Z" fill="url(#goldTuber)" stroke="#855629" stroke-width="1.5"></path>

    <path d="
      M83 104
      C88 102 93 103 97 105" fill="none" stroke="#ffe3a0" stroke-width="1.2" stroke-linecap="round" opacity="0.74"></path>

    <path d="M80 111 C87 112 94 111 99 109" fill="none" stroke="#8a5c2f" stroke-width="0.8" opacity="0.7"></path>

    <circle cx="89" cy="106" r="1" fill="#775026"></circle>
    <circle cx="95" cy="114" r="0.9" fill="#775026"></circle>

  </g>

  <!-- Smaller tubers -->
  <ellipse cx="55" cy="116" rx="8" ry="5" fill="url(#redTuber)" stroke="#762d34" stroke-width="1.1" transform="rotate(-16 55 116)"></ellipse>

  <ellipse cx="74" cy="117" rx="8" ry="5" fill="url(#goldTuber)" stroke="#855629" stroke-width="1.1" transform="rotate(14 74 117)"></ellipse>

  <!-- Fine roots -->
  <g fill="none" stroke="#957957" stroke-width="0.9" stroke-linecap="round" opacity="0.8">

    <path d="M60 101 C52 109 49 117 48 123"></path>
    <path d="M65 102 C68 111 68 117 67 123"></path>
    <path d="M68 102 C80 108 85 115 88 122"></path>
    <path d="M57 101 C45 106 37 111 32 117"></path>

  </g>

  <!-- Stem highlights -->
  <g fill="none" stroke="#bed595" stroke-width="0.85" stroke-linecap="round" opacity="0.65">

    <path d="
      M64 96
      C64 82 63 68 61 55
      C59 42 54 30 49 20"></path>

    <path d="M62 67 C51 61 42 54 34 46"></path>
    <path d="M66 61 C75 54 82 46 88 37"></path>

  </g>

</svg>