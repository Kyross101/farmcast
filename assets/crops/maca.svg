<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="macaTitle macaDesc">
  <title id="macaTitle">Maca</title>
  <desc id="macaDesc">
    Detailed maca plant with a low green leaf rosette
    and enlarged edible golden-purple hypocotyl below the soil.
  </desc>

  <defs>
    <linearGradient id="macaLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a0d376"></stop>
      <stop offset="45%" stop-color="#5fa757"></stop>
      <stop offset="100%" stop-color="#2a7241"></stop>
    </linearGradient>

    <linearGradient id="macaLeafDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#74b761"></stop>
      <stop offset="100%" stop-color="#1d5c36"></stop>
    </linearGradient>

    <radialGradient id="macaRoot" cx="34%" cy="25%" r="78%">
      <stop offset="0%" stop-color="#f2d395"></stop>
      <stop offset="35%" stop-color="#d7aa68"></stop>
      <stop offset="70%" stop-color="#b57a51"></stop>
      <stop offset="100%" stop-color="#78463d"></stop>
    </radialGradient>

    <linearGradient id="macaPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a56a83"></stop>
      <stop offset="100%" stop-color="#6a405c"></stop>
    </linearGradient>

    <linearGradient id="macaStem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#73995c"></stop>
      <stop offset="100%" stop-color="#456c43"></stop>
    </linearGradient>

    <filter id="macaShadow" x="-35%" y="-35%" width="170%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.4" flood-color="#17321f" flood-opacity="0.22"></feDropShadow>
    </filter>
  </defs>

  <!-- Soil -->
  <path d="M11 74
       C27 70 43 73 61 72
       C81 70 99 72 117 75
       L117 113
       C96 116 79 113 63 114
       C44 116 28 114 11 111Z" fill="#8a6548" opacity="0.22"></path>

  <path d="M12 74
       C30 71 46 74 62 73
       C82 71 99 72 116 75" fill="none" stroke="#79583e" stroke-width="2" stroke-linecap="round" opacity="0.65"></path>

  <!-- Crown -->
  <g filter="url(#macaShadow)">
    <path d="M53 73
         C55 68 59 65 64 65
         C70 65 74 69 75 74
         C72 79 56 79 52 75
         C51 74 52 73 53 73Z" fill="#7d6847" stroke="#5d4c39" stroke-width="1.2"></path>
  </g>

  <!-- Leaf stems -->
  <g fill="none" stroke="url(#macaStem)" stroke-width="2.3" stroke-linecap="round">
    <path d="M63 69 C53 61 44 54 34 48"></path>
    <path d="M62 68 C48 66 36 65 24 66"></path>
    <path d="M64 67 C57 55 53 45 52 35"></path>
    <path d="M65 67 C72 55 77 45 79 34"></path>
    <path d="M66 69 C78 62 89 55 99 48"></path>
    <path d="M66 70 C81 70 94 70 106 73"></path>
  </g>

  <!-- Left outer leaf -->
  <g filter="url(#macaShadow)">
    <path d="M37 50
         C29 51 21 48 18 42
         C22 35 31 33 40 37
         C46 41 45 47 37 50Z" fill="url(#macaLeaf)"></path>

    <path d="M40 44 C33 42 26 41 20 42" fill="none" stroke="#d9edc6" stroke-width="1.15" opacity="0.68"></path>
  </g>

  <!-- Far left leaf -->
  <g filter="url(#macaShadow)">
    <path d="M27 69
         C18 72 10 69 8 63
         C13 56 23 55 31 59
         C36 63 34 67 27 69Z" fill="url(#macaLeafDark)"></path>

    <path d="M30 64 C23 63 16 63 10 64" fill="none" stroke="#cee6b8" stroke-width="1.1" opacity="0.66"></path>
  </g>

  <!-- Upper left leaf -->
  <g filter="url(#macaShadow)">
    <path d="M53 39
         C47 33 47 25 52 20
         C60 21 64 28 62 35
         C60 41 56 42 53 39Z" fill="url(#macaLeaf)"></path>

    <path d="M57 38 C56 32 54 26 53 21" fill="none" stroke="#d8edc5" stroke-width="1.1" opacity="0.68"></path>
  </g>

  <!-- Upper right leaf -->
  <g filter="url(#macaShadow)">
    <path d="M77 39
         C74 31 78 24 85 21
         C92 25 93 33 88 39
         C84 44 79 43 77 39Z" fill="url(#macaLeafDark)"></path>

    <path d="M82 40 C84 33 85 27 85 22" fill="none" stroke="#d1e8bc" stroke-width="1.1" opacity="0.68"></path>
  </g>

  <!-- Right leaf -->
  <g filter="url(#macaShadow)">
    <path d="M96 52
         C102 44 111 42 117 47
         C117 55 109 61 101 60
         C95 59 92 56 96 52Z" fill="url(#macaLeaf)"></path>

    <path d="M100 57 C106 53 111 50 116 48" fill="none" stroke="#d8edc4" stroke-width="1.1" opacity="0.68"></path>
  </g>

  <!-- Far right leaf -->
  <g filter="url(#macaShadow)">
    <path d="M103 75
         C110 68 119 68 123 74
         C121 82 113 87 105 84
         C100 82 99 78 103 75Z" fill="url(#macaLeafDark)"></path>

    <path d="M106 80 C112 77 117 75 121 75" fill="none" stroke="#d1e8bb" stroke-width="1.1" opacity="0.68"></path>
  </g>

  <!-- Center small leaves -->
  <g filter="url(#macaShadow)">
    <path d="M59 61
         C54 55 56 49 61 46
         C67 49 69 55 66 61
         C64 64 61 64 59 61Z" fill="url(#macaLeaf)"></path>

    <path d="M69 60
         C70 53 75 49 81 51
         C84 57 80 63 74 64
         C70 64 68 62 69 60Z" fill="url(#macaLeafDark)"></path>
  </g>

  <!-- Enlarged edible hypocotyl -->
  <g filter="url(#macaShadow)">
    <path d="M51 76
         C51 84 54 95 59 103
         C61 107 61 112 64 116
         C68 113 68 108 71 104
         C76 96 79 85 76 77
         C71 72 57 72 51 76Z" fill="url(#macaRoot)" stroke="#84513f" stroke-width="1.5"></path>

    <!-- Purple shoulder -->
    <path d="M52 78
         C57 73 70 73 76 78
         C74 83 70 85 64 85
         C58 85 54 82 52 78Z" fill="url(#macaPurple)" opacity="0.88"></path>

    <!-- Root highlight -->
    <path d="M57 82
         C57 90 59 98 63 104" fill="none" stroke="#f5ddb0" stroke-width="2" stroke-linecap="round" opacity="0.58"></path>

    <!-- Root texture -->
    <g fill="none" stroke="#8b5744" stroke-width="1" stroke-linecap="round" opacity="0.42">
      <path d="M55 91 C59 93 63 93 67 91"></path>
      <path d="M58 101 C62 103 67 102 71 99"></path>
      <path d="M61 108 C64 109 67 108 69 106"></path>
    </g>

    <!-- Fine root tip -->
    <path d="M64 114 C63 119 62 122 60 124" fill="none" stroke="#79543c" stroke-width="1.6" stroke-linecap="round"></path>

    <path d="M64 115 C67 119 69 121 71 123" fill="none" stroke="#79543c" stroke-width="1.3" stroke-linecap="round"></path>
  </g>

  <!-- Soil specks -->
  <g fill="#76553c" opacity="0.4">
    <circle cx="23" cy="91" r="1.5"></circle>
    <circle cx="36" cy="104" r="1.2"></circle>
    <circle cx="87" cy="94" r="1.4"></circle>
    <circle cx="102" cy="107" r="1.2"></circle>
    <circle cx="93" cy="82" r="1"></circle>
    <circle cx="19" cy="108" r="1"></circle>
  </g>
</svg>