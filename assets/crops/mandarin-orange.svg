<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Mandarin Orange</title>
  <desc id="desc">
    A Dalanghita branch with green citrus leaves,
    ripe orange mandarin fruits, and a peeled segment.
  </desc>

  <!-- Main branch -->
  <path d="M23 108
       C38 88 50 69 64 51
       C77 35 91 25 106 18" fill="none" stroke="#70523a" stroke-width="7" stroke-linecap="round"></path>

  <!-- Side branches -->
  <path d="M49 72
       C39 61 33 50 29 39" fill="none" stroke="#75573e" stroke-width="4" stroke-linecap="round"></path>

  <path d="M72 45
       C84 45 96 41 106 34" fill="none" stroke="#75573e" stroke-width="4" stroke-linecap="round"></path>

  <!-- Citrus leaves -->
  <ellipse cx="29" cy="35" rx="15" ry="8" transform="rotate(48 29 35)" fill="#609548" stroke="#42743a" stroke-width="2"></ellipse>

  <ellipse cx="43" cy="54" rx="16" ry="8" transform="rotate(30 43 54)" fill="#71a554" stroke="#42743a" stroke-width="2"></ellipse>

  <ellipse cx="85" cy="39" rx="16" ry="8" transform="rotate(-25 85 39)" fill="#679d4d" stroke="#42743a" stroke-width="2"></ellipse>

  <ellipse cx="103" cy="30" rx="14" ry="8" transform="rotate(-28 103 30)" fill="#76a957" stroke="#42743a" stroke-width="2"></ellipse>

  <ellipse cx="95" cy="16" rx="13" ry="7" transform="rotate(-8 95 16)" fill="#5d9146" stroke="#42743a" stroke-width="2"></ellipse>

  <!-- Fruit stems -->
  <path d="M62 54 C61 62 61 68 61 73" fill="none" stroke="#607941" stroke-width="3"></path>

  <path d="M85 43 C87 50 88 56 87 62" fill="none" stroke="#607941" stroke-width="3"></path>

  <!-- Main mandarin -->
  <circle cx="61" cy="88" r="19" fill="#e99331" stroke="#bd6f22" stroke-width="2.5"></circle>

  <!-- Mandarin top -->
  <path d="M56 70
       C59 67 64 67 67 70" fill="none" stroke="#678748" stroke-width="3" stroke-linecap="round"></path>

  <!-- Peel texture -->
  <circle cx="52" cy="81" r="1.2" fill="#f4b357"></circle>
  <circle cx="64" cy="78" r="1.1" fill="#f4b357"></circle>
  <circle cx="70" cy="88" r="1.2" fill="#f4b357"></circle>
  <circle cx="55" cy="96" r="1.1" fill="#f4b357"></circle>
  <circle cx="66" cy="101" r="1.2" fill="#f4b357"></circle>

  <!-- Highlight -->
  <path d="M50 79
       C46 85 47 92 50 96" fill="none" stroke="#f8bc63" stroke-width="3" stroke-linecap="round"></path>

  <!-- Second mandarin -->
  <circle cx="88" cy="75" r="15" fill="#e68a2d" stroke="#b96c22" stroke-width="2.5"></circle>

  <path d="M84 61
       C87 59 90 59 93 61" fill="none" stroke="#678748" stroke-width="2.5" stroke-linecap="round"></path>

  <!-- Peeled mandarin section -->
  <circle cx="29" cy="100" r="17" fill="#e98e30" stroke="#b96a20" stroke-width="2.5"></circle>

  <!-- White pith -->
  <circle cx="29" cy="100" r="13" fill="#f5dfb5"></circle>

  <!-- Orange segments -->
  <path d="M29 100
       L29 88
       C35 89 39 93 40 99Z" fill="#f2a23d" stroke="#d77c28" stroke-width="1"></path>

  <path d="M29 100
       L40 99
       C40 105 36 110 30 112Z" fill="#eb9633" stroke="#d77c28" stroke-width="1"></path>

  <path d="M29 100
       L30 112
       C24 112 19 108 18 102Z" fill="#f1a13b" stroke="#d77c28" stroke-width="1"></path>

  <path d="M29 100
       L18 102
       C17 96 21 90 27 88Z" fill="#e99131" stroke="#d77c28" stroke-width="1"></path>

  <!-- Center -->
  <circle cx="29" cy="100" r="3" fill="#f1d6a6"></circle>

  <!-- Ground shadow -->
  <ellipse cx="62" cy="118" rx="46" ry="5" fill="#80654a" opacity="0.35"></ellipse>
</svg>