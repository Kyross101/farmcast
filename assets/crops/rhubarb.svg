<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Rhubarb</title>

  <desc id="desc">
    Detailed botanical illustration of rhubarb with broad textured green
    leaves, prominent veins, thick red edible stalks, and a perennial crown.
  </desc>

  <defs>

    <linearGradient id="stalkRed" x1="0" y1="0" x2="1" y2="1">

      <stop offset="0" stop-color="#f58a7b"></stop>

      <stop offset="0.28" stop-color="#dc5e57"></stop>

      <stop offset="0.62" stop-color="#b43e49"></stop>

      <stop offset="1" stop-color="#78333e"></stop>

    </linearGradient>

    <linearGradient id="stalkLight" x1="0" y1="0" x2="1" y2="1">

      <stop offset="0" stop-color="#ffc09d"></stop>

      <stop offset="0.42" stop-color="#ec7365"></stop>

      <stop offset="1" stop-color="#a33846"></stop>

    </linearGradient>

    <radialGradient id="leafGreen" cx="40%" cy="32%" r="72%">

      <stop offset="0" stop-color="#9bc66d"></stop>

      <stop offset="0.32" stop-color="#5e9a50"></stop>

      <stop offset="0.7" stop-color="#347243"></stop>

      <stop offset="1" stop-color="#1b4c38"></stop>

    </radialGradient>

    <radialGradient id="leafDark" cx="38%" cy="30%" r="74%">

      <stop offset="0" stop-color="#78a95a"></stop>

      <stop offset="0.45" stop-color="#3f7d48"></stop>

      <stop offset="1" stop-color="#173f31"></stop>

    </radialGradient>

    <linearGradient id="crownGradient" x1="0" y1="0" x2="0" y2="1">

      <stop offset="0" stop-color="#985144"></stop>

      <stop offset="0.55" stop-color="#6c4436"></stop>

      <stop offset="1" stop-color="#3f342b"></stop>

    </linearGradient>

    <linearGradient id="rootGradient" x1="0" y1="0" x2="1" y2="1">

      <stop offset="0" stop-color="#b9895f"></stop>

      <stop offset="0.5" stop-color="#806047"></stop>

      <stop offset="1" stop-color="#4e4035"></stop>

    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="170%" height="180%">

      <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#17261d" flood-opacity="0.28"></feDropShadow>

    </filter>

    <filter id="leafShadow" x="-25%" y="-25%" width="150%" height="165%">

      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#12251a" flood-opacity="0.25"></feDropShadow>

    </filter>

  </defs>

  <!-- rear stalks -->

  <g fill="none" stroke-linecap="round" filter="url(#softShadow)">

    <path d="
      M50 108
      C47 87 42 67 32 45" stroke="url(#stalkRed)" stroke-width="8"></path>

    <path d="
      M62 110
      C62 83 59 59 60 35" stroke="url(#stalkLight)" stroke-width="9"></path>

    <path d="
      M74 109
      C79 86 85 65 94 43" stroke="url(#stalkRed)" stroke-width="8.5"></path>

    <path d="
      M42 109
      C37 92 29 76 20 61" stroke="url(#stalkLight)" stroke-width="7"></path>

    <path d="
      M84 109
      C90 91 99 77 108 65" stroke="url(#stalkLight)" stroke-width="7"></path>

  </g>

  <!-- stalk highlights -->

  <g fill="none" stroke="#ffd3b5" stroke-linecap="round" opacity="0.46">

    <path d="
      M47 103
      C45 84 40 66 33 49" stroke-width="1.5"></path>

    <path d="
      M60 103
      C60 82 58 60 60 39" stroke-width="1.7"></path>

    <path d="
      M72 102
      C77 83 83 64 91 47" stroke-width="1.5"></path>

  </g>

  <!-- left rear leaf -->

  <g transform="translate(29 43)" filter="url(#leafShadow)">

    <path d="
      M3 7
      C-9 8 -23 3 -27 -8
      C-31 -18 -23 -28 -13 -31
      C-5 -34 2 -29 7 -23
      C11 -31 20 -36 29 -32
      C38 -29 42 -20 39 -12
      C36 -5 27 0 18 2
      C13 3 8 5 3 7Z" fill="url(#leafDark)" stroke="#214e36" stroke-width="1.2"></path>

    <path d="
      M4 7
      C1 -3 -1 -12 -3 -23" fill="none" stroke="#b6d18b" stroke-width="1.3" stroke-linecap="round"></path>

    <g fill="none" stroke="#9cc27b" stroke-width="0.75" stroke-linecap="round" opacity="0.72">

      <path d="M0 -3 C-8 -8 -15 -13 -22 -17"></path>
      <path d="M-1 -8 C-8 -15 -12 -20 -15 -26"></path>
      <path d="M1 -1 C-8 0 -16 0 -23 -3"></path>

      <path d="M0 -3 C8 -8 17 -13 27 -17"></path>
      <path d="M-1 -9 C7 -15 14 -22 21 -28"></path>
      <path d="M2 0 C11 0 20 -2 30 -7"></path>

    </g>

    <path d="
      M-16 -23
      C-8 -29 0 -26 5 -20" fill="none" stroke="#d3e5a9" stroke-width="1.2" stroke-linecap="round" opacity="0.35"></path>

  </g>

  <!-- central large leaf -->

  <g transform="translate(61 32)" filter="url(#leafShadow)">

    <path d="
      M0 6
      C-14 9 -30 5 -36 -7
      C-42 -19 -34 -31 -22 -36
      C-12 -40 -4 -34 1 -27
      C6 -36 16 -42 27 -38
      C39 -34 45 -22 40 -12
      C36 -3 25 2 15 4
      C10 5 5 6 0 6Z" fill="url(#leafGreen)" stroke="#23543a" stroke-width="1.3"></path>

    <!-- central vein -->

    <path d="
      M0 7
      C0 -5 0 -17 1 -30" fill="none" stroke="#c4d99a" stroke-width="1.6" stroke-linecap="round"></path>

    <!-- side veins -->

    <g fill="none" stroke="#a9c985" stroke-width="0.85" stroke-linecap="round" opacity="0.78">

      <path d="M0 -2 C-10 -8 -20 -13 -31 -16"></path>
      <path d="M0 -8 C-9 -16 -16 -23 -21 -31"></path>
      <path d="M0 1 C-11 1 -22 -1 -31 -6"></path>

      <path d="M1 -2 C11 -8 21 -13 32 -16"></path>
      <path d="M1 -9 C10 -16 17 -24 23 -32"></path>
      <path d="M1 1 C12 1 23 -2 33 -7"></path>

    </g>

    <!-- fine texture -->

    <g fill="none" stroke="#d6e7ad" stroke-width="0.45" stroke-linecap="round" opacity="0.42">

      <path d="M-26 -17 C-19 -14 -14 -10 -10 -6"></path>
      <path d="M-21 -27 C-14 -22 -9 -17 -6 -12"></path>
      <path d="M27 -18 C20 -14 14 -10 9 -6"></path>
      <path d="M22 -28 C15 -22 10 -17 6 -11"></path>

    </g>

    <path d="
      M-22 -29
      C-12 -35 -4 -31 1 -25" fill="none" stroke="#e1ecb6" stroke-width="1.4" stroke-linecap="round" opacity="0.35"></path>

  </g>

  <!-- right rear leaf -->

  <g transform="translate(95 43)" filter="url(#leafShadow)">

    <path d="
      M-3 7
      C9 8 23 3 27 -8
      C31 -18 23 -28 13 -31
      C5 -34 -2 -29 -7 -23
      C-11 -31 -20 -36 -29 -32
      C-38 -29 -42 -20 -39 -12
      C-36 -5 -27 0 -18 2
      C-13 3 -8 5 -3 7Z" fill="url(#leafDark)" stroke="#214e36" stroke-width="1.2"></path>

    <path d="
      M-4 7
      C-1 -3 1 -12 3 -23" fill="none" stroke="#b6d18b" stroke-width="1.3" stroke-linecap="round"></path>

    <g fill="none" stroke="#9cc27b" stroke-width="0.75" stroke-linecap="round" opacity="0.72">

      <path d="M0 -3 C8 -8 15 -13 22 -17"></path>
      <path d="M1 -8 C8 -15 12 -20 15 -26"></path>
      <path d="M-1 -1 C8 0 16 0 23 -3"></path>

      <path d="M0 -3 C-8 -8 -17 -13 -27 -17"></path>
      <path d="M1 -9 C-7 -15 -14 -22 -21 -28"></path>
      <path d="M-2 0 C-11 0 -20 -2 -30 -7"></path>

    </g>

  </g>

  <!-- lower-left leaf -->

  <g transform="translate(18 67) scale(0.78)" filter="url(#leafShadow)">

    <path d="
      M3 7
      C-9 8 -23 3 -27 -8
      C-31 -18 -23 -28 -13 -31
      C-5 -34 2 -29 7 -23
      C11 -31 20 -36 29 -32
      C38 -29 42 -20 39 -12
      C36 -5 27 0 18 2
      C13 3 8 5 3 7Z" fill="url(#leafGreen)" stroke="#214e36" stroke-width="1.4"></path>

    <path d="
      M4 7
      C1 -3 -1 -12 -3 -23" fill="none" stroke="#bfd594" stroke-width="1.5"></path>

    <g fill="none" stroke="#9dc37b" stroke-width="0.8" opacity="0.72">

      <path d="M0 -3 L-22 -17"></path>
      <path d="M-1 -8 L-15 -26"></path>
      <path d="M1 -1 L-23 -3"></path>
      <path d="M0 -3 L27 -17"></path>
      <path d="M-1 -9 L21 -28"></path>
      <path d="M2 0 L30 -7"></path>

    </g>

  </g>

  <!-- lower-right leaf -->

  <g transform="translate(110 68) scale(-0.78 0.78)" filter="url(#leafShadow)">

    <path d="
      M3 7
      C-9 8 -23 3 -27 -8
      C-31 -18 -23 -28 -13 -31
      C-5 -34 2 -29 7 -23
      C11 -31 20 -36 29 -32
      C38 -29 42 -20 39 -12
      C36 -5 27 0 18 2
      C13 3 8 5 3 7Z" fill="url(#leafGreen)" stroke="#214e36" stroke-width="1.4"></path>

    <path d="
      M4 7
      C1 -3 -1 -12 -3 -23" fill="none" stroke="#bfd594" stroke-width="1.5"></path>

    <g fill="none" stroke="#9dc37b" stroke-width="0.8" opacity="0.72">

      <path d="M0 -3 L-22 -17"></path>
      <path d="M-1 -8 L-15 -26"></path>
      <path d="M1 -1 L-23 -3"></path>
      <path d="M0 -3 L27 -17"></path>
      <path d="M-1 -9 L21 -28"></path>
      <path d="M2 0 L30 -7"></path>

    </g>

  </g>

  <!-- perennial crown -->

  <path d="
    M36 108
    C43 101 51 99 63 100
    C74 99 84 102 92 109
    C88 118 79 122 64 122
    C49 122 40 118 36 108Z" fill="url(#crownGradient)" stroke="#56382f" stroke-width="1.3" filter="url(#softShadow)"></path>

  <!-- crown ridges -->

  <g fill="none" stroke="#c0785c" stroke-width="1" stroke-linecap="round" opacity="0.48">

    <path d="M43 108 C49 105 55 105 61 108"></path>
    <path d="M61 106 C68 103 75 104 82 108"></path>
    <path d="M47 114 C56 111 67 112 76 115"></path>

  </g>

  <!-- roots -->

  <g fill="none" stroke="url(#rootGradient)" stroke-linecap="round">

    <path d="
      M49 118
      C44 123 40 125 35 127" stroke-width="2.5"></path>

    <path d="
      M56 119
      C53 123 52 125 51 127" stroke-width="2.2"></path>

    <path d="
      M65 120
      C65 123 66 125 68 127" stroke-width="2.3"></path>

    <path d="
      M75 118
      C80 122 84 125 88 127" stroke-width="2.4"></path>

  </g>

  <!-- foreground stalk bases -->

  <g fill="none" stroke-linecap="round">

    <path d="
      M51 110
      C48 99 46 91 45 82" stroke="url(#stalkRed)" stroke-width="7"></path>

    <path d="
      M64 111
      C64 99 65 91 65 82" stroke="url(#stalkLight)" stroke-width="8"></path>

    <path d="
      M78 110
      C81 99 84 91 87 83" stroke="url(#stalkRed)" stroke-width="7"></path>

  </g>

  <!-- foreground stalk shine -->

  <g fill="none" stroke="#ffd7ba" stroke-width="1.2" stroke-linecap="round" opacity="0.5">

    <path d="M49 106 C48 98 47 91 46 85"></path>
    <path d="M62 106 C63 98 63 91 64 85"></path>
    <path d="M77 106 C79 98 82 91 84 86"></path>

  </g>

  <!-- small new emerging leaf -->

  <g transform="translate(64 91)" filter="url(#leafShadow)">

    <path d="
      M0 2
      C-8 -1 -11 -8 -8 -14
      C-4 -19 1 -16 3 -11
      C6 -17 12 -18 16 -13
      C19 -8 14 -2 8 0
      C5 1 2 2 0 2Z" fill="url(#leafGreen)" stroke="#27543b" stroke-width="0.9"></path>

    <path d="
      M1 2
      L3 -11" fill="none" stroke="#bdd491" stroke-width="0.9"></path>

  </g>

</svg>