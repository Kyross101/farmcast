<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Common Scurvygrass</title>

  <desc id="desc">
    Detailed botanical illustration of common scurvygrass with succulent spoon-shaped
    dark green basal leaves, short leafy stems, small four-petalled white flowers,
    and rounded developing seed pods.
  </desc>

  <defs>

    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2d59d"></stop>
      <stop offset="0.48" stop-color="#769b63"></stop>
      <stop offset="1" stop-color="#3c674b"></stop>
    </linearGradient>

    <linearGradient id="leafDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8aaa70"></stop>
      <stop offset="1" stop-color="#345a44"></stop>
    </linearGradient>

    <linearGradient id="stemGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8bf84"></stop>
      <stop offset="1" stop-color="#547557"></stop>
    </linearGradient>

    <radialGradient id="flowerWhite" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"></stop>
      <stop offset="0.68" stop-color="#f1f0e7"></stop>
      <stop offset="1" stop-color="#c8d1c5"></stop>
    </radialGradient>

    <linearGradient id="podGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9c982"></stop>
      <stop offset="1" stop-color="#6e8555"></stop>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#28302a" flood-opacity="0.2"></feDropShadow>
    </filter>

  </defs>

  <ellipse cx="64" cy="119" rx="43" ry="5" fill="#4c514b" opacity="0.15"></ellipse>

  <!-- Root crown -->
  <path d="M48 106
       C53 102 58 100 64 100
       C70 100 76 102 80 106
       C76 112 70 115 64 115
       C58 115 53 112 48 106Z" fill="#715f4b" stroke="#4c4037" stroke-width="1.3"></path>

  <!-- Basal petioles -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round">

    <path d="M63 105 C54 98 45 92 34 89" stroke-width="2"></path>

    <path d="M64 105 C74 98 83 92 94 89" stroke-width="2"></path>

    <path d="M62 106 C50 105 39 106 27 109" stroke-width="1.8"></path>

    <path d="M66 106 C78 105 89 106 101 109" stroke-width="1.8"></path>

  </g>

  <!-- Spoon-shaped succulent leaves -->
  <g filter="url(#softShadow)">

    <path d="M56 103
         C47 104 38 101 32 96
         C26 91 23 85 25 80
         C27 75 32 73 38 75
         C45 77 51 83 54 90
         C57 96 58 100 56 103Z" fill="url(#leafGreen)" stroke="#396347" stroke-width="1.5"></path>

    <path d="M72 103
         C81 104 90 101 96 96
         C102 91 105 85 103 80
         C101 75 96 73 90 75
         C83 77 77 83 74 90
         C71 96 70 100 72 103Z" fill="url(#leafGreen)" stroke="#396347" stroke-width="1.5"></path>

    <path d="M52 106
         C43 110 34 111 27 109
         C21 107 17 103 18 98
         C19 94 24 91 30 91
         C37 91 45 96 50 101
         C52 103 53 105 52 106Z" fill="url(#leafGreen)" stroke="#3d6749" stroke-width="1.35"></path>

    <path d="M76 106
         C85 110 94 111 101 109
         C107 107 111 103 110 98
         C109 94 104 91 98 91
         C91 91 83 96 78 101
         C76 103 75 105 76 106Z" fill="url(#leafGreen)" stroke="#3d6749" stroke-width="1.35"></path>

    <path d="M58 94
         C51 91 47 86 47 80
         C47 75 50 71 55 70
         C60 73 62 78 62 84
         C62 89 60 93 58 94Z" fill="url(#leafDark)" stroke="#345b43" stroke-width="1.15"></path>

    <path d="M70 94
         C77 91 81 86 81 80
         C81 75 78 71 73 70
         C68 73 66 78 66 84
         C66 89 68 93 70 94Z" fill="url(#leafDark)" stroke="#345b43" stroke-width="1.15"></path>

  </g>

  <!-- Leaf highlights and midribs -->
  <g fill="none" stroke="#d6e1bd" stroke-linecap="round" opacity="0.72">

    <path d="M55 100 C48 91 40 83 29 78" stroke-width="0.8"></path>

    <path d="M73 100 C80 91 88 83 99 78" stroke-width="0.8"></path>

    <path d="M50 103 C40 100 30 98 21 99" stroke-width="0.7"></path>

    <path d="M78 103 C88 100 98 98 107 99" stroke-width="0.7"></path>

    <path d="M58 91 C56 84 55 78 56 73" stroke-width="0.65"></path>

    <path d="M70 91 C72 84 73 78 72 73" stroke-width="0.65"></path>

  </g>

  <!-- Upright flowering stems -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round">

    <path d="M64 101
         C63 82 64 65 65 51
         C66 38 66 26 65 14" stroke-width="2.6"></path>

    <path d="M64 70
         C54 64 47 57 43 49" stroke-width="1.4"></path>

    <path d="M65 62
         C76 56 83 49 88 41" stroke-width="1.4"></path>

    <path d="M65 45
         C57 40 52 35 49 29" stroke-width="1.1"></path>

    <path d="M66 41
         C74 36 80 30 83 24" stroke-width="1.1"></path>

  </g>

  <!-- Stem leaves -->
  <g fill="url(#leafDark)" stroke="#355a43" stroke-width="0.9">

    <path d="M60 73
         C54 71 50 67 50 63
         C51 59 54 57 58 57
         C62 62 63 68 60 73Z"></path>

    <path d="M70 66
         C76 63 80 60 80 55
         C79 52 76 49 72 49
         C68 54 67 61 70 66Z"></path>

    <path d="M61 53
         C57 50 55 47 56 43
         C57 40 59 38 62 38
         C65 43 65 49 61 53Z"></path>

  </g>

  <!-- Flower branches -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round">

    <path d="M65 28 L53 20" stroke-width="0.95"></path>
    <path d="M65 27 L65 16" stroke-width="0.95"></path>
    <path d="M66 28 L79 20" stroke-width="0.95"></path>

    <path d="M88 41 L98 34" stroke-width="0.8"></path>
    <path d="M43 49 L33 41" stroke-width="0.8"></path>

  </g>

  <!-- Four-petalled white flowers -->
  <g filter="url(#softShadow)">

    <g transform="translate(53 19)">
      <circle cx="0" cy="0" r="1.2" fill="#d8bd67"></circle>

      <g fill="url(#flowerWhite)" stroke="#a9b5aa" stroke-width="0.42">

        <ellipse cx="0" cy="-3.1" rx="1.6" ry="2.8"></ellipse>
        <ellipse cx="3.1" cy="0" rx="2.8" ry="1.6"></ellipse>
        <ellipse cx="0" cy="3.1" rx="1.6" ry="2.8"></ellipse>
        <ellipse cx="-3.1" cy="0" rx="2.8" ry="1.6"></ellipse>

      </g>
    </g>

    <g transform="translate(65 14)">
      <circle cx="0" cy="0" r="1.25" fill="#d8bd67"></circle>

      <g fill="url(#flowerWhite)" stroke="#a9b5aa" stroke-width="0.42">

        <ellipse cx="0" cy="-3.2" rx="1.7" ry="2.9"></ellipse>
        <ellipse cx="3.2" cy="0" rx="2.9" ry="1.7"></ellipse>
        <ellipse cx="0" cy="3.2" rx="1.7" ry="2.9"></ellipse>
        <ellipse cx="-3.2" cy="0" rx="2.9" ry="1.7"></ellipse>

      </g>
    </g>

    <g transform="translate(80 19)">
      <circle cx="0" cy="0" r="1.2" fill="#d8bd67"></circle>

      <g fill="url(#flowerWhite)" stroke="#a9b5aa" stroke-width="0.42">

        <ellipse cx="0" cy="-3.1" rx="1.6" ry="2.8"></ellipse>
        <ellipse cx="3.1" cy="0" rx="2.8" ry="1.6"></ellipse>
        <ellipse cx="0" cy="3.1" rx="1.6" ry="2.8"></ellipse>
        <ellipse cx="-3.1" cy="0" rx="2.8" ry="1.6"></ellipse>

      </g>
    </g>

    <g transform="translate(99 33) scale(.82)">
      <circle cx="0" cy="0" r="1.2" fill="#d8bd67"></circle>

      <g fill="url(#flowerWhite)" stroke="#a9b5aa" stroke-width="0.42">

        <ellipse cx="0" cy="-3.1" rx="1.6" ry="2.8"></ellipse>
        <ellipse cx="3.1" cy="0" rx="2.8" ry="1.6"></ellipse>
        <ellipse cx="0" cy="3.1" rx="1.6" ry="2.8"></ellipse>
        <ellipse cx="-3.1" cy="0" rx="2.8" ry="1.6"></ellipse>

      </g>
    </g>

    <g transform="translate(32 40) scale(.82)">
      <circle cx="0" cy="0" r="1.2" fill="#d8bd67"></circle>

      <g fill="url(#flowerWhite)" stroke="#a9b5aa" stroke-width="0.42">

        <ellipse cx="0" cy="-3.1" rx="1.6" ry="2.8"></ellipse>
        <ellipse cx="3.1" cy="0" rx="2.8" ry="1.6"></ellipse>
        <ellipse cx="0" cy="3.1" rx="1.6" ry="2.8"></ellipse>
        <ellipse cx="-3.1" cy="0" rx="2.8" ry="1.6"></ellipse>

      </g>
    </g>

  </g>

  <!-- Rounded seed pods -->
  <g fill="url(#podGreen)" stroke="#5d704a" stroke-width="0.55">

    <ellipse cx="93" cy="46" rx="2.5" ry="3" transform="rotate(18 93 46)"></ellipse>

    <ellipse cx="99" cy="50" rx="2.3" ry="2.8" transform="rotate(-10 99 50)"></ellipse>

    <ellipse cx="38" cy="55" rx="2.4" ry="2.9" transform="rotate(-17 38 55)"></ellipse>

  </g>

  <!-- Fibrous roots -->
  <g fill="none" stroke="#695648" stroke-linecap="round">

    <path d="M55 111 C51 116 48 120 44 123" stroke-width="1.1"></path>

    <path d="M61 113 C59 118 58 122 57 125" stroke-width="1"></path>

    <path d="M68 113 C70 118 71 122 72 125" stroke-width="1"></path>

    <path d="M74 111 C78 116 81 119 85 122" stroke-width="1.1"></path>

  </g>

</svg>