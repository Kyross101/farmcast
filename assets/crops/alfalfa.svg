<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="alfalfaTitle alfalfaDesc">
  <title id="alfalfaTitle">Alfalfa</title>
  <desc id="alfalfaDesc">
    Detailed alfalfa plant with green trifoliate leaves and a cluster
    of purple flowers.
  </desc>

  <defs>
    <linearGradient id="stemGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f8f46"></stop>
      <stop offset="55%" stop-color="#23773a"></stop>
      <stop offset="100%" stop-color="#155d2c"></stop>
    </linearGradient>

    <linearGradient id="leafGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#79c967"></stop>
      <stop offset="45%" stop-color="#43a653"></stop>
      <stop offset="100%" stop-color="#20753b"></stop>
    </linearGradient>

    <linearGradient id="leafDarkGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#55b45c"></stop>
      <stop offset="100%" stop-color="#176234"></stop>
    </linearGradient>

    <radialGradient id="flowerGradient" cx="38%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#cf9cf0"></stop>
      <stop offset="45%" stop-color="#9858cf"></stop>
      <stop offset="100%" stop-color="#623099"></stop>
    </radialGradient>

    <radialGradient id="flowerLight" cx="35%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#e9c6ff"></stop>
      <stop offset="50%" stop-color="#b66be2"></stop>
      <stop offset="100%" stop-color="#7438aa"></stop>
    </radialGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#15351f" flood-opacity="0.22"></feDropShadow>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="64" cy="113" rx="32" ry="6" fill="#173b25" opacity="0.13"></ellipse>

  <!-- main stems -->
  <g fill="none" stroke="url(#stemGradient)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M63 111 C62 88 62 66 65 39" stroke-width="5"></path>
    <path d="M62 88 C49 77 41 67 35 55" stroke-width="3.5"></path>
    <path d="M64 78 C77 68 84 58 89 45" stroke-width="3.5"></path>
    <path d="M63 97 C76 91 85 83 92 72" stroke-width="3.2"></path>
    <path d="M62 101 C50 95 42 88 36 79" stroke-width="3.2"></path>
  </g>

  <!-- left trifoliate leaf -->
  <g filter="url(#softShadow)">
    <path d="M36 57
         C24 57 18 50 20 42
         C30 40 38 45 41 54
         C40 56 38 57 36 57Z" fill="url(#leafGradient)"></path>
    <path d="M37 53
         C31 48 26 45 21 43" fill="none" stroke="#d2edb9" stroke-width="1.3" stroke-linecap="round" opacity="0.72"></path>

    <path d="M38 52
         C34 41 37 33 45 29
         C53 35 53 45 45 54
         C42 55 40 54 38 52Z" fill="url(#leafDarkGradient)"></path>
    <path d="M42 51
         C43 43 44 36 45 30" fill="none" stroke="#c9e9b5" stroke-width="1.25" stroke-linecap="round" opacity="0.68"></path>

    <path d="M40 56
         C48 48 58 48 64 53
         C61 63 52 68 42 62
         C40 60 39 58 40 56Z" fill="url(#leafGradient)"></path>
    <path d="M43 59 C50 57 56 55 63 54" fill="none" stroke="#d7efc2" stroke-width="1.25" stroke-linecap="round" opacity="0.7"></path>
  </g>

  <!-- upper right trifoliate leaf -->
  <g filter="url(#softShadow)">
    <path d="M88 47
         C80 39 80 30 86 24
         C96 27 100 36 95 45
         C93 48 90 49 88 47Z" fill="url(#leafDarkGradient)"></path>

    <path d="M91 46 C90 38 89 31 87 25" fill="none" stroke="#d1ebbb" stroke-width="1.2" stroke-linecap="round" opacity="0.68"></path>

    <path d="M91 49
         C99 41 108 42 113 49
         C109 58 100 61 92 55
         C90 53 90 51 91 49Z" fill="url(#leafGradient)"></path>

    <path d="M94 52 C100 51 106 50 112 50" fill="none" stroke="#d9f0c8" stroke-width="1.2" stroke-linecap="round" opacity="0.7"></path>

    <path d="M86 50
         C76 47 69 51 67 59
         C74 66 84 65 90 57
         C91 54 89 52 86 50Z" fill="url(#leafGradient)"></path>

    <path d="M87 54 C81 56 75 58 69 59" fill="none" stroke="#d9f0c8" stroke-width="1.2" stroke-linecap="round" opacity="0.7"></path>
  </g>

  <!-- lower left leaves -->
  <g filter="url(#softShadow)">
    <path d="M38 81
         C28 79 21 84 20 92
         C27 99 37 98 43 89
         C44 85 42 83 38 81Z" fill="url(#leafDarkGradient)"></path>

    <path d="M39 86 C32 88 27 90 21 92" fill="none" stroke="#d2edbd" stroke-width="1.2" opacity="0.7"></path>

    <path d="M40 80
         C36 70 40 63 48 60
         C56 66 56 75 48 83
         C45 84 42 83 40 80Z" fill="url(#leafGradient)"></path>

    <path d="M44 80 C45 73 47 67 48 61" fill="none" stroke="#daf0c8" stroke-width="1.2" opacity="0.72"></path>

    <path d="M43 85
         C51 78 60 80 65 86
         C60 95 51 97 44 91
         C42 89 42 87 43 85Z" fill="url(#leafGradient)"></path>
  </g>

  <!-- lower right leaves -->
  <g filter="url(#softShadow)">
    <path d="M89 73
         C81 64 83 55 90 50
         C99 54 102 63 96 72
         C94 74 91 75 89 73Z" fill="url(#leafGradient)"></path>

    <path d="M92 71 C92 64 91 57 91 51" fill="none" stroke="#d9f0c8" stroke-width="1.2" opacity="0.72"></path>

    <path d="M94 75
         C103 69 112 72 115 80
         C109 88 99 89 93 82
         C92 79 92 77 94 75Z" fill="url(#leafDarkGradient)"></path>

    <path d="M96 79 C102 79 108 80 114 80" fill="none" stroke="#d2edbd" stroke-width="1.2" opacity="0.68"></path>

    <path d="M88 76
         C78 73 70 77 69 85
         C76 92 85 91 91 83
         C92 80 91 78 88 76Z" fill="url(#leafGradient)"></path>
  </g>

  <!-- purple alfalfa flower cluster -->
  <g filter="url(#softShadow)">
    <ellipse cx="65" cy="36" rx="5.7" ry="9" transform="rotate(-25 65 36)" fill="url(#flowerGradient)"></ellipse>
    <ellipse cx="72" cy="34" rx="5.6" ry="9.5" transform="rotate(8 72 34)" fill="url(#flowerLight)"></ellipse>
    <ellipse cx="78" cy="37" rx="5.7" ry="9" transform="rotate(28 78 37)" fill="url(#flowerGradient)"></ellipse>
    <ellipse cx="60" cy="30" rx="5.2" ry="8.2" transform="rotate(-34 60 30)" fill="url(#flowerLight)"></ellipse>
    <ellipse cx="67" cy="27" rx="5.5" ry="9" transform="rotate(-10 67 27)" fill="url(#flowerGradient)"></ellipse>
    <ellipse cx="75" cy="28" rx="5.4" ry="8.8" transform="rotate(17 75 28)" fill="url(#flowerLight)"></ellipse>
    <ellipse cx="81" cy="31" rx="4.8" ry="8" transform="rotate(36 81 31)" fill="url(#flowerGradient)"></ellipse>
    <ellipse cx="63" cy="22" rx="4.8" ry="7.5" transform="rotate(-25 63 22)" fill="url(#flowerGradient)"></ellipse>
    <ellipse cx="70" cy="20" rx="5" ry="8" fill="url(#flowerLight)"></ellipse>
    <ellipse cx="76" cy="22" rx="4.8" ry="7.5" transform="rotate(24 76 22)" fill="url(#flowerGradient)"></ellipse>

    <!-- flower highlights -->
    <g fill="none" stroke="#f2d8ff" stroke-width="1.35" stroke-linecap="round" opacity="0.72">
      <path d="M62 27 C64 25 66 24 68 24"></path>
      <path d="M68 18 C70 17 72 18 73 20"></path>
      <path d="M74 27 C77 27 79 29 80 31"></path>
      <path d="M64 34 C66 32 68 32 70 33"></path>
    </g>
  </g>

  <!-- small stem highlights -->
  <path d="M61.5 108 C61 88 61.5 65 64 42" fill="none" stroke="#74bd66" stroke-width="1.1" stroke-linecap="round" opacity="0.55"></path>
</svg>