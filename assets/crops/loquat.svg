<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Loquat</title>

  <desc id="desc">
    A cluster of ripe golden-orange loquat fruits with green leaves.
  </desc>

  <!-- Leaves -->
  <ellipse cx="41" cy="29" rx="19" ry="8" transform="rotate(-27 41 29)" fill="#5f8d49" stroke="#3e6939" stroke-width="1.8">
  </ellipse>

  <ellipse cx="91" cy="30" rx="19" ry="8" transform="rotate(27 91 30)" fill="#5f8d49" stroke="#3e6939" stroke-width="1.8">
  </ellipse>

  <!-- Leaf veins -->
  <path d="M27 36 L56 24
       M77 24 L106 37" fill="none" stroke="#91ac7b" stroke-width="1.4" stroke-linecap="round">
  </path>

  <!-- Small fruit stems -->
  <path d="M64 22
       C56 34 52 44 51 55

       M64 22
       C64 35 66 45 68 56

       M64 22
       C75 33 82 44 86 55" fill="none" stroke="#6a6a40" stroke-width="3" stroke-linecap="round">
  </path>

  <!-- Left loquat -->
  <ellipse cx="49" cy="70" rx="15" ry="20" fill="#e2a63e" stroke="#aa722b" stroke-width="2.2">
  </ellipse>

  <path d="M41 59
       C37 67 38 77 43 83" fill="none" stroke="#f5ce78" stroke-width="2.2" stroke-linecap="round">
  </path>

  <!-- Center loquat -->
  <ellipse cx="68" cy="82" rx="17" ry="22" fill="#e9ad42" stroke="#ae742c" stroke-width="2.3">
  </ellipse>

  <!-- Center orange blush -->
  <path d="M75 62
       C86 70 88 84 82 96
       C78 102 73 105 68 105
       C73 93 76 77 75 62Z" fill="#d78337" opacity="0.75">
  </path>

  <path d="M59 69
       C55 78 56 89 61 95" fill="none" stroke="#f7d483" stroke-width="2.2" stroke-linecap="round">
  </path>

  <!-- Right loquat -->
  <ellipse cx="89" cy="70" rx="15" ry="20" fill="#e3a13a" stroke="#a96e29" stroke-width="2.2">
  </ellipse>

  <path d="M81 59
       C78 67 79 76 83 82" fill="none" stroke="#f5cd74" stroke-width="2" stroke-linecap="round">
  </path>

  <!-- Small blossom-end marks -->
  <path d="M45 89 L49 85 L53 89
       M64 103 L68 99 L72 103
       M85 89 L89 85 L93 89" fill="none" stroke="#8f632d" stroke-width="1.6" stroke-linecap="round">
  </path>

  <!-- Shadow -->
  <ellipse cx="69" cy="116" rx="37" ry="5" fill="#81664a" opacity="0.2">
  </ellipse>

</svg>