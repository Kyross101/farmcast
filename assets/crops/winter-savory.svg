      <stop offset="0" stop-color="#95ad73"></stop>
      <stop offset="0.52" stop-color="#5f7f4e"></stop>
      <stop offset="1" stop-color="#34583d"></stop>
    </linearGradient>

    <linearGradient id="leafLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aec48c"></stop>
      <stop offset="1" stop-color="#4e7048"></stop>
    </linearGradient>

    <linearGradient id="stemBrown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b795b"></stop>
      <stop offset="0.55" stop-color="#695942"></stop>
      <stop offset="1" stop-color="#443a2f"></stop>
    </linearGradient>

    <linearGradient id="youngStem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#859d64"></stop>
      <stop offset="1" stop-color="#536b43"></stop>
