<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Winter Savory</title>

  <desc id="desc">
    Detailed botanical illustration of winter savory with narrow dark-green leaves,
    woody branching stems, small white-lilac flowers, and freshly harvested culinary sprigs.
  </desc>

  <defs>
