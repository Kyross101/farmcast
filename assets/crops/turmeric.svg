  <path d="M61 71 C59 55 57 38 59 20" fill="none" stroke="#4f7f3b" stroke-width="5" stroke-linecap="round"></path>

  <path d="M68 71 C70 54 71 39 69 23" fill="none" stroke="#598744" stroke-width="4" stroke-linecap="round"></path>

