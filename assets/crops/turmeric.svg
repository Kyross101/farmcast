  <ellipse cx="79" cy="101" rx="7" ry="6" fill="#f4b83e" stroke="#b97625" stroke-width="2"></ellipse>

  <!-- Rhizome markings -->
  <path d="M59 90 C63 95 64 101 62 108" fill="none" stroke="#bd7926" stroke-width="2"></path>

  <path d="M87 93 C84 97 84 102 86 106" fill="none" stroke="#bd7926" stroke-width="2"></path>
