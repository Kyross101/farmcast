<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Agretti</title>

  <desc id="desc">
    Detailed botanical illustration of agretti with a dense clump of
    slender succulent green shoots, needle-like edible leaves,
    branching stems, highlights, shadows, and a small root crown.
  </desc>

  <defs>
    <linearGradient id="stemMain" x1="0" y1="1" x2="0.8" y2="0">
      <stop offset="0" stop-color="#356b32"></stop>
      <stop offset="0.55" stop-color="#4f913f"></stop>
      <stop offset="1" stop-color="#78b75a"></stop>
    </linearGradient>

    <linearGradient id="shootLight" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4d863d"></stop>
      <stop offset="0.55" stop-color="#74aa4f"></stop>
      <stop offset="1" stop-color="#a1cb70"></stop>
    </linearGradient>

    <linearGradient id="shootDark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#28552d"></stop>
      <stop offset="1" stop-color="#5a9645"></stop>
    </linearGradient>

    <radialGradient id="baseShade" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#6f9b48"></stop>
      <stop offset="1" stop-color="#345c2f"></stop>
    </radialGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#18331c" flood-opacity="0.28"></feDropShadow>
    </filter>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="64" cy="112" rx="35" ry="7" fill="#173b22" opacity="0.18"></ellipse>

  <!-- root crown / basal clump -->
  <path d="
    M45 105
    C48 96 54 92 64 91
    C74 92 81 97 84 106
    C77 111 70 113 64 113
    C56 113 49 111 45 105Z" fill="url(#baseShade)" filter="url(#softShadow)"></path>

  <!-- rear dark shoots -->
  <g fill="none" stroke="url(#shootDark)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

    <path d="M55 101 C47 84 45 65 48 43 C49 31 46 20 42 12"></path>
    <path d="M59 100 C55 78 55 57 58 37 C59 26 57 17 54 9"></path>
    <path d="M66 101 C68 79 72 58 78 39 C82 27 83 18 81 10"></path>
    <path d="M72 102 C78 84 84 69 91 55 C97 43 99 31 98 20"></path>
    <path d="M50 102 C42 90 34 77 30 63 C26 49 26 38 29 27"></path>
  </g>

  <!-- rear side branches -->
  <g fill="none" stroke="#4f8a40" stroke-width="2.2" stroke-linecap="round">

    <path d="M47 67 C39 60 34 53 31 45"></path>
    <path d="M49 54 C42 48 39 41 37 34"></path>

    <path d="M58 57 C50 50 47 43 45 35"></path>
    <path d="M59 43 C66 36 69 29 69 21"></path>

    <path d="M77 58 C84 51 88 43 89 35"></path>
    <path d="M80 45 C88 39 92 31 93 24"></path>

    <path d="M87 66 C96 61 101 54 104 46"></path>
  </g>

  <!-- main central shoots -->
  <g fill="none" stroke="url(#stemMain)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#softShadow)">

    <path d="M61 105
             C60 88 61 72 64 57
             C66 43 67 29 65 15"></path>

    <path d="M56 104
             C50 88 48 73 49 58
             C50 44 53 31 57 20"></path>

    <path d="M68 104
             C73 88 77 74 78 59
             C79 44 76 31 73 19"></path>

    <path d="M48 104
             C41 92 38 80 38 68
             C38 55 41 44 45 34"></path>

    <path d="M76 104
             C83 92 88 80 89 67
             C90 55 88 45 86 35"></path>
  </g>

  <!-- characteristic fine succulent side leaves -->
  <g fill="none" stroke="url(#shootLight)" stroke-width="2.3" stroke-linecap="round">

    <!-- left central -->
    <path d="M51 87 C43 82 38 76 34 69"></path>
    <path d="M50 78 C42 73 38 67 35 59"></path>
    <path d="M50 68 C43 63 40 57 39 50"></path>
    <path d="M51 58 C45 53 43 47 43 41"></path>
    <path d="M53 47 C48 42 47 36 48 30"></path>

    <!-- central -->
    <path d="M62 88 C54 83 50 77 48 71"></path>
    <path d="M63 78 C70 73 74 67 76 60"></path>
    <path d="M63 68 C56 63 53 57 52 50"></path>
    <path d="M65 58 C72 52 75 46 76 39"></path>
    <path d="M65 47 C59 42 57 36 58 29"></path>
    <path d="M66 36 C72 31 75 25 75 19"></path>

    <!-- right -->
    <path d="M76 88 C84 82 89 76 92 68"></path>
    <path d="M79 78 C87 73 92 66 95 58"></path>
    <path d="M80 68 C73 62 71 56 71 49"></path>
    <path d="M80 57 C87 52 91 46 93 39"></path>
    <path d="M78 47 C72 42 70 36 70 30"></path>

    <!-- outside tufts -->
    <path d="M42 90 C34 87 27 81 23 74"></path>
    <path d="M39 80 C31 75 26 68 24 61"></path>
    <path d="M86 90 C95 85 101 78 105 70"></path>
    <path d="M89 79 C98 74 103 67 106 59"></path>
  </g>

  <!-- pale new growing tips -->
  <g fill="none" stroke="#a9cf77" stroke-width="2" stroke-linecap="round">

    <path d="M42 13 C40 10 39 8 40 5"></path>
    <path d="M54 10 C53 7 54 5 56 3"></path>
    <path d="M65 16 C64 11 65 7 68 4"></path>
    <path d="M81 11 C82 7 84 5 87 4"></path>
    <path d="M98 21 C100 17 102 14 105 12"></path>
    <path d="M29 28 C28 23 29 19 32 16"></path>
  </g>

  <!-- subtle highlights on succulent stems -->
  <g fill="none" stroke="#c0dc91" stroke-width="0.9" stroke-linecap="round" opacity="0.75">

    <path d="M58 96 C55 81 56 64 59 49"></path>
    <path d="M64 95 C64 78 67 61 68 46"></path>
    <path d="M72 95 C77 81 81 67 82 54"></path>
    <path d="M45 95 C40 84 39 74 40 63"></path>
  </g>

  <!-- crown highlights -->
  <path d="
    M51 104
    C56 99 61 98 67 98
    C72 98 77 100 80 104" fill="none" stroke="#89b65d" stroke-width="2" stroke-linecap="round" opacity="0.75"></path>

</svg>