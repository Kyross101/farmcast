<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Salad Burnet</title>

  <desc id="desc">
    Detailed botanical illustration of salad burnet with pinnate edible green leaves,
    slender branching stems, rounded crimson flower heads,
    and a compact perennial root crown.
  </desc>

  <defs>

    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c1d99b"></stop>
      <stop offset="0.48" stop-color="#79a164"></stop>
      <stop offset="1" stop-color="#3d6749"></stop>
    </linearGradient>

    <linearGradient id="leafDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8cac70"></stop>
      <stop offset="1" stop-color="#345a43"></stop>
    </linearGradient>

    <linearGradient id="stemGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a6bd7e"></stop>
      <stop offset="1" stop-color="#547553"></stop>
    </linearGradient>

    <radialGradient id="flowerCrimson" cx="42%" cy="35%" r="70%">
      <stop offset="0" stop-color="#bf7b78"></stop>
      <stop offset="0.55" stop-color="#8f5054"></stop>
      <stop offset="1" stop-color="#603b43"></stop>
    </radialGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#27302a" flood-opacity="0.2"></feDropShadow>
    </filter>

  </defs>

  <ellipse cx="64" cy="119" rx="43" ry="5" fill="#4d514a" opacity="0.15"></ellipse>

  <!-- Root crown -->
  <path d="M49 106
       C53 102 58 100 64 100
       C70 100 75 102 79 106
       C75 112 70 115 64 115
       C58 115 53 112 49 106Z" fill="#725f49" stroke="#4b4035" stroke-width="1.3"></path>

  <!-- Main stems -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round">

    <path d="M64 103
         C63 84 64 66 65 51
         C66 37 66 23 65 10" stroke-width="2.7"></path>

    <path d="M64 75
         C54 68 47 58 43 48" stroke-width="1.5"></path>

    <path d="M65 66
         C76 59 84 50 89 40" stroke-width="1.5"></path>

    <path d="M65 47
         C57 41 52 34 49 27" stroke-width="1.2"></path>

    <path d="M66 42
         C74 36 80 30 83 23" stroke-width="1.2"></path>

  </g>

  <!-- Basal pinnate leaves -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round">

    <path d="M62 101 C51 94 42 86 34 78" stroke-width="1.7"></path>
    <path d="M66 101 C77 94 86 86 94 78" stroke-width="1.7"></path>

  </g>

  <!-- Left compound leaflets -->
  <g fill="url(#leafGreen)" stroke="#396247" stroke-width="1" filter="url(#softShadow)">

    <ellipse cx="36" cy="79" rx="6" ry="4" transform="rotate(28 36 79)"></ellipse>

    <ellipse cx="42" cy="85" rx="6" ry="4" transform="rotate(25 42 85)"></ellipse>

    <ellipse cx="48" cy="90" rx="6" ry="4" transform="rotate(22 48 90)"></ellipse>

    <ellipse cx="54" cy="95" rx="5.5" ry="3.8" transform="rotate(18 54 95)"></ellipse>

    <ellipse cx="40" cy="75" rx="5.6" ry="3.8" transform="rotate(-22 40 75)"></ellipse>

    <ellipse cx="47" cy="81" rx="5.8" ry="3.9" transform="rotate(-20 47 81)"></ellipse>

    <ellipse cx="53" cy="87" rx="5.7" ry="3.8" transform="rotate(-17 53 87)"></ellipse>

  </g>

  <!-- Right compound leaflets -->
  <g fill="url(#leafGreen)" stroke="#396247" stroke-width="1" filter="url(#softShadow)">

    <ellipse cx="92" cy="79" rx="6" ry="4" transform="rotate(-28 92 79)"></ellipse>

    <ellipse cx="86" cy="85" rx="6" ry="4" transform="rotate(-25 86 85)"></ellipse>

    <ellipse cx="80" cy="90" rx="6" ry="4" transform="rotate(-22 80 90)"></ellipse>

    <ellipse cx="74" cy="95" rx="5.5" ry="3.8" transform="rotate(-18 74 95)"></ellipse>

    <ellipse cx="88" cy="75" rx="5.6" ry="3.8" transform="rotate(22 88 75)"></ellipse>

    <ellipse cx="81" cy="81" rx="5.8" ry="3.9" transform="rotate(20 81 81)"></ellipse>

    <ellipse cx="75" cy="87" rx="5.7" ry="3.8" transform="rotate(17 75 87)"></ellipse>

  </g>

  <!-- Mid-level pinnate leaf -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round">

    <path d="M63 77 C55 72 49 66 44 59" stroke-width="1.35"></path>

    <path d="M66 72 C74 67 80 60 84 53" stroke-width="1.35"></path>

  </g>

  <g fill="url(#leafDark)" stroke="#345940" stroke-width="0.9">

    <ellipse cx="45" cy="59" rx="5" ry="3.4" transform="rotate(25 45 59)"></ellipse>

    <ellipse cx="51" cy="65" rx="5.2" ry="3.5" transform="rotate(20 51 65)"></ellipse>

    <ellipse cx="56" cy="70" rx="4.8" ry="3.2" transform="rotate(18 56 70)"></ellipse>

    <ellipse cx="83" cy="53" rx="5" ry="3.4" transform="rotate(-25 83 53)"></ellipse>

    <ellipse cx="77" cy="59" rx="5.2" ry="3.5" transform="rotate(-20 77 59)"></ellipse>

    <ellipse cx="72" cy="64" rx="4.8" ry="3.2" transform="rotate(-18 72 64)"></ellipse>

  </g>

  <!-- Serration hints -->
  <g fill="none" stroke="#d1dfb6" stroke-linecap="round" opacity="0.68">

    <path d="M31 78 L36 76 L40 79" stroke-width="0.65"></path>

    <path d="M87 79 L92 76 L97 79" stroke-width="0.65"></path>

    <path d="M43 58 L47 57 L50 60" stroke-width="0.6"></path>

    <path d="M78 54 L82 52 L86 54" stroke-width="0.6"></path>

  </g>

  <!-- Flower peduncles -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round">

    <path d="M65 30 C56 26 51 21 48 15" stroke-width="1"></path>

    <path d="M66 29 C75 25 81 20 85 14" stroke-width="1"></path>

    <path d="M65 22 C65 17 65 13 65 9" stroke-width="0.95"></path>

  </g>

  <!-- Crimson flower heads -->
  <g filter="url(#softShadow)">

    <g transform="translate(48 14)">
      <ellipse cx="0" cy="0" rx="5.3" ry="6.2" fill="url(#flowerCrimson)" stroke="#56383f" stroke-width="0.9"></ellipse>

      <g stroke="#d7b6a1" stroke-width="0.55" stroke-linecap="round">

        <path d="M-2 -3 L-5 -6"></path>
        <path d="M0 -3 L0 -7"></path>
        <path d="M2 -3 L5 -6"></path>
        <path d="M-3 0 L-7 -1"></path>
        <path d="M3 0 L7 -1"></path>
        <path d="M-2 3 L-5 6"></path>
        <path d="M2 3 L5 6"></path>

      </g>
    </g>

    <g transform="translate(85 13)">
      <ellipse cx="0" cy="0" rx="5.3" ry="6.2" fill="url(#flowerCrimson)" stroke="#56383f" stroke-width="0.9"></ellipse>

      <g stroke="#d7b6a1" stroke-width="0.55" stroke-linecap="round">

        <path d="M-2 -3 L-5 -6"></path>
        <path d="M0 -3 L0 -7"></path>
        <path d="M2 -3 L5 -6"></path>
        <path d="M-3 0 L-7 -1"></path>
        <path d="M3 0 L7 -1"></path>
        <path d="M-2 3 L-5 6"></path>
        <path d="M2 3 L5 6"></path>

      </g>
    </g>

    <g transform="translate(65 8)">
      <ellipse cx="0" cy="0" rx="5.6" ry="6.5" fill="url(#flowerCrimson)" stroke="#56383f" stroke-width="0.9"></ellipse>

      <g stroke="#d7b6a1" stroke-width="0.55" stroke-linecap="round">

        <path d="M-2 -3 L-5 -6"></path>
        <path d="M0 -3 L0 -7"></path>
        <path d="M2 -3 L5 -6"></path>
        <path d="M-3 0 L-7 -1"></path>
        <path d="M3 0 L7 -1"></path>
        <path d="M-2 3 L-5 6"></path>
        <path d="M2 3 L5 6"></path>

      </g>
    </g>

  </g>

  <!-- Fibrous perennial roots -->
  <g fill="none" stroke="#695546" stroke-linecap="round">

    <path d="M55 111 C51 116 48 120 44 123" stroke-width="1.1"></path>

    <path d="M61 113 C59 118 58 122 57 125" stroke-width="1"></path>

    <path d="M68 113 C70 118 71 122 72 125" stroke-width="1"></path>

    <path d="M74 111 C78 116 81 119 85 122" stroke-width="1.1"></path>

  </g>

</svg>