<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Garden Orach</title>

  <desc id="desc">
    Detailed botanical illustration of garden orach with broad triangular
    spinach-like green leaves, upright branching stems, small reddish-green
    flower clusters, and developing papery seed bracts.
  </desc>

  <defs>

    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfd694"></stop>
      <stop offset="0.48" stop-color="#78a061"></stop>
      <stop offset="1" stop-color="#3d6849"></stop>
    </linearGradient>

    <linearGradient id="leafDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#91b274"></stop>
      <stop offset="1" stop-color="#345a42"></stop>
    </linearGradient>

    <linearGradient id="stemGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5bb7b"></stop>
      <stop offset="0.55" stop-color="#738252"></stop>
      <stop offset="1" stop-color="#585343"></stop>
    </linearGradient>

    <radialGradient id="flowerGreen" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#d4d68a"></stop>
      <stop offset="0.55" stop-color="#9da55c"></stop>
      <stop offset="1" stop-color="#687341"></stop>
    </radialGradient>

    <linearGradient id="seedBract" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cabd82"></stop>
      <stop offset="1" stop-color="#766d4e"></stop>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#273029" flood-opacity="0.2"></feDropShadow>
    </filter>

  </defs>

  <ellipse cx="64" cy="119" rx="43" ry="5" fill="#4d514a" opacity="0.15"></ellipse>

  <!-- Root crown -->
  <path d="M49 106
       C53 102 58 100 64 100
       C70 100 75 102 79 106
       C75 112 70 115 64 115
       C58 115 53 112 49 106Z" fill="#725f49" stroke="#4b4035" stroke-width="1.3"></path>

  <!-- Main upright stem -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round">

    <path d="M64 103
         C63 84 64 66 65 50
         C66 35 66 22 65 9" stroke-width="3"></path>

    <path d="M64 78
         C52 70 44 60 39 50" stroke-width="1.7"></path>

    <path d="M65 70
         C77 62 86 53 92 43" stroke-width="1.7"></path>

    <path d="M65 50
         C56 44 50 37 47 29" stroke-width="1.35"></path>

    <path d="M66 44
         C76 39 82 32 86 24" stroke-width="1.35"></path>

  </g>

  <!-- Broad triangular lower leaves -->
  <g fill="url(#leafGreen)" stroke="#365f43" stroke-width="1.35" filter="url(#softShadow)">

    <path d="M57 100
         C47 102 38 99 31 94
         C25 89 23 83 26 78
         C31 75 37 76 42 80
         L35 67
         C43 68 51 74 55 82
         C59 90 59 96 57 100Z"></path>

    <path d="M71 100
         C81 102 90 99 97 94
         C103 89 105 83 102 78
         C97 75 91 76 86 80
         L93 67
         C85 68 77 74 73 82
         C69 90 69 96 71 100Z"></path>

    <path d="M59 84
         C50 84 43 80 39 74
         C36 69 37 64 41 61
         C46 60 51 63 55 67
         L51 57
         C58 61 62 69 62 76
         C62 80 61 83 59 84Z"></path>

    <path d="M69 81
         C78 81 85 77 89 71
         C92 66 91 61 87 58
         C82 57 77 60 73 64
         L77 54
         C70 58 66 66 66 73
         C66 77 67 80 69 81Z"></path>

  </g>

  <!-- Upper leaves -->
  <g fill="url(#leafDark)" stroke="#31563e" stroke-width="1">

    <path d="M60 65
         C54 62 51 57 52 52
         C53 48 56 45 60 44
         C64 49 65 57 60 65Z"></path>

    <path d="M71 61
         C77 58 80 53 79 48
         C78 44 75 41 71 40
         C67 45 66 53 71 61Z"></path>

    <path d="M61 47
         C57 44 55 40 56 36
         C57 33 59 31 62 30
         C65 35 65 42 61 47Z"></path>

  </g>

  <!-- Leaf veins -->
  <g fill="none" stroke="#d0deaf" stroke-linecap="round" opacity="0.72">

    <path d="M56 96 C48 88 39 83 28 80" stroke-width="0.8"></path>

    <path d="M72 96 C80 88 89 83 100 80" stroke-width="0.8"></path>

    <path d="M58 80 C51 73 45 67 40 64" stroke-width="0.7"></path>

    <path d="M70 77 C77 70 83 64 88 61" stroke-width="0.7"></path>

    <path d="M56 96 L42 80" stroke-width="0.55"></path>

    <path d="M72 96 L86 80" stroke-width="0.55"></path>

  </g>

  <!-- Flowering branches -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round">

    <path d="M65 31 C57 27 52 22 49 17" stroke-width="1.1"></path>

    <path d="M66 30 C74 26 80 21 83 16" stroke-width="1.1"></path>

    <path d="M65 23 C65 18 65 14 65 10" stroke-width="1"></path>

  </g>

  <!-- Small reddish-green flower clusters -->
  <g fill="url(#flowerGreen)" stroke="#626d40" stroke-width="0.4" filter="url(#softShadow)">

    <circle cx="49" cy="17" r="2.3"></circle>
    <circle cx="45" cy="20" r="1.9"></circle>
    <circle cx="53" cy="21" r="2"></circle>

    <circle cx="83" cy="16" r="2.3"></circle>
    <circle cx="79" cy="20" r="1.9"></circle>
    <circle cx="87" cy="20" r="2"></circle>

    <circle cx="65" cy="9" r="2.4"></circle>
    <circle cx="61" cy="12" r="1.9"></circle>
    <circle cx="69" cy="12" r="1.9"></circle>

    <circle cx="58" cy="25" r="1.8"></circle>
    <circle cx="73" cy="25" r="1.8"></circle>

  </g>

  <!-- Reddish flower tint -->
  <g fill="#9b6e60" opacity="0.58">

    <circle cx="49" cy="17" r="0.85"></circle>
    <circle cx="83" cy="16" r="0.85"></circle>
    <circle cx="65" cy="9" r="0.9"></circle>
    <circle cx="53" cy="21" r="0.7"></circle>
    <circle cx="79" cy="20" r="0.7"></circle>

  </g>

  <!-- Papery developing seed bracts -->
  <g fill="url(#seedBract)" stroke="#625c47" stroke-width="0.55">

    <path d="M94 39
         C91 35 92 31 95 28
         C99 31 100 35 98 39
         C97 41 95 41 94 39Z"></path>

    <path d="M101 44
         C98 40 99 36 102 33
         C106 36 107 40 105 44
         C104 46 102 46 101 44Z"></path>

    <path d="M35 47
         C32 43 33 39 36 36
         C40 39 41 43 39 47
         C38 49 36 49 35 47Z"></path>

  </g>

  <!-- Fine fibrous roots -->
  <g fill="none" stroke="#695546" stroke-linecap="round">

    <path d="M55 111 C51 116 48 120 44 123" stroke-width="1.1"></path>

    <path d="M61 113 C59 118 58 122 57 125" stroke-width="1"></path>

    <path d="M68 113 C70 118 71 122 72 125" stroke-width="1"></path>

    <path d="M74 111 C78 116 81 119 85 122" stroke-width="1.1"></path>

  </g>

</svg>