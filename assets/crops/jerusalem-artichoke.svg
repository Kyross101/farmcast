<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="jerusalemArtichokeTitle jerusalemArtichokeDesc">
  <title id="jerusalemArtichokeTitle">Jerusalem Artichoke</title>
  <desc id="jerusalemArtichokeDesc">
    Detailed Jerusalem artichoke plant with green leaves,
    yellow sunflower-like flowers and edible brown tubers.
  </desc>

  <defs>
    <linearGradient id="jaStem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60954c"></stop>
      <stop offset="55%" stop-color="#3d783d"></stop>
      <stop offset="100%" stop-color="#245d31"></stop>
    </linearGradient>

    <linearGradient id="jaLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#87c867"></stop>
      <stop offset="45%" stop-color="#4ca151"></stop>
      <stop offset="100%" stop-color="#23703c"></stop>
    </linearGradient>

    <linearGradient id="jaLeafDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67b75d"></stop>
      <stop offset="100%" stop-color="#195f36"></stop>
    </linearGradient>

    <radialGradient id="jaPetal" cx="38%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fff69a"></stop>
      <stop offset="48%" stop-color="#f5d747"></stop>
      <stop offset="100%" stop-color="#d69f22"></stop>
    </radialGradient>

    <radialGradient id="jaFlowerCenter" cx="40%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#a77628"></stop>
      <stop offset="55%" stop-color="#704920"></stop>
      <stop offset="100%" stop-color="#4a321c"></stop>
    </radialGradient>

    <radialGradient id="jaTuber" cx="32%" cy="25%" r="78%">
      <stop offset="0%" stop-color="#dec28d"></stop>
      <stop offset="40%" stop-color="#bd9561"></stop>
      <stop offset="100%" stop-color="#815b38"></stop>
    </radialGradient>

    <linearGradient id="jaTuberDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a46f"></stop>
      <stop offset="100%" stop-color="#765033"></stop>
    </linearGradient>

    <filter id="jaShadow" x="-35%" y="-35%" width="170%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.4" flood-color="#173721" flood-opacity="0.22"></feDropShadow>
    </filter>
  </defs>

  <!-- Ground -->
  <ellipse cx="64" cy="108" rx="43" ry="7" fill="#583e29" opacity="0.13"></ellipse>

  <!-- Main stems -->
  <g fill="none" stroke="url(#jaStem)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M63 91
         C63 72 64 54 67 37
         C69 28 72 20 76 14" stroke-width="5"></path>

    <path d="M64 69
         C51 62 43 53 37 43" stroke-width="3.3"></path>

    <path d="M65 57
         C78 52 88 44 95 34" stroke-width="3.2"></path>

    <path d="M63 81
         C50 78 39 71 31 63" stroke-width="3"></path>

    <path d="M63 76
         C76 72 87 65 96 57" stroke-width="3"></path>
  </g>

  <!-- Leaves -->
  <g filter="url(#jaShadow)">
    <path d="M42 48
         C31 48 22 42 22 34
         C30 27 42 28 49 36
         C53 42 49 47 42 48Z" fill="url(#jaLeaf)"></path>

    <path d="M46 41
         C38 38 31 35 23 34" fill="none" stroke="#d9efc6" stroke-width="1.25" stroke-linecap="round" opacity="0.68"></path>

    <path d="M88 40
         C91 29 100 24 109 27
         C114 36 109 46 100 49
         C94 50 89 47 88 40Z" fill="url(#jaLeafDark)"></path>

    <path d="M94 44
         C99 38 104 33 109 28" fill="none" stroke="#d3ebc0" stroke-width="1.25" opacity="0.68"></path>

    <path d="M42 72
         C31 69 21 73 18 82
         C25 91 37 93 46 85
         C50 79 48 74 42 72Z" fill="url(#jaLeafDark)"></path>

    <path d="M44 79
         C35 80 27 81 20 82" fill="none" stroke="#d4ebc1" stroke-width="1.25" opacity="0.7"></path>

    <path d="M86 65
         C94 56 105 55 112 62
         C112 72 103 79 93 77
         C87 76 83 70 86 65Z" fill="url(#jaLeaf)"></path>

    <path d="M91 70
         C99 67 105 64 111 62" fill="none" stroke="#d9efc6" stroke-width="1.25" opacity="0.7"></path>

    <path d="M55 63
         C48 55 49 46 56 41
         C65 43 70 51 67 59
         C65 66 59 68 55 63Z" fill="url(#jaLeaf)"></path>

    <path d="M59 62
         C59 55 58 48 57 42" fill="none" stroke="#d8edc6" stroke-width="1.2" opacity="0.68"></path>
  </g>

  <!-- Main flower -->
  <g filter="url(#jaShadow)">
    <g fill="url(#jaPetal)">
      <ellipse cx="78" cy="17" rx="5" ry="12"></ellipse>
      <ellipse cx="87" cy="20" rx="5" ry="12" transform="rotate(38 87 20)"></ellipse>
      <ellipse cx="92" cy="29" rx="5" ry="12" transform="rotate(76 92 29)"></ellipse>
      <ellipse cx="88" cy="38" rx="5" ry="12" transform="rotate(120 88 38)"></ellipse>
      <ellipse cx="79" cy="42" rx="5" ry="12" transform="rotate(165 79 42)"></ellipse>
      <ellipse cx="69" cy="39" rx="5" ry="12" transform="rotate(210 69 39)"></ellipse>
      <ellipse cx="63" cy="30" rx="5" ry="12" transform="rotate(258 63 30)"></ellipse>
      <ellipse cx="68" cy="21" rx="5" ry="12" transform="rotate(315 68 21)"></ellipse>
    </g>

    <circle cx="78" cy="30" r="11" fill="url(#jaFlowerCenter)"></circle>

    <g fill="#d5aa43">
      <circle cx="74" cy="26" r="1.4"></circle>
      <circle cx="79" cy="25" r="1.4"></circle>
      <circle cx="83" cy="28" r="1.4"></circle>
      <circle cx="73" cy="31" r="1.4"></circle>
      <circle cx="78" cy="31" r="1.4"></circle>
      <circle cx="83" cy="33" r="1.4"></circle>
      <circle cx="76" cy="36" r="1.4"></circle>
      <circle cx="81" cy="36" r="1.4"></circle>
    </g>

    <path d="M69 21 C72 17 76 15 80 15" fill="none" stroke="#fff8ae" stroke-width="1.2" stroke-linecap="round" opacity="0.68"></path>
  </g>

  <!-- Small secondary flower -->
  <g filter="url(#jaShadow)">
    <g fill="url(#jaPetal)">
      <ellipse cx="35" cy="38" rx="3.3" ry="8"></ellipse>
      <ellipse cx="40" cy="41" rx="3.3" ry="8" transform="rotate(55 40 41)"></ellipse>
      <ellipse cx="39" cy="47" rx="3.3" ry="8" transform="rotate(115 39 47)"></ellipse>
      <ellipse cx="33" cy="49" rx="3.3" ry="8" transform="rotate(175 33 49)"></ellipse>
      <ellipse cx="28" cy="45" rx="3.3" ry="8" transform="rotate(235 28 45)"></ellipse>
      <ellipse cx="29" cy="40" rx="3.3" ry="8" transform="rotate(300 29 40)"></ellipse>
    </g>

    <circle cx="34" cy="44" r="6" fill="url(#jaFlowerCenter)"></circle>
    <circle cx="32" cy="42" r="1.2" fill="#d9ae45"></circle>
    <circle cx="36" cy="43" r="1.2" fill="#d9ae45"></circle>
    <circle cx="34" cy="46" r="1.2" fill="#d9ae45"></circle>
  </g>

  <!-- Underground stolons -->
  <g fill="none" stroke="#80633f" stroke-width="2.5" stroke-linecap="round">
    <path d="M62 89 C52 96 43 100 33 103"></path>
    <path d="M63 89 C72 96 83 100 94 101"></path>
    <path d="M62 91 C61 98 59 102 56 105"></path>
  </g>

  <!-- Tubers -->
  <g filter="url(#jaShadow)">
    <path d="M25 99
         C21 94 23 88 29 86
         C35 84 38 88 38 92
         C43 93 46 97 44 102
         C42 107 36 108 32 105
         C28 107 23 104 25 99Z" fill="url(#jaTuber)" stroke="#785638" stroke-width="1.2"></path>

    <path d="M27 93
         C29 90 33 89 36 91" fill="none" stroke="#efd5a4" stroke-width="1.25" stroke-linecap="round" opacity="0.64"></path>

    <circle cx="31" cy="99" r="1.4" fill="#694a31" opacity="0.7"></circle>
    <circle cx="38" cy="97" r="1.2" fill="#694a31" opacity="0.7"></circle>

    <path d="M48 106
         C45 101 48 96 53 94
         C59 93 62 96 63 100
         C68 101 70 105 68 109
         C65 114 59 115 55 112
         C51 114 47 111 48 106Z" fill="url(#jaTuberDark)" stroke="#775236" stroke-width="1.2"></path>

    <ellipse cx="55" cy="99" rx="4" ry="2" fill="#ecd19e" opacity="0.55" transform="rotate(-20 55 99)"></ellipse>

    <circle cx="57" cy="108" r="1.3" fill="#66472f" opacity="0.72"></circle>

    <path d="M84 102
         C81 97 84 92 90 90
         C96 89 100 93 99 97
         C105 98 108 102 106 107
         C104 112 98 113 94 110
         C89 113 84 109 84 102Z" fill="url(#jaTuber)" stroke="#785638" stroke-width="1.2"></path>

    <ellipse cx="91" cy="94" rx="4.5" ry="2.3" fill="#efd5a3" opacity="0.55" transform="rotate(-18 91 94)"></ellipse>

    <circle cx="92" cy="104" r="1.3" fill="#694a31" opacity="0.72"></circle>
    <circle cx="100" cy="102" r="1.1" fill="#694a31" opacity="0.68"></circle>
  </g>

  <!-- Soil hint -->
  <path d="M18 108
       C34 105 47 107 62 108
       C78 109 95 105 111 108" fill="none" stroke="#8b6745" stroke-width="1.5" stroke-linecap="round" opacity="0.42"></path>

  <!-- Stem highlight -->
  <path d="M61 88
       C61 70 62 53 65 37
       C67 28 69 21 73 15" fill="none" stroke="#8cc071" stroke-width="1.1" stroke-linecap="round" opacity="0.5"></path>
</svg>