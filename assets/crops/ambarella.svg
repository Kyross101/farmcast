<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Ambarella</title>

  <desc id="desc">
    Three ripe golden-yellow ambarella fruits with green leaves.
  </desc>

  <!-- Leaves -->
  <ellipse cx="41" cy="29" rx="18" ry="7" transform="rotate(-27 41 29)" fill="#60904a" stroke="#3f6b39" stroke-width="1.8">
  </ellipse>

  <ellipse cx="91" cy="30" rx="18" ry="7" transform="rotate(27 91 30)" fill="#60904a" stroke="#3f6b39" stroke-width="1.8">
  </ellipse>

  <!-- Leaf veins -->
  <path d="M28 35 L55 25
       M78 25 L105 37" fill="none" stroke="#94af7c" stroke-width="1.4" stroke-linecap="round">
  </path>

  <!-- Small fruit stems -->
  <path d="M64 22
       C56 34 52 44 50 55

       M64 22
       C65 35 67 46 68 56

       M64 22
       C75 33 82 44 87 55" fill="none" stroke="#696943" stroke-width="3" stroke-linecap="round">
  </path>

  <!-- Left ambarella -->
  <ellipse cx="49" cy="70" rx="15" ry="21" fill="#d6ac43" stroke="#9c762d" stroke-width="2.2">
  </ellipse>

  <path d="M41 58
       C37 66 38 77 43 84" fill="none" stroke="#efd077" stroke-width="2.2" stroke-linecap="round">
  </path>

  <!-- Center ambarella -->
  <ellipse cx="68" cy="82" rx="17" ry="23" fill="#dfb348" stroke="#a0772d" stroke-width="2.3">
  </ellipse>

  <!-- Center ripe orange side -->
  <path d="M75 61
       C86 69 89 84 83 96
       C79 102 74 105 68 105
       C74 92 76 77 75 61Z" fill="#cf8238" opacity="0.72">
  </path>

  <path d="M59 68
       C55 77 56 89 61 96" fill="none" stroke="#f2d681" stroke-width="2.2" stroke-linecap="round">
  </path>

  <!-- Right ambarella -->
  <ellipse cx="89" cy="70" rx="15" ry="21" fill="#d9a83f" stroke="#9a722b" stroke-width="2.2">
  </ellipse>

  <!-- Right ripe side -->
  <path d="M95 52
       C104 60 106 72 101 82
       C98 87 94 90 90 91
       C94 79 97 65 95 52Z" fill="#c77a34" opacity="0.7">
  </path>

  <path d="M81 58
       C78 67 79 77 83 84" fill="none" stroke="#efd078" stroke-width="2" stroke-linecap="round">
  </path>

  <!-- Blossom ends -->
  <circle cx="49" cy="90" r="2.2" fill="#80602c"></circle>
  <circle cx="68" cy="104" r="2.3" fill="#80602c"></circle>
  <circle cx="89" cy="90" r="2.2" fill="#80602c"></circle>

  <!-- Shadow -->
  <ellipse cx="69" cy="116" rx="37" ry="5" fill="#81664a" opacity="0.2">
  </ellipse>

</svg>