<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Lotus Root</title>

  <desc id="desc">
    Detailed botanical illustration of sacred lotus with broad round
    aquatic leaves, a pink lotus flower, mature seed pod, and an
    exposed segmented edible lotus rhizome with characteristic holes.
  </desc>

  <defs>

    <linearGradient id="stemGreen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#326143"></stop>
      <stop offset="0.55" stop-color="#668d52"></stop>
      <stop offset="1" stop-color="#a4bc75"></stop>
    </linearGradient>

    <radialGradient id="leafGreen" cx="42%" cy="35%" r="70%">
      <stop offset="0" stop-color="#a8ca80"></stop>
      <stop offset="0.38" stop-color="#6c9d59"></stop>
      <stop offset="0.72" stop-color="#397345"></stop>
      <stop offset="1" stop-color="#1c5137"></stop>
    </radialGradient>

    <radialGradient id="leafDark" cx="40%" cy="35%" r="72%">
      <stop offset="0" stop-color="#8eb66a"></stop>
      <stop offset="0.45" stop-color="#548a4e"></stop>
      <stop offset="1" stop-color="#214f36"></stop>
    </radialGradient>

    <linearGradient id="petalPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1f4"></stop>
      <stop offset="0.42" stop-color="#f5b7ca"></stop>
      <stop offset="0.75" stop-color="#df789d"></stop>
      <stop offset="1" stop-color="#ad4d75"></stop>
    </linearGradient>

    <linearGradient id="petalLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffafb"></stop>
      <stop offset="0.55" stop-color="#f6ccd7"></stop>
      <stop offset="1" stop-color="#dc8dab"></stop>
    </linearGradient>

    <radialGradient id="flowerCenter" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff3a3"></stop>
      <stop offset="0.5" stop-color="#e6c246"></stop>
      <stop offset="1" stop-color="#a67b27"></stop>
    </radialGradient>

    <radialGradient id="seedPod" cx="35%" cy="25%" r="75%">
      <stop offset="0" stop-color="#d5cb7a"></stop>
      <stop offset="0.5" stop-color="#a1a250"></stop>
      <stop offset="1" stop-color="#666d3e"></stop>
    </radialGradient>

    <linearGradient id="rhizomeCream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d9ae"></stop>
      <stop offset="0.42" stop-color="#d6ae78"></stop>
      <stop offset="0.75" stop-color="#ae8058"></stop>
      <stop offset="1" stop-color="#785742"></stop>
    </linearGradient>

    <radialGradient id="rhizomeCut" cx="42%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff0cf"></stop>
      <stop offset="0.7" stop-color="#e0bd88"></stop>
      <stop offset="1" stop-color="#ad805b"></stop>
    </radialGradient>

    <linearGradient id="mudGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c7657"></stop>
      <stop offset="1" stop-color="#564437"></stop>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#1e2921" flood-opacity="0.25"></feDropShadow>
    </filter>

  </defs>

  <!-- water -->
  <path d="
    M6 86
    C24 82 41 85 59 83
    C78 81 97 84 122 81
    L122 94
    L6 94Z" fill="#8bb6b0" opacity="0.38"></path>

  <!-- water ripples -->
  <g fill="none" stroke="#d2e6df" stroke-width="1" stroke-linecap="round" opacity="0.65">

    <path d="M7 88 C24 85 40 88 55 86"></path>
    <path d="M73 88 C90 85 107 87 121 84"></path>
    <path d="M15 92 C29 90 41 92 50 90"></path>

  </g>

  <!-- mud layer -->
  <path d="
    M4 94
    C27 90 45 95 64 92
    C83 90 104 95 124 91
    L124 122
    L4 122Z" fill="url(#mudGradient)" opacity="0.58"></path>

  <!-- leaf stems -->
  <g fill="none" stroke="url(#stemGreen)" stroke-linecap="round" filter="url(#softShadow)">

    <path d="
      M48 98
      C47 77 45 57 39 37" stroke-width="4"></path>

    <path d="
      M69 98
      C70 75 69 52 66 31" stroke-width="4.3"></path>

    <path d="
      M87 97
      C88 76 92 57 100 41" stroke-width="3.7"></path>

  </g>

  <!-- left lotus leaf -->
  <g transform="translate(37 35)" filter="url(#softShadow)">

    <ellipse cx="0" cy="0" rx="29" ry="13" fill="url(#leafGreen)" stroke="#24563a" stroke-width="1.2" transform="rotate(-8)"></ellipse>

    <circle cx="0" cy="0" r="2.2" fill="#426d45"></circle>

    <!-- radial veins -->
    <g fill="none" stroke="#b4d190" stroke-width="0.7" stroke-linecap="round" opacity="0.7">

      <path d="M0 0 L-25 -4"></path>
      <path d="M0 0 L-20 -9"></path>
      <path d="M0 0 L-12 -12"></path>
      <path d="M0 0 L2 -13"></path>
      <path d="M0 0 L14 -11"></path>
      <path d="M0 0 L24 -5"></path>
      <path d="M0 0 L27 2"></path>
      <path d="M0 0 L20 8"></path>
      <path d="M0 0 L9 11"></path>
      <path d="M0 0 L-8 11"></path>
      <path d="M0 0 L-20 7"></path>

    </g>

    <ellipse cx="-9" cy="-4" rx="7" ry="3" fill="#d8e8b4" opacity="0.18" transform="rotate(-10)"></ellipse>

  </g>

  <!-- right lotus leaf -->
  <g transform="translate(101 43)" filter="url(#softShadow)">

    <ellipse cx="0" cy="0" rx="23" ry="11" fill="url(#leafDark)" stroke="#204f35" stroke-width="1.1" transform="rotate(7)"></ellipse>

    <circle cx="0" cy="0" r="1.8" fill="#3b6742"></circle>

    <g fill="none" stroke="#afd08d" stroke-width="0.65" stroke-linecap="round" opacity="0.68">

      <path d="M0 0 L-20 -3"></path>
      <path d="M0 0 L-14 -8"></path>
      <path d="M0 0 L-4 -10"></path>
      <path d="M0 0 L8 -9"></path>
      <path d="M0 0 L18 -5"></path>
      <path d="M0 0 L21 3"></path>
      <path d="M0 0 L13 8"></path>
      <path d="M0 0 L-7 9"></path>
      <path d="M0 0 L-17 6"></path>

    </g>

  </g>

  <!-- flower stem -->
  <path d="
    M69 94
    C69 72 69 55 68 43" fill="none" stroke="#65884f" stroke-width="3" stroke-linecap="round"></path>

  <!-- main pink lotus flower -->
  <g transform="translate(68 28)" filter="url(#softShadow)">

    <!-- rear petals -->
    <path d="
      M0 3
      C-14 -2 -20 -14 -13 -25
      C-6 -32 1 -20 2 -8Z" fill="url(#petalPink)" stroke="#bf6688" stroke-width="0.8"></path>

    <path d="
      M0 3
      C14 -2 20 -14 13 -25
      C6 -32 -1 -20 -2 -8Z" fill="url(#petalLight)" stroke="#bf6688" stroke-width="0.8"></path>

    <path d="
      M-2 3
      C-20 4 -28 -5 -24 -17
      C-17 -27 -6 -18 -1 -8Z" fill="url(#petalLight)" stroke="#bf6688" stroke-width="0.8"></path>

    <path d="
      M2 3
      C20 4 28 -5 24 -17
      C17 -27 6 -18 1 -8Z" fill="url(#petalPink)" stroke="#bf6688" stroke-width="0.8"></path>

    <!-- front petals -->
    <path d="
      M0 2
      C-16 9 -18 20 -8 24
      C1 23 5 12 3 4Z" fill="url(#petalPink)" stroke="#bf6688" stroke-width="0.8"></path>

    <path d="
      M0 2
      C16 9 18 20 8 24
      C-1 23 -5 12 -3 4Z" fill="url(#petalLight)" stroke="#bf6688" stroke-width="0.8"></path>

    <!-- center receptacle -->
    <ellipse cx="0" cy="3" rx="7" ry="5" fill="url(#flowerCenter)" stroke="#a27f28" stroke-width="0.8"></ellipse>

    <!-- stamens -->
    <g stroke="#ca9b2d" stroke-width="0.7" stroke-linecap="round">

      <path d="M-6 4 L-11 8"></path>
      <path d="M-4 1 L-9 -3"></path>
      <path d="M4 1 L9 -3"></path>
      <path d="M6 4 L11 8"></path>
      <path d="M0 -1 L0 -7"></path>

    </g>

    <g fill="#f0cb4f">
      <circle cx="-11" cy="8" r="1.1"></circle>
      <circle cx="-9" cy="-3" r="1.1"></circle>
      <circle cx="9" cy="-3" r="1.1"></circle>
      <circle cx="11" cy="8" r="1.1"></circle>
      <circle cx="0" cy="-7" r="1.1"></circle>
    </g>

    <!-- petal highlights -->
    <g fill="none" stroke="#fff5f7" stroke-width="0.65" stroke-linecap="round" opacity="0.57">

      <path d="M-4 -4 C-8 -11 -9 -18 -7 -23"></path>
      <path d="M4 -4 C8 -11 9 -18 7 -23"></path>
      <path d="M-7 7 C-11 12 -11 17 -9 20"></path>
      <path d="M7 7 C11 12 11 17 9 20"></path>

    </g>

  </g>

  <!-- seed pod stem -->
  <path d="
    M86 93
    C87 76 91 62 96 52" fill="none" stroke="#687b47" stroke-width="2.6" stroke-linecap="round"></path>

  <!-- mature lotus seed pod -->
  <g transform="translate(98 48)" filter="url(#softShadow)">

    <path d="
      M-12 -4
      C-10 -12 10 -12 12 -4
      L8 10
      C5 15 -5 15 -8 10Z" fill="url(#seedPod)" stroke="#60663a" stroke-width="1.1"></path>

    <!-- seed chambers -->
    <g fill="#525334" stroke="#3d432c" stroke-width="0.5">

      <circle cx="-5" cy="-4" r="2.1"></circle>

      <circle cx="1" cy="-6" r="2.1"></circle>

      <circle cx="6" cy="-2" r="2.1"></circle>

      <circle cx="-2" cy="0" r="2.1"></circle>

      <circle cx="4" cy="3" r="2.1"></circle>

      <circle cx="-5" cy="5" r="2.1"></circle>

    </g>

    <!-- pod highlight -->
    <path d="
      M-9 -6
      C-5 -9 0 -10 5 -8" fill="none" stroke="#e6dda2" stroke-width="1" stroke-linecap="round" opacity="0.55"></path>

  </g>

  <!-- edible rhizome beneath mud -->
  <g transform="translate(18 102)" filter="url(#softShadow)">

    <!-- rear segment -->
    <path d="
      M4 0
      C10 -8 26 -8 33 -2
      C39 3 38 12 31 17
      C24 22 10 20 4 14
      C0 10 0 4 4 0Z" fill="url(#rhizomeCream)" stroke="#785640" stroke-width="1.2"></path>

    <!-- middle segment -->
    <path d="
      M29 -1
      C36 -9 52 -8 59 -2
      C65 4 64 13 57 18
      C49 23 36 21 30 15
      C26 11 26 4 29 -1Z" fill="url(#rhizomeCream)" stroke="#785640" stroke-width="1.2"></path>

    <!-- front segment -->
    <path d="
      M56 -2
      C63 -9 78 -8 85 -1
      C91 5 89 15 82 20
      C74 25 62 22 57 16
      C53 11 53 3 56 -2Z" fill="url(#rhizomeCream)" stroke="#785640" stroke-width="1.2"></path>

    <!-- narrow nodes -->
    <path d="
      M29 0
      C33 4 33 12 29 15" fill="none" stroke="#6d4b3b" stroke-width="2" opacity="0.65"></path>

    <path d="
      M57 -1
      C61 4 61 13 57 16" fill="none" stroke="#6d4b3b" stroke-width="2" opacity="0.65"></path>

    <!-- skin streaks -->
    <g fill="none" stroke="#c09267" stroke-width="0.65" stroke-linecap="round" opacity="0.65">

      <path d="M8 5 C15 3 21 3 27 5"></path>
      <path d="M8 11 C15 9 22 10 28 12"></path>

      <path d="M35 4 C42 2 49 3 55 5"></path>
      <path d="M35 12 C42 9 49 10 55 13"></path>

      <path d="M63 4 C70 2 77 3 83 6"></path>
      <path d="M63 13 C70 10 77 11 82 15"></path>

    </g>

  </g>

  <!-- cut lotus-root slice -->
  <g transform="translate(103 106)" filter="url(#softShadow)">

    <circle cx="0" cy="0" r="16" fill="url(#rhizomeCut)" stroke="#8c6245" stroke-width="1.3"></circle>

    <!-- characteristic holes -->
    <g fill="#7d5b46" stroke="#654432" stroke-width="0.7">

      <ellipse cx="0" cy="-8" rx="3.1" ry="3.8"></ellipse>

      <ellipse cx="7" cy="-4" rx="3.1" ry="3.7" transform="rotate(45 7 -4)"></ellipse>

      <ellipse cx="8" cy="4" rx="3" ry="3.7" transform="rotate(70 8 4)"></ellipse>

      <ellipse cx="0" cy="8" rx="3.1" ry="3.8"></ellipse>

      <ellipse cx="-8" cy="4" rx="3" ry="3.7" transform="rotate(-70 -8 4)"></ellipse>

      <ellipse cx="-7" cy="-4" rx="3.1" ry="3.7" transform="rotate(-45 -7 -4)"></ellipse>

      <circle cx="0" cy="0" r="2.4"></circle>

    </g>

    <!-- slice highlight -->
    <path d="
      M-10 -8
      C-6 -12 0 -14 5 -12" fill="none" stroke="#fff1d1" stroke-width="1.2" stroke-linecap="round" opacity="0.65"></path>

  </g>

</svg>