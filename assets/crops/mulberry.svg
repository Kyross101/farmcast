<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Mulberry</title>

  <desc id="desc">
    A mulberry branch with green leaves
    and clusters of ripe dark-purple fruits.
  </desc>

  <!-- Main branch -->
  <path d="M27 114
       C39 95 50 77 61 59
       C72 42 83 27 96 14" fill="none" stroke="#71563d" stroke-width="6" stroke-linecap="round"></path>

  <!-- Side branches -->
  <path d="M53 72
       C44 60 37 48 31 36" fill="none" stroke="#547d45" stroke-width="3.5" stroke-linecap="round"></path>

  <path d="M65 55
       C78 48 88 39 97 29" fill="none" stroke="#547d45" stroke-width="3.5" stroke-linecap="round"></path>

  <!-- Leaves -->
  <g fill="#61934f" stroke="#426f3d" stroke-width="1.5">

    <path d="M31 37
         C20 29 15 37 19 46
         C23 55 34 58 42 54
         C45 44 40 36 31 37Z"></path>

    <path d="M48 47
         C38 39 33 47 36 56
         C40 65 51 68 59 63
         C62 54 57 47 48 47Z"></path>

    <path d="M93 31
         C104 23 112 30 109 40
         C106 49 96 54 87 50
         C83 41 85 34 93 31Z"></path>

    <path d="M79 47
         C89 39 97 46 94 56
         C91 65 81 69 72 64
         C69 55 71 49 79 47Z"></path>

  </g>

  <!-- Leaf veins -->
  <g fill="none" stroke="#91b07c" stroke-width="1.5" stroke-linecap="round">

    <path d="M24 45 L38 50"></path>
    <path d="M41 55 L55 60"></path>
    <path d="M103 38 L90 46"></path>
    <path d="M89 54 L76 61"></path>

  </g>

  <!-- Fruit stems -->
  <path d="M66 60
       C75 65 81 72 84 79

       M70 61
       C83 64 92 70 99 78

       M65 65
       C67 75 68 84 69 93" fill="none" stroke="#527342" stroke-width="2.5" stroke-linecap="round"></path>

  <!-- Mulberry fruits -->
  <g stroke="#4a314e" stroke-width="1.5">

    <ellipse cx="85" cy="86" rx="8" ry="14" transform="rotate(-18 85 86)" fill="#654065"></ellipse>

    <ellipse cx="101" cy="86" rx="8" ry="14" transform="rotate(15 101 86)" fill="#59375d"></ellipse>

    <ellipse cx="70" cy="99" rx="8" ry="14" transform="rotate(-12 70 99)" fill="#70466e"></ellipse>

  </g>

  <!-- Individual drupelets -->
  <g fill="#89608a">

    <circle cx="82" cy="79" r="2.3"></circle>
    <circle cx="88" cy="82" r="2.3"></circle>
    <circle cx="81" cy="87" r="2.3"></circle>
    <circle cx="87" cy="91" r="2.3"></circle>

    <circle cx="98" cy="80" r="2.3"></circle>
    <circle cx="104" cy="83" r="2.3"></circle>
    <circle cx="98" cy="89" r="2.3"></circle>
    <circle cx="104" cy="93" r="2.3"></circle>

    <circle cx="67" cy="92" r="2.3"></circle>
    <circle cx="73" cy="96" r="2.3"></circle>
    <circle cx="67" cy="102" r="2.3"></circle>
    <circle cx="72" cy="107" r="2.3"></circle>

  </g>

  <!-- Ground -->
  <ellipse cx="48" cy="117" rx="28" ry="5" fill="#81664a" opacity="0.3"></ellipse>

</svg>