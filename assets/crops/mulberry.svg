<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Mulberry</title>
  <desc id="desc">Two ripe dark-purple mulberries with green leaves.</desc>

  <ellipse cx="45" cy="31" rx="18" ry="8" transform="rotate(-28 45 31)" fill="#60904b" stroke="#406c3a" stroke-width="1.8"></ellipse>
  <ellipse cx="90" cy="33" rx="18" ry="8" transform="rotate(27 90 33)" fill="#60904b" stroke="#406c3a" stroke-width="1.8"></ellipse>

  <path d="M31 38 L59 27 M76 27 L104 39" fill="none" stroke="#92ae7c" stroke-width="1.4"></path>

  <path d="M55 43 C56 37 60 31 64 27 M83 45 C85 38 88 33 92 29" fill="none" stroke="#68703f" stroke-width="3" stroke-linecap="round"></path>

  <!-- Left mulberry -->
  <g fill="#57335f" stroke="#45284d" stroke-width="1.1">
    <circle cx="52" cy="56" r="7"></circle><circle cx="61" cy="58" r="7"></circle>
    <circle cx="47" cy="66" r="7"></circle><circle cx="57" cy="67" r="7"></circle><circle cx="67" cy="67" r="7"></circle>
    <circle cx="50" cy="77" r="7"></circle><circle cx="60" cy="78" r="7"></circle><circle cx="69" cy="77" r="7"></circle>
    <circle cx="55" cy="88" r="7"></circle><circle cx="65" cy="87" r="7"></circle>
    <circle cx="60" cy="97" r="6"></circle>
  </g>

  <!-- Right mulberry -->
  <g fill="#65406d" stroke="#4a2c52" stroke-width="1.1">
    <circle cx="84" cy="58" r="6.5"></circle><circle cx="93" cy="60" r="6.5"></circle>
    <circle cx="80" cy="68" r="6.5"></circle><circle cx="89" cy="70" r="6.5"></circle><circle cx="98" cy="69" r="6.5"></circle>
    <circle cx="84" cy="79" r="6.5"></circle><circle cx="93" cy="79" r="6.5"></circle>
    <circle cx="88" cy="89" r="6"></circle>
  </g>

  <ellipse cx="71" cy="113" rx="37" ry="6" fill="#81664a" opacity=".2"></ellipse>
</svg>