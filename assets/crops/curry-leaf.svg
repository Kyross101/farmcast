<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Curry Leaf</title>

  <desc id="desc">
    Detailed botanical illustration of Curry Leaf with
    pinnate glossy green leaflets, small white flowers,
    dark ripe berries, highlights, shadows and natural depth.
  </desc>

  <defs>

    <linearGradient id="branchBrown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9f7757"></stop>
      <stop offset="0.52" stop-color="#694c39"></stop>
      <stop offset="1" stop-color="#3b2e27"></stop>
    </linearGradient>

    <linearGradient id="stemGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7da35a"></stop>
      <stop offset="0.5" stop-color="#50743f"></stop>
      <stop offset="1" stop-color="#2d5035"></stop>
    </linearGradient>

    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5d470"></stop>
      <stop offset="0.42" stop-color="#599c50"></stop>
      <stop offset="1" stop-color="#245f3a"></stop>
    </linearGradient>

    <linearGradient id="leafDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6cac56"></stop>
      <stop offset="0.5" stop-color="#387b47"></stop>
      <stop offset="1" stop-color="#194a31"></stop>
    </linearGradient>

    <radialGradient id="berryDark" cx="32%" cy="25%" r="78%">
      <stop offset="0" stop-color="#68717a"></stop>
      <stop offset="0.38" stop-color="#343b49"></stop>
      <stop offset="0.76" stop-color="#1e2530"></stop>
      <stop offset="1" stop-color="#111820"></stop>
    </radialGradient>

    <radialGradient id="flowerWhite" cx="35%" cy="28%" r="75%">
      <stop offset="0" stop-color="#ffffff"></stop>
      <stop offset="0.55" stop-color="#f5f2df"></stop>
      <stop offset="1" stop-color="#d7d2bc"></stop>
    </radialGradient>

    <radialGradient id="flowerCenter" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#f2d675"></stop>
      <stop offset="1" stop-color="#aa8a43"></stop>
    </radialGradient>

    <filter id="mainShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.4" flood-color="#203429" flood-opacity="0.30"></feDropShadow>
    </filter>

    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5"></feGaussianBlur>
    </filter>

  </defs>

  <!-- ground shadow -->
  <ellipse cx="65" cy="112" rx="37" ry="6" fill="#20392a" opacity="0.15" filter="url(#softBlur)"></ellipse>

  <g filter="url(#mainShadow)">

    <!-- main woody branch -->
    <path d="M29 106
             C41 87 51 69 63 53
             C75 38 88 29 102 24" fill="none" stroke="url(#branchBrown)" stroke-width="6" stroke-linecap="round"></path>

    <!-- main pinnate leaf stem -->
    <path d="M60 58
             C54 49 48 41 39 34" fill="none" stroke="url(#stemGreen)" stroke-width="3.2" stroke-linecap="round"></path>

    <!-- paired leaflets -->
    <path d="M50 49
             C39 49 30 45 24 39
             C34 36 44 39 52 45Z" fill="url(#leafGreen)"></path>

    <path d="M52 48
             C58 39 66 34 75 32
             C71 41 64 47 55 51Z" fill="url(#leafDark)"></path>

    <path d="M45 43
             C36 42 29 38 25 33
             C34 31 41 34 47 39Z" fill="url(#leafDark)"></path>

    <path d="M47 41
             C52 33 58 28 66 26
             C63 34 57 40 49 44Z" fill="url(#leafGreen)"></path>

    <path d="M40 36
             C33 35 27 31 23 27
             C31 26 37 29 42 33Z" fill="url(#leafGreen)"></path>

    <path d="M42 34
             C46 28 52 24 58 23
             C55 30 50 34 44 37Z" fill="url(#leafDark)"></path>

    <!-- lower left foliage -->
    <path d="M54 69
             C42 70 32 66 25 59
             C36 56 47 59 56 65Z" fill="url(#leafDark)"></path>

    <path d="M56 68
             C62 59 69 54 78 52
             C74 61 67 67 59 71Z" fill="url(#leafGreen)"></path>

    <!-- right-side foliage -->
    <path d="M76 54
             C87 44 98 41 109 43
             C102 52 93 57 81 59Z" fill="url(#leafGreen)"></path>

    <path d="M82 68
             C95 61 106 63 114 69
             C105 77 94 80 83 75Z" fill="url(#leafDark)"></path>

    <path d="M86 83
             C98 78 109 81 115 88
             C106 95 96 96 84 92Z" fill="url(#leafGreen)"></path>

    <!-- leaf veins -->
    <g fill="none" stroke="#d7e9ac" stroke-width="1.1" stroke-linecap="round" opacity="0.45">

      <path d="M27 40
               C36 41 44 44 50 47"></path>

      <path d="M28 34
               C35 35 41 38 45 41"></path>

      <path d="M27 28
               C33 29 38 32 41 34"></path>

      <path d="M105 45
               C96 47 88 52 82 56"></path>

      <path d="M110 70
               C101 69 93 72 86 74"></path>

    </g>

    <!-- flower stalk -->
    <path d="M69 49
             C75 43 81 39 87 37" fill="none" stroke="#628247" stroke-width="2.6" stroke-linecap="round"></path>

    <!-- flower cluster branches -->
    <path d="M86 38 L83 30" stroke="#719250" stroke-width="1.5" stroke-linecap="round"></path>

    <path d="M86 38 L91 31" stroke="#719250" stroke-width="1.5" stroke-linecap="round"></path>

    <path d="M86 38 L96 38" stroke="#719250" stroke-width="1.5" stroke-linecap="round"></path>

    <!-- white flower 1 -->
    <g transform="translate(82 28)">

      <ellipse cx="0" cy="-4" rx="2.4" ry="4.4" fill="url(#flowerWhite)"></ellipse>

      <ellipse cx="4" cy="-1" rx="2.4" ry="4.4" transform="rotate(70 4 -1)" fill="url(#flowerWhite)"></ellipse>

      <ellipse cx="3" cy="4" rx="2.4" ry="4.4" transform="rotate(145 3 4)" fill="url(#flowerWhite)"></ellipse>

      <ellipse cx="-3" cy="4" rx="2.4" ry="4.4" transform="rotate(-145 -3 4)" fill="url(#flowerWhite)"></ellipse>

      <ellipse cx="-4" cy="-1" rx="2.4" ry="4.4" transform="rotate(-70 -4 -1)" fill="url(#flowerWhite)"></ellipse>

      <circle cx="0" cy="0" r="1.4" fill="url(#flowerCenter)"></circle>

    </g>

    <!-- white flower 2 -->
    <g transform="translate(92 29)">

      <ellipse cx="0" cy="-4" rx="2.3" ry="4.2" fill="url(#flowerWhite)"></ellipse>

      <ellipse cx="4" cy="-1" rx="2.3" ry="4.2" transform="rotate(70 4 -1)" fill="url(#flowerWhite)"></ellipse>

      <ellipse cx="3" cy="4" rx="2.3" ry="4.2" transform="rotate(145 3 4)" fill="url(#flowerWhite)"></ellipse>

      <ellipse cx="-3" cy="4" rx="2.3" ry="4.2" transform="rotate(-145 -3 4)" fill="url(#flowerWhite)"></ellipse>

      <ellipse cx="-4" cy="-1" rx="2.3" ry="4.2" transform="rotate(-70 -4 -1)" fill="url(#flowerWhite)"></ellipse>

      <circle cx="0" cy="0" r="1.3" fill="url(#flowerCenter)"></circle>

    </g>

    <!-- berries -->
    <path d="M69 67
             C69 74 72 79 76 84" fill="none" stroke="#5d743f" stroke-width="2.5" stroke-linecap="round"></path>

    <path d="M73 77
             C68 80 65 84 64 88" fill="none" stroke="#5d743f" stroke-width="2" stroke-linecap="round"></path>

    <path d="M74 79
             C80 81 84 84 86 88" fill="none" stroke="#5d743f" stroke-width="2" stroke-linecap="round"></path>

    <circle cx="63" cy="92" r="8" fill="url(#berryDark)"></circle>

    <circle cx="77" cy="91" r="8.5" fill="url(#berryDark)"></circle>

    <circle cx="89" cy="94" r="7.5" fill="url(#berryDark)"></circle>

    <!-- berry highlights -->
    <ellipse cx="60" cy="89" rx="2.2" ry="3" fill="#aeb6bc" opacity="0.32"></ellipse>

    <ellipse cx="74" cy="87.5" rx="2.3" ry="3.2" fill="#aeb6bc" opacity="0.34"></ellipse>

    <ellipse cx="86.5" cy="91" rx="2" ry="2.8" fill="#aeb6bc" opacity="0.30"></ellipse>

  </g>

  <!-- branch highlight -->
  <path d="M32 102
           C43 84 53 68 64 53" fill="none" stroke="#c59b75" stroke-width="1.4" stroke-linecap="round" opacity="0.48"></path>

  <!-- leaf shine -->
  <path d="M28 39
           C36 39 44 42 49 45" fill="none" stroke="#eff5ce" stroke-width="1.3" stroke-linecap="round" opacity="0.34"></path>

  <path d="M105 44
           C97 46 90 50 84 54" fill="none" stroke="#eff5ce" stroke-width="1.3" stroke-linecap="round" opacity="0.33"></path>

</svg>