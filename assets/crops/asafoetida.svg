<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">

  <title id="title">Asafoetida</title>

  <desc id="desc">
    Detailed botanical illustration of asafoetida with divided blue-green foliage,
    a tall flowering stalk, yellow umbels, a thick resin-producing taproot,
    and amber oleo-gum resin.
  </desc>

  <defs>
    <linearGradient id="leafGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9aae79"></stop>
      <stop offset="0.5" stop-color="#667f5b"></stop>
      <stop offset="1" stop-color="#405a49"></stop>
    </linearGradient>

    <linearGradient id="stemGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#91a56b"></stop>
      <stop offset="0.55" stop-color="#65794f"></stop>
      <stop offset="1" stop-color="#44583e"></stop>
    </linearGradient>

    <linearGradient id="rootBrown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ad8059"></stop>
      <stop offset="0.5" stop-color="#79553d"></stop>
      <stop offset="1" stop-color="#4b352a"></stop>
    </linearGradient>

    <linearGradient id="rootCut" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0bd88"></stop>
      <stop offset="1" stop-color="#aa774d"></stop>
    </linearGradient>

    <radialGradient id="resinAmber" cx="35%" cy="25%" r="75%">
      <stop offset="0" stop-color="#f2d181"></stop>
      <stop offset="0.5" stop-color="#d49b42"></stop>
      <stop offset="1" stop-color="#976128"></stop>
    </radialGradient>

    <linearGradient id="flowerYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6df70"></stop>
      <stop offset="1" stop-color="#ba9835"></stop>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#302d27" flood-opacity="0.24"></feDropShadow>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="64" cy="119" rx="45" ry="5" fill="#5d5247" opacity="0.16"></ellipse>

  <!-- Thick central flowering stalk -->
  <path d="M64 105
       C64 87 64 68 65 49
       C66 35 67 24 66 14" fill="none" stroke="url(#stemGreen)" stroke-width="7" stroke-linecap="round"></path>

  <!-- Stem highlight -->
  <path d="M67 102
       C67 82 67 65 68 48
       C69 34 69 24 68 16" fill="none" stroke="#b7c38c" stroke-width="1.5" stroke-linecap="round" opacity="0.68"></path>

  <!-- Flowering branches -->
  <g fill="none" stroke="#677545" stroke-width="2" stroke-linecap="round">

    <path d="M66 48 C55 41 47 34 42 27"></path>
    <path d="M67 44 C78 38 87 31 93 24"></path>

    <path d="M66 35 C58 29 53 23 50 18"></path>
    <path d="M67 32 C75 27 81 21 85 16"></path>

  </g>

  <!-- Basal divided foliage -->
  <g fill="none" stroke="url(#leafGreen)" stroke-linecap="round">

    <!-- Left main frond -->
    <path d="M61 84
         C49 78 39 70 31 59" stroke-width="3"></path>

    <path d="M47 75 L34 67" stroke-width="2"></path>
    <path d="M43 71 L30 73" stroke-width="2"></path>
    <path d="M39 67 L28 59" stroke-width="2"></path>
    <path d="M35 62 L23 63" stroke-width="2"></path>
    <path d="M32 58 L24 50" stroke-width="2"></path>

    <!-- Right main frond -->
    <path d="M67 84
         C79 77 90 69 98 58" stroke-width="3"></path>

    <path d="M80 75 L94 67" stroke-width="2"></path>
    <path d="M84 71 L98 73" stroke-width="2"></path>
    <path d="M89 66 L100 58" stroke-width="2"></path>
    <path d="M93 62 L106 63" stroke-width="2"></path>
    <path d="M97 57 L105 49" stroke-width="2"></path>

    <!-- Lower fronds -->
    <path d="M60 95
         C48 92 37 86 28 79" stroke-width="2.8"></path>

    <path d="M68 95
         C80 91 91 86 101 78" stroke-width="2.8"></path>

  </g>

  <!-- Fine leaf divisions -->
  <g fill="none" stroke="#82996e" stroke-width="1.25" stroke-linecap="round">

    <path d="M35 67 l-9 -6 M35 67 l-10 1"></path>
    <path d="M30 73 l-8 -4 M30 73 l-8 4"></path>
    <path d="M28 59 l-7 -7 M28 59 l-9 0"></path>
    <path d="M23 63 l-7 -4 M23 63 l-6 5"></path>

    <path d="M94 67 l9 -6 M94 67 l10 1"></path>
    <path d="M98 73 l8 -4 M98 73 l8 4"></path>
    <path d="M100 58 l7 -7 M100 58 l9 0"></path>
    <path d="M106 63 l7 -4 M106 63 l6 5"></path>

    <path d="M42 88 l-9 -7 M42 88 l-10 0"></path>
    <path d="M34 84 l-8 -7 M34 84 l-9 1"></path>

    <path d="M86 88 l9 -7 M86 88 l10 0"></path>
    <path d="M94 84 l8 -7 M94 84 l9 1"></path>

  </g>

  <!-- Soft leaf highlights -->
  <g fill="none" stroke="#cfdbc1" stroke-width="0.9" stroke-linecap="round" opacity="0.5">

    <path d="M38 70 C43 73 48 76 53 78"></path>
    <path d="M90 70 C85 73 80 76 75 79"></path>

  </g>

  <!-- Main top umbel rays -->
  <g fill="none" stroke="#7a8047" stroke-width="1.5" stroke-linecap="round">

    <path d="M66 15 L54 8"></path>
    <path d="M66 15 L59 5"></path>
    <path d="M66 15 L65 3"></path>
    <path d="M66 15 L72 5"></path>
    <path d="M66 15 L78 8"></path>

  </g>

  <!-- Side umbel rays -->
  <g fill="none" stroke="#7a8047" stroke-width="1.2" stroke-linecap="round">

    <path d="M42 27 L34 21"></path>
    <path d="M42 27 L40 18"></path>
    <path d="M42 27 L48 20"></path>

    <path d="M93 24 L87 18"></path>
    <path d="M93 24 L95 16"></path>
    <path d="M93 24 L101 19"></path>

  </g>

  <!-- Yellow flowers -->
  <g fill="url(#flowerYellow)" stroke="#9d812f" stroke-width="0.6" filter="url(#softShadow)">

    <circle cx="53" cy="7" r="3"></circle>
    <circle cx="59" cy="4" r="3"></circle>
    <circle cx="65" cy="3" r="3"></circle>
    <circle cx="72" cy="5" r="3"></circle>
    <circle cx="79" cy="8" r="3"></circle>

    <circle cx="33" cy="20" r="2.7"></circle>
    <circle cx="40" cy="18" r="2.7"></circle>
    <circle cx="49" cy="19" r="2.7"></circle>

    <circle cx="87" cy="17" r="2.7"></circle>
    <circle cx="95" cy="15" r="2.7"></circle>
    <circle cx="102" cy="18" r="2.7"></circle>

  </g>

  <!-- Flower centers -->
  <g fill="#675c27">
    <circle cx="53" cy="7" r="0.7"></circle>
    <circle cx="59" cy="4" r="0.7"></circle>
    <circle cx="65" cy="3" r="0.7"></circle>
    <circle cx="72" cy="5" r="0.7"></circle>
    <circle cx="79" cy="8" r="0.7"></circle>

    <circle cx="33" cy="20" r="0.6"></circle>
    <circle cx="40" cy="18" r="0.6"></circle>
    <circle cx="49" cy="19" r="0.6"></circle>

    <circle cx="87" cy="17" r="0.6"></circle>
    <circle cx="95" cy="15" r="0.6"></circle>
    <circle cx="102" cy="18" r="0.6"></circle>
  </g>

  <!-- Root crown -->
  <path d="M54 102
       C58 98 70 98 75 103
       L76 110
       C71 114 58 114 53 110Z" fill="#7b5c42" stroke="#4b382b" stroke-width="2"></path>

  <!-- Thick asafoetida taproot -->
  <g filter="url(#softShadow)">
    <path d="M56 106
         C57 116 59 124 64 126
         C69 124 72 116 73 106
         C70 102 60 102 56 106Z" fill="url(#rootBrown)" stroke="#493429" stroke-width="2"></path>

    <path d="M60 106
         C61 115 62 121 64 124" fill="none" stroke="#c19a73" stroke-width="1.2" opacity="0.72"></path>
  </g>

  <!-- Cut root crown showing resin surface -->
  <ellipse cx="64" cy="105" rx="8.2" ry="3.8" fill="url(#rootCut)" stroke="#583e2d" stroke-width="1.4"></ellipse>

  <ellipse cx="64" cy="105" rx="4.5" ry="1.8" fill="#e8cf9b" opacity="0.72"></ellipse>

  <!-- Resin drops -->
  <g filter="url(#softShadow)">

    <path d="M70 107
         C74 111 74 115 71 117
         C68 115 68 111 70 107Z" fill="url(#resinAmber)" stroke="#855925" stroke-width="1"></path>

    <path d="M78 110
         C81 113 81 116 79 118
         C76 117 76 113 78 110Z" fill="url(#resinAmber)" stroke="#855925" stroke-width="0.9"></path>

    <ellipse cx="88" cy="114" rx="4" ry="2.5" fill="url(#resinAmber)" stroke="#855925" stroke-width="1"></ellipse>

  </g>

  <!-- Resin highlights -->
  <g fill="#ffe3a0" opacity="0.65">
    <circle cx="70" cy="111" r="0.8"></circle>
    <circle cx="78" cy="113" r="0.6"></circle>
    <circle cx="87" cy="113" r="0.8"></circle>
  </g>

</svg>